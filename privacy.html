*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--label);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}

.card h3{font-size:17px;margin:0 0 6px}.card p{margin:0}
a{color:var(--tint);text-decoration:none}a:hover{text-decoration:underline}
.btn{display:inline-block;background:var(--tint);color:var(--on-tint);padding:11px 22px;border-radius:12px;font-weight:600;min-height:44px;margin-top:6px}
.btn:hover{text-decoration:none;opacity:.9}
.back{display:inline-block;margin:6px 0 18px;font-size:15px}

.eff{color:var(--label-2);font-size:14px;margin:0 0 20px}

<script>
const I18N={"en": {"title": "Nocti · Privacy Policy", "h1": "Privacy Policy", "back": "Back", "eff": "Effective date: October 21, 2026", "intro": "Nocti (\"the App\") is a Safari extension that darkens web pages on your device. You don't need an account, and nothing you browse ever reaches us. This policy explains exactly how the App handles your information.", "contact_t": "11. Contact us", "contact_l": "If you have any questions about this policy, contact:", "t1": "1. What we don't collect", "b1": "The App has no sign-up or login. It doesn't collect your name, email, location or contacts, and it never collects your browsing history, the full addresses of the pages you visit, or their content.", "t2": "2. How the extension works", "b2": "The extension runs inside Safari on your device. It reads a page's colors only to restyle them in dark colors, right there in Safari. Page content is never copied, stored or sent anywhere.", "t3": "3. Where your settings are stored", "b3": "Your theme, dimming options, site fixes and the list of sites you turned Nocti off for are saved on this device. Apart from the anonymous usage data described below, they aren't uploaded to us or to any third party.", "t4": "4. Anonymous usage data", "b4": "To learn which features people use and which sites need fixing, the App and extension send a small set of anonymous events. Each one is a fixed event name with a few details, such as the theme you picked, the mode you switched to, or the price and currency of a purchase. Counts, such as how many custom themes or site rules you have, are sent only as ranges (for example 2–5), so an exact number can't become a fingerprint. Every event also includes the app version, the operating system and its version, your preferred language and whether Pro is unlocked. When you report a site, turn Nocti off for a site, correct its dark-site detection or adjust its colors, the site's domain is included (for example example.com, never the full address), and a report also includes the note you write. Your browsing history, full page addresses, page content and anything that identifies you are never included. Sharing is on by default, and you can turn it off anytime in Settings → About → Privacy Policy. From then on nothing is sent, and events still waiting to be sent are deleted.", "t5": "5. Who processes this data", "b5": "PostHog processes these events on our behalf, on servers in the United States. The only identifier is a random ID created on this device and shared by the App and extension. It isn't linked to your Apple Account, your device's advertising identifier or any other identity. We don't build user profiles, don't record sessions or screens, and don't store your IP address or use it to look up your location. The data isn't used for advertising, isn't sold or shared with anyone else, and isn't used to track you across apps or websites.", "t6": "6. Network requests", "b6": "Apart from the anonymous usage data described above, the extension downloads only the stylesheets and images a page already uses, so it can restyle them. When you tap Check for Updates, the App asks Apple's public App Store service for the latest version number. That request goes to Apple, not to us.", "t7": "7. Purchases", "b7": "Purchases are completed by Apple through the App Store. Your payment method and Apple Account details are handled by Apple, and we can't see them.", "t8": "8. Feedback emails", "b8": "If you email us, we receive what you write plus the app version, system version and device model pre-filled in the email, which you can delete before sending. We use it only to answer you and fix problems.", "t9": "9. Children's privacy", "b9": "The App doesn't knowingly collect any information from children under 13.", "t10": "10. Changes to this policy", "b10": "If this policy changes, we'll post the new version on this page and update the effective date."}, "zh-Hans": {"title": "夜猫 · 隐私政策", "h1": "隐私政策", "back": "返回", "eff": "生效日期：2026 年 10 月 21 日", "intro": "夜猫（以下称「App」）是一个在你设备上把网页变暗的 Safari 扩展。你不需要在我们这里注册账号，你浏览的任何内容也不会到达我们这里。这份政策逐条说明 App 究竟怎么处理你的信息。", "contact_t": "11. 联系我们", "contact_l": "对这份政策有任何疑问，请联系：", "t1": "1. 我们不会收集什么", "b1": "本 App 无需注册或登录。它不收集你的姓名、邮箱、位置或通讯录，也从不收集你的浏览记录、你访问的网页的完整地址或网页内容。", "t2": "2. 扩展如何工作", "b2": "扩展在你设备上的 Safari 里运行。它读取网页的颜色，只是为了就地把它们换成深色。网页内容不会被复制、保存或发送到任何地方。", "t3": "3. 你的设置存在哪里", "b3": "你的主题、调暗选项、网站适配，以及你关掉夜猫的网站列表，都保存在这台设备上。除下文所述的匿名使用数据外，不会上传给我们或任何第三方。", "t4": "4. 匿名使用数据", "b4": "为了知道哪些功能有人在用、哪些网站需要修，App 和扩展会发送一小组匿名事件：一个固定的事件名，加上少量细节，例如选了哪套主题、切到了哪种模式，或一次购买的价格与币种。数量（比如有几套自定义主题、几条站点规则）只按区间发送（例如「2–5」），免得一个精确数字变成指纹。每个事件还带有 App 版本、操作系统及其版本、首选语言，以及是否已解锁 Pro。当你反馈某个网站、在某个网站关掉夜猫、纠正它的深色网站识别或调整它的颜色时，会附带该网站的域名（例如 example.com，从不含完整网址）；反馈还会附带你写的备注。你的浏览记录、完整网址、网页内容，以及任何能识别你的信息，一律不在其中。这一项默认开启，可随时在「设置 → 关于 → 隐私政策」里关闭；关闭那一刻起不再发送任何内容，尚未发出的事件也会一并删除。", "t5": "5. 这些数据由谁处理", "b5": "这些事件由 PostHog 代我们处理，服务器在美国。其中唯一的标识，是在这台设备上随机生成、由 App 和扩展共用的一个 ID；它不与你的 Apple 账户、设备的广告标识符或任何其他身份关联。我们不建立用户档案，不录制会话或界面，也不保存你的 IP 地址或用它推算你的位置。这些数据不用于广告，不出售也不与任何人共享，也不用来跨 App 或网站追踪你。", "t6": "6. 网络请求", "b6": "除上面所述的匿名使用数据外，扩展只会下载网页本身用到的样式表和图片，用于给它们换上深色。点「检查更新」时，App 会向 Apple 公开的 App Store 服务查询最新版本号，这个请求发给 Apple，而不是我们。", "t7": "7. 购买", "b7": "购买由 Apple 通过 App Store 完成。你的付款方式与 Apple 账户信息由 Apple 处理，我们看不到。", "t8": "8. 反馈邮件", "b8": "你写信给我们时，我们会收到你写的内容，以及邮件里预填的版本号、系统版本与机型（发送前可以删掉）。它们只用来回复你、修复问题。", "t9": "9. 儿童隐私", "b9": "App 不会有意收集 13 岁以下儿童的任何信息。", "t10": "10. 政策的变更", "b10": "这份政策若有变更，我们会把新版本贴在本页，并同时更新生效日期。"}, "zh-Hant": {"title": "夜貓 · 隱私權政策", "h1": "隱私權政策", "back": "返回", "eff": "生效日期：2026 年 10 月 21 日", "intro": "夜貓（以下稱「App」）是一款在你的裝置上把網頁變暗的 Safari 延伸功能。你不需要註冊帳號，你瀏覽的任何內容也不會傳到我們這裡。本政策逐條說明 App 如何處理你的資訊。", "contact_t": "11. 聯絡我們", "contact_l": "如對本政策有任何疑問，請聯絡：", "t1": "1. 我們不會收集哪些資料", "b1": "本 App 不需要註冊或登入。它不會收集你的姓名、電子郵件、位置或聯絡資訊，也絕不收集你的瀏覽記錄、你造訪網頁的完整網址或網頁內容。", "t2": "2. 延伸功能如何運作", "b2": "延伸功能在你裝置上的 Safari 中執行。它讀取網頁的顏色，只是為了直接在 Safari 中將它們改為深色。網頁內容絕不會被拷貝、儲存或傳送到任何地方。", "t3": "3. 你的設定儲存在哪裡", "b3": "你的主題、調暗選項、網站修正，以及你關閉夜貓的網站列表，都儲存在這部裝置上。除了下文所述的匿名使用資料外，不會上傳給我們或任何第三方。", "t4": "4. 匿名使用資料", "b4": "為了知道哪些功能有人在用、哪些網站需要調整，App 和延伸功能會傳送一小組匿名事件：一個固定的事件名稱，加上少量細節，例如選了哪套主題、切換到哪種模式，或一次購買的價格與幣別。數量（例如有幾套自訂主題、幾條網站規則）只按區間傳送（例如「2–5」），以免一個精確數字變成指紋。每個事件還帶有 App 版本、作業系統及其版本、偏好語言，以及是否已解鎖 Pro。當你回報某個網站、在某個網站關閉夜貓、修正對它是否自帶深色的辨識，或調整它的顏色時，會附上該網站的網域（例如 example.com，絕不含完整網址）；回報還會附上你寫的備註。你的瀏覽記錄、完整網址、網頁內容，以及任何能識別你的資訊，一律不在其中。此功能預設開啟，可隨時在「設定 → 關於 → 隱私權政策」關閉；關閉當下起不再傳送任何內容，尚未送出的事件也會一併刪除。", "t5": "5. 這些資料由誰處理", "b5": "這些事件由 PostHog 代我們處理，伺服器位於美國。其中唯一的識別碼，是在這台裝置上隨機產生、由 App 和延伸功能共用的一個 ID；它不與你的 Apple 帳號、裝置的廣告識別碼或任何其他身分關聯。我們不建立使用者檔案，不錄製工作階段或畫面，也不儲存你的 IP 位址或用它推算你的位置。這些資料不用於廣告，不出售也不與任何人分享，也不用來跨 App 或網站追蹤你。", "t6": "6. 網路請求", "b6": "除了上述的匿名使用資料外，延伸功能只會下載網頁本身用到的樣式表和圖片，以便將它們改為深色。點一下「檢查更新」時，App 會向 Apple 公開的 App Store 服務查詢最新版本號碼；這個請求是傳送給 Apple，而不是我們。", "t7": "7. 購買", "b7": "購買由 Apple 透過 App Store 完成。你的付款方式與 Apple 帳號資訊由 Apple 處理，我們無法看到。", "t8": "8. 意見回饋郵件", "b8": "你寄信給我們時，我們會收到你寫的內容，以及郵件中預先填入的 App 版本、系統版本與裝置型號（寄出前可以刪除）。這些資訊只會用來回覆你和修正問題。", "t9": "9. 兒童隱私權", "b9": "本 App 不會在知情的情況下收集 13 歲以下兒童的任何資訊。", "t10": "10. 政策變更", "b10": "本政策如有變更，我們會在此頁面公布新版本，並同時更新生效日期。"}, "ja": {"title": "Nocti · プライバシーポリシー", "h1": "プライバシーポリシー", "back": "戻る", "eff": "発効日：2026年10月21日", "intro": "Nocti（以下「本App」）は、お使いのデバイス上でWebページを暗くするSafari機能拡張です。アカウントは不要で、あなたが閲覧した内容が私たちに届くことは一切ありません。本ポリシーでは、本Appがあなたの情報をどのように扱うかを具体的に説明します。", "contact_t": "11. お問い合わせ", "contact_l": "本ポリシーについてご質問がある場合は、こちらまでご連絡ください：", "t1": "1. 収集しない情報", "b1": "本Appには登録もログインもありません。名前、メールアドレス、位置情報、連絡先を収集せず、閲覧履歴、アクセスしたページの完全なアドレス、ページの内容も一切収集しません。", "t2": "2. 機能拡張の仕組み", "b2": "機能拡張はデバイス上のSafari内で動作します。ページの色を読み取るのは、Safari内でその場でダークな色に変えるためだけです。ページの内容がコピー、保存、送信されることはありません。", "t3": "3. 設定の保存場所", "b3": "テーマ、減光オプション、サイト調整、Noctiをオフにしたサイトのリストは、このデバイスに保存されます。下記の匿名の使用状況データを除き、私たちやほかの第三者にアップロードされることはありません。", "t4": "4. 匿名の使用状況データ", "b4": "どの機能が使われているか、どのサイトに対応が必要かを把握するため、本Appと機能拡張は少数の匿名イベントを送信します。各イベントは決まったイベント名と、選んだテーマ、切り替えたモード、購入の価格と通貨といった少しの詳細だけで構成されます。カスタムテーマやサイトごとのルールの数などの数量は範囲（例：2–5）としてのみ送信し、正確な数がフィンガープリントにならないようにしています。すべてのイベントには、Appのバージョン、OSとそのバージョン、優先する言語、Proのロック解除状況も含まれます。サイトを報告したとき、サイトでNoctiをオフにしたとき、そのサイトのダークなサイトの検出を修正したとき、またはその色を調整したときは、そのサイトのドメインが含まれます（例：example.com。完全なアドレスは含みません）。報告には、あなたが書いたメモも含まれます。閲覧履歴、ページの完全なアドレス、ページの内容、あなたを特定できる情報は一切含まれません。共有はデフォルトでオンになっており、設定 → 情報 → プライバシーポリシーでいつでもオフにできます。オフにした時点から何も送信されず、送信待ちのイベントも削除されます。", "t5": "5. このデータを処理する者", "b5": "これらのイベントは、PostHogが私たちに代わって米国内のサーバで処理します。唯一の識別子は、このデバイス上でランダムに作成され、本Appと機能拡張で共有されるIDです。このIDは、あなたのApple Account、デバイスの広告識別子、その他いかなる身元とも結び付けられていません。私たちはユーザプロファイルを作成せず、セッションや画面を記録せず、IPアドレスを保存したり位置の特定に使ったりもしません。このデータは広告に使われず、販売されることも他者と共有されることもなく、Appやwebサイトをまたいであなたを追跡するために使われることもありません。", "t6": "6. ネットワーク通信", "b6": "上記の匿名の使用状況データを除き、機能拡張がダウンロードするのは、ページの色を変えるためにそのページがもともと使っているスタイルシートと画像だけです。「アップデートを確認」をタップすると、本Appは最新のバージョン番号をAppleの公開App Storeサービスに問い合わせます。この通信の宛先はAppleで、私たちではありません。", "t7": "7. 購入", "b7": "購入はApp Storeを通じてAppleが処理します。お支払い方法やApple Accountの情報はAppleが扱い、私たちが見ることはできません。", "t8": "8. フィードバックメール", "b8": "メールでお問い合わせいただいた場合、私たちが受け取るのは、ご記入の内容と、メールにあらかじめ入力されたAppのバージョン、システムのバージョン、デバイスの機種です（送信前に削除できます）。これらは返信と問題の修正にのみ使用します。", "t9": "9. お子様のプライバシー", "b9": "本Appは、13歳未満のお子様の情報を意図的に収集することはありません。", "t10": "10. 本ポリシーの変更", "b10": "本ポリシーを変更する場合は、新しい版をこのページに掲載し、発効日を更新します。"}, "ko": {"title": "Nocti · 개인정보 처리방침", "h1": "개인정보 처리방침", "back": "뒤로", "eff": "시행일: 2026년 10월 21일", "intro": "Nocti(이하 ‘앱’)는 기기에서 웹 페이지를 어둡게 바꾸는 Safari 확장 프로그램입니다. 계정이 필요 없으며, 사용자가 보는 어떤 내용도 저희에게 전달되지 않습니다. 이 방침은 앱이 사용자의 정보를 어떻게 처리하는지 구체적으로 설명합니다.", "contact_t": "11. 문의하기", "contact_l": "이 방침에 대해 궁금한 점이 있으면 다음으로 문의하세요.", "t1": "1. 수집하지 않는 정보", "b1": "앱에는 가입이나 로그인이 없습니다. 이름, 이메일, 위치, 연락처를 수집하지 않으며, 브라우징 기록, 방문한 페이지의 전체 주소나 그 내용을 절대 수집하지 않습니다.", "t2": "2. 확장 프로그램의 작동 방식", "b2": "확장 프로그램은 기기의 Safari 안에서 실행됩니다. 페이지의 색상을 읽는 것은 Safari 안에서 바로 어두운 색으로 바꾸기 위해서일 뿐입니다. 페이지 내용은 어디에도 복사, 저장, 전송되지 않습니다.", "t3": "3. 설정이 저장되는 위치", "b3": "테마, 어둡게 하기 옵션, 사이트 조정, Nocti를 끈 사이트 목록은 이 기기에 저장됩니다. 아래에서 설명하는 익명 사용 데이터를 제외하면 저희나 제3자에게 업로드되지 않습니다.", "t4": "4. 익명 사용 데이터", "b4": "어떤 기능이 사용되고 어떤 사이트를 수정해야 하는지 파악하기 위해, App과 확장 프로그램은 소수의 익명 이벤트를 전송합니다. 각 이벤트는 고정된 이벤트 이름과 선택한 테마, 전환한 모드, 구입한 항목의 가격과 통화 같은 몇 가지 세부 정보로만 이루어집니다. 사용자 설정 테마나 사이트 규칙이 몇 개인지와 같은 개수는 범위(예: 2–5)로만 전송하여, 정확한 숫자가 핑거프린트가 되지 않도록 합니다. 모든 이벤트에는 앱 버전, 운영 체제와 그 버전, 선호 언어, Pro 잠금 해제 여부도 포함됩니다. 사이트를 신고하거나, 사이트에서 Nocti를 끄거나, 해당 사이트의 다크 사이트 감지를 수정하거나, 색상을 조정하면 해당 사이트의 도메인이 포함되며(예: example.com, 전체 주소는 절대 포함되지 않음), 신고에는 사용자가 작성한 메모도 포함됩니다. 브라우징 기록, 페이지의 전체 주소, 페이지 내용, 그리고 사용자를 식별할 수 있는 어떤 정보도 절대 포함되지 않습니다. 공유는 기본적으로 켜져 있으며, 언제든지 설정 → 정보 → 개인정보 처리방침에서 끌 수 있습니다. 끈 이후에는 아무것도 전송되지 않으며, 아직 전송 대기 중인 이벤트도 삭제됩니다.", "t5": "5. 이 데이터를 처리하는 주체", "b5": "PostHog가 저희를 대신해 미국에 있는 서버에서 이 이벤트를 처리합니다. 유일한 식별자는 이 기기에서 생성되어 App과 확장 프로그램이 함께 사용하는 무작위 ID입니다. 이 ID는 사용자의 Apple 계정, 기기의 광고 식별자 또는 다른 어떤 신원과도 연결되지 않습니다. 저희는 사용자 프로필을 만들지 않고, 세션이나 화면을 녹화하지 않으며, IP 주소를 저장하거나 위치 파악에 사용하지 않습니다. 이 데이터는 광고에 사용되지 않고, 판매되거나 다른 누구와도 공유되지 않으며, 여러 앱이나 웹사이트에 걸쳐 사용자를 추적하는 데 사용되지 않습니다.", "t6": "6. 네트워크 요청", "b6": "위에서 설명한 익명 사용 데이터를 제외하면, 확장 프로그램은 페이지가 이미 사용하는 스타일시트와 이미지만 다운로드해 어두운 스타일로 바꿉니다. ‘업데이트 확인’을 탭하면 앱이 Apple의 공개 App Store 서비스에 최신 버전 번호를 조회합니다. 이 요청은 저희가 아니라 Apple로 전송됩니다.", "t7": "7. 구입", "b7": "구입은 App Store를 통해 Apple이 처리합니다. 결제 수단과 Apple 계정 정보는 Apple이 처리하며 저희는 볼 수 없습니다.", "t8": "8. 피드백 이메일", "b8": "이메일을 보내시면 작성하신 내용과 함께 이메일에 미리 입력된 앱 버전, 시스템 버전, 기기 모델을 받게 됩니다. 이 정보는 보내기 전에 삭제할 수 있습니다. 답변과 문제 해결에만 사용합니다.", "t9": "9. 아동 개인정보 보호", "b9": "앱은 13세 미만 아동의 정보를 고의로 수집하지 않습니다.", "t10": "10. 방침 변경", "b10": "이 방침이 변경되면 이 페이지에 새 버전을 게시하고 시행일을 업데이트합니다."}, "de": {"title": "Nocti · Datenschutzrichtlinie", "h1": "Datenschutzrichtlinie", "back": "Zurück", "eff": "Gültig ab: 21. Oktober 2026", "intro": "Nocti („die App“) ist eine Safari-Erweiterung, die Webseiten auf deinem Gerät abdunkelt. Du brauchst kein Konto, und nichts von dem, was du dir ansiehst, erreicht uns. Diese Richtlinie erklärt genau, wie die App mit deinen Daten umgeht.", "contact_t": "11. Kontakt", "contact_l": "Bei Fragen zu dieser Richtlinie wende dich an:", "t1": "1. Was wir nicht erfassen", "b1": "Die App hat keine Registrierung und kein Login. Sie erfasst weder deinen Namen, deine E-Mail-Adresse, deinen Standort noch deine Kontakte, und niemals deinen Browserverlauf, die vollständigen Adressen besuchter Seiten oder deren Inhalte.", "t2": "2. So funktioniert die Erweiterung", "b2": "Die Erweiterung läuft in Safari auf deinem Gerät. Sie liest die Farben einer Seite nur, um sie direkt in Safari in dunklen Farben neu zu gestalten. Seiteninhalte werden nie kopiert, gespeichert oder irgendwohin gesendet.", "t3": "3. Wo deine Einstellungen gespeichert werden", "b3": "Dein Theme, die Abdunkelungsoptionen, Website-Anpassungen und die Liste der Websites, auf denen du Nocti ausgeschaltet hast, werden auf diesem Gerät gespeichert. Abgesehen von den unten beschriebenen anonymen Nutzungsdaten werden sie weder zu uns noch zu Dritten hochgeladen.", "t4": "4. Anonyme Nutzungsdaten", "b4": "Damit wir wissen, welche Funktionen genutzt werden und welche Websites angepasst werden müssen, senden die App und die Erweiterung eine kleine Auswahl anonymer Ereignisse. Jedes besteht aus einem festen Ereignisnamen und wenigen Details, etwa dem gewählten Theme, dem Modus, zu dem du gewechselt hast, oder Preis und Währung eines Kaufs. Anzahlen, etwa wie viele eigene Themes oder Website-Regeln du hast, werden nur als Bereiche gesendet (zum Beispiel 2–5), damit eine genaue Zahl nicht zum Fingerabdruck werden kann. Jedes Ereignis enthält außerdem die App-Version, das Betriebssystem und seine Version, deine bevorzugte Sprache und ob Pro freigeschaltet ist. Wenn du eine Website meldest, Nocti für eine Website ausschaltest, ihre Erkennung dunkler Websites korrigierst oder ihre Farben anpasst, wird die Domain der Website mitgesendet (zum Beispiel example.com, nie die vollständige Adresse); eine Meldung enthält außerdem die Notiz, die du schreibst. Dein Browserverlauf, vollständige Seitenadressen, Seiteninhalte und alles, was dich identifiziert, sind nie enthalten. Das Teilen ist standardmäßig aktiviert, und du kannst es jederzeit unter Einstellungen → Über → Datenschutzrichtlinie ausschalten. Ab dann wird nichts mehr gesendet, und Ereignisse, die noch auf das Senden warten, werden gelöscht.", "t5": "5. Wer diese Daten verarbeitet", "b5": "PostHog verarbeitet diese Ereignisse in unserem Auftrag auf Servern in den USA. Die einzige Kennung ist eine zufällige ID, die auf diesem Gerät erstellt wird und von App und Erweiterung gemeinsam genutzt wird. Sie ist nicht mit deinem Apple Account, der Werbe-ID deines Geräts oder einer anderen Identität verknüpft. Wir erstellen keine Nutzerprofile, zeichnen keine Sitzungen oder Bildschirme auf und speichern deine IP-Adresse nicht und verwenden sie auch nicht, um deinen Standort zu ermitteln. Die Daten werden nicht für Werbung verwendet, weder verkauft noch an andere weitergegeben und nicht genutzt, um dich über Apps oder Websites hinweg zu verfolgen.", "t6": "6. Netzwerkanfragen", "b6": "Abgesehen von den oben beschriebenen anonymen Nutzungsdaten lädt die Erweiterung nur die Stylesheets und Bilder, die eine Seite ohnehin verwendet, um sie neu zu gestalten. Wenn du auf „Nach Updates suchen“ tippst, fragt die App beim öffentlichen App Store-Dienst von Apple die neueste Versionsnummer ab. Diese Anfrage geht an Apple, nicht an uns.", "t7": "7. Käufe", "b7": "Käufe werden von Apple über den App Store abgewickelt. Deine Zahlungsmethode und die Daten deines Apple Accounts verarbeitet Apple; wir können sie nicht sehen.", "t8": "8. Feedback-E-Mails", "b8": "Wenn du uns schreibst, erhalten wir deinen Text sowie die in der E-Mail vorausgefüllte App-Version, Systemversion und das Gerätemodell – diese kannst du vor dem Senden löschen. Wir nutzen das nur, um dir zu antworten und Probleme zu beheben.", "t9": "9. Datenschutz für Kinder", "b9": "Die App erfasst wissentlich keine Daten von Kindern unter 13 Jahren.", "t10": "10. Änderungen dieser Richtlinie", "b10": "Wenn sich diese Richtlinie ändert, veröffentlichen wir die neue Version auf dieser Seite und aktualisieren das Gültigkeitsdatum."}, "fr": {"title": "Nocti · Politique de confidentialité", "h1": "Politique de confidentialité", "back": "Retour", "eff": "Date d’entrée en vigueur : 21 octobre 2026", "intro": "Nocti (« l’App ») est une extension Safari qui assombrit les pages web sur votre appareil. Vous n’avez besoin d’aucun compte, et rien de ce que vous consultez ne nous parvient. Cette politique explique précisément comment l’App traite vos informations.", "contact_t": "11. Nous contacter", "contact_l": "Pour toute question concernant cette politique, contactez :", "t1": "1. Ce que nous ne collectons pas", "b1": "L’App ne nécessite ni inscription ni connexion. Elle ne collecte pas votre nom, votre adresse e-mail, votre position ni vos contacts, et ne collecte jamais votre historique de navigation, l’adresse complète des pages que vous consultez, ni leur contenu.", "t2": "2. Fonctionnement de l’extension", "b2": "L’extension s’exécute dans Safari, sur votre appareil. Elle lit les couleurs d’une page uniquement pour les remplacer par des couleurs sombres, directement dans Safari. Le contenu des pages n’est jamais copié, stocké ni envoyé où que ce soit.", "t3": "3. Où sont stockés vos réglages", "b3": "Votre thème, vos options d’atténuation, vos corrections de sites et la liste des sites sur lesquels vous avez désactivé Nocti sont enregistrés sur cet appareil. En dehors des données d’utilisation anonymes décrites ci-dessous, ils ne sont transmis ni à nous ni à aucun tiers.", "t4": "4. Données d’utilisation anonymes", "b4": "Pour savoir quelles fonctionnalités sont utilisées et quels sites doivent être corrigés, l’App et l’extension envoient un petit ensemble d’événements anonymes. Chacun se compose d’un nom d’événement fixe et de quelques détails, comme le thème choisi, le mode activé, ou le prix et la devise d’un achat. Les nombres, comme le nombre de thèmes personnalisés ou de règles de site que vous avez, ne sont envoyés que sous forme de tranches (par exemple 2–5), afin qu’un chiffre exact ne puisse pas servir d’empreinte. Chaque événement inclut aussi la version de l’app, le système d’exploitation et sa version, votre langue préférée et l’état de déverrouillage de Pro. Lorsque vous signalez un site, désactivez Nocti sur un site, corrigez sa détection des sites sombres ou ajustez ses couleurs, le domaine du site est inclus (par exemple example.com, jamais l’adresse complète), et un signalement inclut aussi la note que vous rédigez. Votre historique de navigation, les adresses complètes des pages, le contenu des pages et tout ce qui permet de vous identifier ne sont jamais inclus. Le partage est activé par défaut, et vous pouvez le désactiver à tout moment dans Réglages → À propos → Politique de confidentialité. À partir de là, plus rien n’est envoyé, et les événements encore en attente d’envoi sont supprimés.", "t5": "5. Qui traite ces données", "b5": "PostHog traite ces événements pour notre compte, sur des serveurs situés aux États-Unis. Le seul identifiant est un ID aléatoire créé sur cet appareil et partagé par l’App et l’extension. Il n’est lié ni à votre compte Apple, ni à l’identifiant publicitaire de votre appareil, ni à aucune autre identité. Nous ne créons pas de profils d’utilisateurs, n’enregistrons ni sessions ni écrans, et ne conservons pas votre adresse IP ni ne l’utilisons pour déterminer votre position. Les données ne sont pas utilisées à des fins publicitaires, ne sont ni vendues ni partagées avec qui que ce soit, et ne servent pas à vous suivre d’une app ou d’un site web à l’autre.", "t6": "6. Requêtes réseau", "b6": "En dehors des données d’utilisation anonymes décrites ci-dessus, l’extension télécharge uniquement les feuilles de style et les images qu’une page utilise déjà, afin de les adapter au mode sombre. Lorsque vous touchez Rechercher les mises à jour, l’App demande au service public de l’App Store d’Apple le dernier numéro de version. Cette requête est envoyée à Apple, pas à nous.", "t7": "7. Achats", "b7": "Les achats sont effectués par Apple via l’App Store. Votre moyen de paiement et les informations de votre compte Apple sont gérés par Apple, et nous n’y avons pas accès.", "t8": "8. E-mails de commentaires", "b8": "Si vous nous écrivez, nous recevons votre message ainsi que la version de l’app, la version du système et le modèle d’appareil préremplis dans l’e-mail, que vous pouvez supprimer avant l’envoi. Nous les utilisons uniquement pour vous répondre et corriger les problèmes.", "t9": "9. Confidentialité des enfants", "b9": "L’App ne collecte sciemment aucune information auprès d’enfants de moins de 13 ans.", "t10": "10. Modifications de cette politique", "b10": "Si cette politique change, nous publierons la nouvelle version sur cette page et mettrons à jour la date d’entrée en vigueur."}, "es": {"title": "Nocti · Política de privacidad", "h1": "Política de privacidad", "back": "Volver", "eff": "Fecha de entrada en vigor: 21 de octubre de 2026", "intro": "Nocti («la App») es una extensión de Safari que oscurece las páginas web en tu dispositivo. No necesitas ninguna cuenta y nada de lo que navegas nos llega nunca. Esta política explica con exactitud cómo trata la App tu información.", "contact_t": "11. Contacto", "contact_l": "Si tienes alguna pregunta sobre esta política, escribe a:", "t1": "1. Qué no recopilamos", "b1": "La App no tiene registro ni inicio de sesión. No recopila tu nombre, correo electrónico, ubicación ni contactos, y nunca recopila tu historial de navegación, las direcciones completas de las páginas que visitas ni su contenido.", "t2": "2. Cómo funciona la extensión", "b2": "La extensión funciona dentro de Safari en tu dispositivo. Lee los colores de una página solo para cambiarlos por colores oscuros, ahí mismo, en Safari. El contenido de la página nunca se copia, se guarda ni se envía a ningún sitio.", "t3": "3. Dónde se guardan tus ajustes", "b3": "Tu tema, las opciones de atenuación, las correcciones de sitios y la lista de sitios en los que has desactivado Nocti se guardan en este dispositivo. Aparte de los datos de uso anónimos descritos más abajo, no se suben a nuestros servidores ni a los de terceros.", "t4": "4. Datos de uso anónimos", "b4": "Para saber qué funciones se usan y qué sitios hay que corregir, la App y la extensión envían un pequeño conjunto de eventos anónimos. Cada uno es un nombre de evento fijo con unos pocos detalles, como el tema que has elegido, el modo al que has cambiado o el precio y la moneda de una compra. Los recuentos, como cuántos temas personalizados o reglas de sitios tienes, se envían solo como intervalos (por ejemplo, 2–5), para que un número exacto no pueda convertirse en una huella digital. Cada evento incluye también la versión de la app, el sistema operativo y su versión, tu idioma preferido y si Pro está desbloqueado. Cuando notificas un sitio, desactivas Nocti en un sitio, corriges su detección de sitio oscuro o ajustas sus colores, se incluye el dominio del sitio (por ejemplo, example.com, nunca la dirección completa), y una notificación incluye además la nota que escribas. Nunca se incluyen tu historial de navegación, las direcciones completas de las páginas, su contenido ni nada que te identifique. Esta opción está activada por omisión y puedes desactivarla cuando quieras en Ajustes → Acerca de → Política de privacidad. A partir de ese momento no se envía nada, y los eventos pendientes de envío se eliminan.", "t5": "5. Quién trata estos datos", "b5": "PostHog trata estos eventos en nuestro nombre, en servidores ubicados en Estados Unidos. El único identificador es un ID aleatorio creado en este dispositivo y compartido por la App y la extensión. No está vinculado a tu cuenta de Apple, al identificador de publicidad del dispositivo ni a ninguna otra identidad. No creamos perfiles de usuario, no grabamos sesiones ni pantallas, y no guardamos tu dirección IP ni la usamos para averiguar tu ubicación. Los datos no se usan para publicidad, no se venden ni se comparten con nadie más, y no se usan para rastrearte entre apps o sitios web.", "t6": "6. Solicitudes de red", "b6": "Aparte de los datos de uso anónimos descritos arriba, la extensión solo descarga las hojas de estilo y las imágenes que una página ya utiliza, para poder cambiarles el estilo. Cuando tocas «Buscar actualizaciones», la App consulta al servicio público del App Store de Apple el número de la última versión. Esa solicitud va a Apple, no a nosotros.", "t7": "7. Compras", "b7": "Las compras las completa Apple a través del App Store. Apple gestiona tu método de pago y los datos de tu cuenta de Apple, y nosotros no podemos verlos.", "t8": "8. Correos de comentarios", "b8": "Si nos escribes, recibimos lo que escribes junto con la versión de la app, la versión del sistema y el modelo de dispositivo que aparecen ya rellenados en el correo, y que puedes borrar antes de enviarlo. Solo los usamos para responderte y resolver problemas.", "t9": "9. Privacidad de los menores", "b9": "La App no recopila a sabiendas ninguna información de menores de 13 años.", "t10": "10. Cambios en esta política", "b10": "Si esta política cambia, publicaremos la nueva versión en esta página y actualizaremos la fecha de entrada en vigor."}, "it": {"title": "Nocti · Informativa sulla privacy", "h1": "Informativa sulla privacy", "back": "Indietro", "eff": "Data di entrata in vigore: 21 ottobre 2026", "intro": "Nocti (\"l’App\") è un’estensione di Safari che scurisce le pagine web sul tuo dispositivo. Non serve alcun account e nulla di ciò che navighi arriva mai a noi. Questa informativa spiega esattamente come l’App tratta le tue informazioni.", "contact_t": "11. Contatti", "contact_l": "Per qualsiasi domanda su questa informativa, contatta:", "t1": "1. Cosa non raccogliamo", "b1": "L’App non prevede registrazione né login. Non raccoglie il tuo nome, la tua email, la tua posizione o i tuoi contatti, e non raccoglie mai la cronologia di navigazione, gli indirizzi completi delle pagine che visiti o i loro contenuti.", "t2": "2. Come funziona l’estensione", "b2": "L’estensione funziona dentro Safari sul tuo dispositivo. Legge i colori di una pagina solo per sostituirli con colori scuri, direttamente in Safari. I contenuti della pagina non vengono mai copiati, salvati o inviati da nessuna parte.", "t3": "3. Dove sono salvate le tue impostazioni", "b3": "Il tuo tema, le opzioni di attenuazione, le correzioni dei siti e l’elenco dei siti su cui hai disattivato Nocti sono salvati su questo dispositivo. A parte i dati di utilizzo anonimi descritti più avanti, non vengono caricati sui nostri server né su quelli di terzi.", "t4": "4. Dati di utilizzo anonimi", "b4": "Per capire quali funzioni vengono usate e quali siti vanno sistemati, l’App e l’estensione inviano un piccolo insieme di eventi anonimi. Ognuno è un nome di evento fisso con pochi dettagli, come il tema che hai scelto, la modalità che hai attivato o il prezzo e la valuta di un acquisto. I conteggi, come quanti temi personalizzati o regole per sito hai, vengono inviati solo come intervalli (per esempio 2–5), così che un numero esatto non possa diventare un’impronta digitale. Ogni evento include anche la versione dell’app, il sistema operativo e la sua versione, la lingua preferita e se Pro è sbloccato. Quando segnali un sito, disattivi Nocti su un sito, correggi il suo rilevamento dei siti scuri o ne regoli i colori, viene incluso il dominio del sito (per esempio example.com, mai l’indirizzo completo), e una segnalazione include anche la nota che scrivi. La cronologia di navigazione, gli indirizzi completi delle pagine, i contenuti delle pagine e qualsiasi cosa ti identifichi non vengono mai inclusi. La condivisione è attiva per impostazione predefinita e puoi disattivarla in qualsiasi momento in Impostazioni → Info → Informativa sulla privacy. Da quel momento non viene inviato nulla e gli eventi ancora in attesa di invio vengono eliminati.", "t5": "5. Chi tratta questi dati", "b5": "PostHog tratta questi eventi per nostro conto, su server negli Stati Uniti. L’unico identificatore è un ID casuale creato su questo dispositivo e condiviso dall’App e dall’estensione. Non è collegato al tuo account Apple, all’identificatore pubblicitario del dispositivo né a nessun’altra identità. Non creiamo profili utente, non registriamo sessioni né schermate, e non conserviamo il tuo indirizzo IP né lo usiamo per risalire alla tua posizione. I dati non vengono usati per la pubblicità, non vengono venduti né condivisi con nessun altro e non vengono usati per tracciarti tra app o siti web.", "t6": "6. Richieste di rete", "b6": "Oltre ai dati di utilizzo anonimi descritti sopra, l’estensione scarica solo i fogli di stile e le immagini che una pagina già utilizza, per poterne cambiare lo stile. Quando tocchi “Controlla aggiornamenti”, l’App chiede al servizio pubblico App Store di Apple il numero dell’ultima versione. Questa richiesta va ad Apple, non a noi.", "t7": "7. Acquisti", "b7": "Gli acquisti vengono completati da Apple tramite l’App Store. Il metodo di pagamento e i dati del tuo account Apple sono gestiti da Apple e noi non possiamo vederli.", "t8": "8. Email di feedback", "b8": "Se ci scrivi, riceviamo quello che scrivi più la versione dell’app, la versione del sistema e il modello del dispositivo già inseriti nell’email, che puoi eliminare prima dell’invio. Li usiamo solo per risponderti e risolvere i problemi.", "t9": "9. Privacy dei minori", "b9": "L’App non raccoglie consapevolmente alcuna informazione da bambini di età inferiore a 13 anni.", "t10": "10. Modifiche a questa informativa", "b10": "Se questa informativa cambia, pubblicheremo la nuova versione su questa pagina e aggiorneremo la data di entrata in vigore."}, "pt-BR": {"title": "Nocti · Política de Privacidade", "h1": "Política de Privacidade", "back": "Voltar", "eff": "Data de vigência: 21 de outubro de 2026", "intro": "O Nocti (“o App”) é uma extensão do Safari que escurece páginas da web no seu dispositivo. Você não precisa de conta, e nada do que você navega chega até nós. Esta política explica exatamente como o App trata suas informações.", "contact_t": "11. Fale conosco", "contact_l": "Se tiver qualquer dúvida sobre esta política, entre em contato:", "t1": "1. O que não coletamos", "b1": "O App não tem cadastro nem login. Ele não coleta seu nome, e-mail, localização ou contatos, e nunca coleta seu histórico de navegação, os endereços completos das páginas que você visita nem o conteúdo delas.", "t2": "2. Como a extensão funciona", "b2": "A extensão roda dentro do Safari no seu dispositivo. Ela lê as cores de uma página apenas para trocá-las por cores escuras, ali mesmo no Safari. O conteúdo da página nunca é copiado, armazenado ou enviado a lugar nenhum.", "t3": "3. Onde suas configurações ficam armazenadas", "b3": "Seu tema, as opções de escurecimento, as correções de sites e a lista de sites em que você desativou o Nocti ficam salvos neste dispositivo. Além dos dados de uso anônimos descritos abaixo, nada disso é enviado para nós ou para terceiros.", "t4": "4. Dados de uso anônimos", "b4": "Para saber quais recursos são usados e quais sites precisam de correção, o App e a extensão enviam um pequeno conjunto de eventos anônimos. Cada um é um nome de evento fixo com alguns detalhes, como o tema que você escolheu, o modo para o qual mudou ou o preço e a moeda de uma compra. Contagens, como quantos temas personalizados ou regras de sites você tem, são enviadas apenas como faixas (por exemplo, 2–5), para que um número exato não vire uma impressão digital. Todo evento também inclui a versão do app, o sistema operacional e a versão dele, seu idioma preferido e se o Pro está desbloqueado. Quando você relata um site, desativa o Nocti em um site, corrige a detecção de site escuro ou ajusta as cores dele, o domínio do site é incluído (por exemplo, example.com, nunca o endereço completo), e um relato também inclui a observação que você escrever. Seu histórico de navegação, endereços completos de páginas, o conteúdo delas e qualquer coisa que identifique você nunca são incluídos. O compartilhamento vem ativado por padrão, e você pode desativá-lo a qualquer momento em Ajustes → Sobre → Política de Privacidade. A partir daí nada é enviado, e os eventos que ainda aguardavam envio são apagados.", "t5": "5. Quem processa esses dados", "b5": "A PostHog processa esses eventos em nosso nome, em servidores nos Estados Unidos. O único identificador é um ID aleatório criado neste dispositivo e compartilhado pelo App e pela extensão. Ele não é vinculado à sua Conta Apple, ao identificador de publicidade do dispositivo nem a nenhuma outra identidade. Não criamos perfis de usuário, não gravamos sessões nem telas, e não armazenamos seu endereço IP nem o usamos para descobrir sua localização. Os dados não são usados para publicidade, não são vendidos nem compartilhados com mais ninguém e não são usados para rastrear você entre apps ou sites.", "t6": "6. Solicitações de rede", "b6": "Além dos dados de uso anônimos descritos acima, a extensão baixa apenas as folhas de estilo e as imagens que a página já usa, para poder adaptá-las. Quando você toca em Buscar Atualizações, o App consulta o serviço público da App Store da Apple para saber o número da versão mais recente. Essa solicitação vai para a Apple, não para nós.", "t7": "7. Compras", "b7": "As compras são concluídas pela Apple por meio da App Store. Sua forma de pagamento e os dados da sua Conta Apple são tratados pela Apple, e nós não temos acesso a eles.", "t8": "8. E-mails de feedback", "b8": "Se você nos enviar um e-mail, recebemos o que você escreveu e também a versão do app, a versão do sistema e o modelo do dispositivo preenchidos no e-mail, que você pode apagar antes de enviar. Usamos isso apenas para responder e corrigir problemas.", "t9": "9. Privacidade de crianças", "b9": "O App não coleta intencionalmente nenhuma informação de crianças menores de 13 anos.", "t10": "10. Alterações nesta política", "b10": "Se esta política mudar, publicaremos a nova versão nesta página e atualizaremos a data de vigência."}, "ru": {"title": "Nocti · Политика конфиденциальности", "h1": "Политика конфиденциальности", "back": "Назад", "eff": "Дата вступления в силу: 21 октября 2026 г.", "intro": "Nocti («Приложение») — расширение Safari, которое затемняет веб-страницы на вашем устройстве. Учетная запись не нужна, и ничего из того, что вы просматриваете, к нам не попадает. Эта политика подробно объясняет, как Приложение обращается с вашей информацией.", "contact_t": "11. Связаться с нами", "contact_l": "Если у вас есть вопросы об этой политике, напишите:", "t1": "1. Что мы не собираем", "b1": "В Приложении нет регистрации и входа. Оно не собирает ваше имя, email, геопозицию или контакты и никогда не собирает историю просмотров, полные адреса посещаемых страниц или их содержимое.", "t2": "2. Как работает расширение", "b2": "Расширение работает внутри Safari на вашем устройстве. Оно читает цвета страницы только для того, чтобы перекрасить их в темные тона прямо в Safari. Содержимое страниц никогда не копируется, не сохраняется и никуда не отправляется.", "t3": "3. Где хранятся ваши настройки", "b3": "Ваша тема, параметры затемнения, исправления сайтов и список сайтов, на которых вы отключили Nocti, хранятся на этом устройстве. Помимо анонимных данных об использовании, описанных ниже, они не передаются ни нам, ни третьим лицам.", "t4": "4. Анонимные данные об использовании", "b4": "Чтобы понимать, какими функциями пользуются и какие сайты нужно доработать, Приложение и расширение отправляют небольшой набор анонимных событий. Каждое из них — это фиксированное название события и несколько подробностей, например выбранная тема, режим, на который вы переключились, или цена и валюта покупки. Количества, например сколько у вас своих тем или правил для сайтов, отправляются только диапазонами (например, 2–5), чтобы точное число не стало цифровым отпечатком. Каждое событие также содержит версию приложения, операционную систему и ее версию, предпочитаемый язык и то, разблокирована ли версия Pro. Когда вы сообщаете о сайте, отключаете для сайта Nocti, исправляете для него распознавание темных сайтов или настраиваете его цвета, добавляется домен сайта (например, example.com, но никогда не полный адрес), а сообщение также содержит написанную вами заметку. История просмотров, полные адреса страниц, содержимое страниц и все, что позволяет вас идентифицировать, никогда не включаются. Отправка включена по умолчанию, и ее можно в любой момент отключить в разделе Настройки → О приложении → Политика конфиденциальности. С этого момента ничего не отправляется, а события, еще ожидающие отправки, удаляются.", "t5": "5. Кто обрабатывает эти данные", "b5": "Эти события обрабатывает PostHog от нашего имени на серверах в США. Единственный идентификатор — случайный ID, созданный на этом устройстве и общий для Приложения и расширения. Он не связан с вашим Аккаунтом Apple, рекламным идентификатором устройства или любой другой личностью. Мы не создаем профили пользователей, не записываем сеансы или экраны, не храним ваш IP-адрес и не используем его для определения вашего местоположения. Данные не используются для рекламы, не продаются и не передаются никому другому и не используются для отслеживания вас в других приложениях или на сайтах.", "t6": "6. Сетевые запросы", "b6": "Помимо анонимных данных об использовании, описанных выше, расширение загружает только те таблицы стилей и изображения, которые уже использует страница, чтобы перекрасить их. Когда вы нажимаете «Проверить обновления», Приложение запрашивает номер последней версии у публичного сервиса App Store компании Apple. Этот запрос уходит в Apple, а не к нам.", "t7": "7. Покупки", "b7": "Покупки совершаются через App Store компании Apple. Способ оплаты и данные Аккаунта Apple обрабатывает Apple, мы их не видим.", "t8": "8. Письма с отзывами", "b8": "Если вы напишете нам, мы получим ваше письмо, а также версию приложения, версию системы и модель устройства, заранее добавленные в письмо (их можно удалить перед отправкой). Мы используем эти данные только для того, чтобы ответить вам и исправить проблемы.", "t9": "9. Конфиденциальность детей", "b9": "Приложение сознательно не собирает никакую информацию о детях младше 13 лет.", "t10": "10. Изменения политики", "b10": "Если политика изменится, мы опубликуем новую версию на этой странице и обновим дату вступления в силу."}, "ar": {"title": "Nocti · سياسة الخصوصية", "h1": "سياسة الخصوصية", "back": "رجوع", "eff": "تاريخ السريان: 21 أكتوبر 2026", "intro": "Nocti («التطبيق») امتداد لـ Safari يجعل صفحات الويب داكنة على جهازك. لا تحتاج إلى حساب، ولا يصل إلينا أي شيء مما تتصفحه. توضح هذه السياسة بالضبط كيف يتعامل التطبيق مع معلوماتك.", "contact_t": "11. اتصل بنا", "contact_l": "إذا كانت لديك أي أسئلة حول هذه السياسة، فتواصل مع:", "t1": "1. ما لا نجمعه", "b1": "لا يتطلب التطبيق تسجيلًا أو تسجيل دخول. لا يجمع اسمك أو بريدك الإلكتروني أو موقعك أو جهات اتصالك، ولا يجمع أبدًا سجل التصفح أو العناوين الكاملة للصفحات التي تزورها أو محتواها.", "t2": "2. كيف يعمل الامتداد", "b2": "يعمل الامتداد داخل Safari على جهازك. وهو يقرأ ألوان الصفحة فقط لإعادة تنسيقها بألوان داكنة، هناك داخل Safari. لا يُنسَخ محتوى الصفحات أو يُخزَّن أو يُرسَل إلى أي مكان أبدًا.", "t3": "3. أين تُخزَّن إعداداتك", "b3": "تُحفَظ سمتك وخيارات التخفيت وإصلاحات المواقع وقائمة المواقع التي أوقفت Nocti عليها على هذا الجهاز. وباستثناء بيانات الاستخدام المجهولة الموضحة أدناه، لا تُرفَع إلينا ولا إلى أي جهة خارجية.", "t4": "4. بيانات الاستخدام المجهولة", "b4": "لنعرف الميزات التي يستخدمها الناس والمواقع التي تحتاج إلى إصلاح، يرسل التطبيق والامتداد مجموعة صغيرة من الأحداث المجهولة. كل حدث عبارة عن اسم حدث ثابت مع بعض التفاصيل القليلة، مثل السمة التي اخترتها، أو الوضع الذي انتقلت إليه، أو سعر عملية شراء وعملتها. أما الأعداد، مثل عدد السمات المخصصة أو قواعد المواقع لديك، فتُرسل في صورة نطاقات فقط (مثل 2–5)، حتى لا يتحول رقم دقيق إلى بصمة تميّزك. ويتضمن كل حدث أيضًا إصدار التطبيق، ونظام التشغيل وإصداره، ولغتك المفضلة، وما إذا كان Pro مفعّلًا. عندما تبلّغ عن موقع، أو توقف Nocti على موقع، أو تصحّح اكتشاف المواقع الداكنة له، أو تعدّل ألوانه، يُضمَّن نطاق الموقع (مثل example.com، وليس العنوان الكامل أبدًا)، ويتضمن البلاغ أيضًا الملاحظة التي تكتبها. لا يُضمَّن أبدًا سجل التصفح، أو العناوين الكاملة للصفحات، أو محتوى الصفحات، أو أي شيء يحدد هويتك. المشاركة مفعّلة افتراضيًا، ويمكنك إيقافها في أي وقت من «الإعدادات ← حول ← سياسة الخصوصية». ومن تلك اللحظة لا يُرسل أي شيء، وتُحذف الأحداث التي لا تزال بانتظار الإرسال.", "t5": "5. من يعالج هذه البيانات", "b5": "تعالج PostHog هذه الأحداث نيابةً عنا، على خوادم في الولايات المتحدة. المعرّف الوحيد هو معرّف عشوائي يُنشأ على هذا الجهاز ويتشاركه التطبيق والامتداد. وهو غير مرتبط بحساب Apple الخاص بك، أو بمعرّف الإعلانات في جهازك، أو بأي هوية أخرى. لا ننشئ ملفات تعريف للمستخدمين، ولا نسجّل الجلسات أو الشاشات، ولا نخزّن عنوان IP الخاص بك ولا نستخدمه لتحديد موقعك. لا تُستخدم البيانات للإعلانات، ولا تُباع ولا تُشارك مع أي جهة أخرى، ولا تُستخدم لتتبعك عبر التطبيقات أو مواقع الويب.", "t6": "6. طلبات الشبكة", "b6": "باستثناء بيانات الاستخدام المجهولة الموضحة أعلاه، لا يُنزّل الامتداد إلا أوراق الأنماط والصور التي تستخدمها الصفحة أصلًا، كي يتمكن من إعادة تنسيقها. عندما تضغط على «التحقق من وجود تحديثات»، يسأل التطبيق خدمة App Store العامة من Apple عن رقم أحدث إصدار. يذهب هذا الطلب إلى Apple وليس إلينا.", "t7": "7. عمليات الشراء", "b7": "تُكمل Apple عمليات الشراء عبر App Store. تتولى Apple طريقة الدفع وتفاصيل حساب Apple الخاصة بك، ولا يمكننا رؤيتها.", "t8": "8. رسائل الملاحظات", "b8": "إذا راسلتنا، نتلقى ما تكتبه إضافةً إلى إصدار التطبيق وإصدار النظام وطراز الجهاز المعبّأة مسبقًا في الرسالة، ويمكنك حذفها قبل الإرسال. نستخدمها فقط للرد عليك وإصلاح المشكلات.", "t9": "9. خصوصية الأطفال", "b9": "لا يجمع التطبيق عن قصد أي معلومات من الأطفال دون سن 13 عامًا.", "t10": "10. التغييرات على هذه السياسة", "b10": "إذا تغيّرت هذه السياسة، فسننشر النسخة الجديدة على هذه الصفحة ونحدّث تاريخ السريان."}, "bn": {"title": "Nocti · গোপনীয়তা নীতি", "h1": "গোপনীয়তা নীতি", "back": "পিছনে", "eff": "কার্যকর হওয়ার তারিখ: ২১ অক্টোবর, ২০২৬", "intro": "Nocti (“অ্যাপ”) একটি Safari এক্সটেনশন যা আপনার ডিভাইসে ওয়েব পৃষ্ঠা ডার্ক করে। কোনো অ্যাকাউন্টের দরকার নেই, আর আপনি যা ব্রাউজ করেন তার কিছুই আমাদের কাছে পৌঁছায় না। অ্যাপটি আপনার তথ্য ঠিক কীভাবে ব্যবহার করে, এই নীতিতে তা ব্যাখ্যা করা হয়েছে।", "contact_t": "১১. যোগাযোগ করুন", "contact_l": "এই নীতি নিয়ে কোনো প্রশ্ন থাকলে যোগাযোগ করুন:", "t1": "১. আমরা যা সংগ্রহ করি না", "b1": "অ্যাপটিতে কোনো সাইন-আপ বা লগইন নেই। এটি আপনার নাম, ইমেল, লোকেশন বা পরিচিতি সংগ্রহ করে না, এবং কখনো আপনার ব্রাউজিং ইতিহাস, আপনার দেখা পৃষ্ঠাগুলোর পুরো ঠিকানা বা সেগুলোর কনটেন্ট সংগ্রহ করে না।", "t2": "২. এক্সটেনশন কীভাবে কাজ করে", "b2": "এক্সটেনশনটি আপনার ডিভাইসে Safari-র ভেতরেই চলে। এটি পৃষ্ঠার রং পড়ে শুধু সেগুলোকে ডার্ক রঙে নতুন করে সাজানোর জন্য, Safari-র ভেতরেই। পৃষ্ঠার কনটেন্ট কখনো কপি, সংরক্ষণ বা কোথাও পাঠানো হয় না।", "t3": "৩. আপনার সেটিংস কোথায় থাকে", "b3": "আপনার থিম, ম্লান করার বিকল্প, সাইট ফিক্স এবং যেসব সাইটে আপনি Nocti বন্ধ করেছেন তার তালিকা এই ডিভাইসেই সংরক্ষিত থাকে। নিচে বর্ণিত বেনামি ব্যবহারের ডেটা ছাড়া এগুলো আমাদের বা কোনো তৃতীয় পক্ষের কাছে আপলোড করা হয় না।", "t4": "৪. বেনামি ব্যবহারের ডেটা", "b4": "কোন ফিচারগুলো মানুষ ব্যবহার করে এবং কোন সাইটগুলো ঠিক করা দরকার তা জানতে, অ্যাপ ও এক্সটেনশন অল্প কিছু বেনামি ইভেন্ট পাঠায়। প্রতিটি ইভেন্ট হলো একটি নির্দিষ্ট ইভেন্ট নাম আর অল্প কিছু বিবরণ, যেমন আপনি কোন থিম বেছে নিয়েছেন, কোন মোডে গেছেন, বা কোনো কেনাকাটার দাম ও মুদ্রা। সংখ্যা, যেমন আপনার কয়টি কাস্টম থিম বা সাইটের নিয়ম আছে, শুধু পরিসর হিসেবে পাঠানো হয় (যেমন ২–৫), যাতে একটি সঠিক সংখ্যা ফিঙ্গারপ্রিন্টে পরিণত না হয়। প্রতিটি ইভেন্টে অ্যাপের সংস্করণ, অপারেটিং সিস্টেম ও তার সংস্করণ, আপনার পছন্দের ভাষা এবং Pro আনলক করা আছে কি না, তাও থাকে। আপনি কোনো সাইট রিপোর্ট করলে, কোনো সাইটে Nocti বন্ধ করলে, সেটির ডার্ক সাইট শনাক্তকরণ সংশোধন করলে বা সেটির রং সামঞ্জস্য করলে, সাইটটির ডোমেন যুক্ত হয় (যেমন example.com, কখনো পুরো ঠিকানা নয়), আর রিপোর্টে আপনার লেখা নোটও থাকে। আপনার ব্রাউজিং ইতিহাস, পৃষ্ঠার পুরো ঠিকানা, পৃষ্ঠার কনটেন্ট এবং আপনাকে শনাক্ত করতে পারে এমন কিছুই কখনো যুক্ত হয় না। শেয়ার করা ডিফল্টভাবে চালু থাকে, এবং আপনি যেকোনো সময় সেটিংস → সম্পর্কে → গোপনীয়তা নীতি-এ গিয়ে এটি বন্ধ করতে পারেন। তখন থেকে কিছুই পাঠানো হয় না, আর যেসব ইভেন্ট এখনো পাঠানোর অপেক্ষায় আছে সেগুলো মুছে ফেলা হয়।", "t5": "৫. এই ডেটা কে প্রক্রিয়া করে", "b5": "PostHog আমাদের পক্ষ থেকে মার্কিন যুক্তরাষ্ট্রের সার্ভারে এই ইভেন্টগুলো প্রক্রিয়া করে। একমাত্র শনাক্তকারী হলো এই ডিভাইসে তৈরি একটি র‍্যান্ডম আইডি, যা অ্যাপ ও এক্সটেনশন একসঙ্গে ব্যবহার করে। এটি আপনার Apple অ্যাকাউন্ট, ডিভাইসের বিজ্ঞাপন শনাক্তকারী বা অন্য কোনো পরিচয়ের সঙ্গে যুক্ত নয়। আমরা কোনো ব্যবহারকারী প্রোফাইল তৈরি করি না, সেশন বা স্ক্রিন রেকর্ড করি না, এবং আপনার IP ঠিকানা সংরক্ষণ করি না বা তা দিয়ে আপনার অবস্থান খুঁজি না। এই ডেটা বিজ্ঞাপনের জন্য ব্যবহার করা হয় না, বিক্রি করা হয় না বা অন্য কারও সঙ্গে শেয়ার করা হয় না, এবং বিভিন্ন অ্যাপ বা ওয়েবসাইট জুড়ে আপনাকে ট্র্যাক করতে ব্যবহার করা হয় না।", "t6": "৬. নেটওয়ার্ক অনুরোধ", "b6": "উপরে বর্ণিত বেনামি ব্যবহারের ডেটা ছাড়া, এক্সটেনশনটি শুধু সেই স্টাইলশিট ও ছবিগুলো ডাউনলোড করে যা পৃষ্ঠাটি আগে থেকেই ব্যবহার করে, যাতে সেগুলোকে নতুন করে সাজাতে পারে। আপনি “আপডেট চেক করুন” ট্যাপ করলে অ্যাপটি সর্বশেষ সংস্করণ নম্বর জানতে Apple-এর পাবলিক App Store পরিষেবায় অনুরোধ পাঠায়। সেই অনুরোধ Apple-এর কাছে যায়, আমাদের কাছে নয়।", "t7": "৭. কেনাকাটা", "b7": "কেনাকাটা Apple, App Store-এর মাধ্যমে সম্পন্ন করে। আপনার পেমেন্ট পদ্ধতি ও Apple অ্যাকাউন্টের তথ্য Apple পরিচালনা করে, আমরা সেগুলো দেখতে পাই না।", "t8": "৮. মতামতের ইমেল", "b8": "আপনি আমাদের ইমেল করলে আমরা পাই আপনার লেখা, সঙ্গে ইমেলে আগে থেকে পূরণ করা অ্যাপের সংস্করণ, সিস্টেমের সংস্করণ ও ডিভাইসের মডেল — পাঠানোর আগে এগুলো মুছে দিতে পারেন। আমরা এগুলো শুধু আপনাকে উত্তর দিতে এবং সমস্যা সমাধানে ব্যবহার করি।", "t9": "৯. শিশুদের গোপনীয়তা", "b9": "অ্যাপটি জেনেশুনে ১৩ বছরের কম বয়সী শিশুদের কাছ থেকে কোনো তথ্য সংগ্রহ করে না।", "t10": "১০. এই নীতিতে পরিবর্তন", "b10": "এই নীতি পরিবর্তিত হলে আমরা নতুন সংস্করণটি এই পৃষ্ঠায় প্রকাশ করব এবং কার্যকর হওয়ার তারিখ হালনাগাদ করব।"}, "ca": {"title": "Nocti · Política de privacitat", "h1": "Política de privacitat", "back": "Enrere", "eff": "Data d’entrada en vigor: 21 d’octubre de 2026", "intro": "El Nocti (“l’App”) és una extensió del Safari que enfosqueix les pàgines web al dispositiu. No necessites cap compte i res del que navegues no ens arriba mai. Aquesta política explica exactament com tracta l’App la teva informació.", "contact_t": "11. Contacta’ns", "contact_l": "Si tens qualsevol pregunta sobre aquesta política, contacta amb:", "t1": "1. Què no recollim", "b1": "L’App no requereix registre ni inici de sessió. No recull el teu nom, el correu, la ubicació ni els contactes, i no recull mai l’historial de navegació, les adreces completes de les pàgines que visites ni el seu contingut.", "t2": "2. Com funciona l’extensió", "b2": "L’extensió funciona dins del Safari, al dispositiu. Llegeix els colors d’una pàgina només per substituir-los per colors foscos, allà mateix, al Safari. El contingut de les pàgines no es copia, no es desa ni s’envia enlloc.", "t3": "3. On es desa la teva configuració", "b3": "El tema, les opcions d’atenuació, les correccions de llocs i la llista de llocs on has desactivat el Nocti es desen en aquest dispositiu. A part de les dades d’ús anònimes descrites més avall, no es pugen als nostres servidors ni als de cap tercer.", "t4": "4. Dades d’ús anònimes", "b4": "Per saber quines funcions es fan servir i quins llocs cal arreglar, l’App i l’extensió envien un petit conjunt d’esdeveniments anònims. Cadascun és un nom d’esdeveniment fix amb uns quants detalls, com el tema que has triat, el mode al qual has canviat o el preu i la moneda d’una compra. Els recomptes, com quants temes personalitzats o regles de lloc tens, només s’envien com a intervals (per exemple, 2–5), perquè un nombre exacte no pugui convertir-se en una empremta digital. Cada esdeveniment també inclou la versió de l’app, el sistema operatiu i la seva versió, el teu idioma preferit i si el Pro està desbloquejat. Quan informes d’un lloc, hi desactives el Nocti, en corregeixes la detecció de llocs foscos o n’ajustes els colors, s’inclou el domini del lloc (per exemple, example.com, mai l’adreça completa), i un informe també inclou la nota que escriguis. L’historial de navegació, les adreces completes de les pàgines, el contingut de les pàgines i qualsevol cosa que t’identifiqui no s’inclouen mai. La compartició està activada per defecte i la pots desactivar en qualsevol moment a Configuració → Informació → Política de privacitat. A partir d’aquell moment no s’envia res, i els esdeveniments que encara esperaven ser enviats s’eliminen.", "t5": "5. Qui tracta aquestes dades", "b5": "PostHog tracta aquests esdeveniments en nom nostre, en servidors situats als Estats Units. L’únic identificador és un ID aleatori creat en aquest dispositiu i compartit per l’App i l’extensió. No està vinculat al teu compte d’Apple, a l’identificador publicitari del dispositiu ni a cap altra identitat. No creem perfils d’usuari, no enregistrem sessions ni pantalles, i no desem la teva adreça IP ni la fem servir per esbrinar la teva ubicació. Les dades no s’utilitzen per a publicitat, no es venen ni es comparteixen amb ningú més, i no s’utilitzen per seguir-te entre apps o llocs web.", "t6": "6. Sol·licituds de xarxa", "b6": "A part de les dades d’ús anònimes descrites més amunt, l’extensió només baixa els fulls d’estil i les imatges que una pàgina ja fa servir, per poder-los canviar l’estil. Quan toques “Buscar actualitzacions”, l’App consulta al servei públic de l’App Store d’Apple el número de la versió més recent. Aquesta sol·licitud va a Apple, no a nosaltres.", "t7": "7. Compres", "b7": "Apple fa les compres a través de l’App Store. Apple gestiona el teu mètode de pagament i les dades del teu compte d’Apple, i nosaltres no els podem veure.", "t8": "8. Correus de comentaris", "b8": "Si ens escrius, rebem el que escrius i també la versió de l’app, la versió del sistema i el model del dispositiu, que ja venen omplerts al correu i que pots esborrar abans d’enviar-lo. Només ho fem servir per respondre’t i solucionar problemes.", "t9": "9. Privacitat dels infants", "b9": "L’App no recull conscientment cap informació d’infants menors de 13 anys.", "t10": "10. Canvis en aquesta política", "b10": "Si aquesta política canvia, publicarem la nova versió en aquesta pàgina i actualitzarem la data d’entrada en vigor."}, "cs": {"title": "Nocti · Zásady ochrany soukromí", "h1": "Zásady ochrany soukromí", "back": "Zpět", "eff": "Datum účinnosti: 21. října 2026", "intro": "Nocti („aplikace“) je rozšíření Safari, které ztmavuje webové stránky ve vašem zařízení. Nepotřebujete žádný účet a nic z toho, co prohlížíte, se k nám nikdy nedostane. Tyto zásady přesně vysvětlují, jak aplikace nakládá s vašimi údaji.", "contact_t": "11. Kontakt", "contact_l": "Máte-li k těmto zásadám jakékoli dotazy, kontaktujte:", "t1": "1. Co neshromažďujeme", "b1": "Aplikace nevyžaduje registraci ani přihlášení. Neshromažďuje vaše jméno, e-mail, polohu ani kontakty a nikdy neshromažďuje historii prohlížení, úplné adresy navštívených stránek ani jejich obsah.", "t2": "2. Jak rozšíření funguje", "b2": "Rozšíření běží v Safari ve vašem zařízení. Barvy stránky čte jen proto, aby je přímo v Safari přebarvilo na tmavé. Obsah stránky se nikdy nekopíruje, neukládá ani nikam neodesílá.", "t3": "3. Kde jsou uložena vaše nastavení", "b3": "Váš motiv, nastavení ztlumení, opravy webů a seznam webů, na kterých jste Nocti vypnuli, se ukládají v tomto zařízení. Kromě anonymních údajů o používání popsaných níže se nenahrávají k nám ani k žádné třetí straně.", "t4": "4. Anonymní údaje o používání", "b4": "Abychom věděli, které funkce lidé používají a které weby je potřeba opravit, odesílá aplikace a rozšíření malou sadu anonymních událostí. Každá z nich je pevný název události s několika podrobnostmi, například jaký motiv jste vybrali, na jaký režim jste přepnuli nebo cena a měna nákupu. Počty, například kolik máte vlastních motivů nebo pravidel pro weby, se odesílají jen jako rozsahy (například 2–5), aby se přesné číslo nemohlo stát otiskem prstu. Každá událost obsahuje také verzi aplikace, operační systém a jeho verzi, váš preferovaný jazyk a informaci, zda je odemčeno Pro. Když nahlásíte web, vypnete na webu Nocti, opravíte jeho rozpoznávání tmavých webů nebo upravíte jeho barvy, připojí se doména webu (například example.com, nikdy úplná adresa) a hlášení obsahuje také poznámku, kterou napíšete. Historie prohlížení, úplné adresy stránek, obsah stránek ani nic, co by vás mohlo identifikovat, se nikdy nepřipojují. Sdílení je ve výchozím stavu zapnuté a kdykoli ho můžete vypnout v Nastavení → O aplikaci → Zásady ochrany soukromí. Od té chvíle se nic neodesílá a události, které ještě čekají na odeslání, se smažou.", "t5": "5. Kdo tato data zpracovává", "b5": "PostHog zpracovává tyto události naším jménem na serverech ve Spojených státech. Jediným identifikátorem je náhodné ID vytvořené v tomto zařízení, které sdílí aplikace i rozšíření. Není propojené s vaším Apple účtem, reklamním identifikátorem zařízení ani žádnou jinou identitou. Nevytváříme uživatelské profily, nenahráváme relace ani obrazovky a neukládáme vaši IP adresu ani ji nepoužíváme ke zjištění vaší polohy. Data se nepoužívají k reklamě, neprodávají se ani se s nikým nesdílejí a nepoužívají se ke sledování napříč aplikacemi nebo weby.", "t6": "6. Síťové požadavky", "b6": "Kromě anonymních údajů o používání popsaných výše stahuje rozšíření jen styly a obrázky, které stránka už používá, aby je mohlo přebarvit. Když klepnete na Vyhledat aktualizace, aplikace se zeptá veřejné služby App Store od společnosti Apple na číslo nejnovější verze. Tento požadavek jde k Applu, ne k nám.", "t7": "7. Nákupy", "b7": "Nákupy vyřizuje Apple prostřednictvím App Storu. Vaši platební metodu a údaje Apple účtu zpracovává Apple a my je nevidíme.", "t8": "8. E-maily se zpětnou vazbou", "b8": "Když nám napíšete, obdržíme váš text a také verzi aplikace, verzi systému a model zařízení předvyplněné v e-mailu, které můžete před odesláním smazat. Používáme je jen k odpovědi a k opravě problémů.", "t9": "9. Soukromí dětí", "b9": "Aplikace vědomě neshromažďuje žádné údaje od dětí mladších 13 let.", "t10": "10. Změny těchto zásad", "b10": "Pokud se tyto zásady změní, zveřejníme novou verzi na této stránce a aktualizujeme datum účinnosti."}, "da": {"title": "Nocti · Anonymitetspolitik", "h1": "Anonymitetspolitik", "back": "Tilbage", "eff": "Gældende fra: 21. oktober 2026", "intro": "Nocti (»appen«) er en Safari-udvidelse, der gør websider mørke på din enhed. Du behøver ingen konto, og intet af det, du browser, når nogensinde frem til os. Denne politik forklarer præcis, hvordan appen håndterer dine oplysninger.", "contact_t": "11. Kontakt os", "contact_l": "Hvis du har spørgsmål til denne politik, kan du kontakte:", "t1": "1. Hvad vi ikke indsamler", "b1": "Appen kræver ingen tilmelding eller login. Den indsamler ikke dit navn, din e-mail, din lokalitet eller dine kontakter, og den indsamler aldrig din browserhistorik, de fulde adresser på de sider, du besøger, eller deres indhold.", "t2": "2. Sådan fungerer udvidelsen", "b2": "Udvidelsen kører i Safari på din enhed. Den læser kun en sides farver for at give dem mørke farver, direkte i Safari. Sideindhold bliver aldrig kopieret, gemt eller sendt nogen steder hen.", "t3": "3. Hvor dine indstillinger gemmes", "b3": "Dit tema, dine dæmpningsvalg, tilpasninger af websteder og listen over websteder, hvor du har slået Nocti fra, gemmes på denne enhed. Ud over de anonyme brugsdata, der er beskrevet nedenfor, uploades de ikke til os eller til tredjeparter.", "t4": "4. Anonyme brugsdata", "b4": "For at finde ud af, hvilke funktioner folk bruger, og hvilke websteder der skal rettes, sender appen og udvidelsen et lille sæt anonyme hændelser. Hver hændelse er et fast hændelsesnavn med nogle få detaljer, f.eks. det tema, du valgte, den tilstand, du skiftede til, eller prisen og valutaen for et køb. Antal, f.eks. hvor mange egne temaer eller webstedsregler du har, sendes kun som intervaller (for eksempel 2–5), så et præcist tal ikke kan blive et fingeraftryk. Hver hændelse indeholder også appversionen, styresystemet og dets version, dit foretrukne sprog og om Pro er låst op. Når du rapporterer et websted, slår Nocti fra for et websted, retter dets genkendelse af mørke websteder eller justerer dets farver, medsendes webstedets domæne (for eksempel example.com, aldrig den fulde adresse), og en rapport indeholder også den note, du skriver. Din browserhistorik, fulde sideadresser, sideindhold og alt, der kan identificere dig, medsendes aldrig. Deling er slået til som standard, og du kan når som helst slå den fra under Indstillinger → Om → Anonymitetspolitik. Derefter sendes der intet, og hændelser, der stadig venter på at blive sendt, slettes.", "t5": "5. Hvem behandler disse data", "b5": "PostHog behandler disse hændelser på vores vegne på servere i USA. Den eneste identifikator er et tilfældigt id, der oprettes på denne enhed og deles af appen og udvidelsen. Det er ikke knyttet til din Apple-konto, din enheds reklame-id eller nogen anden identitet. Vi opretter ikke brugerprofiler, optager ikke sessioner eller skærme og gemmer ikke din IP-adresse eller bruger den til at finde din lokalitet. Dataene bruges ikke til reklamer, sælges ikke eller deles ikke med andre og bruges ikke til at spore dig på tværs af apps eller websteder.", "t6": "6. Netværksforespørgsler", "b6": "Ud over de anonyme brugsdata, der er beskrevet ovenfor, henter udvidelsen kun de stylesheets og billeder, som en side allerede bruger, så den kan give dem nye farver. Når du trykker på Søg efter opdateringer, spørger appen Apples offentlige App Store-tjeneste om det seneste versionsnummer. Den forespørgsel går til Apple, ikke til os.", "t7": "7. Køb", "b7": "Køb gennemføres af Apple via App Store. Din betalingsmetode og oplysningerne om din Apple-konto håndteres af Apple, og vi kan ikke se dem.", "t8": "8. Feedback via e-mail", "b8": "Hvis du skriver til os, modtager vi det, du skriver, samt appversion, systemversion og enhedsmodel, som er udfyldt på forhånd i e-mailen, og som du kan slette før afsendelse. Vi bruger det kun til at svare dig og løse problemer.", "t9": "9. Børns privatliv", "b9": "Appen indsamler ikke bevidst oplysninger fra børn under 13 år.", "t10": "10. Ændringer af denne politik", "b10": "Hvis denne politik ændres, offentliggør vi den nye version på denne side og opdaterer ikrafttrædelsesdatoen."}, "el": {"title": "Nocti · Πολιτική απορρήτου", "h1": "Πολιτική απορρήτου", "back": "Πίσω", "eff": "Ημερομηνία ισχύος: 21 Οκτωβρίου 2026", "intro": "Το Nocti («η Εφαρμογή») είναι μια επέκταση Safari που σκουραίνει τις ιστοσελίδες στη συσκευή σας. Δεν χρειάζεστε λογαριασμό και τίποτα από όσα περιηγείστε δεν φτάνει ποτέ σε εμάς. Αυτή η πολιτική εξηγεί ακριβώς πώς χειρίζεται η Εφαρμογή τις πληροφορίες σας.", "contact_t": "11. Επικοινωνία", "contact_l": "Αν έχετε οποιαδήποτε απορία σχετικά με αυτή την πολιτική, επικοινωνήστε στο:", "t1": "1. Τι δεν συλλέγουμε", "b1": "Η Εφαρμογή δεν έχει εγγραφή ή σύνδεση. Δεν συλλέγει το όνομα, το email, την τοποθεσία ή τις επαφές σας και δεν συλλέγει ποτέ το ιστορικό περιήγησής σας, τις πλήρεις διευθύνσεις των σελίδων που επισκέπτεστε ή το περιεχόμενό τους.", "t2": "2. Πώς λειτουργεί η επέκταση", "b2": "Η επέκταση λειτουργεί μέσα στο Safari στη συσκευή σας. Διαβάζει τα χρώματα μιας σελίδας μόνο για να τα αναμορφώσει σε σκούρα, εκεί μέσα στο Safari. Το περιεχόμενο των σελίδων δεν αντιγράφεται, δεν αποθηκεύεται και δεν αποστέλλεται ποτέ πουθενά.", "t3": "3. Πού αποθηκεύονται οι ρυθμίσεις σας", "b3": "Το θέμα σας, οι επιλογές χαμηλώματος, οι διορθώσεις ιστοτόπων και η λίστα των ιστοτόπων όπου απενεργοποιήσατε το Nocti αποθηκεύονται σε αυτή τη συσκευή. Εκτός από τα ανώνυμα δεδομένα χρήσης που περιγράφονται παρακάτω, δεν αποστέλλονται σε εμάς ή σε τρίτους.", "t4": "4. Ανώνυμα δεδομένα χρήσης", "b4": "Για να ξέρουμε ποιες λειτουργίες χρησιμοποιούνται και ποιοι ιστότοποι χρειάζονται διόρθωση, η Εφαρμογή και η επέκταση στέλνουν ένα μικρό σύνολο ανώνυμων συμβάντων. Το καθένα είναι ένα σταθερό όνομα συμβάντος με λίγες λεπτομέρειες, όπως το θέμα που επιλέξατε, η λειτουργία στην οποία αλλάξατε ή η τιμή και το νόμισμα μιας αγοράς. Οι ποσότητες, όπως πόσα προσαρμοσμένα θέματα ή κανόνες ιστοτόπων έχετε, στέλνονται μόνο ως εύρη (για παράδειγμα 2–5), ώστε ένας ακριβής αριθμός να μην μπορεί να γίνει αποτύπωμα. Κάθε συμβάν περιλαμβάνει επίσης την έκδοση της εφαρμογής, το λειτουργικό σύστημα και την έκδοσή του, την προτιμώμενη γλώσσα σας και αν το Pro είναι ξεκλείδωτο. Όταν αναφέρετε έναν ιστότοπο, απενεργοποιείτε το Nocti σε έναν ιστότοπο, διορθώνετε τον εντοπισμό σκούρων ιστοτόπων για αυτόν ή προσαρμόζετε τα χρώματά του, περιλαμβάνεται ο τομέας του ιστοτόπου (για παράδειγμα example.com, ποτέ η πλήρης διεύθυνση), και μια αναφορά περιλαμβάνει επίσης τη σημείωση που γράφετε. Το ιστορικό περιήγησής σας, οι πλήρεις διευθύνσεις σελίδων, το περιεχόμενο των σελίδων και οτιδήποτε σας ταυτοποιεί δεν περιλαμβάνονται ποτέ. Η κοινή χρήση είναι ενεργή από προεπιλογή και μπορείτε να την απενεργοποιήσετε οποιαδήποτε στιγμή στο Ρυθμίσεις → Πληροφορίες → Πολιτική απορρήτου. Από τότε δεν στέλνεται τίποτα, και τα συμβάντα που περιμένουν ακόμη να σταλούν διαγράφονται.", "t5": "5. Ποιος επεξεργάζεται αυτά τα δεδομένα", "b5": "Η PostHog επεξεργάζεται αυτά τα συμβάντα για λογαριασμό μας, σε διακομιστές στις Ηνωμένες Πολιτείες. Το μόνο αναγνωριστικό είναι ένα τυχαίο ID που δημιουργείται σε αυτή τη συσκευή και χρησιμοποιείται κοινά από την Εφαρμογή και την επέκταση. Δεν συνδέεται με τον Λογαριασμό Apple σας, το διαφημιστικό αναγνωριστικό της συσκευής σας ή οποιαδήποτε άλλη ταυτότητα. Δεν δημιουργούμε προφίλ χρηστών, δεν καταγράφουμε συνεδρίες ή οθόνες, και δεν αποθηκεύουμε τη διεύθυνση IP σας ούτε τη χρησιμοποιούμε για να εντοπίσουμε την τοποθεσία σας. Τα δεδομένα δεν χρησιμοποιούνται για διαφήμιση, δεν πωλούνται ούτε κοινοποιούνται σε κανέναν άλλο και δεν χρησιμοποιούνται για να σας παρακολουθούν σε εφαρμογές ή ιστότοπους.", "t6": "6. Αιτήματα δικτύου", "b6": "Εκτός από τα ανώνυμα δεδομένα χρήσης που περιγράφονται παραπάνω, η επέκταση κατεβάζει μόνο τα φύλλα στυλ και τις εικόνες που ήδη χρησιμοποιεί μια σελίδα, ώστε να τα αναμορφώσει. Όταν αγγίζετε «Έλεγχος για ενημερώσεις», η Εφαρμογή ρωτά τη δημόσια υπηρεσία App Store της Apple για τον πιο πρόσφατο αριθμό έκδοσης. Αυτό το αίτημα πηγαίνει στην Apple, όχι σε εμάς.", "t7": "7. Αγορές", "b7": "Οι αγορές ολοκληρώνονται από την Apple μέσω του App Store. Ο τρόπος πληρωμής και τα στοιχεία του Λογαριασμού Apple σας τα διαχειρίζεται η Apple και δεν μπορούμε να τα δούμε.", "t8": "8. Email σχολίων", "b8": "Αν μας στείλετε email, λαμβάνουμε ό,τι γράφετε, καθώς και την έκδοση της εφαρμογής, την έκδοση του συστήματος και το μοντέλο της συσκευής που είναι προσυμπληρωμένα στο email και μπορείτε να τα διαγράψετε πριν το στείλετε. Τα χρησιμοποιούμε μόνο για να σας απαντήσουμε και να διορθώσουμε προβλήματα.", "t9": "9. Απόρρητο παιδιών", "b9": "Η Εφαρμογή δεν συλλέγει εν γνώσει της καμία πληροφορία από παιδιά κάτω των 13 ετών.", "t10": "10. Αλλαγές σε αυτή την πολιτική", "b10": "Αν αλλάξει αυτή η πολιτική, θα δημοσιεύσουμε τη νέα έκδοση σε αυτή τη σελίδα και θα ενημερώσουμε την ημερομηνία ισχύος."}, "es-419": {"title": "Nocti · Política de privacidad", "h1": "Política de privacidad", "back": "Atrás", "eff": "Fecha de entrada en vigor: 21 de octubre de 2026", "intro": "Nocti (“la App”) es una extensión de Safari que oscurece las páginas web en tu dispositivo. No necesitas ninguna cuenta y nada de lo que navegas nos llega nunca. Esta política explica con exactitud cómo trata la App tu información.", "contact_t": "11. Contacto", "contact_l": "Si tienes alguna pregunta sobre esta política, escribe a:", "t1": "1. Qué no recopilamos", "b1": "La App no tiene registro ni inicio de sesión. No recopila tu nombre, correo electrónico, ubicación ni contactos, y nunca recopila tu historial de navegación, las direcciones completas de las páginas que visitas ni su contenido.", "t2": "2. Cómo funciona la extensión", "b2": "La extensión funciona dentro de Safari en tu dispositivo. Lee los colores de una página solo para cambiarlos por colores oscuros, ahí mismo, en Safari. El contenido de la página nunca se copia, se guarda ni se envía a ningún sitio.", "t3": "3. Dónde se guarda tu configuración", "b3": "Tu tema, las opciones de atenuación, las correcciones de sitios y la lista de sitios en los que desactivaste Nocti se guardan en este dispositivo. Aparte de los datos de uso anónimos descritos más abajo, no se suben a nuestros servidores ni a los de terceros.", "t4": "4. Datos de uso anónimos", "b4": "Para saber qué funciones se usan y qué sitios hay que corregir, la App y la extensión envían un pequeño conjunto de eventos anónimos. Cada uno es un nombre de evento fijo con unos pocos detalles, como el tema que elegiste, el modo al que cambiaste o el precio y la moneda de una compra. Los conteos, como cuántos temas personalizados o reglas de sitios tienes, se envían solo como rangos (por ejemplo, 2–5), para que un número exacto no pueda convertirse en una huella digital. Cada evento incluye también la versión de la app, el sistema operativo y su versión, tu idioma preferido y si Pro está desbloqueado. Cuando notificas un sitio, desactivas Nocti en un sitio, corriges su detección de sitio oscuro o ajustas sus colores, se incluye el dominio del sitio (por ejemplo, example.com, nunca la dirección completa), y una notificación incluye además la nota que escribas. Nunca se incluyen tu historial de navegación, las direcciones completas de las páginas, su contenido ni nada que te identifique. Esta opción está activada de manera predeterminada y puedes desactivarla cuando quieras en Configuración → Acerca de → Política de privacidad. A partir de ese momento no se envía nada, y los eventos pendientes de envío se eliminan.", "t5": "5. Quién procesa estos datos", "b5": "PostHog procesa estos eventos en nuestro nombre, en servidores ubicados en Estados Unidos. El único identificador es un ID aleatorio creado en este dispositivo y compartido por la App y la extensión. No está vinculado a tu cuenta de Apple, al identificador de publicidad del dispositivo ni a ninguna otra identidad. No creamos perfiles de usuario, no grabamos sesiones ni pantallas, y no guardamos tu dirección IP ni la usamos para averiguar tu ubicación. Los datos no se usan para publicidad, no se venden ni se comparten con nadie más, y no se usan para rastrearte entre apps o sitios web.", "t6": "6. Solicitudes de red", "b6": "Aparte de los datos de uso anónimos descritos arriba, la extensión solo descarga las hojas de estilo y las imágenes que una página ya utiliza, para poder cambiarles el estilo. Cuando tocas “Buscar actualizaciones”, la App consulta al servicio público del App Store de Apple el número de la última versión. Esa solicitud va a Apple, no a nosotros.", "t7": "7. Compras", "b7": "Las compras las completa Apple a través del App Store. Apple administra tu método de pago y los datos de tu cuenta de Apple, y nosotros no podemos verlos.", "t8": "8. Correos de comentarios", "b8": "Si nos escribes, recibimos lo que escribes junto con la versión de la app, la versión del sistema y el modelo de dispositivo que aparecen ya rellenados en el correo, y que puedes borrar antes de enviarlo. Solo los usamos para responderte y resolver problemas.", "t9": "9. Privacidad de los menores", "b9": "La App no recopila a sabiendas ninguna información de menores de 13 años.", "t10": "10. Cambios en esta política", "b10": "Si esta política cambia, publicaremos la nueva versión en esta página y actualizaremos la fecha de entrada en vigor."}, "fi": {"title": "Nocti · Tietosuojakäytäntö", "h1": "Tietosuojakäytäntö", "back": "Takaisin", "eff": "Voimaantulopäivä: 21. lokakuuta 2026", "intro": "Nocti (”Appi”) on Safari-laajennus, joka tummentaa verkkosivuja laitteellasi. Et tarvitse tiliä, eikä mikään selaamasi koskaan päädy meille. Tämä käytäntö kertoo tarkalleen, miten Appi käsittelee tietojasi.", "contact_t": "11. Ota yhteyttä", "contact_l": "Jos sinulla on kysyttävää tästä käytännöstä, ota yhteyttä:", "t1": "1. Mitä emme kerää", "b1": "Apissa ei ole rekisteröitymistä eikä kirjautumista. Se ei kerää nimeäsi, sähköpostiosoitettasi, sijaintiasi tai yhteystietojasi, eikä se koskaan kerää selaushistoriaasi, vierailemiesi sivujen kokonaisia osoitteita tai niiden sisältöä.", "t2": "2. Miten laajennus toimii", "b2": "Laajennus toimii laitteesi Safarissa. Se lukee sivun värit vain muotoillakseen ne tummiksi siinä paikassa, Safarissa. Sivun sisältöä ei koskaan kopioida, tallenneta eikä lähetetä minnekään.", "t3": "3. Missä asetuksesi tallennetaan", "b3": "Teemasi, himmennysvalinnat, sivustokorjaukset ja luettelo sivustoista, joilla laitoit Noctin pois päältä, tallennetaan tälle laitteelle. Alla kuvattuja anonyymejä käyttötietoja lukuun ottamatta niitä ei ladata meille eikä kolmansille osapuolille.", "t4": "4. Anonyymit käyttötiedot", "b4": "Jotta tietäisimme, mitä ominaisuuksia käytetään ja mitkä sivustot kaipaavat korjausta, Appi ja laajennus lähettävät pienen joukon anonyymejä tapahtumia. Kukin niistä on kiinteä tapahtuman nimi ja muutama yksityiskohta, kuten valitsemasi teema, tila, johon vaihdoit, tai oston hinta ja valuutta. Lukumäärät, kuten montako omaa teemaa tai sivustosääntöä sinulla on, lähetetään vain vaihteluväleinä (esimerkiksi 2–5), jottei tarkasta luvusta voi tulla sormenjälkeä. Jokaisessa tapahtumassa on lisäksi apin versio, käyttöjärjestelmä ja sen versio, ensisijainen kielesi sekä tieto siitä, onko Pro avattu. Kun ilmoitat sivustosta, laitat Noctin pois päältä sivustolla, korjaat sen tummien sivustojen tunnistusta tai säädät sen värejä, mukaan liitetään sivuston verkkotunnus (esimerkiksi example.com, ei koskaan koko osoitetta), ja ilmoitukseen liitetään myös kirjoittamasi huomautus. Selaushistoriaasi, sivujen kokonaisia osoitteita, sivujen sisältöä tai mitään sinut tunnistavaa ei koskaan liitetä mukaan. Jakaminen on oletuksena päällä, ja voit laittaa sen pois päältä milloin tahansa kohdassa Asetukset → Tietoja → Tietosuojakäytäntö. Sen jälkeen mitään ei lähetetä, ja vielä lähettämistä odottavat tapahtumat poistetaan.", "t5": "5. Kuka käsittelee näitä tietoja", "b5": "PostHog käsittelee näitä tapahtumia puolestamme Yhdysvalloissa sijaitsevilla palvelimilla. Ainoa tunniste on satunnainen ID, joka luodaan tällä laitteella ja jota Appi ja laajennus käyttävät yhdessä. Sitä ei ole yhdistetty Apple-tiliisi, laitteesi mainostunnisteeseen tai mihinkään muuhun identiteettiin. Emme luo käyttäjäprofiileja, emme tallenna istuntoja tai näyttöjä emmekä tallenna IP-osoitettasi tai käytä sitä sijaintisi selvittämiseen. Tietoja ei käytetä mainontaan, niitä ei myydä eikä jaeta kenellekään muulle, eikä niitä käytetä seuraamaan sinua appien tai verkkosivustojen välillä.", "t6": "6. Verkkopyynnöt", "b6": "Yllä kuvattujen anonyymien käyttötietojen lisäksi laajennus lataa vain ne tyylitiedostot ja kuvat, joita sivu jo käyttää, jotta se voi muotoilla ne uudelleen. Kun napautat Tarkista päivitykset, appi kysyy uusimman versionumeron Applen julkiselta App Store ‑palvelulta. Pyyntö menee Applelle, ei meille.", "t7": "7. Ostot", "b7": "Apple hoitaa ostot App Storen kautta. Apple käsittelee maksutapasi ja Apple-tilisi tiedot, emmekä me näe niitä.", "t8": "8. Palautesähköpostit", "b8": "Jos lähetät meille sähköpostia, saamme kirjoittamasi viestin sekä sähköpostiin valmiiksi täytetyn apin version, järjestelmäversion ja laitemallin, jotka voit poistaa ennen lähettämistä. Käytämme niitä vain vastataksemme sinulle ja korjataksemme ongelmia.", "t9": "9. Lasten yksityisyys", "b9": "Appi ei tietoisesti kerää mitään tietoja alle 13-vuotiailta lapsilta.", "t10": "10. Tämän käytännön muutokset", "b10": "Jos tämä käytäntö muuttuu, julkaisemme uuden version tällä sivulla ja päivitämme voimaantulopäivän."}, "fr-CA": {"title": "Nocti · Politique de confidentialité", "h1": "Politique de confidentialité", "back": "Retour", "eff": "Date d’entrée en vigueur : 21 octobre 2026", "intro": "Nocti (« l’App ») est une extension Safari qui assombrit les pages Web sur votre appareil. Vous n’avez besoin d’aucun compte, et rien de ce que vous consultez ne nous parvient. Cette politique explique précisément comment l’App traite vos informations.", "contact_t": "11. Nous contacter", "contact_l": "Pour toute question concernant cette politique, contactez :", "t1": "1. Ce que nous ne collectons pas", "b1": "L’App ne nécessite ni inscription ni connexion. Elle ne collecte pas votre nom, votre adresse courriel, votre position ni vos contacts, et ne collecte jamais votre historique de navigation, l’adresse complète des pages que vous consultez, ni leur contenu.", "t2": "2. Fonctionnement de l’extension", "b2": "L’extension s’exécute dans Safari, sur votre appareil. Elle lit les couleurs d’une page uniquement pour les remplacer par des couleurs sombres, directement dans Safari. Le contenu des pages n’est jamais copié, stocké ni envoyé où que ce soit.", "t3": "3. Où sont stockés vos réglages", "b3": "Votre thème, vos options d’atténuation, vos corrections de sites et la liste des sites sur lesquels vous avez désactivé Nocti sont enregistrés sur cet appareil. En dehors des données d’utilisation anonymes décrites ci-dessous, ils ne sont transmis ni à nous ni à aucun tiers.", "t4": "4. Données d’utilisation anonymes", "b4": "Pour savoir quelles fonctionnalités sont utilisées et quels sites doivent être corrigés, l’App et l’extension envoient un petit ensemble d’événements anonymes. Chacun se compose d’un nom d’événement fixe et de quelques détails, comme le thème choisi, le mode activé, ou le prix et la devise d’un achat. Les nombres, comme le nombre de thèmes personnalisés ou de règles de site que vous avez, ne sont envoyés que sous forme de tranches (par exemple 2–5), afin qu’un chiffre exact ne puisse pas servir d’empreinte. Chaque événement inclut aussi la version de l’app, le système d’exploitation et sa version, votre langue préférée et l’état de déverrouillage de Pro. Lorsque vous signalez un site, désactivez Nocti sur un site, corrigez sa détection des sites sombres ou ajustez ses couleurs, le domaine du site est inclus (par exemple example.com, jamais l’adresse complète), et un signalement inclut aussi la note que vous rédigez. Votre historique de navigation, les adresses complètes des pages, le contenu des pages et tout ce qui permet de vous identifier ne sont jamais inclus. Le partage est activé par défaut, et vous pouvez le désactiver en tout temps dans Réglages → À propos → Politique de confidentialité. À partir de là, plus rien n’est envoyé, et les événements encore en attente d’envoi sont supprimés.", "t5": "5. Qui traite ces données", "b5": "PostHog traite ces événements pour notre compte, sur des serveurs situés aux États-Unis. Le seul identifiant est un ID aléatoire créé sur cet appareil et partagé par l’App et l’extension. Il n’est lié ni à votre compte Apple, ni à l’identifiant publicitaire de votre appareil, ni à aucune autre identité. Nous ne créons pas de profils d’utilisateurs, n’enregistrons ni sessions ni écrans, et ne conservons pas votre adresse IP ni ne l’utilisons pour déterminer votre position. Les données ne sont pas utilisées à des fins publicitaires, ne sont ni vendues ni partagées avec qui que ce soit, et ne servent pas à vous suivre d’une app ou d’un site Web à l’autre.", "t6": "6. Requêtes réseau", "b6": "En dehors des données d’utilisation anonymes décrites ci-dessus, l’extension télécharge uniquement les feuilles de style et les images qu’une page utilise déjà, afin de les adapter au mode sombre. Lorsque vous touchez Rechercher les mises à jour, l’App demande au service public de l’App Store d’Apple le dernier numéro de version. Cette requête est envoyée à Apple, pas à nous.", "t7": "7. Achats", "b7": "Les achats sont effectués par Apple via l’App Store. Votre moyen de paiement et les informations de votre compte Apple sont gérés par Apple, et nous n’y avons pas accès.", "t8": "8. Courriels de commentaires", "b8": "Si vous nous écrivez, nous recevons votre message ainsi que la version de l’app, la version du système et le modèle d’appareil préremplis dans le courriel, que vous pouvez supprimer avant l’envoi. Nous les utilisons uniquement pour vous répondre et corriger les problèmes.", "t9": "9. Confidentialité des enfants", "b9": "L’App ne collecte sciemment aucune information auprès d’enfants de moins de 13 ans.", "t10": "10. Modifications de cette politique", "b10": "Si cette politique change, nous publierons la nouvelle version sur cette page et mettrons à jour la date d’entrée en vigueur."}, "gu": {"title": "Nocti · ગોપનીયતા નીતિ", "h1": "ગોપનીયતા નીતિ", "back": "પાછળ", "eff": "અમલની તારીખ: 21 ઑક્ટોબર, 2026", "intro": "Nocti (“ઍપ”) એક Safari એક્સ્ટેન્શન છે જે તમારા ડિવાઇસ પર વેબ પેજને ડાર્ક કરે છે. તમારે કોઈ એકાઉન્ટની જરૂર નથી, અને તમે જે બ્રાઉઝ કરો છો તેમાંનું કંઈ પણ અમારા સુધી પહોંચતું નથી. આ નીતિ સ્પષ્ટ સમજાવે છે કે ઍપ તમારી માહિતી કેવી રીતે સંભાળે છે.", "contact_t": "11. અમારો સંપર્ક કરો", "contact_l": "આ નીતિ વિશે કોઈ પ્રશ્ન હોય તો સંપર્ક કરો:", "t1": "1. અમે શું એકત્ર કરતા નથી", "b1": "ઍપમાં કોઈ સાઇન-અપ કે લૉગઇન નથી. તે તમારું નામ, ઇમેઇલ, સ્થાન કે સંપર્કો એકત્ર કરતી નથી, અને ક્યારેય તમારો બ્રાઉઝિંગ ઇતિહાસ, તમે મુલાકાત લો છો તે પેજનાં પૂરાં ઍડ્રેસ કે તેમનું કન્ટેન્ટ એકત્ર કરતી નથી.", "t2": "2. એક્સ્ટેન્શન કેવી રીતે કામ કરે છે", "b2": "એક્સ્ટેન્શન તમારા ડિવાઇસ પર Safariની અંદર ચાલે છે. તે પેજના રંગો ફક્ત તેમને ડાર્ક રંગોમાં બદલવા માટે જ વાંચે છે, ત્યાં Safariમાં જ. પેજનું કન્ટેન્ટ ક્યારેય કૉપિ, સ્ટોર કે ક્યાંય મોકલાતું નથી.", "t3": "3. તમારાં સેટિંગ્સ ક્યાં સ્ટોર થાય છે", "b3": "તમારી થીમ, ઝાંખું કરવાના વિકલ્પો, સાઇટ ફિક્સ અને જે સાઇટ્સ મા
