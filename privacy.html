kickas ingenting, och händelser som fortfarande väntar på att skickas raderas.", "t5": "5. Vem som behandlar dessa data", "b5": "PostHog behandlar dessa händelser för vår räkning, på servrar i USA. Den enda identifieraren är ett slumpmässigt id som skapas på den här enheten och delas av appen och tillägget. Det är inte kopplat till ditt Apple-konto, enhetens annonsidentifierare eller någon annan identitet. Vi skapar inga användarprofiler, spelar inte in sessioner eller skärmar och sparar inte din IP-adress eller använder den för att ta reda på din plats. Datan används inte för reklam, säljs inte och delas inte med någon annan, och används inte för att spåra dig mellan appar eller webbplatser.", "t6": "6. Nätverksförfrågningar", "b6": "Utöver den anonyma användningsdata som beskrivs ovan hämtar tillägget bara de stilmallar och bilder som en sida redan använder, för att kunna ge dem ny stil. När du trycker på Sök efter uppdateringar frågar appen Apples offentliga App Store-tjänst efter det senaste versionsnumret. Den förfrågan går till Apple, inte till oss.", "t7": "7. Köp", "b7": "Köp genomförs av Apple via App Store. Din betalningsmetod och dina Apple-kontouppgifter hanteras av Apple, och vi kan inte se dem.", "t8": "8. Mejl med feedback", "b8": "Om du mejlar oss får vi det du skriver samt appversion, systemversion och enhetsmodell som redan är ifyllda i mejlet – dem kan du radera innan du skickar. Vi använder det bara för att svara dig och åtgärda problem.", "t9": "9. Barns integritet", "b9": "Appen samlar inte medvetet in någon information från barn under 13 år.", "t10": "10. Ändringar i den här policyn", "b10": "Om policyn ändras publicerar vi den nya versionen på den här sidan och uppdaterar datumet då den börjar gälla."}, "ta": {"title": "Nocti · தனியுரிமைக் கொள்கை", "h1": "தனியுரிமைக் கொள்கை", "back": "பின்செல்", "eff": "நடைமுறைக்கு வரும் தேதி: அக்டோபர் 21, 2026", "intro": "Nocti (\"App\") என்பது உங்கள் சாதனத்தில் இணையப் பக்கங்களை இருட்டாக்கும் ஒரு Safari நீட்டிப்பு. உங்களுக்குக் கணக்கு எதுவும் தேவையில்லை, நீங்கள் உலாவும் எதுவும் எங்களை வந்தடைவதில்லை. App உங்கள் தகவல்களை எப்படிக் கையாளுகிறது என்பதை இந்தக் கொள்கை துல்லியமாக விளக்குகிறது.", "contact_t": "11. எங்களைத் தொடர்புகொள்ள", "contact_l": "இந்தக் கொள்கை பற்றி ஏதேனும் கேள்விகள் இருந்தால், தொடர்புகொள்ளுங்கள்:", "t1": "1. நாங்கள் எதைச் சேகரிப்பதில்லை", "b1": "App-இல் பதிவுசெய்தலோ உள்நுழைவோ இல்லை. அது உங்கள் பெயர், மின்னஞ்சல், இருப்பிடம், தொடர்புகள் எதையும் சேகரிப்பதில்லை; உங்கள் உலாவல் வரலாற்றையோ, நீங்கள் பார்வையிடும் பக்கங்களின் முழு முகவரிகளையோ, அவற்றின் உள்ளடக்கத்தையோ ஒருபோதும் சேகரிப்பதில்லை.", "t2": "2. நீட்டிப்பு எப்படி வேலை செய்கிறது", "b2": "நீட்டிப்பு உங்கள் சாதனத்தில் Safari-க்குள் இயங்குகிறது. ஒரு பக்கத்தின் நிறங்களை இருண்ட நிறங்களாக மாற்றுவதற்காக மட்டுமே, அங்கேயே Safari-இல், அது அவற்றைப் படிக்கிறது. பக்க உள்ளடக்கம் ஒருபோதும் நகலெடுக்கப்படுவதோ, சேமிக்கப்படுவதோ, எங்கும் அனுப்பப்படுவதோ இல்லை.", "t3": "3. உங்கள் அமைப்புகள் எங்கே சேமிக்கப்படுகின்றன", "b3": "உங்கள் தீம், மங்கலாக்கும் விருப்பங்கள், தளத் திருத்தங்கள், நீங்கள் Nocti-ஐ முடக்கிய தளங்களின் பட்டியல் ஆகியவை இந்தச் சாதனத்திலேயே சேமிக்கப்படுகின்றன. கீழே விவரிக்கப்பட்ட அநாமதேயப் பயன்பாட்டுத் தரவைத் தவிர, அவை எங்களுக்கோ எந்த மூன்றாம் தரப்புக்கோ பதிவேற்றப்படுவதில்லை.", "t4": "4. அநாமதேயப் பயன்பாட்டுத் தரவு", "b4": "மக்கள் எந்த அம்சங்களைப் பயன்படுத்துகிறார்கள், எந்தத் தளங்களைச் சரிசெய்ய வேண்டும் என்பதை அறிய, App-உம் நீட்டிப்பும் சில அநாமதேய நிகழ்வுகளை அனுப்புகின்றன. ஒவ்வொன்றும் ஒரு நிலையான நிகழ்வுப் பெயரும் சில விவரங்களும் கொண்டது, எடுத்துக்காட்டாக நீங்கள் தேர்ந்தெடுத்த தீம், நீங்கள் மாறிய பயன்முறை, அல்லது ஒரு வாங்குதலின் விலையும் நாணயமும். உங்களிடம் எத்தனை தனிப்பயன் தீம்கள் அல்லது தள விதிகள் உள்ளன என்பது போன்ற எண்ணிக்கைகள் வரம்புகளாக மட்டுமே அனுப்பப்படுகின்றன (எடுத்துக்காட்டாக 2–5), இதனால் துல்லியமான எண் ஒரு கைரேகையாக மாற முடியாது. ஒவ்வொரு நிகழ்விலும் ஆப்ஸ் பதிப்பு, இயக்க முறைமையும் அதன் பதிப்பும், நீங்கள் விரும்பும் மொழி, Pro திறக்கப்பட்டுள்ளதா என்பதும் இருக்கும். நீங்கள் ஒரு தளத்தைப் புகாரளிக்கும்போது, ஒரு தளத்துக்கு Nocti-ஐ முடக்கும்போது, அதன் இருண்ட தளக் கண்டறிதலைத் திருத்தும்போது அல்லது அதன் நிறங்களைச் சரிசெய்யும்போது, தளத்தின் டொமைன் சேர்க்கப்படும் (எடுத்துக்காட்டாக example.com, ஒருபோதும் முழு முகவரி அல்ல), புகாரில் நீங்கள் எழுதும் குறிப்பும் சேர்க்கப்படும். உங்கள் உலாவல் வரலாறு, பக்கங்களின் முழு முகவரிகள், பக்க உள்ளடக்கம், உங்களை அடையாளம் காட்டக்கூடிய எதுவும் ஒருபோதும் சேர்க்கப்படுவதில்லை. பகிர்தல் இயல்பாக இயக்கத்தில் இருக்கும், அமைப்புகள் → அறிமுகம் → தனியுரிமைக் கொள்கை இல் எப்போது வேண்டுமானாலும் அதை முடக்கலாம். அதன் பிறகு எதுவும் அனுப்பப்படாது, அனுப்பக் காத்திருக்கும் நிகழ்வுகளும் நீக்கப்படும்.", "t5": "5. இந்தத் தரவை யார் செயலாக்குகிறார்கள்", "b5": "எங்கள் சார்பாக PostHog இந்த நிகழ்வுகளை அமெரிக்காவில் உள்ள சேவையகங்களில் செயலாக்குகிறது. ஒரே அடையாளங்காட்டி இந்தச் சாதனத்தில் உருவாக்கப்பட்டு App-உம் நீட்டிப்பும் பகிர்ந்துகொள்ளும் ஒரு சீரற்ற ID மட்டுமே. இது உங்கள் Apple கணக்கு, உங்கள் சாதனத்தின் விளம்பர அடையாளங்காட்டி அல்லது வேறு எந்த அடையாளத்துடனும் இணைக்கப்படவில்லை. நாங்கள் பயனர் சுயவிவரங்களை உருவாக்குவதில்லை, அமர்வுகளையோ திரைகளையோ பதிவுசெய்வதில்லை, உங்கள் IP முகவரியைச் சேமிப்பதோ உங்கள் இருப்பிடத்தைக் கண்டறிய அதைப் பயன்படுத்துவதோ இல்லை. இந்தத் தரவு விளம்பரத்துக்குப் பயன்படுத்தப்படுவதில்லை, விற்கப்படுவதோ வேறு யாருடனும் பகிரப்படுவதோ இல்லை, ஆப்ஸ் அல்லது இணையதளங்கள் முழுவதும் உங்களைக் கண்காணிக்கவும் பயன்படுத்தப்படுவதில்லை.", "t6": "6. நெட்வொர்க் கோரிக்கைகள்", "b6": "மேலே விவரிக்கப்பட்ட அநாமதேயப் பயன்பாட்டுத் தரவைத் தவிர, ஒரு பக்கம் ஏற்கெனவே பயன்படுத்தும் ஸ்டைல்ஷீட்களையும் படங்களையும் மட்டுமே நீட்டிப்பு பதிவிறக்குகிறது, அவற்றின் தோற்றத்தை மாற்றுவதற்காக. புதுப்பிப்புகளைச் சரிபார் என்பதைத் தட்டும்போது, சமீபத்திய பதிப்பு எண்ணை App, Apple-இன் பொது App Store சேவையிடம் கேட்கிறது. அந்தக் கோரிக்கை Apple-க்குச் செல்கிறது, எங்களுக்கு அல்ல.", "t7": "7. வாங்குதல்கள்", "b7": "வாங்குதல்கள் App Store மூலம் Apple-ஆல் நிறைவுசெய்யப்படுகின்றன. உங்கள் பணம் செலுத்தும் முறையையும் Apple கணக்கு விவரங்களையும் Apple கையாளுகிறது; அவற்றை எங்களால் பார்க்க முடியாது.", "t8": "8. கருத்து மின்னஞ்சல்கள்", "b8": "நீங்கள் எங்களுக்கு மின்னஞ்சல் அனுப்பினால், நீங்கள் எழுதியதும், மின்னஞ்சலில் முன்பே நிரப்பப்பட்ட ஆப் பதிப்பு, சிஸ்டம் பதிப்பு, சாதன மாடல் ஆகியவையும் எங்களுக்குக் கிடைக்கும்; அனுப்பும் முன் அவற்றை நீக்கலாம். உங்களுக்குப் பதிலளிக்கவும் சிக்கல்களைச் சரிசெய்யவும் மட்டுமே இவற்றைப் பயன்படுத்துகிறோம்.", "t9": "9. குழந்தைகளின் தனியுரிமை", "b9": "13 வயதுக்குட்பட்ட குழந்தைகளிடமிருந்து App தெரிந்தே எந்தத் தகவலையும் சேகரிப்பதில்லை.", "t10": "10. இந்தக் கொள்கையில் மாற்றங்கள்", "b10": "இந்தக் கொள்கை மாறினால், புதிய பதிப்பை இந்தப் பக்கத்தில் வெளியிட்டு, நடைமுறைக்கு வரும் தேதியைப் புதுப்பிப்போம்."}, "te": {"title": "Nocti · గోప్యతా పాలసీ", "h1": "గోప్యతా పాలసీ", "back": "వెనుకకు", "eff": "అమలులోకి వచ్చే తేదీ: అక్టోబర్ 21, 2026", "intro": "Nocti (\"App\") మీ పరికరంలో వెబ్ పేజీలను డార్క్ చేసే ఒక Safari ఎక్స్‌టెన్షన్. మీకు ఖాతా అవసరం లేదు, మీరు బ్రౌజ్ చేసేదేదీ మాకు చేరదు. App మీ సమాచారాన్ని ఎలా నిర్వహిస్తుందో ఈ పాలసీ కచ్చితంగా వివరిస్తుంది.", "contact_t": "11. మమ్మల్ని సంప్రదించండి", "contact_l": "ఈ పాలసీ గురించి ఏవైనా ప్రశ్నలు ఉంటే, సంప్రదించండి:", "t1": "1. మేము ఏమి సేకరించము", "b1": "Appలో సైన్-అప్ లేదా లాగిన్ లేదు. ఇది మీ పేరు, ఇమెయిల్, లొకేషన్ లేదా కాంటాక్ట్‌లను సేకరించదు; మీ బ్రౌజింగ్ హిస్టరీని, మీరు సందర్శించే పేజీల పూర్తి అడ్రస్‌లను, వాటి కంటెంట్‌ను ఎప్పటికీ సేకరించదు.", "t2": "2. ఎక్స్‌టెన్షన్ ఎలా పని చేస్తుంది", "b2": "ఎక్స్‌టెన్షన్ మీ పరికరంలో Safari లోపలే రన్ అవుతుంది. ఒక పేజీ రంగులను డార్క్ రంగుల్లోకి మార్చడానికి మాత్రమే, అక్కడే Safariలో, వాటిని చదువుతుంది. పేజీ కంటెంట్ ఎప్పటికీ కాపీ చేయబడదు, నిల్వ చేయబడదు, ఎక్కడికీ పంపబడదు.", "t3": "3. మీ సెట్టింగ్‌లు ఎక్కడ నిల్వ చేయబడతాయి", "b3": "మీ థీమ్, మసకబార్చే ఆప్షన్‌లు, సైట్ సవరణలు, మీరు Noctiని ఆఫ్ చేసిన సైట్‌ల జాబితా ఈ పరికరంలోనే సేవ్ చేయబడతాయి. కింద వివరించిన అనామక వినియోగ డేటా కాకుండా, అవి మాకు గానీ ఏ థర్డ్ పార్టీకి గానీ అప్‌లోడ్ చేయబడవు.", "t4": "4. అనామక వినియోగ డేటా", "b4": "ప్రజలు ఏ ఫీచర్‌లను ఉపయోగిస్తున్నారో, ఏ సైట్‌లను సరిచేయాలో తెలుసుకోవడానికి, App మరియు ఎక్స్‌టెన్షన్ కొన్ని అనామక ఈవెంట్‌లను పంపుతాయి. ప్రతి ఈవెంట్ ఒక స్థిరమైన ఈవెంట్ పేరు మరియు కొన్ని వివరాలు మాత్రమే, ఉదాహరణకు మీరు ఎంచుకున్న థీమ్, మీరు మారిన మోడ్, లేదా ఒక కొనుగోలు ధర మరియు కరెన్సీ. మీ వద్ద ఎన్ని అనుకూల థీమ్‌లు లేదా సైట్ నియమాలు ఉన్నాయి వంటి లెక్కలు పరిధులుగా మాత్రమే పంపబడతాయి (ఉదాహరణకు 2–5), తద్వారా కచ్చితమైన సంఖ్య ఫింగర్‌ప్రింట్‌గా మారదు. ప్రతి ఈవెంట్‌లో యాప్ వెర్షన్, ఆపరేటింగ్ సిస్టమ్ మరియు దాని వెర్షన్, మీ ప్రాధాన్య భాష, Pro అన్‌లాక్ అయిందా లేదా అనేవి కూడా ఉంటాయి. మీరు ఒక సైట్‌ను రిపోర్ట్ చేసినప్పుడు, ఒక సైట్‌కు Noctiని ఆఫ్ చేసినప్పుడు, దాని డార్క్ సైట్ గుర్తింపును సరిచేసినప్పుడు లేదా దాని రంగులను సర్దుబాటు చేసినప్పుడు, సైట్ డొమైన్ చేర్చబడుతుంది (ఉదాహరణకు example.com, పూర్తి అడ్రస్ ఎప్పటికీ కాదు), మరియు రిపోర్ట్‌లో మీరు రాసిన నోట్ కూడా ఉంటుంది. మీ బ్రౌజింగ్ హిస్టరీ, పేజీల పూర్తి అడ్రస్‌లు, పేజీ కంటెంట్, మిమ్మల్ని గుర్తించగల ఏదీ ఎప్పటికీ చేర్చబడదు. షేరింగ్ డిఫాల్ట్‌గా ఆన్‌లో ఉంటుంది, మీరు ఎప్పుడైనా సెట్టింగ్‌లు → పరిచయం → గోప్యతా పాలసీ లో దాన్ని ఆఫ్ చేయవచ్చు. అప్పటి నుండి ఏదీ పంపబడదు, ఇంకా పంపడానికి వేచి ఉన్న ఈవెంట్‌లు తొలగించబడతాయి.", "t5": "5. ఈ డేటాను ఎవరు ప్రాసెస్ చేస్తారు", "b5": "మా తరఫున PostHog ఈ ఈవెంట్‌లను యునైటెడ్ స్టేట్స్‌లోని సర్వర్‌లలో ప్రాసెస్ చేస్తుంది. ఏకైక ఐడెంటిఫైయర్ ఈ పరికరంలో సృష్టించబడి, App మరియు ఎక్స్‌టెన్షన్ పంచుకునే ఒక యాదృచ్ఛిక ID. ఇది మీ Apple ఖాతా, మీ పరికరం యొక్క ప్రకటనల ఐడెంటిఫైయర్ లేదా మరే ఇతర గుర్తింపుతోనూ లింక్ చేయబడలేదు. మేము యూజర్ ప్రొఫైల్‌లను రూపొందించము, సెషన్‌లను లేదా స్క్రీన్‌లను రికార్డ్ చేయము, మీ IP అడ్రస్‌ను నిల్వ చేయము లేదా మీ లొకేషన్‌ను కనుగొనడానికి దాన్ని ఉపయోగించము. ఈ డేటా ప్రకటనల కోసం ఉపయోగించబడదు, అమ్మబడదు లేదా మరెవరితోనూ షేర్ చేయబడదు, యాప్‌లు లేదా వెబ్‌సైట్‌లలో మిమ్మల్ని ట్రాక్ చేయడానికి ఉపయోగించబడదు.", "t6": "6. నెట్‌వర్క్ అభ్యర్థనలు", "b6": "పైన వివరించిన అనామక వినియోగ డేటా కాకుండా, ఒక పేజీ ఇప్పటికే ఉపయోగిస్తున్న స్టైల్‌షీట్‌లు, చిత్రాలను మాత్రమే ఎక్స్‌టెన్షన్ డౌన్‌లోడ్ చేస్తుంది, వాటి రూపాన్ని మార్చడానికి. మీరు అప్‌డేట్‌ల కోసం తనిఖీ చేయి నొక్కినప్పుడు, App తాజా వెర్షన్ నంబర్‌ను Apple పబ్లిక్ App Store సేవను అడుగుతుంది. ఆ అభ్యర్థన Appleకు వెళ్తుంది, మాకు కాదు.", "t7": "7. కొనుగోళ్లు", "b7": "కొనుగోళ్లను App Store ద్వారా Apple పూర్తి చేస్తుంది. మీ చెల్లింపు పద్ధతి, Apple ఖాతా వివరాలను Apple నిర్వహిస్తుంది; వాటిని మేము చూడలేము.", "t8": "8. ఫీడ్‌బ్యాక్ ఇమెయిల్‌లు", "b8": "మీరు మాకు ఇమెయిల్ చేస్తే, మీరు రాసినది, ఇమెయిల్‌లో ముందే నింపిన యాప్ వెర్షన్, సిస్టమ్ వెర్షన్, పరికర మోడల్ మాకు అందుతాయి; పంపే ముందు వాటిని తొలగించవచ్చు. మీకు జవాబు ఇవ్వడానికి, సమస్యలు సరిచేయడానికి మాత్రమే వాటిని ఉపయోగిస్తాం.", "t9": "9. పిల్లల గోప్యత", "b9": "13 ఏళ్లలోపు పిల్లల నుంచి App తెలిసి ఏ సమాచారాన్నీ సేకరించదు.", "t10": "10. ఈ పాలసీలో మార్పులు", "b10": "ఈ పాలసీ మారితే, కొత్త వెర్షన్‌ను ఈ పేజీలో పోస్ట్ చేసి, అమలులోకి వచ్చే తేదీని అప్‌డేట్ చేస్తాం."}, "th": {"title": "Nocti · นโยบายความเป็นส่วนตัว", "h1": "นโยบายความเป็นส่วนตัว", "back": "กลับ", "eff": "วันที่มีผลบังคับใช้: 21 ตุลาคม 2026", "intro": "Nocti (“แอป”) เป็นส่วนขยาย Safari ที่ทำให้หน้าเว็บมืดลงบนอุปกรณ์ของคุณ คุณไม่ต้องมีบัญชี และสิ่งที่คุณท่องเว็บจะไม่มาถึงเราเลย นโยบายนี้อธิบายอย่างละเอียดว่าแอปจัดการข้อมูลของคุณอย่างไร", "contact_t": "11. ติดต่อเรา", "contact_l": "หากมีคำถามเกี่ยวกับนโยบายนี้ โปรดติดต่อ:", "t1": "1. สิ่งที่เราไม่เก็บรวบรวม", "b1": "แอปไม่มีการสมัครหรือลงชื่อเข้าใช้ ไม่เก็บชื่อ อีเมล ตำแหน่งที่ตั้ง หรือรายชื่อของคุณ และไม่เคยเก็บประวัติการท่องเว็บ ที่อยู่แบบเต็มของหน้าที่คุณเข้าชม หรือเนื้อหาของหน้าเหล่านั้น", "t2": "2. ส่วนขยายทำงานอย่างไร", "b2": "ส่วนขยายทำงานภายใน Safari บนอุปกรณ์ของคุณ โดยอ่านสีของหน้าเว็บเพื่อปรับเป็นสีมืดตรงนั้นใน Safari เท่านั้น เนื้อหาของหน้าเว็บไม่เคยถูกคัดลอก จัดเก็บ หรือส่งไปที่ใด", "t3": "3. การตั้งค่าของคุณจัดเก็บไว้ที่ใด", "b3": "ธีม ตัวเลือกการหรี่ การแก้ไขเว็บไซต์ และรายชื่อเว็บไซต์ที่คุณปิด Nocti ไว้ จะบันทึกอยู่บนอุปกรณ์นี้ นอกจากข้อมูลการใช้งานแบบไม่ระบุตัวตนที่อธิบายไว้ด้านล่าง ข้อมูลเหล่านี้จะไม่ถูกอัปโหลดมาที่เราหรือบุคคลที่สามใดๆ", "t4": "4. ข้อมูลการใช้งานแบบไม่ระบุตัวตน", "b4": "เพื่อให้รู้ว่าผู้คนใช้ฟีเจอร์ใดและเว็บไซต์ใดต้องแก้ไข แอปและส่วนขยายจะส่งเหตุการณ์แบบไม่ระบุตัวตนจำนวนเล็กน้อย แต่ละเหตุการณ์คือชื่อเหตุการณ์ที่กำหนดไว้ตายตัวพร้อมรายละเอียดเล็กน้อย เช่น ธีมที่คุณเลือก โหมดที่คุณสลับไป หรือราคาและสกุลเงินของการซื้อ จำนวนต่างๆ เช่น คุณมีธีมกำหนดเองหรือกฎของเว็บไซต์กี่รายการ จะส่งเป็นช่วงเท่านั้น (เช่น 2–5) เพื่อไม่ให้ตัวเลขที่แน่นอนกลายเป็นลายนิ้วมือ ทุกเหตุการณ์ยังมีเวอร์ชันของแอป ระบบปฏิบัติการและเวอร์ชันของระบบ ภาษาที่คุณต้องการ และสถานะว่าปลดล็อก Pro แล้วหรือไม่ เมื่อคุณรายงานเว็บไซต์ ปิด Nocti สำหรับเว็บไซต์ แก้ไขการตรวจจับเว็บไซต์ที่มืดอยู่แล้วของเว็บไซต์นั้น หรือปรับสีของเว็บไซต์นั้น จะมีโดเมนของเว็บไซต์รวมอยู่ด้วย (เช่น example.com ไม่ใช่ที่อยู่แบบเต็มเด็ดขาด) และรายงานจะมีบันทึกที่คุณเขียนด้วย ประวัติการท่องเว็บ ที่อยู่แบบเต็มของหน้าเว็บ เนื้อหาของหน้าเว็บ และสิ่งใดก็ตามที่ระบุตัวคุณได้ จะไม่ถูกรวมไว้เลย การแชร์เปิดอยู่ตามค่าเริ่มต้น และคุณปิดได้ทุกเมื่อได้ที่ การตั้งค่า → เกี่ยวกับ → นโยบายความเป็นส่วนตัว หลังจากนั้นจะไม่มีการส่งสิ่งใดอีก และเหตุการณ์ที่ยังรอส่งอยู่จะถูกลบ", "t5": "5. ผู้ประมวลผลข้อมูลนี้", "b5": "PostHog ประมวลผลเหตุการณ์เหล่านี้ในนามของเรา บนเซิร์ฟเวอร์ในสหรัฐอเมริกา ตัวระบุเพียงอย่างเดียวคือ ID แบบสุ่มที่สร้างขึ้นบนอุปกรณ์นี้และใช้ร่วมกันระหว่างแอปกับส่วนขยาย ID นี้ไม่เชื่อมโยงกับบัญชี Apple ของคุณ ตัวระบุสำหรับโฆษณาของอุปกรณ์ หรือตัวตนอื่นใด เราไม่สร้างโปรไฟล์ผู้ใช้ ไม่บันทึกเซสชันหรือหน้าจอ และไม่เก็บที่อยู่ IP ของคุณหรือใช้ที่อยู่ดังกล่าวเพื่อหาตำแหน่งของคุณ ข้อมูลนี้ไม่ถูกใช้เพื่อการโฆษณา ไม่ถูกขายหรือแชร์กับผู้อื่น และไม่ถูกใช้เพื่อติดตามคุณข้ามแอปหรือเว็บไซต์", "t6": "6. คำขอทางเครือข่าย", "b6": "นอกจากข้อมูลการใช้งานแบบไม่ระบุตัวตนที่อธิบายไว้ข้างต้น ส่วนขยายจะดาวน์โหลดเฉพาะสไตล์ชีตและภาพที่หน้าเว็บใช้อยู่แล้ว เพื่อนำมาปรับสีใหม่เท่านั้น เมื่อคุณแตะ “ตรวจหาอัปเดต” แอปจะสอบถามหมายเลขเวอร์ชันล่าสุดจากบริการ App Store สาธารณะของ Apple คำขอนี้ส่งไปที่ Apple ไม่ใช่ที่เรา", "t7": "7. การซื้อ", "b7": "การซื้อดำเนินการโดย Apple ผ่าน App Store วิธีการชำระเงินและรายละเอียดบัญชี Apple ของคุณได้รับการจัดการโดย Apple และเรามองไม่เห็นข้อมูลเหล่านั้น", "t8": "8. อีเมลแสดงความคิดเห็น", "b8": "หากคุณส่งอีเมลถึงเรา เราจะได้รับสิ่งที่คุณเขียน พร้อมเวอร์ชันแอป เวอร์ชันระบบ และรุ่นอุปกรณ์ที่กรอกไว้ล่วงหน้าในอีเมล ซึ่งคุณลบออกได้ก่อนส่ง เราใช้ข้อมูลนี้เพื่อตอบกลับคุณและแก้ไขปัญหาเท่านั้น", "t9": "9. ความเป็นส่วนตัวของเด็ก", "b9": "แอปไม่ได้เก็บรวบรวมข้อมูลใดๆ จากเด็กอายุต่ำกว่า 13 ปีโดยเจตนา", "t10": "10. การเปลี่ยนแปลงนโยบายนี้", "b10": "หากนโยบายนี้มีการเปลี่ยนแปลง เราจะเผยแพร่เวอร์ชันใหม่ในหน้านี้และอัปเดตวันที่มีผลบังคับใช้"}, "tr": {"title": "Nocti · Gizlilik Politikası", "h1": "Gizlilik Politikası", "back": "Geri", "eff": "Yürürlük tarihi: 21 Ekim 2026", "intro": "Nocti (“Uygulama”), web sayfalarını aygıtınızda koyulaştıran bir Safari uzantısıdır. Hesap gerekmez ve göz attığınız hiçbir şey bize ulaşmaz. Bu politika, Uygulama’nın bilgilerinizi tam olarak nasıl işlediğini açıklar.", "contact_t": "11. Bize ulaşın", "contact_l": "Bu politikayla ilgili sorularınız için iletişim:", "t1": "1. Neleri toplamıyoruz", "b1": "Uygulamada kayıt veya giriş yoktur. Adınızı, e-postanızı, konumunuzu veya kişilerinizi toplamaz; tarama geçmişinizi, ziyaret ettiğiniz sayfaların tam adreslerini veya içeriklerini asla toplamaz.", "t2": "2. Uzantı nasıl çalışır", "b2": "Uzantı, aygıtınızda Safari’nin içinde çalışır. Bir sayfanın renklerini yalnızca onları koyu renklerle yeniden biçimlendirmek için, orada, Safari’nin içinde okur. Sayfa içeriği asla kopyalanmaz, saklanmaz veya bir yere gönderilmez.", "t3": "3. Ayarlarınız nerede saklanır", "b3": "Temanız, karartma seçenekleriniz, site düzeltmeleriniz ve Nocti’yi kapattığınız sitelerin listesi bu aygıtta saklanır. Aşağıda açıklanan anonim kullanım verileri dışında bize veya herhangi bir üçüncü tarafa yüklenmez.", "t4": "4. Anonim kullanım verileri", "b4": "Hangi özelliklerin kullanıldığını ve hangi sitelerin düzeltilmesi gerektiğini öğrenmek için Uygulama ve uzantı, küçük bir anonim olay kümesi gönderir. Her biri sabit bir olay adı ile birkaç ayrıntıdan oluşur; örneğin seçtiğiniz tema, geçtiğiniz mod ya da bir satın almanın fiyatı ve para birimi. Kaç özel temanız veya site kuralınız olduğu gibi sayılar yalnızca aralık olarak gönderilir (örneğin 2–5); böylece kesin bir sayı parmak izine dönüşemez. Her olay ayrıca uygulama sürümünü, işletim sistemini ve sürümünü, tercih ettiğiniz dili ve Pro’nun açık olup olmadığını içerir. Bir siteyi bildirdiğinizde, bir sitede Nocti’yi kapattığınızda, sitenin koyu site algılamasını düzelttiğinizde veya renklerini ayarladığınızda sitenin alan adı eklenir (örneğin example.com; asla tam adres değil) ve bir bildirim ayrıca yazdığınız notu da içerir. Tarama geçmişiniz, sayfaların tam adresleri, sayfa içeriği ve sizi tanımlayan hiçbir şey asla dahil edilmez. Paylaşım varsayılan olarak açıktır ve istediğiniz zaman Ayarlar → Hakkında → Gizlilik Politikası bölümünden kapatabilirsiniz. O andan itibaren hiçbir şey gönderilmez ve gönderilmeyi bekleyen olaylar silinir.", "t5": "5. Bu verileri kim işler", "b5": "PostHog bu olayları bizim adımıza, Amerika Birleşik Devletleri’ndeki sunucularda işler. Tek tanımlayıcı, bu aygıtta oluşturulan ve Uygulama ile uzantının ortak kullandığı rastgele bir kimliktir. Bu kimlik Apple Hesabınızla, aygıtınızın reklam tanımlayıcısıyla veya başka herhangi bir kimlikle ilişkilendirilmez. Kullanıcı profili oluşturmayız, oturum veya ekran kaydı yapmayız; IP adresinizi saklamayız ve konumunuzu bulmak için kullanmayız. Veriler reklam için kullanılmaz, satılmaz veya başka kimseyle paylaşılmaz ve sizi uygulamalar ya da web siteleri arasında izlemek için kullanılmaz.", "t6": "6. Ağ istekleri", "b6": "Yukarıda açıklanan anonim kullanım verileri dışında uzantı, yalnızca bir sayfanın zaten kullandığı stil sayfalarını ve görüntüleri indirir; böylece onları yeniden biçimlendirebilir. Güncellemeleri Denetle’ye dokunduğunuzda Uygulama, en son sürüm numarasını Apple’ın herkese açık App Store hizmetine sorar. Bu istek bize değil, Apple’a gider.", "t7": "7. Satın almalar", "b7": "Satın almalar Apple tarafından App Store üzerinden tamamlanır. Ödeme yönteminiz ve Apple Hesabı bilgileriniz Apple tarafından işlenir; biz bunları göremeyiz.", "t8": "8. Geri bildirim e-postaları", "b8": "Bize e-posta gönderirseniz yazdıklarınızı ve e-postaya önceden eklenmiş uygulama sürümünü, sistem sürümünü ve aygıt modelini alırız; bunları göndermeden önce silebilirsiniz. Bu bilgileri yalnızca size yanıt vermek ve sorunları düzeltmek için kullanırız.", "t9": "9. Çocukların gizliliği", "b9": "Uygulama, 13 yaşından küçük çocuklardan bilerek hiçbir bilgi toplamaz.", "t10": "10. Bu politikadaki değişiklikler", "b10": "Bu politika değişirse yeni sürümü bu sayfada yayımlar ve yürürlük tarihini güncelleriz."}, "uk": {"title": "Nocti · Політика конфіденційності", "h1": "Політика конфіденційності", "back": "Назад", "eff": "Дата набрання чинності: 21 жовтня 2026 р.", "intro": "Nocti («Програма») — розширення Safari, яке затемнює вебсторінки на вашому пристрої. Обліковий запис не потрібен, і нічого з того, що ви переглядаєте, до нас не потрапляє. Ця політика докладно пояснює, як Програма поводиться з вашою інформацією.", "contact_t": "11. Зв’язатися з нами", "contact_l": "Якщо у вас є запитання щодо цієї політики, пишіть:", "t1": "1. Що ми не збираємо", "b1": "У Програмі немає реєстрації та входу. Вона не збирає ваше ім’я, email, місцезнаходження чи контакти й ніколи не збирає історію переглядів, повні адреси відвідуваних сторінок або їхній вміст.", "t2": "2. Як працює розширення", "b2": "Розширення працює всередині Safari на вашому пристрої. Воно читає кольори сторінки лише для того, щоб перефарбувати їх у темні тони просто в Safari. Вміст сторінок ніколи не копіюється, не зберігається й нікуди не надсилається.", "t3": "3. Де зберігаються ваші налаштування", "b3": "Ваша тема, параметри затемнення, виправлення сайтів і список сайтів, на яких ви вимкнули Nocti, зберігаються на цьому пристрої. Окрім анонімних даних про використання, описаних нижче, вони не передаються ні нам, ні третім особам.", "t4": "4. Анонімні дані про використання", "b4": "Щоб розуміти, якими функціями користуються і які сайти потрібно доопрацювати, Програма й розширення надсилають невеликий набір анонімних подій. Кожна з них — це фіксована назва події та кілька подробиць, наприклад вибрана тема, режим, на який ви перейшли, або ціна й валюта покупки. Кількості, наприклад скільки у вас власних тем чи правил для сайтів, надсилаються лише діапазонами (наприклад, 2–5), щоб точне число не стало цифровим відбитком. Кожна подія також містить версію програми, операційну систему та її версію, бажану мову та те, чи розблоковано Pro. Коли ви повідомляєте про сайт, вимикаєте для сайту Nocti, виправляєте для нього розпізнавання темних сайтів або налаштовуєте його кольори, додається домен сайту (наприклад, example.com, але ніколи не повна адреса), а повідомлення також містить написану вами примітку. Історія переглядів, повні адреси сторінок, вміст сторінок і все, що дає змогу вас ідентифікувати, ніколи не включаються. Надсилання ввімкнено за замовчуванням, і його можна будь-коли вимкнути у розділі Налаштування → Про програму → Політика конфіденційності. Відтоді нічого не надсилається, а події, які ще чекають на надсилання, видаляються.", "t5": "5. Хто обробляє ці дані", "b5": "Ці події обробляє PostHog від нашого імені на серверах у США. Єдиний ідентифікатор — випадковий ID, створений на цьому пристрої та спільний для Програми й розширення. Він не пов’язаний з вашим обліковим записом Apple, рекламним ідентифікатором пристрою чи будь-якою іншою особою. Ми не створюємо профілів користувачів, не записуємо сеансів чи екранів, не зберігаємо вашу IP-адресу й не використовуємо її для визначення вашого місцезнаходження. Дані не використовуються для реклами, не продаються й не передаються нікому іншому та не використовуються для стеження за вами в інших програмах чи на сайтах.", "t6": "6. Мережеві запити", "b6": "Окрім анонімних даних про використання, описаних вище, розширення завантажує лише ті таблиці стилів і зображення, які вже використовує сторінка, щоб перефарбувати їх. Коли ви натискаєте «Перевірити оновлення», Програма запитує номер останньої версії в публічного сервісу App Store від Apple. Цей запит надходить до Apple, а не до нас.", "t7": "7. Покупки", "b7": "Покупки здійснюються через App Store компанією Apple. Спосіб оплати й дані облікового запису Apple обробляє Apple, ми їх не бачимо.", "t8": "8. Листи з відгуками", "b8": "Якщо ви напишете нам, ми отримаємо ваш лист, а також версію програми, версію системи й модель пристрою, заздалегідь додані в лист (їх можна видалити перед надсиланням). Ми використовуємо ці дані лише для того, щоб відповісти вам і виправити проблеми.", "t9": "9. Конфіденційність дітей", "b9": "Програма свідомо не збирає жодної інформації про дітей віком до 13 років.", "t10": "10. Зміни в політиці", "b10": "Якщо ця політика зміниться, ми опублікуємо нову версію на цій сторінці й оновимо дату набрання чинності."}, "ur": {"title": "Nocti · رازداری کی پالیسی", "h1": "رازداری کی پالیسی", "back": "واپس", "eff": "مؤثر تاریخ: 21 اکتوبر 2026", "intro": "Nocti (\"ایپ\") ایک Safari ایکسٹینشن ہے جو آپ کے ڈیوائس پر ویب صفحات کو ڈارک کرتی ہے۔ آپ کو کسی اکاؤنٹ کی ضرورت نہیں، اور آپ جو کچھ براؤز کرتے ہیں وہ کبھی ہم تک نہیں پہنچتا۔ یہ پالیسی واضح طور پر بتاتی ہے کہ ایپ آپ کی معلومات کو کیسے سنبھالتی ہے۔", "contact_t": "11. ہم سے رابطہ کریں", "contact_l": "اس پالیسی کے بارے میں کوئی سوال ہو تو رابطہ کریں:", "t1": "1. ہم کیا جمع نہیں کرتے", "b1": "ایپ میں کوئی سائن اپ یا لاگ ان نہیں۔ یہ آپ کا نام، ای میل، مقام یا رابطے جمع نہیں کرتی، اور کبھی آپ کی براؤزنگ ہسٹری، آپ کے دیکھے گئے صفحات کے مکمل ایڈریس، یا ان کا مواد جمع نہیں کرتی۔", "t2": "2. ایکسٹینشن کیسے کام کرتی ہے", "b2": "ایکسٹینشن آپ کے ڈیوائس پر Safari کے اندر چلتی ہے۔ یہ صفحے کے رنگ صرف اس لیے پڑھتی ہے کہ انہیں وہیں Safari میں ڈارک رنگوں میں بدل دے۔ صفحے کا مواد کبھی کاپی، محفوظ یا کہیں نہیں بھیجا جاتا۔", "t3": "3. آپ کی سیٹنگز کہاں محفوظ ہوتی ہیں", "b3": "آپ کی تھیم، مدھم کرنے کے آپشنز، سائٹ کی درستگیاں اور ان سائٹس کی فہرست جن کے لیے آپ نے Nocti بند کیا، اسی ڈیوائس پر محفوظ ہیں۔ نیچے بیان کردہ گمنام استعمال کے ڈیٹا کے علاوہ، یہ ہمیں یا کسی تیسرے فریق کو اپ لوڈ نہیں کیے جاتے۔", "t4": "4. گمنام استعمال کا ڈیٹا", "b4": "یہ جاننے کے لیے کہ لوگ کون سی خصوصیات استعمال کرتے ہیں اور کن سائٹس کو درست کرنے کی ضرورت ہے، ایپ اور ایکسٹینشن چند گمنام ایونٹس بھیجتے ہیں۔ ہر ایونٹ ایک مقررہ ایونٹ نام اور چند تفصیلات پر مشتمل ہوتا ہے، جیسے آپ کی منتخب کردہ تھیم، وہ موڈ جس پر آپ نے سوئچ کیا، یا کسی خریداری کی قیمت اور کرنسی۔ تعداد، جیسے آپ کے پاس کتنی حسب ضرورت تھیمز یا سائٹ کے اصول ہیں، صرف حدود کی صورت میں بھیجی جاتی ہے (مثال کے طور پر 2–5)، تاکہ کوئی درست عدد فنگر پرنٹ نہ بن سکے۔ ہر ایونٹ میں ایپ کا ورژن، آپریٹنگ سسٹم اور اس کا ورژن، آپ کی ترجیحی زبان اور یہ کہ Pro ان لاک ہے یا نہیں، بھی شامل ہوتا ہے۔ جب آپ کسی سائٹ کو رپورٹ کرتے ہیں، کسی سائٹ کے لیے Nocti بند کرتے ہیں، اس کی ڈارک سائٹ کی شناخت درست کرتے ہیں یا اس کے رنگ ایڈجسٹ کرتے ہیں، تو سائٹ کا ڈومین شامل ہوتا ہے (مثال کے طور پر example.com، مکمل ایڈریس کبھی نہیں)، اور رپورٹ میں آپ کا لکھا ہوا نوٹ بھی شامل ہوتا ہے۔ آپ کی براؤزنگ ہسٹری، صفحات کے مکمل ایڈریس، صفحے کا مواد اور کوئی بھی چیز جو آپ کی شناخت کرے، کبھی شامل نہیں ہوتی۔ شیئرنگ بطور ڈیفالٹ آن ہوتی ہے، اور آپ اسے کسی بھی وقت سیٹنگز ← تعارف ← رازداری کی پالیسی میں بند کر سکتے ہیں۔ اس کے بعد کچھ نہیں بھیجا جاتا، اور جو ایونٹس ابھی بھیجے جانے کے منتظر ہیں وہ حذف کر دیے جاتے ہیں۔", "t5": "5. یہ ڈیٹا کون پراسیس کرتا ہے", "b5": "PostHog ہماری جانب سے، امریکہ میں واقع سرورز پر ان ایونٹس کو پراسیس کرتا ہے۔ واحد شناخت کنندہ اس ڈیوائس پر بنائی گئی ایک بے ترتیب ID ہے، جسے ایپ اور ایکسٹینشن مشترکہ طور پر استعمال کرتے ہیں۔ یہ آپ کے Apple اکاؤنٹ، آپ کے ڈیوائس کے اشتہاری شناخت کنندہ یا کسی اور شناخت سے منسلک نہیں ہے۔ ہم صارف پروفائلز نہیں بناتے، سیشنز یا اسکرینز ریکارڈ نہیں کرتے، اور آپ کا IP ایڈریس محفوظ نہیں کرتے اور نہ ہی آپ کا مقام معلوم کرنے کے لیے اسے استعمال کرتے ہیں۔ یہ ڈیٹا اشتہارات کے لیے استعمال نہیں ہوتا، نہ بیچا جاتا ہے نہ کسی اور کے ساتھ شیئر کیا جاتا ہے، اور نہ ہی مختلف ایپس یا ویب سائٹس پر آپ کو ٹریک کرنے کے لیے استعمال ہوتا ہے۔", "t6": "6. نیٹ ورک درخواستیں", "b6": "اوپر بیان کردہ گمنام استعمال کے ڈیٹا کے علاوہ، ایکسٹینشن صرف وہی اسٹائل شیٹس اور تصاویر ڈاؤن لوڈ کرتی ہے جو صفحہ پہلے سے استعمال کرتا ہے، تاکہ انہیں نیا رنگ دیا جا سکے۔ جب آپ اپ ڈیٹس چیک کریں پر ٹیپ کرتے ہیں، تو ایپ Apple کی عوامی App Store سروس سے تازہ ترین ورژن نمبر پوچھتی ہے۔ یہ درخواست Apple کو جاتی ہے، ہمیں نہیں۔", "t7": "7. خریداریاں", "b7": "خریداریاں Apple، App Store کے ذریعے مکمل کرتا ہے۔ آپ کا ادائیگی کا طریقہ اور Apple اکاؤنٹ کی تفصیلات Apple سنبھالتا ہے، اور ہم انہیں نہیں دیکھ سکتے۔", "t8": "8. فیڈبیک ای میلز", "b8": "اگر آپ ہمیں ای میل کریں، تو ہمیں آپ کا لکھا ہوا مواد ملتا ہے، نیز ای میل میں پہلے سے درج ایپ ورژن، سسٹم ورژن اور ڈیوائس ماڈل، جنہیں آپ بھیجنے سے پہلے ڈیلیٹ کر سکتے ہیں۔ ہم اسے صرف آپ کو جواب دینے اور مسائل ٹھیک کرنے کے لیے استعمال کرتے ہیں۔", "t9": "9. بچوں کی رازداری", "b9": "ایپ جان بوجھ کر 13 سال سے کم عمر بچوں سے کوئی معلومات جمع نہیں کرتی۔", "t10": "10. اس پالیسی میں تبدیلیاں", "b10": "اگر یہ پالیسی بدلی، تو ہم نیا ورژن اسی صفحے پر شائع کریں گے اور مؤثر تاریخ اپ ڈیٹ کریں گے۔"}, "vi": {"title": "Nocti · Chính sách quyền riêng tư", "h1": "Chính sách quyền riêng tư", "back": "Quay lại", "eff": "Ngày hiệu lực: 21 tháng 10, 2026", "intro": "Nocti (“Ứng dụng”) là một tiện ích mở rộng Safari giúp làm tối các trang web trên thiết bị của bạn. Bạn không cần tài khoản và không có gì bạn duyệt được gửi tới chúng tôi. Chính sách này giải thích chính xác cách Ứng dụng xử lý thông tin của bạn.", "contact_t": "11. Liên hệ với chúng tôi", "contact_l": "Nếu bạn có bất kỳ câu hỏi nào về chính sách này, hãy liên hệ:", "t1": "1. Những gì chúng tôi không thu thập", "b1": "Ứng dụng không cần đăng ký hay đăng nhập. Ứng dụng không thu thập tên, email, vị trí hay danh bạ của bạn, và không bao giờ thu thập lịch sử duyệt web, địa chỉ đầy đủ của các trang bạn truy cập hay nội dung của chúng.", "t2": "2. Cách tiện ích mở rộng hoạt động", "b2": "Tiện ích mở rộng chạy bên trong Safari trên thiết bị của bạn. Tiện ích chỉ đọc màu sắc của trang để tạo kiểu lại bằng màu tối, ngay trong Safari. Nội dung trang không bao giờ bị sao chép, lưu trữ hay gửi đi đâu cả.", "t3": "3. Nơi lưu cài đặt của bạn", "b3": "Chủ đề, tùy chọn làm dịu, bản sửa lỗi trang web và danh sách các trang bạn đã tắt Nocti đều được lưu trên thiết bị này. Ngoài dữ liệu sử dụng ẩn danh được mô tả bên dưới, chúng không được tải lên cho chúng tôi hay bất kỳ bên thứ ba nào.", "t4": "4. Dữ liệu sử dụng ẩn danh", "b4": "Để biết mọi người dùng những tính năng nào và trang web nào cần sửa, Ứng dụng và tiện ích mở rộng gửi một nhóm nhỏ các sự kiện ẩn danh. Mỗi sự kiện là một tên sự kiện cố định kèm vài chi tiết, chẳng hạn chủ đề bạn đã chọn, chế độ bạn đã chuyển sang, hoặc giá và đơn vị tiền tệ của một giao dịch mua. Các con số đếm, chẳng hạn bạn có bao nhiêu chủ đề tùy chỉnh hoặc quy tắc trang web, chỉ được gửi dưới dạng khoảng (ví dụ 2–5), để một con số chính xác không thể trở thành dấu vân tay. Mỗi sự kiện cũng bao gồm phiên bản ứng dụng, hệ điều hành và phiên bản của nó, ngôn ngữ ưu tiên của bạn và việc Pro đã được mở khóa hay chưa. Khi bạn báo cáo một trang web, tắt Nocti cho một trang web, sửa việc nhận diện trang tối sẵn của trang đó hoặc điều chỉnh màu của trang đó, tên miền của trang sẽ được gửi kèm (ví dụ example.com, không bao giờ là địa chỉ đầy đủ), và một báo cáo còn kèm theo ghi chú bạn viết. Lịch sử duyệt web, địa chỉ đầy đủ của các trang, nội dung trang và bất cứ thứ gì nhận dạng được bạn không bao giờ được gửi kèm. Tính năng chia sẻ được bật theo mặc định và bạn có thể tắt bất cứ lúc nào trong Cài đặt → Giới thiệu → Chính sách quyền riêng tư. Từ đó trở đi, không có gì được gửi nữa và các sự kiện còn đang chờ gửi sẽ bị xóa.", "t5": "5. Ai xử lý dữ liệu này", "b5": "PostHog thay mặt chúng tôi xử lý các sự kiện này trên máy chủ đặt tại Hoa Kỳ. Mã định danh duy nhất là một ID ngẫu nhiên được tạo trên thiết bị này và được Ứng dụng cùng tiện ích mở rộng dùng chung. ID này không được liên kết với Tài khoản Apple của bạn, mã định danh quảng cáo của thiết bị hay bất kỳ danh const SUP=["en", "zh-Hans", "zh-Hant", "ja", "ko", "de", "fr", "es", "it", "pt-BR", "ru", "ar", "bn", "ca", "cs", "da", "el", "es-419", "fi", "fr-CA", "gu", "he", "hi", "hr", "hu", "id", "kn", "ml", "mr", "ms", "nb", "nl", "or", "pa", "pl", "pt-PT", "ro", "sk", "sl", "sv", "ta", "te", "th", "tr", "uk", "ur", "vi"],RTL=["ar", "he", "ur"];
function norm(p){p=p.toLowerCase();
  const ex=SUP.find(c=>c.toLowerCase()===p);if(ex)return ex;
  if(p.startsWith('zh'))return(p.includes('hant')||p.includes('tw')||p.includes('hk')||p.includes('mo'))?'zh-Hant':'zh-Hans';
  if(p.startsWith('pt'))return p.includes('pt-pt')?'pt-PT':'pt-BR';
  if(p.startsWith('fr'))return p.includes('ca')?'fr-CA':'fr';
  if(p.startsWith('es'))return/^es-(419|mx|ar|co|cl|pe|ve|ec|uy|py|bo|cr|pa|do|gt|hn|ni|sv|pr|cu|us)/.test(p)?'es-419':'es';
  if(/^(nb|nn|no)/.test(p))return'nb';
  if(p.startsWith('iw'))return'he';
  if(p.startsWith('in'))return'id';
  const b=p.slice(0,2);return SUP.includes(b)?b:null;}
function detect(){
  const h=(location.hash.match(/lang=([\w-]+)/)||[])[1];
  if(h&&I18N[h])return h;
  for(const p of(navigator.languages||[navigator.language||'en'])){const n=norm(p);if(n&&I18N[n])return n;}
  return'en';}
function apply(lang){
  const d=I18N[lang]||I18N.en;
  document.documentElement.lang=lang;document.documentElement.dir=RTL.includes(lang)?'rtl':'ltr';
  document.title=d.title;
  document.querySelectorAll('[data-i]').forEach(el=>{el.innerHTML=d[el.dataset.i]||'';});
  document.querySelectorAll('a[data-page]').forEach(a=>{a.href=a.dataset.page+'#lang='+lang;});
  document.getElementById('lang').value=lang;
  try{history.replaceState(null,'','#lang='+lang);}catch(e){}}
document.getElementById('lang').addEventListener('change',e=>apply(e.target.value));
apply(detect());
