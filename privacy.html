ટે તમે Nocti બંધ કર્યું છે તેની યાદી આ ડિવાઇસ પર સેવ થાય છે. નીચે જણાવેલા અનામી ઉપયોગ ડેટા સિવાય, તે અમને કે કોઈ ત્રીજા પક્ષને અપલોડ થતાં નથી.", "t4": "4. અનામી ઉપયોગ ડેટા", "b4": "લોકો કયાં ફીચર વાપરે છે અને કઈ સાઇટ્સ સુધારવાની છે તે જાણવા માટે, ઍપ અને એક્સ્ટેન્શન થોડી અનામી ઇવેન્ટ્સ મોકલે છે. દરેક ઇવેન્ટ એક નિશ્ચિત ઇવેન્ટ નામ અને થોડી વિગતો હોય છે, જેમ કે તમે પસંદ કરેલી થીમ, તમે બદલેલો મોડ, અથવા કોઈ ખરીદીની કિંમત અને ચલણ. સંખ્યાઓ, જેમ કે તમારી પાસે કેટલી કસ્ટમ થીમ્સ કે સાઇટ નિયમો છે, ફક્ત શ્રેણી તરીકે મોકલાય છે (ઉદાહરણ તરીકે 2–5), જેથી ચોક્કસ સંખ્યા ફિંગરપ્રિન્ટ ન બની શકે. દરેક ઇવેન્ટમાં ઍપ વર્ઝન, ઑપરેટિંગ સિસ્ટમ અને તેનું વર્ઝન, તમારી પસંદગીની ભાષા અને Pro અનલૉક છે કે નહીં તે પણ હોય છે. જ્યારે તમે કોઈ સાઇટની જાણ કરો, કોઈ સાઇટ માટે Nocti બંધ કરો, તેની ડાર્ક સાઇટની ઓળખ સુધારો અથવા તેના રંગો ગોઠવો, ત્યારે સાઇટનું ડોમેન સામેલ થાય છે (ઉદાહરણ તરીકે example.com, ક્યારેય પૂરું ઍડ્રેસ નહીં), અને જાણમાં તમે લખેલી નોંધ પણ સામેલ હોય છે. તમારો બ્રાઉઝિંગ ઇતિહાસ, પેજનાં પૂરાં ઍડ્રેસ, પેજનું કન્ટેન્ટ અને તમને ઓળખી શકે તેવું કંઈપણ ક્યારેય સામેલ થતું નથી. શેરિંગ ડિફૉલ્ટ રૂપે ચાલુ હોય છે, અને તમે તેને ગમે ત્યારે સેટિંગ્સ → વિશે → ગોપનીયતા નીતિ માં બંધ કરી શકો છો. ત્યારથી કંઈ મોકલાતું નથી, અને હજી મોકલવાની રાહ જોતી ઇવેન્ટ્સ ડિલીટ થઈ જાય છે.", "t5": "5. આ ડેટા કોણ પ્રોસેસ કરે છે", "b5": "PostHog અમારા વતી, યુનાઇટેડ સ્ટેટ્સમાંના સર્વર પર આ ઇવેન્ટ્સ પ્રોસેસ કરે છે. એકમાત્ર ઓળખકર્તા આ ડિવાઇસ પર બનાવેલું એક રેન્ડમ ID છે, જે ઍપ અને એક્સ્ટેન્શન સાથે મળીને વાપરે છે. તે તમારા Apple એકાઉન્ટ, તમારા ડિવાઇસના જાહેરાત ઓળખકર્તા કે બીજી કોઈ ઓળખ સાથે જોડાયેલું નથી. અમે યુઝર પ્રોફાઇલ બનાવતા નથી, સેશન કે સ્ક્રીન રેકોર્ડ કરતા નથી, અને તમારું IP ઍડ્રેસ સંગ્રહતા નથી કે તમારું સ્થાન શોધવા તેનો ઉપયોગ કરતા નથી. આ ડેટા જાહેરાત માટે વપરાતો નથી, વેચાતો નથી કે બીજા કોઈ સાથે શેર થતો નથી, અને ઍપ્સ કે વેબસાઇટ્સ પર તમને ટ્રૅક કરવા માટે વપરાતો નથી.", "t6": "6. નેટવર્ક વિનંતીઓ", "b6": "ઉપર જણાવેલા અનામી ઉપયોગ ડેટા સિવાય, એક્સ્ટેન્શન ફક્ત એ જ સ્ટાઇલશીટ અને છબીઓ ડાઉનલોડ કરે છે જે પેજ પહેલેથી વાપરે છે, જેથી તેમને નવી સ્ટાઇલ આપી શકાય. તમે “અપડેટ માટે તપાસો” પર ટૅપ કરો ત્યારે ઍપ નવીનતમ વર્ઝન નંબર જાણવા Appleની જાહેર App Store સેવાને પૂછે છે. એ વિનંતી Appleને જાય છે, અમને નહીં.", "t7": "7. ખરીદીઓ", "b7": "ખરીદીઓ Apple દ્વારા App Store મારફતે પૂર્ણ થાય છે. તમારી ચુકવણી પદ્ધતિ અને Apple એકાઉન્ટની વિગતો Apple સંભાળે છે, અને અમે તે જોઈ શકતા નથી.", "t8": "8. પ્રતિસાદ ઇમેઇલ", "b8": "જો તમે અમને ઇમેઇલ કરો, તો અમને તમે લખેલું અને ઇમેઇલમાં પહેલેથી ભરેલાં ઍપ વર્ઝન, સિસ્ટમ વર્ઝન અને ડિવાઇસ મૉડલ મળે છે, જે તમે મોકલતાં પહેલાં ડિલીટ કરી શકો છો. અમે તેનો ઉપયોગ ફક્ત તમને જવાબ આપવા અને સમસ્યાઓ સુધારવા માટે કરીએ છીએ.", "t9": "9. બાળકોની ગોપનીયતા", "b9": "ઍપ જાણીજોઈને 13 વર્ષથી નાનાં બાળકો પાસેથી કોઈ માહિતી એકત્ર કરતી નથી.", "t10": "10. આ નીતિમાં ફેરફાર", "b10": "જો આ નીતિ બદલાશે, તો અમે નવું વર્ઝન આ પેજ પર મૂકીશું અને અમલની તારીખ અપડેટ કરીશું."}, "he": {"title": "Nocti · מדיניות פרטיות", "h1": "מדיניות פרטיות", "back": "חזרה", "eff": "תאריך תחולה: 21 באוקטובר 2026", "intro": "Nocti (״האפליקציה״) היא הרחבה ל-Safari שמכהה עמודי אינטרנט במכשיר שלך. אין צורך בחשבון, ושום דבר מהגלישה שלך לא מגיע אלינו. מדיניות זו מסבירה בדיוק איך האפליקציה מטפלת במידע שלך.", "contact_t": "11. יצירת קשר", "contact_l": "לשאלות בנוגע למדיניות זו, אפשר לפנות אל:", "t1": "1. מה אנחנו לא אוספים", "b1": "באפליקציה אין הרשמה או התחברות. היא לא אוספת את השם, הדוא״ל, המיקום או אנשי הקשר שלך, ולעולם לא אוספת את היסטוריית הגלישה, את הכתובות המלאות של העמודים שבהם ביקרת או את התוכן שלהם.", "t2": "2. איך ההרחבה עובדת", "b2": "ההרחבה פועלת בתוך Safari במכשיר שלך. היא קוראת את צבעי העמוד רק כדי לעצב אותם מחדש בצבעים כהים, שם, בתוך Safari. תוכן העמוד אף פעם לא מועתק, נשמר או נשלח לשום מקום.", "t3": "3. איפה ההגדרות שלך נשמרות", "b3": "ערכת הנושא, אפשרויות העמעום, תיקוני האתרים ורשימת האתרים שבהם כיבית את Nocti נשמרים במכשיר הזה. מלבד נתוני השימוש האנונימיים המתוארים בהמשך, הם לא מועלים אלינו או לצד שלישי כלשהו.", "t4": "4. נתוני שימוש אנונימיים", "b4": "כדי לדעת באילו תכונות משתמשים ואילו אתרים צריך לתקן, האפליקציה וההרחבה שולחות קבוצה קטנה של אירועים אנונימיים. כל אירוע הוא שם אירוע קבוע עם כמה פרטים, למשל ערכת הנושא שבחרת, המצב שעברת אליו, או המחיר והמטבע של רכישה. כמויות, כמו מספר ערכות הנושא המותאמות או כללי האתרים שיש לך, נשלחות רק כטווחים (למשל 2–5), כדי שמספר מדויק לא יהפוך לטביעת אצבע. כל אירוע כולל גם את גרסת האפליקציה, את מערכת ההפעלה והגרסה שלה, את השפה המועדפת עליך והאם Pro פתוח. כשמדווחים על אתר, מכבים בו את Nocti, מתקנים את זיהוי האתרים הכהים שלו או מכווננים את הצבעים שלו, הדומיין של האתר נכלל (למשל example.com, אף פעם לא הכתובת המלאה), ודיווח כולל גם את ההערה שכתבת. היסטוריית הגלישה, כתובות מלאות של עמודים, תוכן העמודים וכל מה שמזהה אותך אינם נכללים לעולם. השיתוף פעיל כברירת מחדל, ואפשר לכבות אותו בכל עת ב«הגדרות ← אודות ← מדיניות פרטיות». מאותו רגע לא נשלח דבר, ואירועים שעדיין ממתינים לשליחה נמחקים.", "t5": "5. מי מעבד את הנתונים האלה", "b5": "PostHog מעבדת את האירועים האלה בשמנו, בשרתים בארצות הברית. המזהה היחיד הוא מזהה אקראי שנוצר במכשיר הזה ומשותף לאפליקציה ולהרחבה. הוא אינו מקושר לחשבון Apple שלך, למזהה הפרסום של המכשיר או לכל זהות אחרת. איננו בונים פרופילי משתמשים, איננו מקליטים הפעלות או מסכים, ואיננו שומרים את כתובת ה-IP שלך או משתמשים בה כדי לאתר את מיקומך. הנתונים אינם משמשים לפרסום, אינם נמכרים או משותפים עם אף אחד אחר, ואינם משמשים למעקב אחריך בין אפליקציות או אתרים.", "t6": "6. בקשות רשת", "b6": "מלבד נתוני השימוש האנונימיים המתוארים למעלה, ההרחבה מורידה רק את גיליונות הסגנון והתמונות שהעמוד כבר משתמש בהם, כדי שתוכל לעצב אותם מחדש. בהקשה על ״בדיקת עדכונים״, האפליקציה שואלת את שירות ה-App Store הציבורי של Apple מהו מספר הגרסה העדכני. הבקשה הזו נשלחת ל-Apple, לא אלינו.", "t7": "7. רכישות", "b7": "הרכישות מתבצעות על ידי Apple דרך ה-App Store. אמצעי התשלום ופרטי חשבון Apple שלך מטופלים על ידי Apple, ואין לנו גישה אליהם.", "t8": "8. הודעות דוא״ל עם משוב", "b8": "אם תשלחו לנו דוא״ל, נקבל את מה שכתבתם וגם את גרסת האפליקציה, גרסת המערכת ודגם המכשיר שממולאים מראש בהודעה, ואפשר למחוק אותם לפני השליחה. אנחנו משתמשים בהם רק כדי לענות לכם ולתקן בעיות.", "t9": "9. פרטיות ילדים", "b9": "האפליקציה לא אוספת ביודעין מידע כלשהו מילדים מתחת לגיל 13.", "t10": "10. שינויים במדיניות זו", "b10": "אם המדיניות תשתנה, נפרסם את הגרסה החדשה בעמוד זה ונעדכן את תאריך התחולה."}, "hi": {"title": "Nocti · गोपनीयता नीति", "h1": "गोपनीयता नीति", "back": "वापस", "eff": "लागू होने की तारीख़: 21 अक्टूबर 2026", "intro": "Nocti (“ऐप”) एक Safari एक्सटेंशन है जो आपके डिवाइस पर वेब पेजों को डार्क करता है। आपको किसी खाते की ज़रूरत नहीं है, और आप जो भी ब्राउज़ करते हैं वह कभी हम तक नहीं पहुँचता। यह नीति साफ़-साफ़ बताती है कि ऐप आपकी जानकारी को कैसे संभालता है।", "contact_t": "11. हमसे संपर्क करें", "contact_l": "इस नीति के बारे में कोई भी सवाल हो, तो संपर्क करें:", "t1": "1. हम क्या इकट्ठा नहीं करते", "b1": "ऐप में कोई साइन-अप या लॉगिन नहीं है। यह आपका नाम, ईमेल, लोकेशन या संपर्क इकट्ठा नहीं करता, और कभी भी आपका ब्राउज़िंग इतिहास, आपके देखे गए पेजों के पूरे पते या उनकी सामग्री इकट्ठा नहीं करता।", "t2": "2. एक्सटेंशन कैसे काम करता है", "b2": "एक्सटेंशन आपके डिवाइस पर Safari के अंदर चलता है। यह किसी पेज के रंग सिर्फ़ इसलिए पढ़ता है ताकि उन्हें वहीं Safari में डार्क रंगों में बदल सके। पेज की सामग्री कभी कॉपी, सेव या कहीं भेजी नहीं जाती।", "t3": "3. आपकी सेटिंग्ज़ कहाँ सेव होती हैं", "b3": "आपकी थीम, मद्धम करने के विकल्प, साइट सुधार और उन साइटों की सूची जिन पर आपने Nocti बंद किया है, इसी डिवाइस पर सेव रहते हैं। नीचे बताए गए गुमनाम उपयोग डेटा के अलावा, ये हमें या किसी तीसरे पक्ष को अपलोड नहीं किए जाते।", "t4": "4. गुमनाम उपयोग डेटा", "b4": "यह जानने के लिए कि लोग कौन-सी सुविधाएँ इस्तेमाल करते हैं और किन साइटों को ठीक करना है, ऐप और एक्सटेंशन कुछ गुमनाम इवेंट भेजते हैं। हर इवेंट एक तय इवेंट नाम और कुछ विवरण होता है, जैसे आपने कौन-सी थीम चुनी, किस मोड पर स्विच किया, या किसी ख़रीदारी की कीमत और मुद्रा। गिनतियाँ, जैसे आपकी कितनी कस्टम थीम या साइट नियम हैं, सिर्फ़ दायरों के रूप में भेजी जाती हैं (उदाहरण के लिए 2–5), ताकि कोई सटीक संख्या फ़िंगरप्रिंट न बन सके। हर इवेंट में ऐप का वर्शन, ऑपरेटिंग सिस्टम और उसका वर्शन, आपकी पसंदीदा भाषा और Pro अनलॉक है या नहीं, यह भी शामिल होता है। जब आप किसी साइट की रिपोर्ट करते हैं, किसी साइट पर Nocti बंद करते हैं, उसकी डार्क साइट की पहचान सुधारते हैं या उसके रंग एडजस्ट करते हैं, तो साइट का डोमेन शामिल होता है (उदाहरण के लिए example.com, पूरा पता कभी नहीं), और रिपोर्ट में आपका लिखा नोट भी शामिल होता है। आपका ब्राउज़िंग इतिहास, पेजों के पूरे पते, पेज की सामग्री और ऐसा कुछ भी जो आपकी पहचान कर सके, कभी शामिल नहीं होता। शेयर करना डिफ़ॉल्ट रूप से चालू रहता है, और आप इसे कभी भी सेटिंग्ज़ → परिचय → गोपनीयता नीति में बंद कर सकते हैं। उसके बाद कुछ भी नहीं भेजा जाता, और जो इवेंट अभी भेजे जाने का इंतज़ार कर रहे हैं, वे मिटा दिए जाते हैं।", "t5": "5. इस डेटा को कौन प्रोसेस करता है", "b5": "PostHog हमारी ओर से अमेरिका में स्थित सर्वरों पर इन इवेंट को प्रोसेस करता है। एकमात्र पहचानकर्ता इस डिवाइस पर बनाया गया एक रैंडम ID है, जिसे ऐप और एक्सटेंशन साझा रूप से इस्तेमाल करते हैं। यह आपके Apple खाते, आपके डिवाइस के विज्ञापन पहचानकर्ता या किसी अन्य पहचान से जुड़ा नहीं है। हम यूज़र प्रोफ़ाइल नहीं बनाते, सेशन या स्क्रीन रिकॉर्ड नहीं करते, और आपका IP पता स्टोर नहीं करते और न ही उससे आपकी लोकेशन पता करते हैं। यह डेटा विज्ञापन के लिए इस्तेमाल नहीं होता, न बेचा जाता है न किसी और के साथ शेयर किया जाता है, और न ही अलग-अलग ऐप या वेबसाइटों पर आपको ट्रैक करने के लिए इस्तेमाल होता है।", "t6": "6. नेटवर्क अनुरोध", "b6": "ऊपर बताए गए गुमनाम उपयोग डेटा के अलावा, एक्सटेंशन सिर्फ़ वही स्टाइलशीट और इमेज डाउनलोड करता है जो पेज पहले से इस्तेमाल करता है, ताकि उन्हें डार्क रंगों में बदला जा सके। जब आप “अपडेट जाँचें” पर टैप करते हैं, तो ऐप Apple की सार्वजनिक App Store सेवा से नवीनतम वर्शन नंबर पूछता है। यह अनुरोध Apple को जाता है, हमें नहीं।", "t7": "7. ख़रीदारी", "b7": "ख़रीदारी Apple द्वारा App Store के ज़रिए पूरी की जाती है। आपका भुगतान तरीका और Apple खाते की जानकारी Apple संभालता है, और हम उन्हें नहीं देख सकते।", "t8": "8. फ़ीडबैक ईमेल", "b8": "अगर आप हमें ईमेल करते हैं, तो हमें आपका लिखा संदेश मिलता है, साथ में ईमेल में पहले से भरे ऐप वर्शन, सिस्टम वर्शन और डिवाइस मॉडल भी, जिन्हें आप भेजने से पहले हटा सकते हैं। हम इनका उपयोग सिर्फ़ आपको जवाब देने और समस्याएँ ठीक करने के लिए करते हैं।", "t9": "9. बच्चों की गोपनीयता", "b9": "ऐप जानबूझकर 13 साल से कम उम्र के बच्चों से कोई जानकारी इकट्ठा नहीं करता।", "t10": "10. इस नीति में बदलाव", "b10": "अगर यह नीति बदलती है, तो हम नया वर्शन इसी पेज पर पोस्ट करेंगे और लागू होने की तारीख़ अपडेट करेंगे।"}, "hr": {"title": "Nocti · Pravila privatnosti", "h1": "Pravila privatnosti", "back": "Natrag", "eff": "Datum stupanja na snagu: 21. listopada 2026.", "intro": "Nocti („Aplikacija”) proširenje je za Safari koje zatamnjuje web-stranice na vašem uređaju. Ne trebate račun i ništa što pregledavate nikad ne stiže do nas. Ova pravila točno objašnjavaju kako Aplikacija postupa s vašim podacima.", "contact_t": "11. Kontakt", "contact_l": "Ako imate pitanja o ovim pravilima, obratite se na:", "t1": "1. Što ne prikupljamo", "b1": "Aplikacija nema registraciju ni prijavu. Ne prikuplja vaše ime, e-adresu, lokaciju ni kontakte i nikad ne prikuplja vašu povijest pregledavanja, pune adrese stranica koje posjećujete ni njihov sadržaj.", "t2": "2. Kako proširenje radi", "b2": "Proširenje radi unutar Safarija na vašem uređaju. Boje stranice čita samo da bi ih ondje, u Safariju, preoblikovalo u tamne. Sadržaj stranice nikad se ne kopira, ne sprema niti šalje nikamo.", "t3": "3. Gdje se spremaju vaše postavke", "b3": "Vaša tema, opcije prigušivanja, prilagodbe stranica i popis stranica za koje ste isključili Nocti spremaju se na ovom uređaju. Osim anonimnih podataka o korištenju opisanih u nastavku, ne prenose se nama ni bilo kojoj trećoj strani.", "t4": "4. Anonimni podaci o korištenju", "b4": "Kako bismo znali koje značajke ljudi koriste i koje stranice treba popraviti, Aplikacija i proširenje šalju mali skup anonimnih događaja. Svaki je fiksni naziv događaja s nekoliko pojedinosti, primjerice koju ste temu odabrali, na koji ste način prešli ili cijena i valuta kupnje. Brojevi, primjerice koliko imate prilagođenih tema ili pravila za stranice, šalju se samo kao rasponi (na primjer 2–5), kako točan broj ne bi postao otisak prsta. Svaki događaj sadrži i verziju aplikacije, operacijski sustav i njegovu verziju, vaš željeni jezik te je li Pro otključan. Kad prijavite stranicu, isključite Nocti za stranicu, ispravite njezino prepoznavanje tamnih stranica ili prilagodite njezine boje, uključuje se domena stranice (na primjer example.com, nikad puna adresa), a prijava sadrži i bilješku koju napišete. Vaša povijest pregledavanja, pune adrese stranica, sadržaj stranica i sve što vas identificira nikad nisu uključeni. Dijeljenje je zadano uključeno i možete ga isključiti bilo kada u Postavke → O aplikaciji → Pravila privatnosti. Od tada se ništa ne šalje, a događaji koji još čekaju slanje brišu se.", "t5": "5. Tko obrađuje ove podatke", "b5": "PostHog obrađuje ove događaje u naše ime, na poslužiteljima u Sjedinjenim Državama. Jedini identifikator je nasumični ID stvoren na ovom uređaju koji dijele Aplikacija i proširenje. Nije povezan s vašim Apple računom, oglašivačkim identifikatorom uređaja ni bilo kojim drugim identitetom. Ne izrađujemo korisničke profile, ne snimamo sesije ni zaslone te ne pohranjujemo vašu IP adresu niti je koristimo za utvrđivanje vaše lokacije. Podaci se ne koriste za oglašavanje, ne prodaju se niti dijele s bilo kim drugim i ne koriste se za praćenje vas kroz aplikacije ili web-stranice.", "t6": "6. Mrežni zahtjevi", "b6": "Osim gore opisanih anonimnih podataka o korištenju, proširenje preuzima samo stilove i slike koje stranica već koristi, kako bi ih moglo preoblikovati. Kad dodirnete Provjeri ažuriranja, aplikacija od Appleove javne usluge App Store traži broj najnovije verzije. Taj zahtjev ide Appleu, a ne nama.", "t7": "7. Kupnje", "b7": "Kupnje obavlja Apple putem App Storea. Vašim načinom plaćanja i podacima Apple računa upravlja Apple, a mi ih ne vidimo.", "t8": "8. E-poruke s povratnim informacijama", "b8": "Ako nam pošaljete e-poruku, primit ćemo ono što napišete te verziju aplikacije, verziju sustava i model uređaja unaprijed upisane u poruku, koje možete obrisati prije slanja. Koristimo ih samo da vam odgovorimo i riješimo probleme.", "t9": "9. Privatnost djece", "b9": "Aplikacija svjesno ne prikuplja nikakve podatke od djece mlađe od 13 godina.", "t10": "10. Izmjene ovih pravila", "b10": "Ako se ova pravila promijene, novu ćemo verziju objaviti na ovoj stranici i ažurirati datum stupanja na snagu."}, "hu": {"title": "Nocti · Adatvédelmi szabályzat", "h1": "Adatvédelmi szabályzat", "back": "Vissza", "eff": "Hatálybalépés dátuma: 2026. október 21.", "intro": "A Nocti (az „App”) egy Safari-bővítmény, amely az eszközödön sötétíti el a weboldalakat. Nincs szükséged fiókra, és semmi sem jut el hozzánk abból, amit böngészel. Ez a szabályzat pontosan leírja, hogyan kezeli az App az adataidat.", "contact_t": "11. Kapcsolat", "contact_l": "Ha kérdésed van ezzel a szabályzattal kapcsolatban, írj ide:", "t1": "1. Amit nem gyűjtünk", "b1": "Az Appban nincs regisztráció vagy bejelentkezés. Nem gyűjti a nevedet, e-mail-címedet, helyzetedet vagy névjegyeidet, és sosem gyűjti a böngészési előzményeidet, a meglátogatott oldalak teljes címét vagy azok tartalmát.", "t2": "2. Hogyan működik a bővítmény?", "b2": "A bővítmény a Safariban fut az eszközödön. Az oldal színeit csak azért olvassa be, hogy ott helyben, a Safariban sötét színekre cserélje őket. Az oldal tartalmát sosem másolja, tárolja vagy küldi el sehova.", "t3": "3. Hol tárolódnak a beállításaid?", "b3": "A témád, a tompítási beállítások, a webhelyjavítások és azoknak a webhelyeknek a listája, amelyeken kikapcsoltad a Noctit, ezen az eszközön tárolódnak. Az alább leírt névtelen használati adatokon kívül nem töltődnek fel hozzánk vagy harmadik félhez.", "t4": "4. Névtelen használati adatok", "b4": "Hogy tudjuk, mely funkciókat használják az emberek, és mely webhelyeket kell javítani, az App és a bővítmény névtelen események egy kis körét küldi el. Mindegyik egy rögzített eseménynév néhány részlettel, például hogy melyik témát választottad, melyik módra váltottál, vagy egy vásárlás ára és pénzneme. A darabszámok – például hogy hány egyéni témád vagy webhelyszabályod van – csak tartományként kerülnek elküldésre (például 2–5), hogy egy pontos szám ne válhasson ujjlenyomattá. Minden esemény tartalmazza az app verzióját, az operációs rendszert és annak verzióját, a preferált nyelvedet, valamint azt is, hogy fel van-e oldva a Pro. Ha jelentesz egy webhelyet, kikapcsolod rajta a Noctit, javítod a sötét webhelyek felismerését rajta, vagy módosítod a színeit, a webhely domainje is bekerül (például example.com, soha nem a teljes cím), a jelentés pedig az általad írt megjegyzést is tartalmazza. A böngészési előzményeid, a teljes oldalcímek, az oldalak tartalma és bármi, ami azonosíthat téged, soha nem kerülnek bele. A megosztás alapértelmezés szerint be van kapcsolva, és bármikor kikapcsolhatod itt: Beállítások → Névjegy → Adatvédelmi szabályzat. Ettől kezdve semmi sem kerül elküldésre, a még küldésre váró események pedig törlődnek.", "t5": "5. Ki kezeli ezeket az adatokat", "b5": "Ezeket az eseményeket a PostHog kezeli a megbízásunkból, az Egyesült Államokban lévő szervereken. Az egyetlen azonosító egy véletlenszerű azonosító, amely ezen az eszközön jön létre, és amelyet az App és a bővítmény közösen használ. Nincs összekapcsolva az Apple-fiókoddal, az eszközöd hirdetési azonosítójával vagy bármilyen más identitással. Nem hozunk létre felhasználói profilokat, nem rögzítünk munkameneteket vagy képernyőket, és nem tároljuk az IP-címedet, illetve nem használjuk a helyzeted meghatározására. Az adatokat nem használjuk hirdetésekhez, nem adjuk el és nem osztjuk meg senki mással, és nem használjuk arra, hogy appokon vagy webhelyeken átívelően kövessünk.", "t6": "6. Hálózati kérések", "b6": "A fent leírt névtelen használati adatokon kívül a bővítmény csak azokat a stíluslapokat és képeket tölti le, amelyeket az oldal már használ, hogy átszínezhesse őket. Ha a Frissítések keresése gombra koppintasz, az app az Apple nyilvános App Store-szolgáltatásától kérdezi le a legújabb verziószámot. Ez a kérés az Apple-höz megy, nem hozzánk.", "t7": "7. Vásárlások", "b7": "A vásárlásokat az Apple bonyolítja le az App Store-on keresztül. A fizetési módodat és az Apple-fiókod adatait az Apple kezeli, mi nem látjuk őket.", "t8": "8. Visszajelző e-mailek", "b8": "Ha e-mailt írsz nekünk, megkapjuk az üzenetedet, valamint az e-mailben előre kitöltött appverziót, rendszerverziót és eszközmodellt, amelyeket küldés előtt törölhetsz. Ezeket csak a válaszadáshoz és a hibák javításához használjuk.", "t9": "9. Gyermekek adatvédelme", "b9": "Az App szándékosan nem gyűjt semmilyen információt 13 év alatti gyermekektől.", "t10": "10. Az adatvédelmi szabályzat módosításai", "b10": "Ha ez a szabályzat megváltozik, az új verziót ezen az oldalon tesszük közzé, és frissítjük a hatálybalépés dátumát."}, "id": {"title": "Nocti · Kebijakan Privasi", "h1": "Kebijakan Privasi", "back": "Kembali", "eff": "Tanggal berlaku: 21 Oktober 2026", "intro": "Nocti (“App”) adalah ekstensi Safari yang menggelapkan halaman web di perangkat Anda. Anda tidak memerlukan akun, dan tidak ada yang Anda telusuri yang pernah sampai ke kami. Kebijakan ini menjelaskan secara persis bagaimana App menangani informasi Anda.", "contact_t": "11. Hubungi kami", "contact_l": "Jika Anda memiliki pertanyaan tentang kebijakan ini, hubungi:", "t1": "1. Yang tidak kami kumpulkan", "b1": "App tidak memerlukan pendaftaran atau login. App tidak mengumpulkan nama, email, lokasi, atau kontak Anda, dan tidak pernah mengumpulkan riwayat penelusuran, alamat lengkap halaman yang Anda kunjungi, atau kontennya.", "t2": "2. Cara kerja ekstensi", "b2": "Ekstensi berjalan di dalam Safari di perangkat Anda. Ekstensi membaca warna halaman hanya untuk mengubahnya menjadi warna gelap, langsung di Safari. Konten halaman tidak pernah disalin, disimpan, atau dikirim ke mana pun.", "t3": "3. Tempat pengaturan Anda disimpan", "b3": "Tema, opsi peredupan, perbaikan situs, dan daftar situs tempat Anda mematikan Nocti disimpan di perangkat ini. Selain data penggunaan anonim yang dijelaskan di bawah, semuanya tidak diunggah ke kami atau ke pihak ketiga mana pun.", "t4": "4. Data penggunaan anonim", "b4": "Untuk mengetahui fitur mana yang digunakan orang dan situs mana yang perlu diperbaiki, App dan ekstensi mengirim sekumpulan kecil peristiwa anonim. Setiap peristiwa berupa nama peristiwa yang tetap dengan beberapa detail, seperti tema yang Anda pilih, mode yang Anda alihkan, atau harga dan mata uang suatu pembelian. Jumlah, seperti berapa banyak tema khusus atau aturan situs yang Anda miliki, hanya dikirim sebagai rentang (misalnya 2–5), agar angka yang persis tidak bisa menjadi sidik jari. Setiap peristiwa juga menyertakan versi app, sistem operasi beserta versinya, bahasa pilihan Anda, dan apakah Pro sudah dibuka. Saat Anda melaporkan situs, mematikan Nocti untuk suatu situs, mengoreksi deteksi situs gelap untuk situs itu, atau menyesuaikan warnanya, domain situs tersebut disertakan (misalnya example.com, tidak pernah alamat lengkapnya), dan laporan juga menyertakan catatan yang Anda tulis. Riwayat penelusuran, alamat lengkap halaman, konten halaman, dan apa pun yang dapat mengidentifikasi Anda tidak pernah disertakan. Berbagi aktif secara default, dan Anda dapat mematikannya kapan saja di Pengaturan → Tentang → Kebijakan Privasi. Sejak saat itu tidak ada yang dikirim, dan peristiwa yang masih menunggu untuk dikirim akan dihapus.", "t5": "5. Siapa yang memproses data ini", "b5": "PostHog memproses peristiwa ini atas nama kami, di server yang berada di Amerika Serikat. Satu-satunya pengenal adalah ID acak yang dibuat di perangkat ini dan digunakan bersama oleh App dan ekstensi. ID ini tidak ditautkan ke Akun Apple Anda, pengenal iklan perangkat Anda, atau identitas lain apa pun. Kami tidak membuat profil pengguna, tidak merekam sesi atau layar, dan tidak menyimpan alamat IP Anda atau menggunakannya untuk mencari tahu lokasi Anda. Data ini tidak digunakan untuk iklan, tidak dijual atau dibagikan kepada siapa pun, dan tidak digunakan untuk melacak Anda di berbagai app atau situs web.", "t6": "6. Permintaan jaringan", "b6": "Selain data penggunaan anonim yang dijelaskan di atas, ekstensi hanya mengunduh stylesheet dan gambar yang sudah digunakan halaman agar bisa mengubah gayanya. Saat Anda mengetuk Periksa Pembaruan, App menanyakan nomor versi terbaru ke layanan App Store publik milik Apple. Permintaan itu dikirim ke Apple, bukan ke kami.", "t7": "7. Pembelian", "b7": "Pembelian diselesaikan oleh Apple melalui App Store. Metode pembayaran dan detail Akun Apple Anda ditangani oleh Apple, dan kami tidak dapat melihatnya.", "t8": "8. Email masukan", "b8": "Jika Anda mengirim email kepada kami, kami menerima isi tulisan Anda beserta versi app, versi sistem, dan model perangkat yang sudah terisi di email, yang bisa Anda hapus sebelum mengirim. Kami hanya menggunakannya untuk membalas Anda dan memperbaiki masalah.", "t9": "9. Privasi anak-anak", "b9": "App tidak dengan sengaja mengumpulkan informasi apa pun dari anak-anak di bawah 13 tahun.", "t10": "10. Perubahan kebijakan ini", "b10": "Jika kebijakan ini berubah, kami akan memasang versi barunya di halaman ini dan memperbarui tanggal berlakunya."}, "kn": {"title": "Nocti · ಗೌಪ್ಯತಾ ನೀತಿ", "h1": "ಗೌಪ್ಯತಾ ನೀತಿ", "back": "ಹಿಂದೆ", "eff": "ಜಾರಿ ದಿನಾಂಕ: ಅಕ್ಟೋಬರ್ 21, 2026", "intro": "Nocti (\"App\") ನಿಮ್ಮ ಸಾಧನದಲ್ಲಿ ವೆಬ್ ಪುಟಗಳನ್ನು ಡಾರ್ಕ್ ಮಾಡುವ Safari ಎಕ್ಸ್‌ಟೆನ್ಶನ್ ಆಗಿದೆ. ನಿಮಗೆ ಖಾತೆಯ ಅಗತ್ಯವಿಲ್ಲ, ಮತ್ತು ನೀವು ಬ್ರೌಸ್ ಮಾಡುವ ಯಾವುದೂ ನಮ್ಮನ್ನು ತಲುಪುವುದಿಲ್ಲ. App ನಿಮ್ಮ ಮಾಹಿತಿಯನ್ನು ಹೇಗೆ ನಿರ್ವಹಿಸುತ್ತದೆ ಎಂಬುದನ್ನು ಈ ನೀತಿ ನಿಖರವಾಗಿ ವಿವರಿಸುತ್ತದೆ.", "contact_t": "11. ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ", "contact_l": "ಈ ನೀತಿಯ ಬಗ್ಗೆ ಯಾವುದೇ ಪ್ರಶ್ನೆಗಳಿದ್ದರೆ, ಸಂಪರ್ಕಿಸಿ:", "t1": "1. ನಾವು ಏನನ್ನು ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ", "b1": "App ನಲ್ಲಿ ಸೈನ್-ಅಪ್ ಅಥವಾ ಲಾಗಿನ್ ಇಲ್ಲ. ಇದು ನಿಮ್ಮ ಹೆಸರು, ಇಮೇಲ್, ಸ್ಥಳ ಅಥವಾ ಸಂಪರ್ಕಗಳನ್ನು ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ; ನಿಮ್ಮ ಬ್ರೌಸಿಂಗ್ ಇತಿಹಾಸ, ನೀವು ಭೇಟಿ ನೀಡುವ ಪುಟಗಳ ಪೂರ್ಣ ವಿಳಾಸಗಳು ಅಥವಾ ಅವುಗಳ ವಿಷಯವನ್ನು ಎಂದಿಗೂ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ.", "t2": "2. ಎಕ್ಸ್‌ಟೆನ್ಶನ್ ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ", "b2": "ಎಕ್ಸ್‌ಟೆನ್ಶನ್ ನಿಮ್ಮ ಸಾಧನದಲ್ಲಿ Safari ಯೊಳಗೆ ರನ್ ಆಗುತ್ತದೆ. ಪುಟದ ಬಣ್ಣಗಳನ್ನು ಡಾರ್ಕ್ ಬಣ್ಣಗಳಾಗಿ ಬದಲಾಯಿಸಲು ಮಾತ್ರ, ಅಲ್ಲೇ Safari ಯಲ್ಲಿ, ಅದು ಅವುಗಳನ್ನು ಓದುತ್ತದೆ. ಪುಟದ ವಿಷಯವನ್ನು ಎಂದಿಗೂ ನಕಲಿಸಲಾಗುವುದಿಲ್ಲ, ಸಂಗ್ರಹಿಸಲಾಗುವುದಿಲ್ಲ ಅಥವಾ ಎಲ್ಲಿಗೂ ಕಳುಹಿಸಲಾಗುವುದಿಲ್ಲ.", "t3": "3. ನಿಮ್ಮ ಸೆಟ್ಟಿಂಗ್‌ಗಳನ್ನು ಎಲ್ಲಿ ಸಂಗ್ರಹಿಸಲಾಗುತ್ತದೆ", "b3": "ನಿಮ್ಮ ಥೀಮ್, ಮಂದಗೊಳಿಸುವ ಆಯ್ಕೆಗಳು, ಸೈಟ್ ತಿದ್ದುಪಡಿಗಳು ಮತ್ತು ನೀವು Nocti ಆಫ್ ಮಾಡಿದ ಸೈಟ್‌ಗಳ ಪಟ್ಟಿಯನ್ನು ಈ ಸಾಧನದಲ್ಲೇ ಉಳಿಸಲಾಗುತ್ತದೆ. ಕೆಳಗೆ ವಿವರಿಸಿದ ಅನಾಮಧೇಯ ಬಳಕೆಯ ಡೇಟಾವನ್ನು ಹೊರತುಪಡಿಸಿ, ಅವುಗಳನ್ನು ನಮಗೆ ಅಥವಾ ಯಾವುದೇ ಮೂರನೇ ವ್ಯಕ್ತಿಗೆ ಅಪ್‌ಲೋಡ್ ಮಾಡಲಾಗುವುದಿಲ್ಲ.", "t4": "4. ಅನಾಮಧೇಯ ಬಳಕೆಯ ಡೇಟಾ", "b4": "ಜನರು ಯಾವ ವೈಶಿಷ್ಟ್ಯಗಳನ್ನು ಬಳಸುತ್ತಾರೆ ಮತ್ತು ಯಾವ ಸೈಟ್‌ಗಳನ್ನು ಸರಿಪಡಿಸಬೇಕು ಎಂದು ತಿಳಿಯಲು, App ಮತ್ತು ಎಕ್ಸ್‌ಟೆನ್ಶನ್ ಕೆಲವೇ ಅನಾಮಧೇಯ ಈವೆಂಟ್‌ಗಳನ್ನು ಕಳುಹಿಸುತ್ತವೆ. ಪ್ರತಿಯೊಂದೂ ಒಂದು ನಿಗದಿತ ಈವೆಂಟ್ ಹೆಸರು ಮತ್ತು ಕೆಲವು ವಿವರಗಳು, ಉದಾಹರಣೆಗೆ ನೀವು ಆಯ್ಕೆ ಮಾಡಿದ ಥೀಮ್, ನೀವು ಬದಲಾಯಿಸಿದ ಮೋಡ್, ಅಥವಾ ಖರೀದಿಯ ಬೆಲೆ ಮತ್ತು ಕರೆನ್ಸಿ. ನಿಮ್ಮಲ್ಲಿ ಎಷ್ಟು ಕಸ್ಟಮ್ ಥೀಮ್‌ಗಳು ಅಥವಾ ಸೈಟ್ ನಿಯಮಗಳಿವೆ ಎಂಬಂತಹ ಎಣಿಕೆಗಳನ್ನು ವ್ಯಾಪ್ತಿಗಳಾಗಿ ಮಾತ್ರ ಕಳುಹಿಸಲಾಗುತ್ತದೆ (ಉದಾಹರಣೆಗೆ 2–5), ಇದರಿಂದ ನಿಖರ ಸಂಖ್ಯೆಯು ಫಿಂಗರ್‌ಪ್ರಿಂಟ್ ಆಗುವುದಿಲ್ಲ. ಪ್ರತಿ ಈವೆಂಟ್‌ನಲ್ಲಿ ಆ್ಯಪ್ ಆವೃತ್ತಿ, ಆಪರೇಟಿಂಗ್ ಸಿಸ್ಟಮ್ ಮತ್ತು ಅದರ ಆವೃತ್ತಿ, ನಿಮ್ಮ ಆದ್ಯತೆಯ ಭಾಷೆ ಮತ್ತು Pro ಅನ್‌ಲಾಕ್ ಆಗಿದೆಯೇ ಎಂಬುದೂ ಇರುತ್ತದೆ. ನೀವು ಸೈಟ್ ಅನ್ನು ವರದಿ ಮಾಡಿದಾಗ, ಸೈಟ್‌ಗೆ Nocti ಆಫ್ ಮಾಡಿದಾಗ, ಅದರ ಡಾರ್ಕ್ ಸೈಟ್ ಪತ್ತೆಯನ್ನು ಸರಿಪಡಿಸಿದಾಗ ಅಥವಾ ಅದರ ಬಣ್ಣಗಳನ್ನು ಹೊಂದಿಸಿದಾಗ, ಸೈಟ್‌ನ ಡೊಮೇನ್ ಸೇರಿರುತ್ತದೆ (ಉದಾಹರಣೆಗೆ example.com, ಪೂರ್ಣ ವಿಳಾಸ ಎಂದಿಗೂ ಅಲ್ಲ), ಮತ್ತು ವರದಿಯಲ್ಲಿ ನೀವು ಬರೆದ ಟಿಪ್ಪಣಿಯೂ ಇರುತ್ತದೆ. ನಿಮ್ಮ ಬ್ರೌಸಿಂಗ್ ಇತಿಹಾಸ, ಪುಟಗಳ ಪೂರ್ಣ ವಿಳಾಸಗಳು, ಪುಟದ ವಿಷಯ ಮತ್ತು ನಿಮ್ಮನ್ನು ಗುರುತಿಸಬಹುದಾದ ಯಾವುದನ್ನೂ ಎಂದಿಗೂ ಸೇರಿಸಲಾಗುವುದಿಲ್ಲ. ಹಂಚಿಕೊಳ್ಳುವಿಕೆ ಡೀಫಾಲ್ಟ್ ಆಗಿ ಆನ್ ಆಗಿರುತ್ತದೆ, ಮತ್ತು ನೀವು ಯಾವಾಗ ಬೇಕಾದರೂ ಸೆಟ್ಟಿಂಗ್‌ಗಳು → ಕುರಿತು → ಗೌಪ್ಯತಾ ನೀತಿ ನಲ್ಲಿ ಅದನ್ನು ಆಫ್ ಮಾಡಬಹುದು. ಅಂದಿನಿಂದ ಏನನ್ನೂ ಕಳುಹಿಸಲಾಗುವುದಿಲ್ಲ, ಮತ್ತು ಇನ್ನೂ ಕಳುಹಿಸಲು ಕಾಯುತ್ತಿರುವ ಈವೆಂಟ್‌ಗಳನ್ನು ಅಳಿಸಲಾಗುತ್ತದೆ.", "t5": "5. ಈ ಡೇಟಾವನ್ನು ಯಾರು ಪ್ರಕ್ರಿಯೆಗೊಳಿಸುತ್ತಾರೆ", "b5": "PostHog ನಮ್ಮ ಪರವಾಗಿ, ಅಮೆರಿಕ ಸಂಯುಕ್ತ ಸಂಸ್ಥಾನದಲ್ಲಿರುವ ಸರ್ವರ್‌ಗಳಲ್ಲಿ ಈ ಈವೆಂಟ್‌ಗಳನ್ನು ಪ್ರಕ್ರಿಯೆಗೊಳಿಸುತ್ತದೆ. ಏಕೈಕ ಗುರುತಿಸುವಿಕೆ ಎಂದರೆ ಈ ಸಾಧನದಲ್ಲಿ ರಚಿಸಲಾದ, App ಮತ್ತು ಎಕ್ಸ್‌ಟೆನ್ಶನ್ ಹಂಚಿಕೊಳ್ಳುವ ಒಂದು ಯಾದೃಚ್ಛಿಕ ID. ಇದು ನಿಮ್ಮ Apple ಖಾತೆ, ನಿಮ್ಮ ಸಾಧನದ ಜಾಹೀರಾತು ಗುರುತಿಸುವಿಕೆ ಅಥವಾ ಬೇರೆ ಯಾವುದೇ ಗುರುತಿನೊಂದಿಗೆ ಜೋಡಣೆಯಾಗಿಲ್ಲ. ನಾವು ಬಳಕೆದಾರರ ಪ್ರೊಫೈಲ್‌ಗಳನ್ನು ರಚಿಸುವುದಿಲ್ಲ, ಸೆಷನ್‌ಗಳು ಅಥವಾ ಪರದೆಗಳನ್ನು ರೆಕಾರ್ಡ್ ಮಾಡುವುದಿಲ್ಲ, ಮತ್ತು ನಿಮ್ಮ IP ವಿಳಾಸವನ್ನು ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ ಅಥವಾ ನಿಮ್ಮ ಸ್ಥಳವನ್ನು ಕಂಡುಹಿಡಿಯಲು ಅದನ್ನು ಬಳಸುವುದಿಲ್ಲ. ಈ ಡೇಟಾವನ್ನು ಜಾಹೀರಾತಿಗಾಗಿ ಬಳಸುವುದಿಲ್ಲ, ಮಾರಾಟ ಮಾಡುವುದಿಲ್ಲ ಅಥವಾ ಬೇರೆ ಯಾರೊಂದಿಗೂ ಹಂಚಿಕೊಳ್ಳುವುದಿಲ್ಲ, ಮತ್ತು ಆ್ಯಪ್‌ಗಳು ಅಥವಾ ವೆಬ್‌ಸೈಟ್‌ಗಳಾದ್ಯಂತ ನಿಮ್ಮನ್ನು ಟ್ರ್ಯಾಕ್ ಮಾಡಲು ಬಳಸುವುದಿಲ್ಲ.", "t6": "6. ನೆಟ್‌ವರ್ಕ್ ವಿನಂತಿಗಳು", "b6": "ಮೇಲೆ ವಿವರಿಸಿದ ಅನಾಮಧೇಯ ಬಳಕೆಯ ಡೇಟಾವನ್ನು ಹೊರತುಪಡಿಸಿ, ಪುಟವು ಈಗಾಗಲೇ ಬಳಸುತ್ತಿರುವ ಸ್ಟೈಲ್‌ಶೀಟ್‌ಗಳು ಮತ್ತು ಚಿತ್ರಗಳನ್ನು ಮಾತ್ರ ಎಕ್ಸ್‌ಟೆನ್ಶನ್ ಡೌನ್‌ಲೋಡ್ ಮಾಡುತ್ತದೆ, ಅವುಗಳ ಶೈಲಿಯನ್ನು ಬದಲಾಯಿಸಲು. ನೀವು ಅಪ್‌ಡೇಟ್‌ಗಳಿಗಾಗಿ ಪರಿಶೀಲಿಸಿ ಟ್ಯಾಪ್ ಮಾಡಿದಾಗ, App ಇತ್ತೀಚಿನ ಆವೃತ್ತಿ ಸಂಖ್ಯೆಯನ್ನು Apple ನ ಸಾರ್ವಜನಿಕ App Store ಸೇವೆಯಿಂದ ಕೇಳುತ್ತದೆ. ಆ ವಿನಂತಿ Apple ಗೆ ಹೋಗುತ್ತದೆ, ನಮಗಲ್ಲ.", "t7": "7. ಖರೀದಿಗಳು", "b7": "ಖರೀದಿಗಳನ್ನು App Store ಮೂಲಕ Apple ಪೂರ್ಣಗೊಳಿಸುತ್ತದೆ. ನಿಮ್ಮ ಪಾವತಿ ವಿಧಾನ ಮತ್ತು Apple ಖಾತೆಯ ವಿವರಗಳನ್ನು Apple ನಿರ್ವಹಿಸುತ್ತದೆ; ಅವುಗಳನ್ನು ನಾವು ನೋಡಲಾಗುವುದಿಲ್ಲ.", "t8": "8. ಪ್ರತಿಕ್ರಿಯೆ ಇಮೇಲ್‌ಗಳು", "b8": "ನೀವು ನಮಗೆ ಇಮೇಲ್ ಮಾಡಿದರೆ, ನೀವು ಬರೆದದ್ದು ಮತ್ತು ಇಮೇಲ್‌ನಲ್ಲಿ ಮೊದಲೇ ತುಂಬಿರುವ ಆ್ಯಪ್ ಆವೃತ್ತಿ, ಸಿಸ್ಟಮ್ ಆವೃತ್ತಿ, ಸಾಧನದ ಮಾಡೆಲ್ ನಮಗೆ ಸಿಗುತ್ತವೆ; ಕಳುಹಿಸುವ ಮೊದಲು ಅವುಗಳನ್ನು ಅಳಿಸಬಹುದು. ನಿಮಗೆ ಉತ್ತರಿಸಲು ಮತ್ತು ಸಮಸ್ಯೆಗಳನ್ನು ಸರಿಪಡಿಸಲು ಮಾತ್ರ ಅವುಗಳನ್ನು ಬಳಸುತ್ತೇವೆ.", "t9": "9. ಮಕ್ಕಳ ಗೌಪ್ಯತೆ", "b9": "13 ವರ್ಷದೊಳಗಿನ ಮಕ್ಕಳಿಂದ App ತಿಳಿದೂ ಯಾವುದೇ ಮಾಹಿತಿಯನ್ನು ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ.", "t10": "10. ಈ ನೀತಿಯಲ್ಲಿನ ಬದಲಾವಣೆಗಳು", "b10": "ಈ ನೀತಿ ಬದಲಾದರೆ, ಹೊಸ ಆವೃತ್ತಿಯನ್ನು ಈ ಪುಟದಲ್ಲಿ ಪ್ರಕಟಿಸಿ ಜಾರಿ ದಿನಾಂಕವನ್ನು ಅಪ್‌ಡೇಟ್ ಮಾಡುತ್ತೇವೆ."}, "ml": {"title": "Nocti · സ്വകാര്യതാ നയം", "h1": "സ്വകാര്യതാ നയം", "back": "പിന്നോട്ട്", "eff": "പ്രാബല്യത്തിലുള്ള തീയതി: 2026 ഒക്ടോബർ 21", "intro": "Nocti (\"App\") നിങ്ങളുടെ ഉപകരണത്തിലെ വെബ് പേജുകളെ ഇരുണ്ടതാക്കുന്ന ഒരു Safari എക്സ്റ്റൻഷനാണ്. നിങ്ങൾക്ക് ഒരു അക്കൗണ്ട് ആവശ്യമില്ല, നിങ്ങൾ ബ്രൗസ് ചെയ്യുന്ന ഒന്നും ഒരിക്കലും തും (ഉദാഹരണത്തിന് example.com, ഒരിക്കലും പൂർണ്ണ വിലാസമല്ല), റിപ്പോർട്ടിൽ നിങ്ങൾ എഴുതുന്ന കുറിപ്പും ഉൾപ്പെടും. നിങ്ങളുടെ ബ്രൗസിംഗ് ചരിത്രം, പേജുകളുടെ പൂർണ്ണ വിലാസങ്ങൾ, പേജ് ഉള്ളടക്കം, നിങ്ങളെ തിരിച്ചറിയാൻ കഴിയുന്ന എന്തും ഒരിക്കലും ഉൾപ്പെടുത്തില്ല. പങ്കിടൽ ഡിഫോൾട്ടായി ഓണാണ്, ക്രമീകരണം → വിവരം → സ്വകാര്യതാ നയം ൽ എപ്പോൾ വേണമെങ്കിലും നിങ്ങൾക്ക് ഇത് ഓഫാക്കാം. അപ്പോൾ മുതൽ ഒന്നും അയയ്ക്കില്ല, അയയ്ക്കാൻ കാത്തിരിക്കുന്ന ഇവന്റുകൾ ഇല്ലാതാക്കുകയും ചെയ്യും.", "t5": "5. ഈ ഡാറ്റ ആര് പ്രോസസ്സ് ചെയ്യുന്നു", "b5": "ഞങ്ങൾക്കുവേണ്ടി PostHog ഈ ഇവന്റുകൾ അമേരിക്കൻ ഐക്യനാടുകളിലെ സെർവറുകളിൽ പ്രോസസ്സ് ചെയ്യുന്നു. ഈ ഉപകരണത്തിൽ സൃഷ്ടിക്കുന്ന, App-ഉം എക്സ്റ്റൻഷനും പങ്കിടുന്ന ഒരു ക്രമരഹിത ID മാത്രമാണ് ഏക ഐഡന്റിഫയർ. ഇത് നിങ്ങളുടെ Apple അക്കൗണ്ടുമായോ ഉപകരണത്തിന്റെ പരസ്യ ഐഡന്റിഫയറുമായോ മറ്റേതെങ്കിലും ഐഡന്റിറ്റിയുമായോ ബന്ധിപ്പിച്ചിട്ടില്ല. ഞങ്ങൾ ഉപയോക്തൃ പ്രൊഫൈലുകൾ നിർമ്മിക്കുന്നില്ല, സെഷനുകളോ സ്ക്രീനുകളോ റെക്കോർഡ് ചെയ്യുന്നില്ല, നിങ്ങളുടെ IP വിലാസം സംഭരിക്കുകയോ നിങ്ങളുടെ ലൊക്കേഷൻ കണ്ടെത്താൻ അത് ഉപയോഗിക്കുകയോ ചെയ്യുന്നില്ല. ഈ ഡാറ്റ പരസ്യത്തിനായി ഉപയോഗിക്കുന്നില്ല, വിൽക്കുകയോ മറ്റാരുമായും പങ്കിടുകയോ ചെയ്യുന്നില്ല, ആപ്പുകളിലോ വെബ്‌സൈറ്റുകളിലോ ഉടനീളം നിങ്ങളെ ട്രാക്ക് ചെയ്യാൻ ഉപയോഗിക്കുന്നുമില്ല.", "t6": "6. നെറ്റ്‌വർക്ക് അഭ്യർത്ഥനകൾ", "b6": "മുകളിൽ വിവരിച്ച അജ്ഞാത ഉപയോഗ ഡാറ്റയ്ക്ക് പുറമെ, ഒരു പേജ് ഇതിനകം ഉപയോഗിക്കുന്ന സ്റ്റൈൽഷീറ്റുകളും ചിത്രങ്ങളും മാത്രമേ എക്സ്റ്റൻഷൻ ഡൗൺലോഡ് ചെയ്യൂ, അവയുടെ നിറം മാറ്റാൻ വേണ്ടി മാത്രം. നിങ്ങൾ അപ്‌ഡേറ്റുകൾക്കായി പരിശോധിക്കുക ടാപ്പ് ചെയ്യുമ്പോൾ, ഏറ്റവും പുതിയ പതിപ്പ് നമ്പർ App, Apple-ന്റെ പൊതു App Store സേവനത്തോട് ചോദിക്കുന്നു. ആ അഭ്യർത്ഥന പോകുന്നത് Apple-ലേക്കാണ്, ഞങ്ങളിലേക്കല്ല.", "t7": "7. വാങ്ങലുകൾ", "b7": "വാങ്ങലുകൾ App Store വഴി Apple പൂർത്തിയാക്കുന്നു. നിങ്ങളുടെ പേയ്‌മെന്റ് രീതിയും Apple അക്കൗണ്ട് വിവരങ്ങളും Apple കൈകാര്യം ചെയ്യുന്നു, ഞങ്ങൾക്ക് അവ കാണാനാകില്ല.", "t8": "8. ഫീഡ്‌ബാക്ക് ഇമെയിലുകൾ", "b8": "നിങ്ങൾ ഞങ്ങൾക്ക് ഇമെയിൽ ചെയ്താൽ, നിങ്ങൾ എഴുതുന്നതും ഇമെയിലിൽ മുൻകൂട്ടി ചേർത്ത ആപ്പ് പതിപ്പ്, സിസ്റ്റം പതിപ്പ്, ഉപകരണ മോഡൽ എന്നിവയും ഞങ്ങൾക്ക് ലഭിക്കും; അയയ്ക്കുന്നതിന് മുമ്പ് അവ ഇല്ലാതാക്കാം. നിങ്ങൾക്ക് മറുപടി നൽകാനും പ്രശ്നങ്ങൾ പരിഹരിക്കാനും മാത്രമേ ഞങ്ങൾ അത് ഉപയോഗിക്കൂ.", "t9": "9. കുട്ടികളുടെ സ്വകാര്യത", "b9": "13 വയസ്സിന് താഴെയുള്ള കുട്ടികളിൽ നിന്ന് App അറിഞ്ഞുകൊണ്ട് ഒരു വിവരവും ശേഖരിക്കുന്നില്ല.", "t10": "10. ഈ നയത്തിലെ മാറ്റങ്ങൾ", "b10": "ഈ നയം മാറുകയാണെങ്കിൽ, പുതിയ പതിപ്പ് ഈ പേജിൽ പ്രസിദ്ധീകരിക്കുകയും പ്രാബല്യത്തിലുള്ള തീയതി പുതുക്കുകയും ചെയ്യും."}, "mr": {"title": "Nocti · गोपनीयता धोरण", "h1": "गोपनीयता धोरण", "back": "मागे", "eff": "प्रभावी तारीख: 21 ऑक्टोबर 2026", "intro": "Nocti (“ॲप”) हे एक Safari एक्सटेन्शन आहे जे तुमच्या डिव्हाइसवर वेब पेजेस गडद करते. तुम्हाला खात्याची गरज नाही, आणि तुम्ही जे ब्राउझ करता त्यातले काहीही आमच्यापर्यंत पोहोचत नाही. हे धोरण ॲप तुमची माहिती नेमकी कशी हाताळते ते स्पष्ट करते.", "contact_t": "11. आमच्याशी संपर्क साधा", "contact_l": "या धोरणाबद्दल काही प्रश्न असल्यास, येथे संपर्क करा:", "t1": "1. आम्ही काय गोळा करत नाही", "b1": "ॲपमध्ये साइन-अप किंवा लॉगिन नाही. ते तुमचे नाव, ईमेल, स्थान किंवा संपर्क गोळा करत नाही, आणि तुमचा ब्राउझिंग इतिहास, तुम्ही भेट देता त्या पेजेसचे संपूर्ण पत्ते किंवा त्यांचा मजकूर कधीही गोळा करत नाही.", "t2": "2. एक्सटेन्शन कसे काम करते", "b2": "एक्सटेन्शन तुमच्या डिव्हाइसवरील Safari मध्ये चालते. ते पेजचे रंग फक्त त्यांना गडद रंगांत नवी शैली देण्यासाठी, तिथेच Safari मध्ये वाचते. पेजचा मजकूर कधीही कॉपी, साठवला किंवा कुठेही पाठवला जात नाही.", "t3": "3. तुमच्या सेटिंग्ज कुठे साठवल्या जातात", "b3": "तुमची थीम, मंद करण्याचे पर्याय, साइट दुरुस्त्या आणि तुम्ही Nocti बंद केलेल्या साइट्सची यादी या डिव्हाइसवर सेव्ह केली जाते. खाली वर्णन केलेल्या निनावी वापर डेटाव्यतिरिक्त, ती आमच्याकडे किंवा कोणत्याही तृतीय पक्षाकडे अपलोड केली जात नाही.", "t4": "4. निनावी वापर डेटा", "b4": "लोक कोणती वैशिष्ट्ये वापरतात आणि कोणत्या साइट्स दुरुस्त करायच्या आहेत हे जाणून घेण्यासाठी, ॲप आणि एक्सटेन्शन काही निनावी इव्हेंट्स पाठवतात. प्रत्येक इव्हेंट म्हणजे एक ठरलेले इव्हेंट नाव आणि थोडे तपशील, जसे की तुम्ही निवडलेली थीम, तुम्ही बदललेला मोड, किंवा एखाद्या खरेदीची किंमत आणि चलन. संख्या, जसे की तुमच्याकडे किती कस्टम थीम्स किंवा साइट नियम आहेत, फक्त श्रेणी म्हणून पाठवल्या जातात (उदाहरणार्थ 2–5), जेणेकरून नेमकी संख्या फिंगरप्रिंट बनू शकत नाही. प्रत्येक इव्हेंटमध्ये ॲपचे व्हर्जन, ऑपरेटिंग सिस्टम आणि तिचे व्हर्जन, तुमची पसंतीची भाषा आणि Pro अनलॉक आहे की नाही हेही असते. तुम्ही एखादी साइट रिपोर्ट करता, एखाद्या साइटसाठी Nocti बंद करता, तिची गडद साइट ओळख दुरुस्त करता किंवा तिचे रंग समायोजित करता, तेव्हा साइटचे डोमेन समाविष्ट होते (उदाहरणार्थ example.com, संपूर्ण पत्ता कधीच नाही), आणि रिपोर्टमध्ये तुम्ही लिहिलेली नोंदही असते. तुमचा ब्राउझिंग इतिहास, पेजेसचे संपूर्ण पत्ते, पेजचा मजकूर आणि तुमची ओळख पटवू शकेल असे काहीही कधीच समाविष्ट होत नाही. शेअरिंग डीफॉल्टनुसार सुरू असते, आणि तुम्ही ते कधीही सेटिंग्ज → विषयी → गोपनीयता धोरण मध्ये बंद करू शकता. तेव्हापासून काहीही पाठवले जात नाही, आणि अजून पाठवण्याच्या प्रतीक्षेत असलेले इव्हेंट्स हटवले जातात.", "t5": "5. हा डेटा कोण प्रक्रिया करते", "b5": "PostHog आमच्या वतीने, युनायटेड स्टेट्समधील सर्व्हरवर या इव्हेंट्सवर प्रक्रिया करते. एकमेव ओळखकर्ता म्हणजे या डिव्हाइसवर तयार केलेला एक यादृच्छिक ID, जो ॲप आणि एक्सटेन्शन मिळून वापरतात. तो तुमच्या Apple खात्याशी, तुमच्या डिव्हाइसच्या जाहिरात ओळखकर्त्याशी किंवा इतर कोणत्याही ओळखीशी जोडलेला नाही. आम्ही युझर प्रोफाइल तयार करत नाही, सेशन किंवा स्क्रीन रेकॉर्ड करत नाही, आणि तुमचा IP पत्ता साठवत नाही किंवा तुमचे स्थान शोधण्यासाठी तो वापरत नाही. हा डेटा जाहिरातींसाठी वापरला जात नाही, विकला जात नाही किंवा इतर कोणाशीही शेअर केला जात नाही, आणि ॲप्स किंवा वेबसाइट्सवर तुमचा मागोवा घेण्यासाठी वापरला जात नाही.", "t6": "6. नेटवर्क विनंत्या", "b6": "वर वर्णन केलेल्या निनावी वापर डेटाव्यतिरिक्त, एक्सटेन्शन फक्त पेज आधीच वापरत असलेल्या स्टाइलशीट्स आणि इमेजेस डाउनलोड करते, जेणेकरून त्यांना नवी शैली देता येईल. तुम्ही अपडेट्स तपासा वर टॅप करता तेव्हा, ॲप Apple च्या सार्वजनिक App Store सेवेकडून नवीनतम व्हर्जन नंबर विचारते. ती विनंती Apple कडे जाते, आमच्याकडे नाही.", "t7": "7. खरेदी", "b7": "खरेदी Apple द्वारे App Store मार्फत पूर्ण केली जाते. तुमची पेमेंट पद्धत आणि Apple खात्याचे तपशील Apple हाताळते, आणि ते आम्हाला दिसत नाहीत.", "t8": "8. अभिप्राय ईमेल", "b8": "तुम्ही आम्हाला ईमेल केल्यास, तुम्ही लिहिलेला मजकूर आणि ईमेलमध्ये आधीच भरलेले ॲप व्हर्जन, सिस्टम व्हर्जन व डिव्हाइस मॉडेल आम्हाला मिळते; पाठवण्यापूर्वी तुम्ही ते हटवू शकता. आम्ही ते फक्त तुम्हाला उत्तर देण्यासाठी आणि समस्या दुरुस्त करण्यासाठी वापरतो.", "t9": "9. मुलांची गोपनीयता", "b9": "ॲप 13 वर्षांखालील मुलांकडून जाणूनबुजून कोणतीही माहिती गोळा करत नाही.", "t10": "10. या धोरणातील बदल", "b10": "हे धोरण बदलल्यास, आम्ही नवी आवृत्ती या पेजवर प्रकाशित करू आणि प्रभावी तारीख अपडेट करू."}, "ms": {"title": "Nocti · Dasar Privasi", "h1": "Dasar Privasi", "back": "Kembali", "eff": "Tarikh berkuat kuasa: 21 Oktober 2026", "intro": "Nocti (“App”) ialah sambungan Safari yang menggelapkan halaman web pada peranti anda. Anda tidak memerlukan akaun, dan apa sahaja yang anda layari tidak pernah sampai kepada kami. Dasar ini menerangkan dengan tepat cara App mengendalikan maklumat anda.", "contact_t": "11. Hubungi kami", "contact_l": "Jika anda mempunyai sebarang soalan tentang dasar ini, hubungi:", "t1": "1. Perkara yang tidak kami kumpulkan", "b1": "App tidak memerlukan pendaftaran atau log masuk. Ia tidak mengumpul nama, e-mel, lokasi atau kenalan anda, dan tidak sekali-kali mengumpul sejarah pelayaran anda, alamat penuh halaman yang anda lawati atau kandungannya.", "t2": "2. Cara sambungan berfungsi", "b2": "Sambungan berjalan di dalam Safari pada peranti anda. Ia membaca warna halaman hanya untuk menggayakannya semula dengan warna gelap, terus di dalam Safari. Kandungan halaman tidak sekali-kali disalin, disimpan atau dihantar ke mana-mana.", "t3": "3. Tempat seting anda disimpan", "b3": "Tema, pilihan pemalapan, pembaikan laman dan senarai laman yang anda matikan Nocti disimpan pada peranti ini. Selain data penggunaan tanpa nama yang diterangkan di bawah, semuanya tidak dimuat naik kepada kami atau mana-mana pihak ketiga.", "t4": "4. Data penggunaan tanpa nama", "b4": "Untuk mengetahui ciri yang digunakan dan laman yang perlu dibaiki, App dan sambungan menghantar satu set kecil acara tanpa nama. Setiap acara ialah nama acara yang tetap dengan beberapa butiran, seperti tema yang anda pilih, mod yang anda tukar kepada, atau harga dan mata wang sesuatu pembelian. Kiraan, seperti berapa banyak tema tersuai atau peraturan laman yang anda ada, dihantar hanya sebagai julat (contohnya 2–5), supaya nombor yang tepat tidak boleh menjadi cap jari. Setiap acara juga termasuk versi app, sistem pengendalian dan versinya, bahasa pilihan anda dan sama ada Pro telah dibuka kunci. Apabila anda melaporkan laman, mematikan Nocti untuk sesuatu laman, membetulkan pengesanan laman gelap untuk laman itu atau melaraskan warnanya, domain laman itu disertakan (contohnya example.com, tidak sekali-kali alamat penuh), dan laporan juga menyertakan nota yang anda tulis. Sejarah pelayaran anda, alamat penuh halaman, kandungan halaman dan apa-apa sahaja yang mengenal pasti anda tidak sekali-kali disertakan. Perkongsian dihidupkan secara lalai, dan anda boleh mematikannya pada bila-bila masa di Seting → Perihal → Dasar Privasi. Mulai saat itu tiada apa-apa dihantar, dan acara yang masih menunggu untuk dihantar akan dipadamkan.", "t5": "5. Siapa yang memproses data ini", "b5": "PostHog memproses acara ini bagi pihak kami, pada pelayan di Amerika Syarikat. Satu-satunya pengecam ialah ID rawak yang dicipta pada peranti ini dan dikongsi oleh App dan sambungan. Ia tidak dipautkan kepada Akaun Apple anda, pengecam pengiklanan peranti anda atau mana-mana identiti lain. Kami tidak membina profil pengguna, tidak merakam sesi atau skrin, dan tidak menyimpan alamat IP anda atau menggunakannya untuk mencari lokasi anda. Data ini tidak digunakan untuk pengiklanan, tidak dijual atau dikongsi dengan sesiapa pun, dan tidak digunakan untuk menjejaki anda merentas app atau laman web.", "t6": "6. Permintaan rangkaian", "b6": "Selain data penggunaan tanpa nama yang diterangkan di atas, sambungan hanya memuat turun helaian gaya dan imej yang sudah digunakan oleh halaman, supaya ia boleh menggayakannya semula. Apabila anda mengetik Semak Kemas Kini, App bertanya kepada perkhidmatan App Store awam Apple tentang nombor versi terkini. Permintaan itu dihantar kepada Apple, bukan kepada kami.", "t7": "7. Pembelian", "b7": "Pembelian diselesaikan oleh Apple melalui App Store. Kaedah pembayaran dan butiran Akaun Apple anda dikendalikan oleh Apple, dan kami tidak dapat melihatnya.", "t8": "8. E-mel maklum balas", "b8": "Jika anda menghantar e-mel kepada kami, kami menerima apa yang anda tulis serta versi app, versi sistem dan model peranti yang telah diisi dalam e-mel, yang boleh anda padam sebelum menghantar. Kami menggunakannya hanya untuk membalas anda dan membaiki masalah.", "t9": "9. Privasi kanak-kanak", "b9": "App tidak secara sedar mengumpul sebarang maklumat daripada kanak-kanak di bawah umur 13 tahun.", "t10": "10. Perubahan pada dasar ini", "b10": "Jika dasar ini berubah, kami akan menyiarkan versi baharu di halaman ini dan mengemas kini tarikh berkuat kuasa."}, "nb": {"title": "Nocti · Personvernerklæring", "h1": "Personvernerklæring", "back": "Tilbake", "eff": "Gjelder fra: 21. oktober 2026", "intro": "Nocti («appen») er en Safari-utvidelse som gjør nettsider mørke på enheten din. Du trenger ingen konto, og ingenting du surfer på, når noen gang frem til oss. Disse retningslinjene forklarer nøyaktig hvordan appen håndterer informasjonen din.", "contact_t": "11. Kontakt oss", "contact_l": "Hvis du har spørsmål om disse retningslinjene, kan du kontakte:", "t1": "1. Hva vi ikke samler inn", "b1": "Appen har ingen registrering eller pålogging. Den samler ikke inn navnet, e-postadressen, posisjonen eller kontaktene dine, og den samler aldri inn nettleserloggen din, de fullstendige adressene til sidene du besøker, eller innholdet deres.", "t2": "2. Slik fungerer utvidelsen", "b2": "Utvidelsen kjører i Safari på enheten din. Den leser fargene på en side bare for å gi dem en mørk stil, rett der i Safari. Sideinnhold blir aldri kopiert, lagret eller sendt noe sted.", "t3": "3. Hvor innstillingene dine lagres", "b3": "Temaet ditt, dempingsvalg, nettstedjusteringer og listen over nettsteder der du har slått av Nocti, lagres på denne enheten. Bortsett fra de anonyme bruksdataene som er beskrevet nedenfor, lastes de ikke opp til oss eller til noen tredjepart.", "t4": "4. Anonyme bruksdata", "b4": "For å finne ut hvilke funksjoner folk bruker, og hvilke nettsteder som må fikses, sender appen og utvidelsen et lite sett med anonyme hendelser. Hver hendelse er et fast hendelsesnavn med noen få detaljer, for eksempel temaet du valgte, modusen du byttet til, eller prisen og valutaen for et kjøp. Antall, for eksempel hvor mange egendefinerte temaer eller nettstedsregler du har, sendes bare som intervaller (for eksempel 2–5), slik at et nøyaktig tall ikke kan bli et fingeravtrykk. Hver hendelse inneholder også appversjonen, operativsystemet og versjonen av det, foretrukket språk og om Pro er låst opp. Når du rapporterer et nettsted, slår av Nocti for et nettsted, korrigerer gjenkjenning av mørke nettsteder for det eller justerer fargene, tas domenet til nettstedet med (for eksempel example.com, aldri hele adressen), og en rapport inneholder også notatet du skriver. Nettleserloggen din, fullstendige sideadresser, sideinnhold og alt som identifiserer deg, tas aldri med. Deling er slått på som standard, og du kan når som helst slå det av under Innstillinger → Om → Personvernerklæring. Fra da av sendes ingenting, og hendelser som fortsatt venter på å bli sendt, slettes.", "t5": "5. Hvem som behandler disse dataene", "b5": "PostHog behandler disse hendelsene på våre vegne, på servere i USA. Den eneste identifikatoren er en tilfeldig ID som opprettes på denne enheten og deles av appen og utvidelsen. Den er ikke knyttet til Apple-kontoen din, enhetens reklame-ID eller noen annen identitet. Vi lager ikke brukerprofiler, tar ikke opp økter eller skjermer, og lagrer ikke IP-adressen din eller bruker den til å finne posisjonen din. Dataene brukes ikke til reklame, selges ikke eller deles ikke med andre, og brukes ikke til å spore deg på tvers av apper eller nettsteder.", "t6": "6. Nettverksforespørsler", "b6": "Bortsett fra de anonyme bruksdataene som er beskrevet over, laster utvidelsen bare ned stilarkene og bildene en side allerede bruker, slik at den kan gi dem ny stil. Når du trykker på Se etter oppdateringer, spør appen Apples offentlige App Store-tjeneste om det nyeste versjonsnummeret. Den forespørselen går til Apple, ikke til oss.", "t7": "7. Kjøp", "b7": "Kjøp gjennomføres av Apple via App Store. Betalingsmåten og Apple-kontoopplysningene dine håndteres av Apple, og vi kan ikke se dem.", "t8": "8. E-post med tilbakemeldinger", "b8": "Hvis du sender oss e-post, mottar vi det du skriver, pluss appversjon, systemversjon og enhetsmodell som er fylt inn på forhånd i e-posten – disse kan du slette før du sender. Vi bruker det bare til å svare deg og løse problemer.", "t9": "9. Barns personvern", "b9": "Appen samler ikke bevisst inn informasjon fra barn under 13 år.", "t10": "10. Endringer i disse retningslinjene", "b10": "Hvis disse retningslinjene endres, publiserer vi den nye versjonen på denne siden og oppdaterer ikrafttredelsesdatoen."}, "nl": {"title": "Nocti · Privacybeleid", "h1": "Privacybeleid", "back": "Terug", "eff": "Ingangsdatum: 21 oktober 2026", "intro": "Nocti (‘de app’) is een Safari-extensie die webpagina's op je apparaat donker maakt. Je hebt geen account nodig en niets van wat je bekijkt bereikt ons. Dit beleid legt precies uit hoe de app met je gegevens omgaat.", "contact_t": "11. Contact", "contact_l": "Heb je vragen over dit beleid, neem dan contact op via:", "t1": "1. Wat we niet verzamelen", "b1": "De app heeft geen registratie of inlog. Hij verzamelt niet je naam, e-mailadres, locatie of contacten, en nooit je browsegeschiedenis, de volledige adressen van pagina's die je bezoekt of hun inhoud.", "t2": "2. Hoe de extensie werkt", "b2": "De extensie draait in Safari op je apparaat. Hij leest de kleuren van een pagina alleen om ze ter plekke in Safari in donkere kleuren om te zetten. Pagina-inhoud wordt nooit gekopieerd, bewaard of ergens naartoe gestuurd.", "t3": "3. Waar je instellingen worden bewaard", "b3": "Je thema, dimopties, siteaanpassingen en de lijst met sites waarop je Nocti hebt uitgezet, worden op dit apparaat bewaard. Afgezien van de hieronder beschreven anonieme gebruiksgegevens worden ze niet naar ons of naar derden geüpload.", "t4": "4. Anonieme gebruiksgegevens", "b4": "Om te weten welke functies worden gebruikt en welke sites aangepast moeten worden, versturen de app en de extensie een kleine set anonieme gebeurtenissen. Elke gebeurtenis is een vaste naam met een paar details, zoals het thema dat je koos, de modus waarnaar je overschakelde, of de prijs en valuta van een aankoop. Aantallen, zoals hoeveel eigen thema's of siteregels je hebt, worden alleen als bereik verstuurd (bijvoorbeeld 2–5), zodat een exact getal geen vingerafdruk kan worden. Elke gebeurtenis bevat ook de appversie, het besturingssysteem en de versie daarvan, je voorkeurstaal en of Pro is ontgrendeld. Als je een site meldt, Nocti voor een site uitzet, de herkenning van donkere sites voor die site corrigeert of de kleuren ervan aanpast, wordt het domein van de site meegestuurd (bijvoorbeeld example.com, nooit het volledige adres), en een melding bevat ook de notitie die je schrijft. Je browsegeschiedenis, volledige paginaadressen, pagina-inhoud en alles waarmee je kunt worden geïdentificeerd, worden nooit meegestuurd. Delen staat standaard aan en je kunt het op elk moment uitzetten via Instellingen → Over → Privacybeleid. Vanaf dat moment wordt er niets meer verstuurd en worden gebeurtenissen die nog verstuurd moesten worden verwijderd.", "t5": "5. Wie deze gegevens verwerkt", "b5": "PostHog verwerkt deze gebeurtenissen namens ons, op servers in de Verenigde Staten. De enige identificatie is een willekeurige ID die op dit apparaat is aangemaakt en door de app en de extensie wordt gedeeld. Die is niet gekoppeld aan je Apple Account, de advertentie-ID van je apparaat of een andere identiteit. We maken geen gebruikersprofielen, nemen geen sessies of schermen op, en bewaren je IP-adres niet en gebruiken het ook niet om je locatie te bepalen. De gegevens worden niet gebruikt voor advertenties, worden niet verkocht of met anderen gedeeld en worden niet gebruikt om je te volgen in apps of op websites.", "t6": "6. Netwerkverzoeken", "b6": "Afgezien van de hierboven beschreven anonieme gebruiksgegevens downloadt de extensie alleen de stylesheets en afbeeldingen die een pagina zelf al gebruikt, zodat ze kunnen worden aangepast. Als je op ‘Zoek naar updates’ tikt, vraagt de app de openbare App Store-dienst van Apple om het nieuwste versienummer. Dat verzoek gaat naar Apple, niet naar ons.", "t7": "7. Aankopen", "b7": "Aankopen worden door Apple via de App Store afgehandeld. Je betaalmethode en de gegevens van je Apple Account worden door Apple verwerkt en die kunnen wij niet zien.", "t8": "8. Feedbackmails", "b8": "Als je ons mailt, ontvangen we wat je schrijft plus de app-versie, systeemversie en het apparaatmodel die vooraf in de e-mail zijn ingevuld. Die kun je vóór het versturen verwijderen. We gebruiken dit alleen om je te antwoorden en problemen op te lossen.", "t9": "9. Privacy van kinderen", "b9": "De app verzamelt niet bewust gegevens van kinderen jonger dan 13 jaar.", "t10": "10. Wijzigingen in dit beleid", "b10": "Als dit beleid verandert, plaatsen we de nieuwe versie op deze pagina en werken we de ingangsdatum bij."}, "or": {"title": "Nocti · ଗୋପନୀୟତା ନୀତି", "h1": "ଗୋପନୀୟତା ନୀତି", "back": "ପଛକୁ", "eff": "ପ୍ରଭାବୀ ତାରିଖ: 21 ଅକ୍ଟୋବର 2026", "intro": "Nocti (\"ଆପ୍\") ଏକ Safari ଏକ୍ସଟେନସନ୍ ଯାହା ଆପଣଙ୍କ ଡିଭାଇସରେ ୱେବ୍ ପେଜକୁ ଡାର୍କ କରେ। ଆପଣଙ୍କୁ କୌଣସି ଆକାଉଣ୍ଟ ଦରକାର ନାହିଁ, ଏବଂ ଆପଣ ଯାହା ବ୍ରାଉଜ୍ କରନ୍ତି ତାହା କେବେ ବି ଆମ ପାଖରେ ପହଞ୍ଚେ ନାହିଁ। ଆପ୍ ଆପଣଙ୍କ ସୂଚନାକୁ କିପରି ପରିଚାଳନା କରେ, ଏହି ନୀତି ତାହା ସଠିକ୍ ଭାବେ ବୁଝାଏ।", "contact_t": "11. ଆମ ସହ ଯୋଗାଯୋଗ କରନ୍ତୁ", "contact_l": "ଏହି ନୀତି ବିଷୟରେ କୌଣସି ପ୍ରଶ୍ନ ଥିଲେ, ଯୋଗାଯୋଗ କରନ୍ତୁ:", "t1": "1. ଆମେ କ’ଣ ସଂଗ୍ରହ କରୁନାହୁଁ", "b1": "ଆପରେ କୌଣସି ସାଇନ୍ ଅପ୍ କିମ୍ବା ଲଗଇନ୍ ନାହିଁ। ଏହା ଆପଣଙ୍କ ନାମ, ଇମେଲ୍, ଲୋକେସନ୍ କିମ୍ବା କଣ୍ଟାକ୍ଟ ସଂଗ୍ରହ କରେ ନାହିଁ, ଏବଂ କେବେ ବି ଆପଣଙ୍କ ବ୍ରାଉଜିଂ ଇତିହାସ, ଆପଣ ଦେଖୁଥିବା ପେଜର ସମ୍ପୂର୍ଣ୍ଣ ଠିକଣା କିମ୍ବା ସେଗୁଡ଼ିକର ବିଷୟବସ୍ତୁ ସଂଗ୍ରହ କରେ ନାହିଁ।", "t2": "2. ଏକ୍ସଟେନସନ୍ କିପରି କାମ କରେ", "b2": "ଏକ୍ସଟେନସନ୍ ଆପଣଙ୍କ ଡିଭାଇସରେ Safari ଭିତରେ ଚାଲେ। ଏହା ପେଜର ରଙ୍ଗ କେବଳ ସେଗୁଡ଼ିକୁ ଡାର୍କ ରଙ୍ଗରେ ନୂଆ ରୂପ ଦେବା ପାଇଁ ପଢ଼େ, ସେଇଠି Safariରେ। ପେଜ୍ ବିଷୟବସ୍ତୁ କେବେ ବି କପି, ସେଭ୍ କିମ୍ବା କୁଆଡ଼େ ପଠାଯାଏ ନାହିଁ।", "t3": "3. ଆପଣଙ୍କ ସେଟିଂସ କେଉଁଠି ସଂରକ୍ଷିତ ହୁଏ", "b3": "ଆପଣଙ୍କ ଥିମ୍, ଡିମିଂ ବିକଳ୍ପ, ସାଇଟ୍ ସମାଧାନ ଏବଂ ଆପଣ Nocti ବନ୍ଦ କରିଥିବା ସାଇଟଗୁଡ଼ିକର ତାଲିକା ଏହି ଡିଭାଇସରେ ସେଭ୍ ହୁଏ। ତଳେ ବର୍ଣ୍ଣିତ ଅଜ୍ଞାତ ବ୍ୟବହାର ଡାଟା ବ୍ୟତୀତ, ସେଗୁଡ଼ିକ ଆମ ପାଖକୁ କିମ୍ବା କୌଣସି ତୃତୀୟ ପକ୍ଷକୁ ଅପଲୋଡ୍ ହୁଏ ନାହିଁ।", "t4": "4. ଅଜ୍ଞାତ ବ୍ୟବହାର ଡାଟା", "b4": "ଲୋକମାନେ କେଉଁ ଫିଚର୍ ବ୍ୟବହାର କରନ୍ତି ଏବଂ କେଉଁ ସାଇଟ୍ ଠିକ୍ କରିବା ଦରକାର ତାହା ଜାଣିବା ପାଇଁ, ଆପ୍ ଏବଂ ଏକ୍ସଟେନସନ୍ ଅଳ୍ପ କିଛି ଅଜ୍ଞାତ ଇଭେଣ୍ଟ ପଠାନ୍ତି। ପ୍ରତ୍ୟେକ ଇଭେଣ୍ଟ ଏକ ନିର୍ଦ୍ଦିଷ୍ଟ ଇଭେଣ୍ଟ ନାମ ଏବଂ କିଛି ବିବରଣୀ, ଯେପରି ଆପଣ ବାଛିଥିବା ଥିମ୍, ଆପଣ ବଦଳାଇଥିବା ମୋଡ୍, କିମ୍ବା କୌଣସି କ୍ରୟର ମୂଲ୍ୟ ଏବଂ ମୁଦ୍ରା। ସଂଖ୍ୟା, ଯେପରି ଆପଣଙ୍କର କେତୋଟି କଷ୍ଟମ୍ ଥିମ୍ କିମ୍ବା ସାଇଟ୍ ନିୟମ ଅଛି, କେବଳ ପରିସର ଭାବେ ପଠାଯାଏ (ଉଦାହରଣ ସ୍ୱରୂପ 2–5), ଯାହାଦ୍ୱାରା ଏକ ସଠିକ୍ ସଂଖ୍ୟା ଫିଙ୍ଗରପ୍ରିଣ୍ଟ ହୋଇପାରିବ ନାହିଁ। ପ୍ରତ୍ୟେକ ଇଭେଣ୍ଟରେ ଆପ୍ ଭର୍ସନ୍, ଅପରେଟିଂ ସିଷ୍ଟମ୍ ଓ ତାହାର ଭର୍ସନ୍, ଆପଣଙ୍କ ପସନ୍ଦର ଭାଷା ଏବଂ Pro ଅନଲକ୍ ହୋଇଛି କି ନାହିଁ ତାହା ମଧ୍ୟ ଥାଏ। ଆପଣ କୌଣସି ସାଇଟ୍ ରିପୋର୍ଟ କଲେ, କୌଣସି ସାଇଟ୍ ପାଇଁ Nocti ବନ୍ଦ କଲେ, ତାହାର ଡାର୍କ ସାଇଟ୍ ଚିହ୍ନଟ ସଂଶୋଧନ କଲେ କିମ୍ବା ତାହାର ରଙ୍ଗ ସଜାଡ଼ିଲେ, ସାଇଟର ଡୋମେନ୍ ଅନ୍ତର୍ଭୁକ୍ତ ହୁଏ (ଉଦାହରଣ ସ୍ୱରୂପ example.com, କେବେ ବି ସମ୍ପୂର୍ଣ୍ଣ ଠିକଣା ନୁହେଁ), ଏବଂ ରିପୋର୍ଟରେ ଆପଣ ଲେଖିଥିବା ନୋଟ୍ ମଧ୍ୟ ଥାଏ। ଆପଣଙ୍କ ବ୍ରାଉଜିଂ ଇତିହାସ, ପେଜର ସମ୍ପୂର୍ଣ୍ଣ ଠିକଣା, ପେଜ୍ ବିଷୟବସ୍ତୁ ଏବଂ ଆପଣଙ୍କୁ ଚିହ୍ନଟ କରିପାରୁଥିବା କିଛି ବି କେବେ ଅନ୍ତର୍ଭୁକ୍ତ ହୁଏ ନାହିଁ। ସେୟାରିଂ ଡିଫଲ୍ଟ ଭାବେ ଚାଲୁ ଥାଏ, ଏବଂ ଆପଣ ଯେକୌଣସି ସମୟରେ ସେଟିଂସ → ବିଷୟରେ → ଗୋପନୀୟତା ନୀତି ରେ ଏହାକୁ ବନ୍ଦ କରିପାରିବେ। ସେହି ସମୟଠାରୁ କିଛି ବି ପଠାଯାଏ ନାହିଁ, ଏବଂ ପଠାଯିବା ପାଇଁ ଅପେକ୍ଷା କରୁଥିବା ଇଭେଣ୍ଟଗୁଡ଼ିକ ଡିଲିଟ୍ ହୋଇଯାଏ।", "t5": "5. ଏହି ଡାଟା କିଏ ପ୍ରକ୍ରିୟାକରଣ କରେ", "b5": "PostHog ଆମ ତରଫରୁ, ଯୁକ୍ତରାଷ୍ଟ୍ର ଆମେରିକାର ସର୍ଭରରେ ଏହି ଇଭେଣ୍ଟଗୁଡ଼ିକୁ ପ୍ରକ୍ରିୟାକରଣ କରେ। ଏକମାତ୍ର ଚିହ୍ନଟକାରୀ ହେଉଛି ଏହି ଡିଭାଇସରେ ସୃଷ୍ଟି ହୋଇଥିବା ଏକ ରାଣ୍ଡମ୍ ID, ଯାହାକୁ ଆପ୍ ଏବଂ ଏକ୍ସଟେନସନ୍ ମିଳିତ ଭାବେ ବ୍ୟବହାର କରନ୍ତି। ଏହା ଆପଣଙ୍କ Apple ଆକାଉଣ୍ଟ, ଆପଣଙ୍କ ଡିଭାଇସର ବିଜ୍ଞାପନ ଚିହ୍ନଟକାରୀ କିମ୍ବା ଅନ୍ୟ କୌଣସି ପରିଚୟ ସହିତ ଯୋଡ଼ା ହୋଇନାହିଁ। ଆମେ ୟୁଜର୍ ପ୍ରୋଫାଇଲ୍ ତିଆରି କରୁନାହୁଁ, ସେସନ୍ କିମ୍ବା ସ୍କ୍ରିନ୍ ରେକର୍ଡ କରୁନାହୁଁ, ଏବଂ ଆପଣଙ୍କ IP ଠିକଣା ସଂରକ୍ଷଣ କରୁନାହୁଁ କିମ୍ବା ଆପଣଙ୍କ ଲୋକେସନ୍ ଖୋଜିବା ପାଇଁ ତାହା ବ୍ୟବହାର କରୁନାହୁଁ। ଏହି ଡାଟା ବିଜ୍ଞାପନ ପାଇଁ ବ୍ୟବହୃତ ହୁଏ ନାହିଁ, ବିକ୍ରି କିମ୍ବା ଅନ୍ୟ କାହା ସହିତ ସେୟାର୍ କରାଯାଏ ନାହିଁ, ଏବଂ ଆପ୍ କିମ୍ବା ୱେବସାଇଟ୍ ମଧ୍ୟରେ ଆପଣଙ୍କୁ ଟ୍ରାକ୍ କରିବା ପାଇଁ ବ୍ୟବହୃତ ହୁଏ ନାହିଁ।", "t6": "6. ନେଟୱାର୍କ ଅନୁରୋଧ", "b6": "ଉପରେ ବର୍ଣ୍ଣିତ ଅଜ୍ଞାତ ବ୍ୟବହାର ଡାଟା ବ୍ୟତୀତ, ଏକ୍ସଟେନସନ୍ କେବଳ ସେହି ଷ୍ଟାଇଲସିଟ୍ ଏବଂ ଛବି ଡାଉନଲୋଡ୍ କରେ ଯାହା ପେଜ୍ ପୂର୍ବରୁ ବ୍ୟବହାର କରୁଛି, ଯାହାଦ୍ୱାରା ସେଗୁଡ଼ିକୁ ନୂଆ ରଙ୍ଗ ଦିଆଯାଇପାରିବ। ଆପଣ \"ଅପଡେଟ୍ ପାଇଁ ଯାଞ୍ଚ କରନ୍ତୁ\" ଟାପ୍ କଲେ, ଆପ୍ Appleର ସାର୍ବଜନୀନ App Store ସେବାରୁ ସର୍ବଶେଷ ଭର୍ସନ୍ ନମ୍ବର ପଚାରେ। ସେହି ଅନୁରୋଧ Appleକୁ ଯାଏ, ଆମ ପାଖକୁ ନୁହେଁ।", "t7": "7. କ୍ରୟ", "b7": "କ୍ରୟ Apple ଦ୍ୱାରା App Store ମାଧ୍ୟମରେ ସମ୍ପୂର୍ଣ୍ଣ ହୁଏ। ଆପଣଙ୍କ ପେମେଣ୍ଟ ପଦ୍ଧତି ଏବଂ Apple ଆକାଉଣ୍ଟ ବିବରଣୀ Apple ପରିଚାଳନା କରେ, ଏବଂ ଆମେ ସେଗୁଡ଼ିକ ଦେଖିପାରୁନାହୁଁ।", "t8": "8. ମତାମତ ଇମେଲ୍", "b8": "ଯଦି ଆପଣ ଆମକୁ ଇମେଲ୍ କରନ୍ତି, ଆମେ ଆପଣ ଯାହା ଲେଖନ୍ତି ତାହା ସହ ଇମେଲରେ ପୂର୍ବରୁ ଭରାଯାଇଥିବା ଆପ୍ ଭର୍ସନ୍, ସିଷ୍ଟମ୍ ଭର୍ସନ୍ ଏବଂ ଡିଭାଇସ୍ ମଡେଲ୍ ପାଉ, ଯାହା ଆପଣ ପଠାଇବା ପୂର୍ବରୁ ଡିଲିଟ୍ କରିପାରିବେ। ଆମେ ଏହାକୁ କେବଳ ଆପଣଙ୍କୁ ଉତ୍ତର ଦେବା ଏବଂ ସମସ୍ୟା ଠିକ୍ କରିବା ପାଇଁ ବ୍ୟବହାର କରୁ।", "t9": "9. ପିଲାମାନଙ୍କ ଗୋପନୀୟତା", "b9": "ଆପ୍ ଜାଣିଶୁଣି 13 ବର୍ଷରୁ କମ୍ ବୟସର ପିଲାଙ୍କଠାରୁ କୌଣସି ସୂଚନା ସଂଗ୍ରହ କରେ ନାହିଁ।", "t10": "10. ଏହି ନୀତିରେ ପରିବର୍ତ୍ତନ", "b10": "ଯଦି ଏହି ନୀତି ବଦଳେ, ଆମେ ନୂଆ ଭର୍ସନ୍ ଏହି ପେଜରେ ପୋଷ୍ଟ କରିବୁ ଏବଂ ପ୍ରଭାବୀ ତାରିଖ ଅପଡେଟ୍ କରିବୁ।"}, "pa": {"title": "Nocti · ਪਰਦੇਦਾਰੀ ਨੀਤੀ", "h1": "ਪਰਦੇਦਾਰੀ ਨੀਤੀ", "back": "ਪਿੱਛੇ", "eff": "ਲਾਗੂ ਹੋਣ ਦੀ ਮਿਤੀ: 21 ਅਕਤੂਬਰ, 2026", "intro": "Nocti (“ਐਪ”) ਇੱਕ Safari ਐਕਸਟੈਂਸ਼ਨ ਹੈ ਜੋ ਤੁਹਾਡੇ ਡੀਵਾਈਸ ’ਤੇ ਵੈੱਬ ਪੰਨਿਆਂ ਨੂੰ ਡਾਰਕ ਕਰਦੀ ਹੈ। ਤੁਹਾਨੂੰ ਕਿਸੇ ਖਾਤੇ ਦੀ ਲੋੜ ਨਹੀਂ, ਅਤੇ ਤੁਸੀਂ ਜੋ ਵੀ ਬ੍ਰਾਊਜ਼ ਕਰਦੇ ਹੋ ਉਸ ਵਿੱਚੋਂ ਕੁਝ ਵੀ ਸਾਡੇ ਤੱਕ ਨਹੀਂ ਪਹੁੰਚਦਾ। ਇਹ ਨੀਤੀ ਸਪਸ਼ਟ ਦੱਸਦੀ ਹੈ ਕਿ ਐਪ ਤੁਹਾਡੀ ਜਾਣਕਾਰੀ ਨੂੰ ਕਿਵੇਂ ਸੰਭਾਲਦੀ ਹੈ।", "contact_t": "11. ਸਾਡੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ", "contact_l": "ਇਸ ਨੀਤੀ ਬਾਰੇ ਕੋਈ ਸਵਾਲ ਹੋਵੇ ਤਾਂ ਸੰਪਰਕ ਕਰੋ:", "t1": "1. ਅਸੀਂ ਕੀ ਇਕੱਠਾ ਨਹੀਂ ਕਰਦੇ", "b1": "ਐਪ ਵਿੱਚ ਕੋਈ ਸਾਈਨ-ਅੱਪ ਜਾਂ ਲੌਗਇਨ ਨਹੀਂ ਹੈ। ਇਹ ਤੁਹਾਡਾ ਨਾਮ, ਈਮੇਲ, ਟਿਕਾਣਾ ਜਾਂ ਸੰਪਰਕ ਇਕੱਠੇ ਨਹੀਂ ਕਰਦੀ, ਅਤੇ ਕਦੇ ਵੀ ਤੁਹਾਡਾ ਬ੍ਰਾਊਜ਼ਿੰਗ ਇਤਿਹਾਸ, ਤੁਹਾਡੇ ਵੱਲੋਂ ਖੋਲ੍ਹੇ ਪੰਨਿਆਂ ਦੇ ਪੂਰੇ ਪਤੇ ਜਾਂ ਉਹਨਾਂ ਦੀ ਸਮੱਗਰੀ ਇਕੱਠੀ ਨਹੀਂ ਕਰਦੀ।", "t2": "2. ਐਕਸਟੈਂਸ਼ਨ ਕਿਵੇਂ ਕੰਮ ਕਰਦੀ ਹੈ", "b2": "ਐਕਸਟੈਂਸ਼ਨ ਤੁਹਾਡੇ ਡੀਵਾਈਸ ’ਤੇ Safari ਦੇ ਅੰਦਰ ਚੱਲਦੀ ਹੈ। ਇਹ ਪੰਨੇ ਦੇ ਰੰਗ ਸਿਰਫ਼ ਉਹਨਾਂ ਨੂੰ ਡਾਰਕ ਰੰਗਾਂ ਵਿੱਚ ਬਦਲਣ ਲਈ ਪੜ੍ਹਦੀ ਹੈ, ਉੱਥੇ Safari ਵਿੱਚ ਹੀ। ਪੰਨੇ ਦੀ ਸਮੱਗਰੀ ਕਦੇ ਵੀ ਕਾਪੀ, ਸਟੋਰ ਜਾਂ ਕਿਤੇ ਭੇਜੀ ਨਹੀਂ ਜਾਂਦੀ।", "t3": "3. ਤੁਹਾਡੀਆਂ ਸੈਟਿੰਗਾਂ ਕਿੱਥੇ ਸਟੋਰ ਹੁੰਦੀਆਂ ਹਨ", "b3": "ਤੁਹਾਡੀ ਥੀਮ, ਮੱਧਮ ਕਰਨ ਦੇ ਵਿਕਲਪ, ਸਾਈਟ ਫਿਕਸ ਅਤੇ ਉਹਨਾਂ ਸਾਈਟਾਂ ਦੀ ਸੂਚੀ ਜਿਨ੍ਹਾਂ ਲਈ ਤੁਸੀਂ Nocti ਬੰਦ ਕੀਤਾ ਹੈ, ਇਸ ਡੀਵਾਈਸ ’ਤੇ ਸੁਰੱਖਿਅਤ ਹੁੰਦੇ ਹਨ। ਹੇਠਾਂ ਦੱਸੇ ਅਗਿਆਤ ਵਰਤੋਂ ਡਾਟਾ ਤੋਂ ਇਲਾਵਾ, ਇਹ ਸਾਡੇ ਕੋਲ ਜਾਂ ਕਿਸੇ ਤੀਜੀ ਧਿਰ ਕੋਲ ਅੱਪਲੋਡ ਨਹੀਂ ਕੀਤੇ ਜਾਂਦੇ।", "t4": "4. ਅਗਿਆਤ ਵਰਤੋਂ ਡਾਟਾ", "b4": "ਇਹ ਜਾਣਨ ਲਈ ਕਿ ਲੋਕ ਕਿਹੜੀਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਵਰਤਦੇ ਹਨ ਅਤੇ ਕਿਹੜੀਆਂ ਸਾਈਟਾਂ ਨੂੰ ਸੁਧਾਰਨ ਦੀ ਲੋੜ ਹੈ, ਐਪ ਅਤੇ ਐਕਸਟੈਂਸ਼ਨ ਕੁਝ ਅਗਿਆਤ ਇਵੈਂਟ ਭੇਜਦੇ ਹਨ। ਹਰ ਇਵੈਂਟ ਇੱਕ ਨਿਸ਼ਚਿਤ ਇਵੈਂਟ ਨਾਮ ਅਤੇ ਕੁਝ ਵੇਰਵੇ ਹੁੰਦਾ ਹੈ, ਜਿਵੇਂ ਤੁਹਾਡੀ ਚੁਣੀ ਥੀਮ, ਤੁਹਾਡੇ ਵੱਲੋਂ ਬਦਲਿਆ ਮੋਡ, ਜਾਂ ਕਿਸੇ ਖਰੀਦ ਦੀ ਕੀਮਤ ਅਤੇ ਮੁਦਰਾ। ਗਿਣਤੀਆਂ, ਜਿਵੇਂ ਤੁਹਾਡੇ ਕੋਲ ਕਿੰਨੀਆਂ ਕਸਟਮ ਥੀਮਾਂ ਜਾਂ ਸਾਈਟ ਨਿਯਮ ਹਨ, ਸਿਰਫ਼ ਦਾਇਰਿਆਂ ਵਜੋਂ ਭੇਜੀਆਂ ਜਾਂਦੀਆਂ ਹਨ (ਉਦਾਹਰਨ ਲਈ 2–5), ਤਾਂ ਜੋ ਕੋਈ ਸਹੀ ਸੰਖਿਆ ਫਿੰਗਰਪ੍ਰਿੰਟ ਨਾ ਬਣ ਸਕੇ। ਹਰ ਇਵੈਂਟ ਵਿੱਚ ਐਪ ਵਰਜਨ, ਓਪਰੇਟਿੰਗ ਸਿਸਟਮ ਅਤੇ ਉਸਦਾ ਵਰਜਨ, ਤੁਹਾਡੀ ਪਸੰਦੀਦਾ ਭਾਸ਼ਾ ਅਤੇ Pro ਅਨਲੌਕ ਹੈ ਜਾਂ ਨਹੀਂ, ਇਹ ਵੀ ਸ਼ਾਮਲ ਹੁੰਦਾ ਹੈ। ਜਦੋਂ ਤੁਸੀਂ ਕਿਸੇ ਸਾਈਟ ਦੀ ਰਿਪੋਰਟ ਕਰਦੇ ਹੋ, ਕਿਸੇ ਸਾਈਟ ਲਈ Nocti ਬੰਦ ਕਰਦੇ ਹੋ, ਉਸਦੀ ਡਾਰਕ ਸਾਈਟਾਂ ਦੀ ਪਛਾਣ ਠੀਕ ਕਰਦੇ ਹੋ ਜਾਂ ਉਸਦੇ ਰੰਗ ਅਡਜਸਟ ਕਰਦੇ ਹੋ, ਤਾਂ ਸਾਈਟ ਦਾ ਡੋਮੇਨ ਸ਼ਾਮਲ ਹੁੰਦਾ ਹੈ (ਉਦਾਹਰਨ ਲਈ example.com, ਪੂਰਾ ਪਤਾ ਕਦੇ ਨਹੀਂ), ਅਤੇ ਰਿਪੋਰਟ ਵਿੱਚ ਤੁਹਾਡਾ ਲਿਖਿਆ ਨੋਟ ਵੀ ਸ਼ਾਮਲ ਹੁੰਦਾ ਹੈ। ਤੁਹਾਡਾ ਬ੍ਰਾਊਜ਼ਿੰਗ ਇਤਿਹਾਸ, ਪੰਨਿਆਂ ਦੇ ਪੂਰੇ ਪਤੇ, ਪੰਨੇ ਦੀ ਸਮੱਗਰੀ ਅਤੇ ਕੁਝ ਵੀ ਜੋ ਤੁਹਾਡੀ ਪਛਾਣ ਕਰ ਸਕੇ, ਕਦੇ ਸ਼ਾਮਲ ਨਹੀਂ ਹੁੰਦਾ। ਸਾਂਝਾ ਕਰਨਾ ਪੂਰਵ-ਨਿਰਧਾਰਿਤ ਤੌਰ ’ਤੇ ਚਾਲੂ ਹੁੰਦਾ ਹੈ, ਅਤੇ ਤੁਸੀਂ ਇਸਨੂੰ ਕਦੇ ਵੀ ਸੈਟਿੰਗਾਂ → ਇਸ ਬਾਰੇ → ਪਰਦੇਦਾਰੀ ਨੀਤੀ ਵਿੱਚ ਬੰਦ ਕਰ ਸਕਦੇ ਹੋ। ਉਸ ਤੋਂ ਬਾਅਦ ਕੁਝ ਨਹੀਂ ਭੇਜਿਆ ਜਾਂਦਾ, ਅਤੇ ਜੋ ਇਵੈਂਟ ਅਜੇ ਭੇਜੇ ਜਾਣ ਦੀ ਉਡੀਕ ਵਿੱਚ ਹਨ ਉਹ ਮਿਟਾ ਦਿੱਤੇ ਜਾਂਦੇ ਹਨ।", "t5": "5. ਇਸ ਡਾਟੇ ’ਤੇ ਕਾਰਵਾਈ ਕੌਣ ਕਰਦਾ ਹੈ", "b5": "PostHog ਸਾਡੇ ਵੱਲੋਂ, ਸੰਯੁਕਤ ਰਾਜ ਅਮਰੀਕਾ ਵਿੱਚ ਸਥਿਤ ਸਰਵਰਾਂ ’ਤੇ ਇਹਨਾਂ ਇਵੈਂਟਾਂ ’ਤੇ ਕਾਰਵਾਈ ਕਰਦਾ ਹੈ। ਇੱਕੋ-ਇੱਕ ਪਛਾਣਕਰਤਾ ਇਸ ਡੀਵਾਈਸ ’ਤੇ ਬਣਾਈ ਗਈ ਇੱਕ ਬੇਤਰਤੀਬ ID ਹੈ, ਜਿਸਨੂੰ ਐਪ ਅਤੇ ਐਕਸਟੈਂਸ਼ਨ ਸਾਂਝੇ ਤੌਰ ’ਤੇ ਵਰਤਦੇ ਹਨ। ਇਹ ਤੁਹਾਡੇ Apple ਖਾਤੇ, ਤੁਹਾਡੇ ਡੀਵਾਈਸ ਦੇ ਇਸ਼ਤਿਹਾਰ ਪਛਾਣਕਰਤਾ ਜਾਂ ਕਿਸੇ ਹੋਰ ਪਛਾਣ ਨਾਲ ਨਹੀਂ ਜੁੜੀ। ਅਸੀਂ ਵਰਤੋਂਕਾਰ ਪ੍ਰੋਫਾਈਲਾਂ ਨਹੀਂ ਬਣਾਉਂਦੇ, ਸੈਸ਼ਨ ਜਾਂ ਸਕ੍ਰੀਨਾਂ ਰਿਕਾਰਡ ਨਹੀਂ ਕਰਦੇ, ਅਤੇ ਤੁਹਾਡਾ IP ਪਤਾ ਸਟੋਰ ਨਹੀਂ ਕਰਦੇ ਜਾਂ ਤੁਹਾਡਾ ਟਿਕਾਣਾ ਲੱਭਣ ਲਈ ਉਸਨੂੰ ਨਹੀਂ ਵਰਤਦੇ। ਇਹ ਡਾਟਾ ਇਸ਼ਤਿਹਾਰਾਂ ਲਈ ਨਹੀਂ ਵਰਤਿਆ ਜਾਂਦਾ, ਨਾ ਵੇਚਿਆ ਜਾਂਦਾ ਹੈ ਨਾ ਕਿਸੇ ਹੋਰ ਨਾਲ ਸਾਂਝਾ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਨਾ ਹੀ ਐਪਾਂ ਜਾਂ ਵੈੱਬਸਾਈਟਾਂ ਵਿੱਚ ਤੁਹਾਨੂੰ ਟਰੈਕ ਕਰਨ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ।", "t6": "6. ਨੈੱਟਵਰਕ ਬੇਨਤੀਆਂ", "b6": "ਉੱਪਰ ਦੱਸੇ ਅਗਿਆਤ ਵਰਤੋਂ ਡਾਟਾ ਤੋਂ ਇਲਾਵਾ, ਐਕਸਟੈਂਸ਼ਨ ਸਿਰਫ਼ ਉਹੀ ਸਟਾਈਲਸ਼ੀਟਾਂ ਅਤੇ ਚਿੱਤਰ ਡਾਊਨਲੋਡ ਕਰਦੀ ਹੈ ਜੋ ਪੰਨਾ ਪਹਿਲਾਂ ਹੀ ਵਰਤਦਾ ਹੈ, ਤਾਂ ਜੋ ਉਹਨਾਂ ਨੂੰ ਨਵੀਂ ਸਟਾਈਲ ਦਿੱਤੀ ਜਾ ਸਕੇ। ਜਦੋਂ ਤੁਸੀਂ “ਅੱਪਡੇਟ ਲਈ ਜਾਂਚ ਕਰੋ” ’ਤੇ ਟੈਪ ਕਰਦੇ ਹੋ, ਤਾਂ ਐਪ ਨਵੀਨਤਮ ਵਰਜਨ ਨੰਬਰ ਲਈ Apple ਦੀ ਜਨਤਕ App Store ਸੇਵਾ ਤੋਂ ਪੁੱਛਦੀ ਹੈ। ਉਹ ਬੇਨਤੀ Apple ਕੋਲ ਜਾਂਦੀ ਹੈ, ਸਾਡੇ ਕੋਲ ਨਹੀਂ।", "t7": "7. ਖਰੀਦਾਂ", "b7": "ਖਰੀਦਾਂ Apple ਵੱਲੋਂ App Store ਰਾਹੀਂ ਪੂਰੀਆਂ ਕੀਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ। ਤੁਹਾਡਾ ਭੁਗਤਾਨ ਤਰੀਕਾ ਅਤੇ Apple ਖਾਤੇ ਦੇ ਵੇਰਵੇ Apple ਸੰਭਾਲਦਾ ਹੈ, ਅਤੇ ਅਸੀਂ ਉਹਨਾਂ ਨੂੰ ਨਹੀਂ ਦੇਖ ਸਕਦੇ।", "t8": "8. ਫੀਡਬੈਕ ਈਮੇਲਾਂ", "b8": "ਜੇ ਤੁਸੀਂ ਸਾਨੂੰ ਈਮੇਲ ਕਰਦੇ ਹੋ, ਤਾਂ ਸਾਨੂੰ ਤੁਹਾਡਾ ਲਿਖਿਆ ਹੋਇਆ ਅਤੇ ਈਮੇਲ ਵਿੱਚ ਪਹਿਲਾਂ ਤੋਂ ਭਰਿਆ ਐਪ ਵਰਜਨ, ਸਿਸਟਮ ਵਰਜਨ ਅਤੇ ਡੀਵਾਈਸ ਮਾਡਲ ਮਿਲਦਾ ਹੈ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਤੁਸੀਂ ਭੇਜਣ ਤੋਂ ਪਹਿਲਾਂ ਮਿਟਾ ਸਕਦੇ ਹੋ। ਅਸੀਂ ਇਹਨਾਂ ਨੂੰ ਸਿਰਫ਼ ਤੁਹਾਨੂੰ ਜਵਾਬ ਦੇਣ ਅਤੇ ਸਮੱਸਿਆਵਾਂ ਠੀਕ ਕਰਨ ਲਈ ਵਰਤਦੇ ਹਾਂ।", "t9": "9. ਬੱਚਿਆਂ ਦੀ ਪਰਦੇਦਾਰੀ", "b9": "ਐਪ ਜਾਣ-ਬੁੱਝ ਕੇ 13 ਸਾਲ ਤੋਂ ਘੱਟ ਉਮਰ ਦੇ ਬੱਚਿਆਂ ਤੋਂ ਕੋਈ ਜਾਣਕਾਰੀ ਇਕੱਠੀ ਨਹੀਂ ਕਰਦੀ।", "t10": "10. ਇਸ ਨੀਤੀ ਵਿੱਚ ਬਦਲਾਅ", "b10": "ਜੇ ਇਹ ਨੀਤੀ ਬਦਲਦੀ ਹੈ, ਤਾਂ ਅਸੀਂ ਨਵਾਂ ਵਰਜਨ ਇਸ ਪੰਨੇ ’ਤੇ ਪਾਵਾਂਗੇ ਅਤੇ ਲਾਗੂ ਹੋਣ ਦੀ ਮਿਤੀ ਅੱਪਡੇਟ ਕਰਾਂਗੇ।"}, "pl": {"title": "Nocti · Polityka prywatności", "h1": "Polityka prywatności", "back": "Wstecz", "eff": "Data wejścia w życie: 21 października 2026 r.", "intro": "Nocti („Aplikacja”) to rozszerzenie Safari, które przyciemnia strony internetowe na Twoim urządzeniu. Nie potrzebujesz konta, a nic z tego, co przeglądasz, nigdy do nas nie trafia. Ta polityka dokładnie wyjaśnia, jak Aplikacja postępuje z Twoimi informacjami.", "contact_t": "11. Kontakt", "contact_l": "Jeśli masz pytania dotyczące tej polityki, napisz na adres:", "t1": "1. Czego nie zbieramy", "b1": "Aplikacja nie wymaga rejestracji ani logowania. Nie zbiera Twojego imienia i nazwiska, adresu e-mail, lokalizacji ani kontaktów i nigdy nie zbiera historii przeglądania, pełnych adresów odwiedzanych stron ani ich treści.", "t2": "2. Jak działa rozszerzenie", "b2": "Rozszerzenie działa w Safari na Twoim urządzeniu. Odczytuje kolory strony wyłącznie po to, by zamienić je na ciemne — na miejscu, w Safari. Treść stron nigdy nie jest kopiowana, przechowywana ani nigdzie wysyłana.", "t3": "3. Gdzie przechowywane są Twoje ustawienia", "b3": "Twój motyw, opcje przyciemniania, poprawki stron i lista stron, na których wyłączono Nocti, są zapisane na tym urządzeniu. Poza anonimowymi danymi o użytkowaniu opisanymi poniżej nie są przesyłane ani do nas, ani do żadnych podmiotów trzecich.", "t4": "4. Anonimowe dane o użytkowaniu", "b4": "Aby wiedzieć, z których funkcji ludzie korzystają i które strony trzeba poprawić, Aplikacja i rozszerzenie wysyłają niewielki zestaw anonimowych zdarzeń. Każde z nich to stała nazwa zdarzenia z kilkoma szczegółami, takimi jak wybrany motyw, tryb, na który się przełączono, albo cena i waluta zakupu. Liczby, np. ile masz własnych motywów lub reguł dla stron, są wysyłane tylko jako przedziały (na przykład 2–5), aby dokładna liczba nie mogła stać się odciskiem palca. Każde zdarzenie zawiera też wersję aplikacji, system operacyjny i jego wersję, preferowany język oraz informację, czy Pro jest odblokowane. Gdy zgłaszasz stronę, wyłączasz na niej Nocti, poprawiasz dla niej wykrywanie ciemnych stron lub dostosowujesz jej kolory, dołączana jest domena strony (na przykład example.com, nigdy pełny adres), a zgłoszenie zawiera również napisaną przez Ciebie notatkę. Historia przeglądania, pełne adresy stron, treść stron ani nic, co pozwala Cię zidentyfikować, nigdy nie są dołączane. Udostępnianie jest domyślnie włączone i w każdej chwili możesz je wyłączyć w Ustawienia → Informacje → Polityka prywatności. Od tej chwili nic nie jest wysyłane, a zdarzenia, które wciąż czekają na wysłanie, są usuwane.", "t5": "5. Kto przetwarza te dane", "b5": "PostHog przetwarza te zdarzenia w naszym imieniu na serwerach w Stanach Zjednoczonych. Jedynym identyfikatorem jest losowy identyfikator utworzony na tym urządzeniu i wspólny dla Aplikacji i rozszerzenia. Nie jest on powiązany z Twoim Kontem Apple, identyfikatorem reklamowym urządzenia ani żadną inną tożsamością. Nie tworzymy profili użytkowników, nie nagrywamy sesji ani ekranów, nie przechowujemy Twojego adresu IP i nie używamy go do ustalania Twojej lokalizacji. Dane nie są wykorzystywane do reklam, nie są sprzedawane ani udostępniane nikomu innemu i nie służą do śledzenia Cię w różnych aplikacjach lub witrynach.", "t6": "6. Połączenia sieciowe", "b6": "Poza anonimowymi danymi o użytkowaniu opisanymi powyżej rozszerzenie pobiera wyłącznie arkusze stylów i obrazy, których strona już używa, aby nadać im nowe kolory. Gdy stukniesz „Sprawdź uaktualnienia”, Aplikacja pyta publiczną usługę App Store firmy Apple o numer najnowszej wersji. To zapytanie trafia do Apple, nie do nas.", "t7": "7. Zakupy", "b7": "Zakupy realizuje Apple przez App Store. Twoją metodą płatności i danymi Konta Apple zajmuje się Apple — my ich nie widzimy.", "t8": "8. E-maile z opiniami", "b8": "Gdy do nas napiszesz, otrzymamy treść Twojej wiadomości oraz wersję aplikacji, wersję systemu i model urządzenia wstępnie wpisane w e-mail (możesz je usunąć przed wysłaniem). Używamy ich wyłącznie do odpowiedzi i naprawiania problemów.", "t9": "9. Prywatność dzieci", "b9": "Aplikacja nie zbiera świadomie żadnych informacji od dzieci poniżej 13 roku życia.", "t10": "10. Zmiany w polityce", "b10": "Jeśli ta polityka się zmieni, opublikujemy nową wersję na tej stronie i zaktualizujemy datę wejścia w życie."}, "pt-PT": {"title": "Nocti · Política de privacidade", "h1": "Política de privacidade", "back": "Voltar", "eff": "Data de entrada em vigor: 21 de outubro de 2026", "intro": "O Nocti (“a App”) é uma extensão do Safari que escurece páginas web no seu dispositivo. Não precisa de conta e nada do que navega chega até nós. Esta política explica exatamente como a App trata as suas informações.", "contact_t": "11. Contacte-nos", "contact_l": "Se tiver alguma questão sobre esta política, contacte:", "t1": "1. O que não recolhemos", "b1": "A App não tem registo nem início de sessão. Não recolhe o seu nome, e-mail, localização ou contactos, e nunca recolhe o seu histórico de navegação, os endereços completos das páginas que visita nem o respetivo conteúdo.", "t2": "2. Como funciona a extensão", "b2": "A extensão funciona dentro do Safari, no seu dispositivo. Lê as cores de uma página apenas para as substituir por cores escuras, ali mesmo no Safari. O conteúdo da página nunca é copiado, guardado nem enviado para lado nenhum.", "t3": "3. Onde são guardadas as suas definições", "b3": "O seu tema, as opções de escurecimento, as correções de sites e a lista de sites onde desativou o Nocti ficam guardados neste dispositivo. Além dos dados de utilização anónimos descritos abaixo, nada disto é enviado para nós nem para terceiros.", "t4": "4. Dados de utilização anónimos", "b4": "Para saber que funcionalidades são utilizadas e que sites precisam de correção, a App e a extensão enviam um pequeno conjunto de eventos anónimos. Cada um é um nome de evento fixo com alguns detalhes, como o tema que escolheu, o modo para o qual mudou ou o preço e a moeda de uma compra. As contagens, como quantos temas personalizados ou regras de sites tem, são enviadas apenas como intervalos (por exemplo, 2–5), para que um número exato não se torne uma impressão digital. Cada evento inclui também a versão da app, o sistema operativo e a respetiva versão, o seu idioma preferido e se o Pro está desbloqueado. Quando reporta um site, desativa o Nocti num site, corrige a deteção de site escuro ou ajusta as cores de um site, é incluído o domínio do site (por exemplo, example.com, nunca o endereço completo), e um relatório inclui ainda a nota que escrever. O seu histórico de navegação, os endereços completos das páginas, o conteúdo das mesmas e qualquer dado que o identifique nunca são incluídos. A partilha está ativada por predefinição e pode desativá-la a qualquer momento em Definições → Acerca de → Política de privacidade. A partir desse momento nada é enviado, e os eventos que ainda aguardavam envio são eliminados.", "t5": "5. Quem trata estes dados", "b5": "A PostHog trata estes eventos em nosso nome, em servidores localizados nos Estados Unidos. O único identificador é um ID aleatório criado neste dispositivo e partilhado pela App e pela extensão. Não está associado à sua Conta Apple, ao identificador de publicidade do dispositivo nem a qualquer outra identidade. Não criamos perfis de utilizador, não gravamos sessões nem ecrãs, e não guardamos o seu endereço IP nem o usamos para determinar a sua localização. Os dados não são usados para publicidade, não são vendidos nem partilhados com mais ninguém e não são usados para o seguir entre apps ou sites.", "t6": "6. Pedidos de rede", "b6": "Além dos dados de utilização anónimos descritos acima, a extensão só transfere as folhas de estilo e as imagens que a página já utiliza, para lhes poder aplicar um novo estilo. Quando toca em Procurar atualizações, a App consulta o serviço público da App Store da Apple para saber o número da versão mais recente. Esse pedido vai para a Apple, não para nós.", "t7": "7. Compras", "b7": "As compras são concluídas pela Apple através da App Store. O seu método de pagamento e os dados da sua Conta Apple são tratados pela Apple e nós não temos acesso a eles.", "t8": "8. E-mails de feedback", "b8": "Se nos enviar um e-mail, recebemos o que escreveu e ainda a versão da app, a versão do sistema e o modelo do dispositivo pré-preenchidos no e-mail, que pode apagar antes de enviar. Utilizamos estes dados apenas para lhe responder e corrigir problemas.", "t9": "9. Privacidade das crianças", "b9": "A App não recolhe intencionalmente quaisquer informações de crianças com menos de 13 anos.", "t10": "10. Alterações a esta política", "b10": "Se esta política mudar, publicaremos a nova versão nesta página e atualizaremos a data de entrada em vigor."}, "ro": {"title": "Nocti · Politica de confidențialitate", "h1": "Politica de confidențialitate", "back": "Înapoi", "eff": "Data intrării în vigoare: 21 octombrie 2026", "intro": "Nocti („Aplicația”) este o extensie Safari care întunecă paginile web pe dispozitivul dvs. Nu aveți nevoie de cont și nimic din ce navigați nu ajunge la noi. Această politică explică exact cum gestionează Aplicația informațiile dvs.", "contact_t": "11. Contactați-ne", "contact_l": "Dacă aveți întrebări despre această politică, contactați:", "t1": "1. Ce nu colectăm", "b1": "Aplicația nu necesită înregistrare sau autentificare. Nu vă colectează numele, adresa de e-mail, localizarea sau contactele și nu colectează niciodată istoricul de navigare, adresele complete ale paginilor vizitate sau conținutul acestora.", "t2": "2. Cum funcționează extensia", "b2": "Extensia rulează în Safari, pe dispozitivul dvs. Citește culorile unei pagini doar pentru a le înlocui cu culori întunecate, direct în Safari. Conținutul paginii nu este niciodată copiat, stocat sau trimis nicăieri.", "t3": "3. Unde sunt stocate configurările dvs.", "b3": "Tema, opțiunile de estompare, remedierile pentru site-uri și lista site-urilor pe care ați dezactivat Nocti sunt salvate pe acest dispozitiv. Cu excepția datelor de utilizare anonime descrise mai jos, nu sunt încărcate la noi sau la terți.", "t4": "4. Date de utilizare anonime", "b4": "Pentru a afla ce funcții sunt folosite și ce site-uri trebuie remediate, Aplicația și extensia trimit un set restrâns de evenimente anonime. Fiecare este un nume de eveniment fix, cu câteva detalii, cum ar fi tema aleasă, modul la care ați trecut sau prețul și moneda unei achiziții. Numărătorile, de exemplu câte teme personalizate sau reguli pentru site-uri aveți, sunt trimise doar ca intervale (de exemplu, 2–5), ca un număr exact să nu devină o amprentă digitală. Fiecare eveniment include și versiunea aplicației, sistemul de operare și versiunea acestuia, limba preferată și dacă Pro este deblocat. Când raportați un site, dezactivați Nocti pe un site, corectați detectarea site-ului întunecat sau îi ajustați culorile, este inclus domeniul site-ului (de exemplu, example.com, niciodată adresa completă), iar un raport include și nota pe care o scrieți. Istoricul de navigare, adresele complete ale paginilor, conținutul acestora și orice v-ar putea identifica nu sunt incluse niciodată. Partajarea este activată implicit și o puteți dezactiva oricând din Configurări → Despre → Politica de confidențialitate. Din acel moment nu se mai trimite nimic, iar evenimentele care așteaptă încă să fie trimise sunt șterse.", "t5": "5. Cine prelucrează aceste date", "b5": "PostHog prelucrează aceste evenimente în numele nostru, pe servere din Statele Unite. Singurul identificator este un ID aleatoriu creat pe acest dispozitiv și folosit în comun de Aplicație și extensie. Nu este asociat cu contul dvs. Apple, cu identificatorul de publicitate al dispozitivului sau cu orice altă identitate. Nu creăm profiluri de utilizator, nu înregistrăm sesiuni sau ecrane și nu stocăm adresa dvs. IP și nici nu o folosim pentru a vă determina locația. Datele nu sunt folosite pentru publicitate, nu sunt vândute sau partajate cu nimeni altcineva și nu sunt folosite pentru a vă urmări în alte aplicații sau site-uri.", "t6": "6. Solicitări de rețea", "b6": "Pe lângă datele de utilizare anonime descrise mai sus, extensia descarcă doar foile de stil și imaginile pe care pagina le folosește deja, pentru a le putea adapta. Când atingeți Caută actualizări, Aplicația interoghează serviciul public App Store al Apple pentru numărul celei mai recente versiuni. Solicitarea ajunge la Apple, nu la noi.", "t7": "7. Achiziții", "b7": "Achizițiile sunt finalizate de Apple prin App Store. Metoda de plată și detaliile contului Apple sunt gestionate de Apple, iar noi nu le putem vedea.", "t8": "8. E-mailuri de feedback", "b8": "Dacă ne scrieți un e-mail, primim ce ați scris, plus versiunea aplicației, versiunea sistemului și modelul dispozitivului precompletate în e-mail, pe care le puteți șterge înainte de trimitere. Le folosim doar pentru a vă răspunde și a remedia probleme.", "t9": "9. Confidențialitatea copiilor", "b9": "Aplicația nu colectează în mod intenționat informații de la copii sub 13 ani.", "t10": "10. Modificări ale acestei politici", "b10": "Dacă această politică se schimbă, vom publica noua versiune pe această pagină și vom actualiza data intrării în vigoare."}, "sk": {"title": "Nocti · Zásady ochrany súkromia", "h1": "Zásady ochrany súkromia", "back": "Späť", "eff": "Dátum účinnosti: 21. októbra 2026", "intro": "Nocti („aplikácia“) je rozšírenie Safari, ktoré stmavuje webové stránky vo vašom zariadení. Nepotrebujete žiadny účet a nič z toho, čo prehliadate, sa k nám nikdy nedostane. Tieto zásady presne vysvetľujú, ako aplikácia narába s vašimi údajmi.", "contact_t": "11. Kontakt", "contact_l": "Ak máte k týmto zásadám akékoľvek otázky, kontaktujte:", "t1": "1. Čo nezhromažďujeme", "b1": "Aplikácia nevyžaduje registráciu ani prihlásenie. Nezhromažďuje vaše meno, e-mail, polohu ani kontakty a nikdy nezhromažďuje históriu prehliadania, úplné adresy navštívených stránok ani ich obsah.", "t2": "2. Ako rozšírenie funguje", "b2": "Rozšírenie beží v Safari vo vašom zariadení. Farby stránky číta len preto, aby ich priamo v Safari prefarbilo na tmavé. Obsah stránky sa nikdy nekopíruje, neukladá ani nikam neodosiela.", "t3": "3. Kde sú uložené vaše nastavenia", "b3": "Váš motív, nastavenia stlmenia, opravy webov a zoznam webov, na ktorých ste Nocti vypli, sa ukladajú v tomto zariadení. Okrem anonymných údajov o používaní opísaných nižšie sa nenahrávajú k nám ani žiadnej tretej strane.", "t4": "4. Anonymné údaje o používaní", "b4": "Aby sme vedeli, ktoré funkcie ľudia používajú a ktoré weby treba opraviť, odosiela aplikácia a rozšírenie malú sadu anonymných udalostí. Každá z nich je pevný názov udalosti s niekoľkými podrobnosťami, napríklad aký motív ste vybrali, na aký režim ste prepli alebo cena a mena nákupu. Počty, napríklad koľko máte vlastných motívov alebo pravidiel pre weby, sa odosielajú len ako rozsahy (napríklad 2–5), aby sa presné číslo nemohlo stať odtlačkom prsta. Každá udalosť obsahuje aj verziu aplikácie, operačný systém a jeho verziu, váš preferovaný jazyk a informáciu, či je odomknuté Pro. Keď nahlásite web, vypnete na webe Nocti, opravíte jeho rozpoznávanie tmavých webov alebo upravíte jeho farby, pripojí sa doména webu (napríklad example.com, nikdy úplná adresa) a hlásenie obsahuje aj poznámku, ktorú napíšete. História prehliadania, úplné adresy stránok, obsah stránok ani nič, čo by vás mohlo identifikovať, sa nikdy nepripájajú. Zdieľanie je predvolene zapnuté a kedykoľvek ho môžete vypnúť v Nastavenia → O aplikácii → Zásady ochrany súkromia. Od tej chvíle sa nič neodosiela a udalosti, ktoré ešte čakajú na odoslanie, sa vymažú.", "t5": "5. Kto tieto údaje spracúva", "b5": "PostHog spracúva tieto udalosti v našom mene na serveroch v Spojených štátoch. Jediným identifikátorom je náhodné ID vytvorené v tomto zariadení, ktoré zdieľa aplikácia aj rozšírenie. Nie je prepojené s vaším Apple účtom, reklamným identifikátorom zariadenia ani žiadnou inou identitou. Nevytvárame používateľské profily, nenahrávame relácie ani obrazovky a neukladáme vašu IP adresu ani ju nepoužívame na zistenie vašej polohy. Údaje sa nepoužívajú na reklamu, nepredávajú sa ani sa s nikým nezdieľajú a nepoužívajú sa na sledovanie naprieč aplikáciami alebo webmi.", "t6": "6. Sieťové požiadavky", "b6": "Okrem anonymných údajov o používaní opísaných vyššie sťahuje rozšírenie len štýly a obrázky, ktoré stránka už používa, aby ich mohlo prefarbiť. Keď klepnete na Vyhľadať aktualizácie, aplikácia sa opýta verejnej služby App Store od spoločnosti Apple na číslo najnovšej verzie. Táto požiadavka ide do Applu, nie k nám.", "t7": "7. Nákupy", "b7": "Nákupy vybavuje Apple prostredníctvom App Storu. Vašu platobnú metódu a údaje Apple účtu spracúva Apple a my ich nevidíme.", "t8": "8. E-maily so spätnou väzbou", "b8": "Keď nám napíšete, dostaneme váš text a tiež verziu aplikácie, verziu systému a model zariadenia predvyplnené v e-maile, ktoré môžete pred odoslaním vymazať. Používame ich len na odpoveď a opravu problémov.", "t9": "9. Súkromie detí", "b9": "Aplikácia vedome nezhromažďuje žiadne údaje od detí mladších ako 13 rokov.", "t10": "10. Zmeny týchto zásad", "b10": "Ak sa tieto zásady zmenia, zverejníme novú verziu na tejto stránke a aktualizujeme dátum účinnosti."}, "sl": {"title": "Nocti · Pravilnik o zasebnosti", "h1": "Pravilnik o zasebnosti", "back": "Nazaj", "eff": "Datum veljavnosti: 21. oktober 2026", "intro": "Nocti (»aplikacija«) je razširitev za Safari, ki temni spletne strani v vaši napravi. Ne potrebujete računa in nič, kar brskate, nikoli ne pride do nas. Ta pravilnik natančno pojasnjuje, kako aplikacija ravna z vašimi podatki.", "contact_t": "11. Kontakt", "contact_l": "Če imate vprašanja o tem pravilniku, se obrnite na:", "t1": "1. Česa ne zbiramo", "b1": "Aplikacija nima registracije ali prijave. Ne zbira vašega imena, e-poštnega naslova, lokacije ali stikov in nikoli ne zbira zgodovine brskanja, celotnih naslovov strani, ki jih obiščete, ali njihove vsebine.", "t2": "2. Kako deluje razširitev", "b2": "Razširitev deluje v Safariju v vaši napravi. Barve strani prebere le zato, da jih na mestu, v Safariju, preoblikuje v temne. Vsebina strani se nikoli ne kopira, shrani ali pošlje nikamor.", "t3": "3. Kje so shranjene vaše nastavitve", "b3": "Vaša tema, možnosti zatemnitve, popravki strani in seznam strani, za katere ste izklopili Nocti, so shranjeni v tej napravi. Razen spodaj opisanih anonimnih podatkov o uporabi se ne nalagajo k nam ali tretjim osebam.", "t4": "4. Anonimni podatki o uporabi", "b4": "Da bi vedeli, katere funkcije ljudje uporabljajo in katere strani je treba popraviti, aplikacija in razširitev pošiljata majhen nabor anonimnih dogodkov. Vsak je stalno ime dogodka z nekaj podrobnostmi, na primer katero temo ste izbrali, na kateri način ste preklopili ali cena in valuta nakupa. Števila, na primer koliko tem po meri ali pravil za strani imate, se pošiljajo le kot razponi (na primer 2–5), da natančno število ne more postati prstni odtis. Vsak dogodek vsebuje tudi različico aplikacije, operacijski sistem in njegovo različico, vaš želeni jezik in podatek, ali je Pro odklenjen. Ko prijavite stran, zanjo izklopite Nocti, popravite njeno zaznavanje temnih strani ali prilagodite njene barve, se doda domena strani (na primer example.com, nikoli celoten naslov), prijava pa vsebuje tudi opombo, ki jo napišete. Zgodovina brskanja, celotni naslovi strani, vsebina strani in karkoli, kar vas identificira, niso nikoli vključeni. Deljenje je privzeto vklopljeno in ga lahko kadarkoli izklopite v Nastavitve → Vizitka → Pravilnik o zasebnosti. Od takrat se ne pošlje nič več, dogodki, ki še čakajo na pošiljanje, pa se izbrišejo.", "t5": "5. Kdo obdeluje te podatke", "b5": "PostHog obdeluje te dogodke v našem imenu na strežnikih v Združenih državah. Edini identifikator je naključni ID, ustvarjen v tej napravi, ki si ga delita aplikacija in razširitev. Ni povezan z vašim Apple računom, oglaševalskim identifikatorjem naprave ali katero koli drugo identiteto. Ne ustvarjamo uporabniških profilov, ne snemamo sej ali zaslonov ter ne shranjujemo vašega naslova IP in ga ne uporabljamo za določanje vaše lokacije. Podatki se ne uporabljajo za oglaševanje, se ne prodajajo in ne delijo z nikomer drugim ter se ne uporabljajo za sledenje med aplikacijami ali spletnimi mesti.", "t6": "6. Omrežne zahteve", "b6": "Razen zgoraj opisanih anonimnih podatkov o uporabi razširitev prenese le slogovne datoteke in slike, ki jih stran že uporablja, da jih lahko preoblikuje. Ko tapnete Preveri posodobitve, aplikacija pri Applovi javni storitvi App Store preveri številko najnovejše različice. Ta zahteva gre k Applu, ne k nam.", "t7": "7. Nakupi", "b7": "Nakupe opravi Apple prek trgovine App Store. Z vašim načinom plačila in podatki Apple računa upravlja Apple, mi pa jih ne vidimo.", "t8": "8. E-pošta s povratnimi informacijami", "b8": "Če nam pišete, prejmemo vaše besedilo ter različico aplikacije, različico sistema in model naprave, ki so vnaprej izpolnjeni v sporočilu in jih lahko pred pošiljanjem izbrišete. Uporabimo jih le za odgovor in odpravljanje težav.", "t9": "9. Zasebnost otrok", "b9": "Aplikacija namerno ne zbira nobenih podatkov o otrocih, mlajših od 13 let.", "t10": "10. Spremembe tega pravilnika", "b10": "Če se ta pravilnik spremeni, bomo novo različico objavili na tej strani in posodobili datum veljavnosti."}, "sv": {"title": "Nocti · Integritetspolicy", "h1": "Integritetspolicy", "back": "Tillbaka", "eff": "Gäller från: 21 oktober 2026", "intro": "Nocti (”appen”) är ett Safari-tillägg som gör webbsidor mörka på din enhet. Du behöver inget konto, och inget du surfar på når någonsin oss. Den här policyn förklarar exakt hur appen hanterar din information.", "contact_t": "11. Kontakta oss", "contact_l": "Har du frågor om den här policyn kan du kontakta:", "t1": "1. Vad vi inte samlar in", "b1": "Appen har ingen registrering eller inloggning. Den samlar inte in ditt namn, din e-postadress, din plats eller dina kontakter, och den samlar aldrig in din surfhistorik, de fullständiga adresserna till sidorna du besöker eller deras innehåll.", "t2": "2. Så fungerar tillägget", "b2": "Tillägget körs i Safari på din enhet. Det läser en sidas färger bara för att ge dem en mörk stil, direkt i Safari. Sidinnehåll kopieras, sparas eller skickas aldrig någonstans.", "t3": "3. Var dina inställningar sparas", "b3": "Ditt tema, dämpningsalternativ, webbplatsjusteringar och listan över webbplatser där du har stängt av Nocti sparas på den här enheten. Utöver den anonyma användningsdata som beskrivs nedan laddas de inte upp till oss eller till någon tredje part.", "t4": "4. Anonym användningsdata", "b4": "För att ta reda på vilka funktioner som används och vilka webbplatser som behöver åtgärdas skickar appen och tillägget en liten uppsättning anonyma händelser. Varje händelse är ett fast händelsenamn med några få detaljer, till exempel vilket tema du valde, vilket läge du bytte till eller priset och valutan för ett köp. Antal, till exempel hur många anpassade teman eller webbplatsregler du har, skickas bara som intervall (till exempel 2–5), så att ett exakt tal inte kan bli ett fingeravtryck. Varje händelse innehåller också appversionen, operativsystemet och dess version, ditt önskade språk och om Pro är upplåst. När du rapporterar en webbplats, stänger av Nocti för en webbplats, korrigerar dess identifiering av mörka webbplatser eller justerar dess färger skickas webbplatsens domän med (till exempel example.com, aldrig den fullständiga adressen), och en rapport innehåller också anteckningen du skriver. Din surfhistorik, fullständiga sidadresser, sidinnehåll och allt som identifierar dig skickas aldrig med. Delning är på som standard, och du kan när som helst stänga av den i Inställningar → Om → Integritetspolicy. Därefter s
