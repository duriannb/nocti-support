। ਇਹ ਦਿਖਾਉਣ ਲਈ ਟੂਲਬਾਰ ਦਾ ਆਈਕਨ ਫਿੱਕਾ ਹੋ ਜਾਂਦਾ ਹੈ।", "q7": "ਮੈਂ ਸਿਸਟਮ ਨੂੰ ਲਾਈਟ ਮੋਡ ’ਤੇ ਕੀਤਾ, ਪਰ ਕੁਝ ਨਹੀਂ ਬਦਲਿਆ।", "a7": "Nocti ਮੀਨੂ ਵਿੱਚ ਮੋਡ ਦੇਖੋ। <strong>ਸਿਸਟਮ ਅਨੁਸਾਰ (Follow System)</strong> ਵਿੱਚ ਖੁੱਲ੍ਹੀਆਂ ਟੈਬਾਂ ਇੱਕ ਸਕਿੰਟ ਵਿੱਚ ਵਾਪਸ ਬਦਲ ਜਾਂਦੀਆਂ ਹਨ। <strong>ਹਮੇਸ਼ਾਂ ਚਾਲੂ (Always On)</strong> ਵਿੱਚ ਸਿਸਟਮ ਦੀ ਦਿੱਖ ਭਾਵੇਂ ਕੋਈ ਵੀ ਹੋਵੇ, ਵੈੱਬਸਾਈਟਾਂ ਡਾਰਕ ਰਹਿੰਦੀਆਂ ਹਨ।", "q8": "PDF ਡਾਰਕ ਕਿਉਂ ਨਹੀਂ ਹੁੰਦੀਆਂ?", "a8": "PDF, ਲੋਕਲ ਫ਼ਾਈਲਾਂ ਅਤੇ Safari ਦੇ ਆਪਣੇ ਪੰਨੇ ਜਾਣ-ਬੁੱਝ ਕੇ ਜਿਵੇਂ ਹਨ ਉਵੇਂ ਛੱਡੇ ਜਾਂਦੇ ਹਨ। ਉਹਨਾਂ ’ਤੇ ਜ਼ਬਰਦਸਤੀ ਡਾਰਕ ਮੋਡ ਲਾਗੂ ਕਰਨ ਨਾਲ ਅਕਸਰ ਉਹ ਖਾਲੀ ਹੋ ਜਾਂਦੇ ਹਨ।", "q9": "ਪੰਨੇ ਵਾਪਸ ਹਲਕੇ ਹੋ ਜਾਂਦੇ ਹਨ, ਜਾਂ ਚਿੱਤਰ ਉਲਟੇ ਰੰਗਾਂ ਵਾਲੇ ਦਿਖਦੇ ਹਨ।", "a9": "<strong>ਸਮਾਰਟ ਇਨਵਰਟ</strong> ਅਤੇ <strong>ਕਲਾਸਿਕ ਇਨਵਰਟ</strong> ਬੰਦ ਕਰੋ — ਇਹ Nocti ਨਾਲ ਟਕਰਾਉਂਦੇ ਹਨ। iPhone ਅਤੇ iPad ’ਤੇ: <strong>ਸੈਟਿੰਗਾਂ → ਪਹੁੰਚਯੋਗਤਾ → ਡਿਸਪਲੇ ਅਤੇ ਟੈਕਸਟ ਦਾ ਆਕਾਰ</strong>। Mac ’ਤੇ: <strong>ਸਿਸਟਮ ਸੈਟਿੰਗਾਂ → ਪਹੁੰਚਯੋਗਤਾ → ਡਿਸਪਲੇ</strong>।", "q10": "ਕੀ ਮੁਫ਼ਤ ਹੈ, ਅਤੇ Nocti Pro ਕੀ ਜੋੜਦਾ ਹੈ?", "a10": "ਪੰਨਿਆਂ ਨੂੰ ਪੜ੍ਹਨਯੋਗ ਰੱਖਣ ਵਾਲਾ ਸਭ ਕੁਝ ਹਮੇਸ਼ਾਂ ਲਈ ਮੁਫ਼ਤ ਹੈ: ਨਾ ਚਿੱਟੀ ਝਪਕ, ਨਾ ਚਮਕਦੇ ਕਿਨਾਰੇ, ਸਿਸਟਮ ਅਨੁਸਾਰ, ਹਰ ਸਾਈਟ ਲਈ ਕੰਟਰੋਲ ਅਤੇ ਡਾਰਕ ਸਾਈਟਾਂ ਦੀ ਪਛਾਣ, ਨਾਲ ਹੀ Nocti Gray ਥੀਮ। <strong>Nocti Pro</strong> ਇੱਕ ਵਾਰ ਦੀ ਖਰੀਦ ਹੈ ਜੋ OLED Black ਅਤੇ ਚਾਰ ਹੋਰ ਥੀਮਾਂ, ਕਸਟਮ ਥੀਮਾਂ, ਅਤੇ ਚਮਕ, ਕੰਟ੍ਰਾਸਟ ਤੇ ਨਿੱਘ ਦੀਆਂ ਵਿਵਸਥਾਵਾਂ ਜੋੜਦੀ ਹੈ। ਤੁਸੀਂ ਪੂਰਾ Pro 14 ਦਿਨਾਂ ਲਈ ਮੁਫ਼ਤ ਅਜ਼ਮਾ ਸਕਦੇ ਹੋ।", "q11": "ਮੁਫ਼ਤ ਟ੍ਰਾਇਲ ਕਿਵੇਂ ਕੰਮ ਕਰਦਾ ਹੈ?", "a11": "<strong>Nocti Pro</strong> ਖੋਲ੍ਹੋ ਅਤੇ <strong>14 ਦਿਨਾਂ ਦਾ ਮੁਫ਼ਤ ਟ੍ਰਾਇਲ ਸ਼ੁਰੂ ਕਰੋ</strong> ’ਤੇ ਟੈਪ ਕਰੋ। ਟ੍ਰਾਇਲ ਇੱਕ ਮੁਫ਼ਤ ਇਨ-ਐਪ ਖਰੀਦ ਹੈ, ਇਸ ਲਈ ਇਹ ਤੁਹਾਡੇ Apple ਖਾਤੇ ਨਾਲ ਜੁੜਿਆ ਹੁੰਦਾ ਹੈ: ਤੁਹਾਡੇ ਸਾਰੇ ਡਿਵਾਈਸਾਂ ’ਤੇ Pro 14 ਦਿਨਾਂ ਲਈ ਅਨਲੌਕ ਰਹਿੰਦਾ ਹੈ, ਅਤੇ ਹਰ Apple ਖਾਤਾ ਇਸਨੂੰ ਇੱਕ ਵਾਰ ਵਰਤ ਸਕਦਾ ਹੈ। ਕੋਈ ਖਰਚਾ ਨਹੀਂ ਲਿਆ ਜਾਂਦਾ ਅਤੇ ਕੁਝ ਵੀ ਰੀਨਿਊ ਨਹੀਂ ਹੁੰਦਾ।", "q12": "ਮੁਫ਼ਤ ਟ੍ਰਾਇਲ ਖਤਮ ਹੋਣ ’ਤੇ ਕੀ ਹੁੰਦਾ ਹੈ?", "a12": "Nocti ਕੰਮ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ ਅਤੇ ਵਾਪਸ Nocti Gray ’ਤੇ ਆ ਜਾਂਦਾ ਹੈ। ਕੋਈ ਖਰਚਾ ਨਹੀਂ ਲੱਗਦਾ ਅਤੇ ਕੁਝ ਵੀ ਰੱਦ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ। ਤੁਹਾਡੀਆਂ ਕਸਟਮ ਥੀਮਾਂ ਅਤੇ ਵਿਵਸਥਾਵਾਂ ਸੰਭਾਲੀਆਂ ਰਹਿੰਦੀਆਂ ਹਨ, ਅਤੇ Pro ਅਨਲੌਕ ਕਰਦੇ ਹੀ ਵਾਪਸ ਆ ਜਾਂਦੀਆਂ ਹਨ।", "q13": "ਕੀ ਮੈਨੂੰ Mac ਜਾਂ iPad ’ਤੇ Nocti Pro ਦੁਬਾਰਾ ਖਰੀਦਣਾ ਪਵੇਗਾ?", "a13": "ਨਹੀਂ। ਇੱਕੋ Apple ਖਾਤੇ ਨਾਲ ਇੱਕ ਵਾਰ ਖਰੀਦਣ ’ਤੇ iPhone, iPad ਅਤੇ Mac ’ਤੇ Pro ਅਨਲੌਕ ਹੋ ਜਾਂਦਾ ਹੈ। ਜੇ ਕਿਸੇ ਡੀਵਾਈਸ ’ਤੇ ਅਜੇ ਵੀ ਮੁਫ਼ਤ ਵਰਜਨ ਦਿਖਦਾ ਹੈ, ਤਾਂ ਐਪ ਵਿੱਚ <strong>Nocti Pro</strong> ਖੋਲ੍ਹੋ ਅਤੇ <strong>ਖਰੀਦਾਂ ਰੀਸਟੋਰ ਕਰੋ</strong> ’ਤੇ ਟੈਪ ਕਰੋ।", "q14": "ਕੀ Nocti ਇਸ਼ਤਿਹਾਰ ਦਿਖਾਏਗਾ ਜਾਂ ਰੇਟਿੰਗ ਮੰਗੇਗਾ?", "a14": "ਵੈੱਬ ਪੰਨਿਆਂ ਦੇ ਅੰਦਰ ਜਾਂ Nocti ਮੀਨੂ ਵਿੱਚ ਕਦੇ ਨਹੀਂ। Nocti ਵਿੱਚ ਕੋਈ ਇਸ਼ਤਿਹਾਰ ਨਹੀਂ — Pro ਇਸ ਐਪ ਦੇ ਅੰਦਰ ਇੱਕੋ-ਇੱਕ, ਵਿਕਲਪਿਕ ਖਰੀਦ ਹੈ।"}, "pl": {"title": "Nocti · Wsparcie", "app": "Nocti", "tagline": "Tryb ciemny dla Safari na iPhonie, iPadzie i Macu", "support_h": "Wsparcie", "contact_h": "Kontakt", "contact_p": "Masz pytanie, chcesz zgłosić błąd albo jakaś strona wygląda źle? Napisz do nas – zwykle odpowiadamy w ciągu dwóch dni.", "contact_btn": "Napisz e-mail", "faq_h": "Pytania i odpowiedzi", "privacy_link": "Polityka prywatności", "q1": "Czy Nocti zbiera dane o tym, co przeglądam?", "a1": "Nie. Nocti zmienia wygląd stron wyłącznie na Twoim urządzeniu i nigdy nie zbiera historii przeglądania ani treści stron. Wysyła anonimowe dane o użytkowaniu — w tym domenę strony, gdy ją zgłosisz lub wyłączysz na niej Nocti — abyśmy wiedzieli, które strony trzeba poprawić. Możesz to wyłączyć w Ustawieniach.", "q2": "Dlaczego Nocti prosi o dostęp do wszystkich witryn?", "a2": "Aby przyciemnić stronę, Nocti musi odczytać jej kolory. Z dostępem do wszystkich witryn przyciemnia każdą stronę od pierwszej klatki. Jeśli zezwalasz na strony pojedynczo, te bez zezwolenia pozostaną jasne.", "q3": "Nocti nie działa w Messengerze, Mailu ani w innych aplikacjach.", "a3": "Strony otwierane w innych aplikacjach korzystają z wbudowanej przeglądarki, która nie obsługuje rozszerzeń Safari. Stuknij <strong>Otwórz w Safari</strong> (zwykle w menu ••• lub udostępniania), a Nocti zacznie działać.", "q4": "Dlaczego nowa karta lub Strona startowa są nadal jasne?", "a4": "Safari nie pozwala rozszerzeniom zmieniać własnych stron, takich jak Strona startowa, Ustawienia i Lista Czytelnia. Dopasowują się one do wyglądu systemu — przełącz urządzenie na tryb ciemny, aby były ciemne.", "q5": "Strona wygląda źle. Co mogę zrobić?", "a5": "Otwórz menu Nocti na tej stronie i włącz <strong>Wyłącz na tej stronie</strong>. Strona od razu wróci do normy, a Nocti to zapamięta. Poprawki stron wydajemy co kilka tygodni, więc po uaktualnieniu spróbuj włączyć Nocti ponownie.", "q6": "Strona ma już ciemny wygląd. Czy Nocti przyciemni ją drugi raz?", "a6": "Nie. Nocti wykrywa strony z własnym ciemnym wyglądem i je pomija. Ikona na pasku narzędzi staje się wtedy półprzezroczysta.", "q7": "Przełączam system na tryb jasny, ale nic się nie zmienia.", "a7": "Sprawdź tryb w menu Nocti. W trybie <strong>Jak w systemie</strong> otwarte karty wracają do normalnego wyglądu w ciągu sekundy. W trybie <strong>Zawsze włączony</strong> strony pozostają ciemne bez względu na wygląd systemu.", "q8": "Dlaczego PDF-y nie są ciemne?", "a8": "PDF-y, pliki lokalne i własne strony Safari celowo pozostają bez zmian. Wymuszanie na nich trybu ciemnego często sprawia, że robią się puste.", "q9": "Strony wracają do jasnego wyglądu lub obrazy wyglądają na odwrócone.", "a9": "Wyłącz <strong>Inteligentne odwracanie</strong> i <strong>Klasyczne odwracanie</strong> — kolidują z Nocti. Na iPhonie i iPadzie: <strong>Ustawienia → Dostępność → Ekran i wielkość tekstu</strong>. Na Macu: <strong>Ustawienia systemowe → Dostępność → Ekran</strong>.", "q10": "Co jest za darmo, a co dodaje Nocti Pro?", "a10": "Wszystko, co sprawia, że strony dobrze się czyta, jest zawsze za darmo: brak białych błysków i jasnych krawędzi, tryb „Jak w systemie”, ustawienia dla poszczególnych stron i wykrywanie ciemnych stron, a także motyw Szary Nocti. <strong>Nocti Pro</strong> to jednorazowy zakup, który dodaje Czarny OLED i cztery inne motywy, własne motywy oraz regulację jasności, kontrastu i ciepła barw. Całe Pro możesz wypróbować za darmo przez 14 dni.", "q11": "Jak działa bezpłatny okres próbny?", "a11": "Otwórz <strong>Nocti Pro</strong> i stuknij <strong>Rozpocznij bezpłatny 14-dniowy okres próbny</strong>. Okres próbny to bezpłatny zakup w aplikacji, więc jest przypisany do Twojego Konta Apple: Pro jest odblokowany przez 14 dni na wszystkich Twoich urządzeniach, a każde Konto Apple może z niego skorzystać raz. Bez żadnych opłat i bez odnawiania.", "q12": "Co się stanie po zakończeniu bezpłatnego okresu próbnego?", "a12": "Nocti działa dalej i wraca do motywu Szary Nocti. Nie pobieramy żadnych opłat i nie trzeba niczego anulować. Twoje własne motywy i ustawienia zostają zachowane i wrócą, gdy tylko odblokujesz Pro.", "q13": "Czy muszę ponownie kupić Nocti Pro na Macu lub iPadzie?", "a13": "Nie. Jeden zakup odblokowuje Pro na iPhonie, iPadzie i Macu z tym samym Kontem Apple. Jeśli urządzenie nadal pokazuje wersję bezpłatną, otwórz <strong>Nocti Pro</strong> w aplikacji i stuknij <strong>Odtwórz zakupy</strong>.", "q14": "Czy Nocti będzie wyświetlać reklamy lub prosić o ocenę?", "a14": "Nigdy na stronach internetowych ani w menu Nocti. Nocti nie ma reklam — Pro to jeden, opcjonalny zakup w tej aplikacji."}, "pt-PT": {"title": "Nocti · Suporte", "app": "Nocti", "tagline": "Modo escuro para o Safari no iPhone, iPad e Mac", "support_h": "Suporte", "contact_h": "Contacte-nos", "contact_p": "Tem dúvidas, encontrou um erro ou um site que não aparece bem? Escreva-nos; costumamos responder no prazo de dois dias.", "contact_btn": "Enviar e-mail", "faq_h": "Perguntas frequentes", "privacy_link": "Política de privacidade", "q1": "O Nocti recolhe os meus dados de navegação?", "a1": "Não. O Nocti aplica o novo estilo às páginas inteiramente no seu dispositivo e nunca recolhe o seu histórico de navegação nem o conteúdo das páginas. Envia dados de utilização anónimos, incluindo o domínio de um site quando o reporta ou desativa o Nocti nele, para sabermos que sites precisam de correção. Pode desativar esta opção nas Definições.", "q2": "Porque é que o Nocti pede acesso a todos os sites?", "a2": "O Nocti tem de ler as cores de uma página para a escurecer. Com acesso a todos os sites, escurece todas as páginas desde o primeiro instante. Se autorizar um site de cada vez, as páginas que não autorizou continuam claras.", "q3": "O Nocti não funciona no Instagram, no Mail ou noutras apps.", "a3": "As páginas abertas dentro de outras apps usam um navegador integrado que não suporta extensões do Safari. Toque em <strong>Abrir no Safari</strong> (normalmente no menu ••• ou de partilha) e o Nocti passa a funcionar.", "q4": "Porque é que a página de novo separador ou a Página inicial continua clara?", "a4": "O Safari não deixa que as extensões alterem as suas próprias páginas, como a Página inicial, as Definições e a Lista de leitura. Essas páginas seguem o aspeto do sistema — mude o dispositivo para o modo escuro para as escurecer.", "q5": "Um site aparece mal. O que posso fazer?", "a5": "Abra o menu do Nocti nesse site e ative <strong>Desativar neste site</strong>. A página volta ao normal de imediato e o Nocti memoriza a escolha. Lançamos correções de sites de poucas em poucas semanas, por isso experimente voltar a ativá-lo depois de uma atualização.", "q6": "O site já tem um visual escuro. O Nocti vai escurecê-lo duas vezes?", "a6": "Não. O Nocti deteta os sites com visual escuro próprio e não lhes toca. O ícone na barra de ferramentas fica esbatido para o indicar.", "q7": "Mudei o sistema para o modo claro, mas nada mudou.", "a7": "Verifique o modo no menu do Nocti. Em <strong>Seguir o sistema</strong>, os separadores abertos voltam ao normal num segundo. Em <strong>Sempre ativado</strong>, os sites ficam escuros seja qual for o aspeto do sistema.", "q8": "Porque é que os PDF não ficam escuros?", "a8": "Os PDF, os ficheiros locais e as páginas do próprio Safari ficam como estão, de propósito. Forçar o modo escuro neles deixa-os muitas vezes em branco.", "q9": "As páginas voltam a ficar claras ou as imagens parecem invertidas.", "a9": "Desative a <strong>Inversão inteligente</strong> e a <strong>Inversão clássica</strong> — entram em conflito com o Nocti. No iPhone e iPad: <strong>Definições → Acessibilidade → Ecrã e tamanho do texto</strong>. No Mac: <strong>Definições do Sistema → Acessibilidade → Ecrã</strong>.", "q10": "O que é gratuito e o que acrescenta o Nocti Pro?", "a10": "Tudo o que mantém as páginas legíveis é gratuito para sempre: sem clarão branco, sem margens claras, Seguir o sistema, controlo por site e deteção de sites escuros, com o tema Cinzento Nocti. O <strong>Nocti Pro</strong> é uma compra única que acrescenta o Preto OLED e mais quatro temas, temas personalizados e ajustes de brilho, contraste e calor. Pode experimentar todo o Pro gratuitamente durante 14 dias.", "q11": "Como funciona o período experimental gratuito?", "a11": "Abra <strong>Nocti Pro</strong> e toque em <strong>Iniciar período experimental gratuito de 14 dias</strong>. O período experimental é uma compra gratuita na app, por isso fica associado à sua Conta Apple: o Pro fica desbloqueado durante 14 dias em todos os seus dispositivos, e cada Conta Apple só o pode usar uma vez. Nada é cobrado e nada é renovado.", "q12": "O que acontece quando o período experimental gratuito termina?", "a12": "O Nocti continua a funcionar e volta ao Cinzento Nocti. Nada é cobrado e não há nada para cancelar. Os seus temas personalizados e ajustes são mantidos e voltam assim que desbloquear o Pro.", "q13": "Tenho de comprar o Nocti Pro outra vez no Mac ou no iPad?", "a13": "Não. Uma só compra desbloqueia o Pro no iPhone, iPad e Mac com a mesma Conta Apple. Se algum dispositivo ainda mostrar a versão gratuita, abra <strong>Nocti Pro</strong> na app e toque em <strong>Restaurar compras</strong>.", "q14": "O Nocti vai mostrar anúncios ou pedir avaliações?", "a14": "Nunca dentro das páginas web nem no menu do Nocti. O Nocti não tem anúncios — o Pro é uma compra única e opcional dentro desta app."}, "ro": {"title": "Nocti · Asistență", "app": "Nocti", "tagline": "Mod întunecat pentru Safari pe iPhone, iPad și Mac", "support_h": "Asistență", "contact_h": "Contactează-ne", "contact_p": "Ai o întrebare, ai găsit o eroare sau un site care arată greșit? Scrie-ne; de obicei răspundem în două zile.", "contact_btn": "Trimite un e-mail", "faq_h": "Întrebări frecvente", "privacy_link": "Politica de confidențialitate", "q1": "Nocti colectează datele mele de navigare?", "a1": "Nu. Nocti modifică paginile în întregime pe dispozitivul dvs. și nu colectează niciodată istoricul de navigare sau conținutul paginilor. Trimite date de utilizare anonime, inclusiv domeniul unui site atunci când îl raportați sau dezactivați Nocti pe el, ca să știm ce site-uri trebuie remediate. Puteți dezactiva acest lucru din Configurări.", "q2": "De ce cere Nocti acces la toate site-urile?", "a2": "Nocti trebuie să citească culorile unei pagini pentru a o întuneca. Cu acces la toate site-urile, poate întuneca fiecare pagină încă din prima clipă. Dacă permiteți site-urile unul câte unul, paginile nepermise rămân luminoase.", "q3": "Nocti nu funcționează în Facebook, Mail sau alte aplicații.", "a3": "Paginile deschise în alte aplicații folosesc un browser integrat care nu acceptă extensii Safari. Atingeți <strong>Deschide în Safari</strong> (de obicei în meniul ••• sau de partajare) și Nocti va funcționa acolo.", "q4": "De ce pagina de filă nouă sau Pagina de start este încă luminoasă?", "a4": "Safari nu permite extensiilor să-i modifice propriile pagini, cum ar fi Pagina de start, Configurările și Lista de lecturi. Acestea urmează aspectul sistemului — treceți dispozitivul în modul întunecat pentru a le întuneca.", "q5": "Un site arată greșit. Ce pot face?", "a5": "Deschideți meniul Nocti pe acel site și activați <strong>Dezactivează pe acest site</strong>. Pagina revine imediat la normal, iar Nocti își amintește alegerea. Lansăm remedieri pentru site-uri la câteva săptămâni, așa că încercați să-l reactivați după o actualizare.", "q6": "Un site are deja un design întunecat. Nocti îl va întuneca de două ori?", "a6": "Nu. Nocti detectează site-urile cu propriul design întunecat și le omite. Pictograma din bara de instrumente devine estompată pentru a arăta acest lucru.", "q7": "Am trecut sistemul în modul luminos, dar nu s-a schimbat nimic.", "a7": "Verificați modul în meniul Nocti. În <strong>Urmează sistemul</strong>, filele deschise revin la normal în cel mult o secundă. În <strong>Mereu activ</strong>, site-urile rămân întunecate indiferent de aspectul sistemului.", "q8": "De ce fișierele PDF nu sunt întunecate?", "a8": "Fișierele PDF, fișierele locale și paginile proprii ale Safari rămân neschimbate intenționat. Forțarea modului întunecat pe ele le face adesea goale.", "q9": "Paginile revin la luminos sau imaginile par inversate.", "a9": "Dezactivați <strong>Inversare inteligentă</strong> și <strong>Inversare clasică</strong> — intră în conflict cu Nocti. Pe iPhone și iPad: <strong>Configurări → Accesibilitate → Afișaj și dimensiune text</strong>. Pe Mac: <strong>Configurări sistem → Accesibilitate → Afișaj</strong>.", "q10": "Ce este gratuit și ce adaugă Nocti Pro?", "a10": "Tot ce face paginile lizibile este gratuit pentru totdeauna: fără ecran alb, fără margini luminoase, Urmează sistemul, control pentru fiecare site și detectarea site-urilor întunecate, plus tema Gri Nocti. <strong>Nocti Pro</strong> este o achiziție unică ce adaugă Negru OLED și încă patru teme, teme personalizate și ajustări de luminozitate, contrast și căldură. Puteți încerca tot Pro gratuit timp de 14 zile.", "q11": "Cum funcționează perioada de probă gratuită?", "a11": "Deschideți <strong>Nocti Pro</strong> și atingeți <strong>Începe perioada de probă gratuită de 14 zile</strong>. Perioada de probă este o achiziție gratuită în aplicație, deci aparține contului dvs. Apple: Pro este deblocat timp de 14 zile pe toate dispozitivele dvs., iar fiecare cont Apple o poate folosi o singură dată. Nu se percepe nicio plată și nu se reînnoiește nimic.", "q12": "Ce se întâmplă când se încheie perioada de probă gratuită?", "a12": "Nocti funcționează în continuare și revine la Gri Nocti. Nu se percepe nicio plată și nu trebuie să anulați nimic. Temele personalizate și ajustările se păstrează și revin imediat ce deblocați Pro.", "q13": "Trebuie să cumpăr din nou Nocti Pro pe Mac sau iPad?", "a13": "Nu. O singură achiziție deblochează Pro pe iPhone, iPad și Mac cu același cont Apple. Dacă un dispozitiv afișează încă versiunea gratuită, deschideți <strong>Nocti Pro</strong> în aplicație și atingeți <strong>Restaurează achizițiile</strong>.", "q14": "Nocti va afișa reclame sau îmi va cere evaluări?", "a14": "Niciodată în paginile web sau în meniul Nocti. Nocti nu are reclame — Pro este o achiziție unică și opțională în această aplicație."}, "sk": {"title": "Nocti · Podpora", "app": "Nocti", "tagline": "Tmavý režim pre Safari na iPhone, iPade a Macu", "support_h": "Podpora", "contact_h": "Kontaktujte nás", "contact_p": "Máte otázku, chcete nahlásiť chybu alebo sa vám nejaká stránka zobrazuje zle? Napíšte nám, zvyčajne odpovedáme do dvoch dní.", "contact_btn": "Napísať e-mail", "faq_h": "Časté otázky", "privacy_link": "Zásady ochrany súkromia", "q1": "Zhromažďuje Nocti údaje o mojom prehliadaní?", "a1": "Nie. Nocti upravuje stránky výhradne vo vašom zariadení a nikdy nezhromažďuje históriu prehliadania ani obsah stránok. Odosiela anonymné údaje o používaní vrátane domény webu, keď ho nahlásite alebo na ňom Nocti vypnete, aby sme vedeli, ktoré weby treba opraviť. Môžete to vypnúť v Nastaveniach.", "q2": "Prečo Nocti žiada o prístup ku všetkým webom?", "a2": "Aby Nocti mohlo stránku stmaviť, musí čítať jej farby. S prístupom ku všetkým webom stmaví každú stránku od prvého snímku. Ak weby povoľujete jednotlivo, stránky, ktoré ste nepovolili, zostanú svetlé.", "q3": "Nocti nefunguje vo WeChate, v Maile ani v iných aplikáciách.", "a3": "Stránky otvorené v iných aplikáciách používajú vstavaný prehliadač, ktorý nepodporuje rozšírenia Safari. Klepnite na <strong>Otvoriť v Safari</strong> (zvyčajne v menu ••• alebo Zdieľať) a Nocti tam bude fungovať.", "q4": "Prečo je nový panel alebo Úvodná stránka stále svetlá?", "a4": "Safari nedovoľuje rozšíreniam meniť svoje vlastné stránky, napríklad Úvodnú stránku, Nastavenia či Zoznam na čítanie. Tie sa namiesto toho riadia vzhľadom systému — prepnite zariadenie do tmavého režimu a stmavnú.", "q5": "Web vyzerá zle. Čo s tým?", "a5": "Otvorte na tom webe menu Nocti a zapnite <strong>Vypnúť na tomto webe</strong>. Stránka sa okamžite vráti do pôvodného stavu a Nocti si to zapamätá. Opravy webov vydávame každých pár týždňov, takže to po aktualizácii skúste znova zapnúť.", "q6": "Web už má vlastný tmavý vzhľad. Stmaví ho Nocti druhýkrát?", "a6": "Nie. Nocti rozpozná weby s vlastným tmavým vzhľadom a preskočí ich. Ikona na paneli s nástrojmi potom spriehľadnie.", "q7": "Systém je vo svetlom režime, ale nič sa nezmenilo.", "a7": "Skontrolujte režim v menu Nocti. V režime <strong>Podľa systému</strong> sa otvorené panely do sekundy prepnú späť. V režime <strong>Vždy zapnuté</strong> zostávajú weby tmavé bez ohľadu na vzhľad systému.", "q8": "Prečo nie sú PDF tmavé?", "a8": "PDF, lokálne súbory a vlastné stránky Safari zámerne zostávajú bez zmeny. Vynútený tmavý režim by ich často zobrazil prázdne.", "q9": "Stránky sa vracajú do svetlej podoby alebo obrázky vyzerajú invertované.", "a9": "Vypnite voľby <strong>Inteligentná inverzia</strong> a <strong>Klasická inverzia</strong> — kolidujú s Nocti. Na iPhone a iPade: <strong>Nastavenia → Prístupnosť → Displej a veľkosť textu</strong>. Na Macu: <strong>Systémové nastavenia → Prístupnosť → Displej</strong>.", "q10": "Čo je zadarmo a čo pridáva Nocti Pro?", "a10": "Všetko, vďaka čomu sú stránky čitateľné, je navždy zadarmo: žiadny biely záblesk, žiadne svetlé okraje, režim Podľa systému, ovládanie jednotlivých webov a rozpoznávanie tmavých webov, k tomu motív Nocti sivá. <strong>Nocti Pro</strong> je jednorazový nákup, ktorý pridáva OLED čiernu a štyri ďalšie motívy, vlastné motívy a nastavenie jasu, kontrastu a teploty. Celé Pro môžete 14 dní vyskúšať zadarmo.", "q11": "Ako funguje bezplatná skúšobná verzia?", "a11": "Otvorte <strong>Nocti Pro</strong> a klepnite na <strong>Vyskúšať 14 dní zadarmo</strong>. Skúšobná verzia je bezplatný nákup v aplikácii, takže patrí k vášmu Apple účtu: Pro je odomknuté na 14 dní vo všetkých vašich zariadeniach a každý Apple účet ju môže využiť raz. Nič sa neúčtuje a nič sa neobnovuje.", "q12": "Čo sa stane po skončení bezplatnej skúšobnej verzie?", "a12": "Nocti funguje ďalej a vráti sa k motívu Nocti sivá. Nič sa neúčtuje a nemusíte nič rušiť. Vaše vlastné motívy a nastavenia sa zachovajú a vrátia sa hneď, ako odomknete Pro.", "q13": "Musím si Nocti Pro na Macu alebo iPade kúpiť znova?", "a13": "Nie. Jeden nákup odomkne Pro na iPhone, iPade aj Macu s rovnakým Apple účtom. Ak niektoré zariadenie stále ukazuje bezplatnú verziu, otvorte v aplikácii <strong>Nocti Pro</strong> a klepnite na <strong>Obnoviť nákupy</strong>.", "q14": "Bude Nocti zobrazovať reklamy alebo žiadať o hodnotenie?", "a14": "Nikdy na webových stránkach ani v menu Nocti. Nocti nemá reklamy — Pro je jediný voliteľný nákup v tejto aplikácii."}, "sl": {"title": "Nocti · Podpora", "app": "Nocti", "tagline": "Temni način za Safari v iPhonu, iPadu in Macu", "support_h": "Podpora", "contact_h": "Stik z nami", "contact_p": "Imate vprašanje, prijavo napake ali spletno mesto, ki je videti narobe? Pišite nam, običajno odgovorimo v dveh dneh.", "contact_btn": "Pošlji e-pošto", "faq_h": "Pogosta vprašanja", "privacy_link": "Pravilnik o zasebnosti", "q1": "Ali Nocti zbira podatke o mojem brskanju?", "a1": "Ne. Nocti preoblikuje strani v celoti v vaši napravi in nikoli ne zbira zgodovine brskanja ali vsebine strani. Pošilja anonimne podatke o uporabi, vključno z domeno strani, ko jo prijavite ali zanjo izklopite Nocti, da vemo, katere strani je treba popraviti. To lahko izklopite v Nastavitvah.", "q2": "Zakaj Nocti zahteva dostop do vseh spletnih strani?", "a2": "Nocti mora prebrati barve strani, da jo potemni. Z dostopom do vseh spletnih strani lahko potemni vsako stran že od prve sličice. Če strani dovolite eno za drugo, strani, ki jih niste dovolili, ostanejo svetle.", "q3": "Nocti ne deluje v aplikacijah WeChat, Mail ali drugih aplikacijah.", "a3": "Strani, odprte v drugih aplikacijah, uporabljajo vgrajeni brskalnik, ki ne podpira razširitev za Safari. Tapnite <strong>Odpri v Safariju</strong> (običajno v meniju ••• ali meniju za deljenje) in Nocti bo deloval tam.", "q4": "Zakaj je stran novega zavihka ali Začetna stran še vedno svetla?", "a4": "Safari razširitvam ne dovoli spreminjati svojih strani, kot so Začetna stran, Nastavitve in Bralni seznam. Te sledijo videzu sistema – preklopite napravo v temni način, da postanejo temne.", "q5": "Spletna stran ni videti prav. Kaj lahko storim?", "a5": "Na tej strani odprite meni Nocti in vklopite <strong>Onemogoči na tej strani</strong>. Stran se takoj vrne v običajno stanje in Nocti si to zapomni. Popravke strani izdajamo vsakih nekaj tednov, zato ga po posodobitvi poskusite znova vklopiti.", "q6": "Spletna stran je že temna. Ali jo bo Nocti potemnil še enkrat?", "a6": "Ne. Nocti zazna strani z lastnim temnim oblikovanjem in jih preskoči. Ikona v orodni vrstici takrat zbledi.", "q7": "Preklop sistema v svetli način ni ničesar spremenil.", "a7": "V meniju Nocti preverite način. V načinu <strong>Sledi sistemu</strong> se odprti zavihki preklopijo nazaj v sekundi. V načinu <strong>Vedno vklopljeno</strong> spletne strani ostanejo temne ne glede na videz sistema.", "q8": "Zakaj datoteke PDF niso temne?", "a8": "Datoteke PDF, lokalne datoteke in Safarijeve lastne strani namenoma ostanejo nespremenjene. Vsiljen temni način jih pogosto spremeni v prazne strani.", "q9": "Strani se vrnejo v svetlo ali pa so slike videti obrnjene.", "a9": "Izklopite <strong>Pametno obračanje</strong> in <strong>Klasično obračanje</strong> – sta v sporu z Nocti. V iPhonu in iPadu: <strong>Nastavitve → Dostopnost → Zaslon in velikost besedila</strong>. V Macu: <strong>Sistemske nastavitve → Dostopnost → Zaslon</strong>.", "q10": "Kaj je brezplačno in kaj doda Nocti Pro?", "a10": "Vse, kar ohranja strani berljive, je za vedno brezplačno: brez belega bliska, brez svetlih robov, Sledi sistemu, nadzor po straneh in zaznavanje temnih strani, s temo Nocti siva. <strong>Nocti Pro</strong> je enkratni nakup, ki doda OLED črno in še štiri teme, teme po meri ter prilagajanje svetlosti, kontrasta in topline. Ves Pro lahko 14 dni preizkušate brezplačno.", "q11": "Kako deluje brezplačni preizkus?", "a11": "Odprite <strong>Nocti Pro</strong> in tapnite <strong>Začni 14-dnevni brezplačni preizkus</strong>. Preizkus je brezplačen nakup v aplikaciji, zato pripada vašemu Apple računu: Pro je 14 dni odklenjen v vseh vaših napravah, vsak Apple račun pa ga lahko uporabi enkrat. Nič se ne zaračuna in nič se ne podaljša.", "q12": "Kaj se zgodi, ko se brezplačni preizkus izteče?", "a12": "Nocti deluje naprej in se vrne na temo Nocti siva. Nič se ne zaračuna in ničesar vam ni treba preklicati. Vaše teme po meri in prilagoditve se ohranijo in se vrnejo, takoj ko odklenete Pro.", "q13": "Ali moram Nocti Pro znova kupiti na Macu ali iPadu?", "a13": "Ne. En nakup odklene Pro v iPhonu, iPadu in Macu z istim Apple računom. Če naprava še vedno prikazuje brezplačno različico, v aplikaciji odprite <strong>Nocti Pro</strong> in tapnite <strong>Obnovi nakupe</strong>.", "q14": "Ali bo Nocti prikazoval oglase ali me prosil za oceno?", "a14": "Nikoli na spletnih straneh ali v meniju Nocti. Nocti nima oglasov — Pro je en sam izbirni nakup v tej aplikaciji."}, "sv": {"title": "Nocti · Support", "app": "Nocti", "tagline": "Mörkt läge för Safari på iPhone, iPad och Mac", "support_h": "Support", "contact_h": "Kontakta oss", "contact_p": "Har du en fråga, en felrapport eller en webbplats som ser fel ut? Mejla oss – vi svarar oftast inom två dagar.", "contact_btn": "Mejla oss", "faq_h": "Vanliga frågor", "privacy_link": "Integritetspolicy", "q1": "Samlar Nocti in data om min surfning?", "a1": "Nej. Nocti ger sidor ny stil helt på din enhet och samlar aldrig in din surfhistorik eller ditt sidinnehåll. Anonym användningsdata skickas, inklusive en webbplats domän när du rapporterar den eller stänger av Nocti för den, så att vi vet vilka webbplatser som behöver åtgärdas. Du kan stänga av det i Inställningar.", "q2": "Varför ber Nocti om åtkomst till alla webbplatser?", "a2": "Nocti måste läsa en sidas färger för att göra den mörk. Med åtkomst till alla webbplatser kan Nocti göra varje sida mörk från första bildrutan. Om du tillåter webbplatser en i taget förblir de sidor du inte har tillåtit ljusa.", "q3": "Nocti fungerar inte i Mail eller andra appar.", "a3": "Sidor som öppnas i andra appar använder en inbyggd webbläsare som inte har stöd för Safari-tillägg. Tryck på <strong>Öppna i Safari</strong> (oftast i •••- eller delningsmenyn) så fungerar Nocti där.", "q4": "Varför är sidan för ny flik eller startsidan fortfarande ljus?", "a4": "Safari låter inte tillägg ändra Safaris egna sidor, som startsidan, inställningarna och läslistan. De följer i stället systemets utseende – växla enheten till mörkt läge för att göra dem mörka.", "q5": "En webbplats ser fel ut. Vad kan jag göra?", "a5": "Öppna Nocti-menyn på webbplatsen och slå på <strong>Inaktivera på den här webbplatsen</strong>. Sidan återgår direkt till det normala och Nocti kommer ihåg det. Vi släpper webbplatsjusteringar med några veckors mellanrum, så prova att aktivera Nocti igen efter en uppdatering.", "q6": "En webbplats har redan en mörk design. Gör Nocti den mörk två gånger?", "a6": "Nej. Nocti känner igen webbplatser med egen mörk design och hoppar över dem. Symbolen i verktygsfältet bleknar för att visa det.", "q7": "Jag bytte systemet till ljust läge, men inget hände.", "a7": "Kolla läget i Nocti-menyn. I <strong>Följ systemet</strong> blir öppna flikar ljusa igen inom en sekund. I <strong>Alltid på</strong> förblir webbplatser mörka oavsett systemets utseende.", "q8": "Varför blir inte PDF:er mörka?", "a8": "PDF:er, lokala filer och Safaris egna sidor lämnas avsiktligt som de är. Att tvinga mörkt läge på dem gör dem ofta tomma.", "q9": "Sidor blir ljusa igen, eller bilder ser inverterade ut.", "a9": "Stäng av <strong>Smart invertering</strong> och <strong>Klassisk invertering</strong> – de krockar med Nocti. På iPhone och iPad: <strong>Inställningar → Hjälpmedel → Skärm och textstorlek</strong>. På Mac: <strong>Systeminställningar → Hjälpmedel → Skärm</strong>.", "q10": "Vad är gratis, och vad lägger Nocti Pro till?", "a10": "Allt som håller sidor läsbara är gratis för alltid: ingen vit blixt, inga ljusa kanter, Följ systemet, inställningar per webbplats och identifiering av mörka webbplatser, plus temat Nocti-grå. <strong>Nocti Pro</strong> är ett engångsköp som lägger till OLED-svart och fyra teman till, anpassade teman samt justering av ljusstyrka, kontrast och värme. Du kan prova hela Pro gratis i 14 dagar.", "q11": "Hur fungerar den kostnadsfria provperioden?", "a11": "Öppna <strong>Nocti Pro</strong> och tryck på <strong>Prova gratis i 14 dagar</strong>. Provperioden är ett kostnadsfritt köp i appen och hör därför till ditt Apple-konto: Pro är upplåst i 14 dagar på alla dina enheter, och varje Apple-konto kan använda den en gång. Inget debiteras och inget förnyas.", "q12": "Vad händer när den kostnadsfria provperioden är slut?", "a12": "Nocti fortsätter att fungera och byter tillbaka till Nocti-grå. Inget debiteras och det finns inget att säga upp. Dina anpassade teman och justeringar sparas och kommer tillbaka så fort du låser upp Pro.", "q13": "Måste jag köpa Nocti Pro igen på min Mac eller iPad?", "a13": "Nej. Ett köp låser upp Pro på iPhone, iPad och Mac med samma Apple-konto. Om en enhet fortfarande visar gratisversionen öppnar du <strong>Nocti Pro</strong> i appen och trycker på <strong>Återställ köp</strong>.", "q14": "Visar Nocti annonser eller ber mig om betyg?", "a14": "Aldrig på webbsidor eller i Nocti-menyn. Nocti har ingen reklam – Pro är ett enda, valfritt köp i den här appen."}, "ta": {"title": "Nocti · ஆதரவு", "app": "Nocti", "tagline": "iPhone, iPad, Mac இல் Safari-க்கான டார்க் மோடு", "support_h": "ஆதரவு", "contact_h": "எங்களைத் தொடர்புகொள்ளுங்கள்", "contact_p": "கேள்வி, பிழை அறிக்கை, அல்லது தவறாகத் தெரியும் தளம் உள்ளதா? எங்களுக்கு மின்னஞ்சல் அனுப்புங்கள்; வழக்கமாக இரண்டு நாட்களுக்குள் பதிலளிப்போம்.", "contact_btn": "மின்னஞ்சல் அனுப்பு", "faq_h": "அடிக்கடி கேட்கப்படும் கேள்விகள்", "privacy_link": "தனியுரிமைக் கொள்கை", "q1": "Nocti என் உலாவல் தரவைச் சேகரிக்கிறதா?", "a1": "இல்லை. Nocti பக்கங்களின் தோற்றத்தை முழுவதுமாக உங்கள் சாதனத்திலேயே மாற்றுகிறது, உங்கள் உலாவல் வரலாற்றையோ பக்க உள்ளடக்கத்தையோ ஒருபோதும் சேகரிப்பதில்லை. எந்தத் தளங்களைச் சரிசெய்ய வேண்டும் என்று அறிய, அநாமதேயப் பயன்பாட்டுத் தரவை அனுப்புகிறது — ஒரு தளத்தைப் புகாரளிக்கும்போதோ அதற்கு Nocti-ஐ முடக்கும்போதோ அந்தத் தளத்தின் டொமைன் உட்பட. இதை அமைப்புகளில் முடக்கலாம்.", "q2": "எல்லா இணையதளங்களுக்கும் அணுகலை Nocti ஏன் கேட்கிறது?", "a2": "ஒரு பக்கத்தை இருட்டாக்க, Nocti அதன் நிறங்களைப் படிக்க வேண்டும். எல்லா இணையதளங்களுக்கும் அணுகல் இருந்தால், ஒவ்வொரு பக்கத்தையும் முதல் ஃப்ரேமிலிருந்தே இருட்டாக்க முடியும். தளங்களை ஒவ்வொன்றாக அனுமதித்தால், நீங்கள் அனுமதிக்காத பக்கங்கள் வெளிச்சமாகவே இருக்கும்.", "q3": "WeChat, மெயில் அல்லது பிற ஆப்களில் Nocti வேலை செய்யவில்லை.", "a3": "பிற ஆப்களுக்குள் திறக்கப்படும் பக்கங்கள், Safari நீட்டிப்புகளை ஆதரிக்காத உள்ளமைந்த உலாவியைப் பயன்படுத்துகின்றன. <strong>Safari-இல் திற</strong> என்பதைத் தட்டுங்கள் (பொதுவாக ••• அல்லது பகிர் மெனுவில் இருக்கும்), அங்கே Nocti வேலை செய்யும்.", "q4": "புதிய டேப் பக்கம் அல்லது தொடக்கப் பக்கம் ஏன் இன்னும் வெளிச்சமாக உள்ளது?", "a4": "தொடக்கப் பக்கம், அமைப்புகள், வாசிப்புப் பட்டியல் போன்ற Safari-இன் சொந்தப் பக்கங்களை மாற்ற நீட்டிப்புகளை Safari அனுமதிப்பதில்லை. அவை உங்கள் சிஸ்டம் தோற்றத்தைப் பின்பற்றுகின்றன — அவற்றை இருட்டாக்க, உங்கள் சாதனத்தை இருண்ட பயன்முறைக்கு மாற்றுங்கள்.", "q5": "ஒரு இணையதளம் சரியாகத் தெரியவில்லை. நான் என்ன செய்யலாம்?", "a5": "அந்தத் தளத்தில் Nocti மெனுவைத் திறந்து <strong>இந்தத் தளத்தில் முடக்கு</strong> என்பதை இயக்குங்கள். பக்கம் உடனே இயல்பு நிலைக்குத் திரும்பும், Nocti அதை நினைவில் வைத்துக்கொள்ளும். சில வாரங்களுக்கு ஒருமுறை தளத் திருத்தங்களை வெளியிடுகிறோம், எனவே புதுப்பிப்புக்குப் பிறகு மீண்டும் இயக்கிப் பாருங்கள்.", "q6": "ஒரு இணையதளத்துக்கு ஏற்கெனவே இருண்ட வடிவமைப்பு உள்ளது. Nocti அதை இரண்டு முறை இருட்டாக்குமா?", "a6": "இல்லை. சொந்த இருண்ட வடிவமைப்புள்ள தளங்களை Nocti கண்டறிந்து தவிர்க்கிறது. இதைக் காட்ட, கருவிப்பட்டி ஐகான் மங்கும்.", "q7": "என் சிஸ்டத்தை ஒளிப் பயன்முறைக்கு மாற்றினேன், ஆனால் எதுவும் மாறவில்லை.", "a7": "Nocti மெனுவில் பயன்முறையைச் சரிபார்க்கவும். <strong>சிஸ்டத்தைப் பின்பற்று</strong> பயன்முறையில், திறந்திருக்கும் டேப்கள் ஒரு வினாடிக்குள் மீண்டும் மாறும். <strong>எப்போதும் இயக்கத்தில்</strong> பயன்முறையில், சிஸ்டம் தோற்றம் எதுவாக இருந்தாலும் இணையதளங்கள் இருண்டே இருக்கும்.", "q8": "PDFகள் ஏன் இருண்டு தெரிவதில்லை?", "a8": "PDFகள், உள்ளூர்க் கோப்புகள், Safari-இன் சொந்தப் பக்கங்கள் வேண்டுமென்றே அப்படியே விடப்படுகின்றன. அவற்றின் மீது இருண்ட பயன்முறையைக் கட்டாயப்படுத்தினால் அவை பெரும்பாலும் வெறுமையாகிவிடும்.", "q9": "பக்கங்கள் மீண்டும் வெளிச்சமாகின்றன, அல்லது படங்கள் தலைகீழ் நிறத்தில் தெரிகின்றன.", "a9": "<strong>ஸ்மார்ட் இன்வெர்ட்</strong>, <strong>கிளாசிக் இன்வெர்ட்</strong> இரண்டையும் முடக்குங்கள் — அவை Nocti-உடன் முரண்படும். iPhone, iPad-இல்: <strong>அமைப்புகள் → அணுகல்தன்மை → திரை &amp; உரை அளவு</strong>. Mac-இல்: <strong>சிஸ்டம் அமைப்புகள் → அணுகல்தன்மை → திரை</strong>.", "q10": "எது இலவசம், Nocti Pro எதைச் சேர்க்கிறது?", "a10": "பக்கங்களை வாசிக்க எளிதாக வைக்கும் அனைத்தும் என்றும் இலவசம்: வெள்ளை ஃபிளாஷ் இல்லை, பிரகாசமான ஓரங்கள் இல்லை, சிஸ்டத்தைப் பின்பற்று, ஒவ்வொரு தளத்துக்குமான கட்டுப்பாடுகள், இருண்ட தளக் கண்டறிதல், Nocti சாம்பல் தீம். <strong>Nocti Pro</strong> என்பது ஒருமுறை வாங்குதல்; அது OLED கருப்பும் மேலும் நான்கு தீம்களும், தனிப்பயன் தீம்கள், ஒளிர்வு, மாறுபாடு, வெதுவெதுப்புச் சரிசெய்தல்கள் ஆகியவற்றைச் சேர்க்கிறது. Pro முழுவதையும் 14 நாட்கள் இலவசமாக முயன்று பார்க்கலாம்.", "q11": "இலவசச் சோதனை எப்படி வேலை செய்கிறது?", "a11": "<strong>Nocti Pro</strong>-வைத் திறந்து <strong>14 நாள் இலவசச் சோதனையைத் தொடங்கு</strong> என்பதைத் தட்டவும். சோதனை என்பது இலவச ஆப்-இன் வாங்குதல், எனவே அது உங்கள் Apple கணக்கைச் சேர்ந்தது: உங்கள் எல்லாச் சாதனங்களிலும் 14 நாட்களுக்கு Pro திறக்கப்படும், ஒவ்வொரு Apple கணக்கும் இதை ஒருமுறை மட்டுமே பயன்படுத்த முடியும். எந்தக் கட்டணமும் இல்லை, எதுவும் புதுப்பிக்கப்படாது.", "q12": "இலவசச் சோதனைக் காலம் முடிந்ததும் என்ன நடக்கும்?", "a12": "Nocti தொடர்ந்து வேலை செய்யும், மீண்டும் Nocti சாம்பலுக்கு மாறும். எந்தக் கட்டணமும் வசூலிக்கப்படாது, எதையும் ரத்துசெய்ய வேண்டியதில்லை. உங்கள் தனிப்பயன் தீம்களும் சரிசெய்தல்களும் சேமிக்கப்பட்டிருக்கும்; Pro-வைத் திறந்தவுடன் அவை திரும்ப வரும்.", "q13": "என் Mac அல்லது iPad-இல் Nocti Pro-ஐ மீண்டும் வாங்க வேண்டுமா?", "a13": "இல்லை. ஒரே Apple கணக்கில் ஒருமுறை வாங்கினால், iPhone, iPad, Mac அனைத்திலும் Pro திறக்கப்படும். ஒரு சாதனம் இன்னும் இலவசப் பதிப்பைக் காட்டினால், ஆப்பில் <strong>Nocti Pro</strong>-ஐத் திறந்து <strong>வாங்கியவற்றை மீட்டமை</strong> என்பதைத் தட்டவும்.", "q14": "Nocti விளம்பரங்களைக் காட்டுமா அல்லது மதிப்பீடு கேட்குமா?", "a14": "இணையப் பக்கங்களுக்குள்ளோ Nocti மெனுவிலோ ஒருபோதும் இல்லை. Nocti-இல் விளம்பரங்கள் இல்லை — Pro என்பது இந்த ஆப்பிற்குள் உள்ள ஒற்றை, விருப்பத்தேர்வு வாங்குதல்."}, "te": {"title": "Nocti · సపోర్ట్", "app": "Nocti", "tagline": "iPhone, iPad, Mac లో Safari కోసం డార్క్ మోడ్", "support_h": "సపోర్ట్", "contact_h": "మమ్మల్ని సంప్రదించండి", "contact_p": "ప్రశ్న, బగ్ రిపోర్ట్ లేదా తప్పుగా కనిపించే సైట్ ఉందా? మాకు ఇమెయిల్ చేయండి, మేము సాధారణంగా రెండు రోజుల్లో బదులిస్తాము.", "contact_btn": "ఇమెయిల్ పంపండి", "faq_h": "తరచుగా అడిగే ప్రశ్నలు", "privacy_link": "గోప్యతా పాలసీ", "q1": "Nocti నా బ్రౌజింగ్ డేటాను సేకరిస్తుందా?", "a1": "లేదు. Nocti పేజీల రూపాన్ని పూర్తిగా మీ పరికరంలోనే మారుస్తుంది, మీ బ్రౌజింగ్ హిస్టరీని లేదా పేజీ కంటెంట్‌ను ఎప్పటికీ సేకరించదు. ఏ సైట్‌లను సరిచేయాలో తెలుసుకోవడానికి అనామక వినియోగ డేటాను పంపుతుంది — మీరు ఒక సైట్‌ను రిపోర్ట్ చేసినప్పుడు లేదా దానికి Noctiని ఆఫ్ చేసినప్పుడు ఆ సైట్ డొమైన్‌తో సహా. దీన్ని సెట్టింగ్‌లలో ఆఫ్ చేయవచ్చు.", "q2": "Nocti అన్ని వెబ్‌సైట్‌లకు యాక్సెస్ ఎందుకు అడుగుతుంది?", "a2": "పేజీని డార్క్ చేయడానికి Nocti దాని రంగులను చదవాలి. అన్ని వెబ్‌సైట్‌లకు యాక్సెస్ ఉంటే, ప్రతి పేజీని మొదటి ఫ్రేమ్ నుంచే డార్క్ చేయగలదు. సైట్‌లను ఒక్కొక్కటిగా అనుమతిస్తే, మీరు అనుమతించని పేజీలు లైట్‌గానే ఉంటాయి.", "q3": "WeChat, మెయిల్ లేదా ఇతర యాప్‌లలో Nocti పని చేయడం లేదు.", "a3": "ఇతర యాప్‌లలో తెరిచే పేజీలు Safari ఎక్స్‌టెన్షన్‌లకు సపోర్ట్ చేయని అంతర్నిర్మిత బ్రౌజర్‌ను ఉపయోగిస్తాయి. <strong>Safariలో తెరువు</strong> నొక్కండి (సాధారణంగా ••• లేదా షేర్ మెనులో ఉంటుంది), అక్కడ Nocti పని చేస్తుంది.", "q4": "కొత్త ట్యాబ్ పేజీ లేదా ప్రారంభ పేజీ ఇంకా లైట్‌గా ఎందుకు ఉంది?", "a4": "ప్రారంభ పేజీ, సెట్టింగ్‌లు, రీడింగ్ లిస్ట్ వంటి Safari సొంత పేజీలను మార్చడానికి Safari ఎక్స్‌టెన్షన్‌లను అనుమతించదు. అవి మీ సిస్టమ్ రూపాన్ని అనుసరిస్తాయి — వాటిని డార్క్ చేయడానికి మీ పరికరాన్ని డార్క్ మోడ్‌కు మార్చండి.", "q5": "ఒక వెబ్‌సైట్ సరిగా కనిపించడం లేదు. నేనేం చేయాలి?", "a5": "ఆ సైట్‌లో Nocti మెనును తెరిచి <strong>ఈ సైట్‌లో నిలిపివేయి</strong>ని ఆన్ చేయండి. పేజీ వెంటనే మామూలు స్థితికి వస్తుంది, Nocti దాన్ని గుర్తుంచుకుంటుంది. మేము కొన్ని వారాలకు ఒకసారి సైట్ సవరణలను విడుదల చేస్తాం, కాబట్టి అప్‌డేట్ తర్వాత మళ్లీ ఆన్ చేసి చూడండి.", "q6": "ఒక వెబ్‌సైట్‌కు ఇప్పటికే డార్క్ డిజైన్ ఉంది. Nocti దాన్ని రెండుసార్లు డార్క్ చేస్తుందా?", "a6": "లేదు. సొంత డార్క్ డిజైన్ ఉన్న సైట్‌లను Nocti గుర్తించి వదిలేస్తుంది. దీన్ని సూచించడానికి టూల్‌బార్ ఐకాన్ మసకబారుతుంది.", "q7": "నా సిస్టమ్‌ను లైట్ మోడ్‌కు మార్చాను, కానీ ఏమీ మారలేదు.", "a7": "Nocti మెనులో మోడ్‌ను తనిఖీ చేయండి. <strong>సిస్టమ్‌ను అనుసరించు</strong> మోడ్‌లో, తెరిచి ఉన్న ట్యాబ్‌లు ఒక సెకనులోపే తిరిగి మారతాయి. <strong>ఎల్లప్పుడూ ఆన్</strong> మోడ్‌లో, సిస్టమ్ రూపం ఏదైనా వెబ్‌సైట్‌లు డార్క్‌గానే ఉంటాయి.", "q8": "PDFలు ఎందుకు డార్క్ కావు?", "a8": "PDFలు, లోకల్ ఫైల్‌లు, Safari సొంత పేజీలను కావాలనే అలాగే వదిలేస్తాం. వాటిపై డార్క్ మోడ్‌ను బలవంతంగా వర్తింపజేస్తే అవి తరచుగా ఖాళీగా మారిపోతాయి.", "q9": "పేజీలు తిరిగి లైట్‌గా మారుతున్నాయి, లేదా చిత్రాలు తలకిందుల రంగుల్లో కనిపిస్తున్నాయి.", "a9": "<strong>స్మార్ట్ ఇన్‌వర్ట్</strong>, <strong>క్లాసిక్ ఇన్‌వర్ట్</strong>లను ఆఫ్ చేయండి — అవి Noctiతో విభేదిస్తాయి. iPhone, iPadలో: <strong>సెట్టింగ్‌లు → యాక్సెసిబిలిటీ → డిస్‌ప్లే &amp; టెక్స్ట్ పరిమాణం</strong>. Macలో: <strong>సిస్టమ్ సెట్టింగ్‌లు → యాక్సెసిబిలిటీ → డిస్‌ప్లే</strong>.", "q10": "ఏది ఉచితం, Nocti Pro ఏమి జోడిస్తుంది?", "a10": "పేజీలను చదవడానికి సులువుగా ఉంచే ప్రతిదీ ఎప్పటికీ ఉచితం: తెల్లని ఫ్లాష్ లేదు, ప్రకాశవంతమైన అంచులు లేవు, సిస్టమ్‌ను అనుసరించు, సైట్‌వారీ నియంత్రణలు, డార్క్ సైట్ గుర్తింపు, Nocti బూడిద థీమ్. <strong>Nocti Pro</strong> ఒకేసారి చేసే కొనుగోలు; ఇది OLED నలుపుతో పాటు మరో నాలుగు థీమ్‌లు, అనుకూల థీమ్‌లు, ప్రకాశం, కాంట్రాస్ట్, వెచ్చదనం సర్దుబాట్లను జోడిస్తుంది. Pro మొత్తాన్ని 14 రోజులు ఉచితంగా ప్రయత్నించవచ్చు.", "q11": "ఉచిత ట్రయల్ ఎలా పనిచేస్తుంది?", "a11": "<strong>Nocti Pro</strong>ను తెరిచి <strong>14 రోజుల ఉచిత ట్రయల్ ప్రారంభించు</strong> నొక్కండి. ట్రయల్ అనేది ఉచిత యాప్‌లో కొనుగోలు, కాబట్టి ఇది మీ Apple ఖాతాకు చెందుతుంది: మీ అన్ని పరికరాల్లో 14 రోజుల పాటు Pro అన్‌లాక్ అవుతుంది, ప్రతి Apple ఖాతా దీన్ని ఒక్కసారి మాత్రమే ఉపయోగించగలదు. ఎలాంటి ఛార్జీ ఉండదు, ఏదీ రెన్యూ కాదు.", "q12": "ఉచిత ట్రయల్ ముగిసినప్పుడు ఏమవుతుంది?", "a12": "Nocti పని చేస్తూనే ఉంటుంది, తిరిగి Nocti బూడిదకు మారుతుంది. ఎలాంటి ఛార్జీ ఉండదు, రద్దు చేయాల్సిందేమీ లేదు. మీ అనుకూల థీమ్‌లు, సర్దుబాట్లు భద్రంగా ఉంటాయి; Proని అన్‌లాక్ చేసిన వెంటనే తిరిగి వస్తాయి.", "q13": "నా Mac లేదా iPadలో Nocti Proను మళ్లీ కొనాలా?", "a13": "లేదు. ఒకే Apple ఖాతాతో ఒక్కసారి కొంటే iPhone, iPad, Mac అన్నింటిలోనూ Pro అన్‌లాక్ అవుతుంది. ఏదైనా పరికరం ఇంకా ఉచిత వెర్షన్‌ను చూపిస్తే, యాప్‌లో <strong>Nocti Pro</strong> తెరిచి <strong>కొనుగోళ్లను పునరుద్ధరించు</strong> నొక్కండి.", "q14": "Nocti యాడ్‌లు చూపిస్తుందా లేదా రేటింగ్ అడుగుతుందా?", "a14": "వెబ్ పేజీల్లో గానీ Nocti మెనులో గానీ ఎప్పుడూ ఉండవు. Noctiలో యాడ్‌లు లేవు — Pro అనేది ఈ యాప్‌లోని ఒకే ఒక్క, ఐచ్ఛిక కొనుగోలు."}, "th": {"title": "Nocti · ฝ่ายสนับสนุน", "app": "Nocti", "tagline": "โหมดมืดสำหรับ Safari บน iPhone, iPad และ Mac", "support_h": "ฝ่ายสนับสนุน", "contact_h": "ติดต่อเรา", "contact_p": "มีคำถาม พบข้อผิดพลาด หรือมีเว็บไซต์ที่แสดงผลผิดปกติ? ส่งอีเมลถึงเราได้ โดยปกติเราตอบกลับภายในสองวัน", "contact_btn": "ส่งอีเมล", "faq_h": "คำถามที่พบบ่อย", "privacy_link": "นโยบายความเป็นส่วนตัว", "q1": "Nocti เก็บข้อมูลการท่องเว็บของฉันหรือไม่", "a1": "ไม่ Nocti ปรับสไตล์หน้าเว็บบนอุปกรณ์ของคุณทั้งหมด และไม่เคยเก็บประวัติการท่องเว็บหรือเนื้อหาของหน้าเว็บ แอปจะส่งข้อมูลการใช้งานแบบไม่ระบุตัวตน ซึ่งรวมถึงโดเมนของเว็บไซต์เมื่อคุณรายงานหรือปิด Nocti สำหรับเว็บไซต์นั้น เพื่อให้เรารู้ว่าเว็บไซต์ใดต้องแก้ไข คุณปิดได้ในการตั้งค่า", "q2": "ทำไม Nocti จึงขอสิทธิ์เข้าถึงเว็บไซต์ทั้งหมด", "a2": "Nocti ต้องอ่านสีของหน้าเว็บจึงจะทำให้มืดได้ เมื่อได้รับสิทธิ์เข้าถึงเว็บไซต์ทั้งหมด จะทำให้ทุกหน้ามืดได้ตั้งแต่เฟรมแรก ถ้าคุณอนุญาตทีละเว็บไซต์ หน้าที่คุณยังไม่อนุญาตจะยังคงสว่าง", "q3": "Nocti ไม่ทำงานใน LINE, เมล หรือแอปอื่นๆ", "a3": "หน้าเว็บที่เปิดภายในแอปอื่นใช้เบราว์เซอร์ในตัวที่ไม่รองรับส่วนขยาย Safari แตะ <strong>เปิดใน Safari</strong> (มักอยู่ในเมนู ••• หรือเมนูแชร์) แล้ว Nocti จะทำงานได้", "q4": "ทำไมหน้าแท็บใหม่หรือหน้าเริ่มต้นยังสว่างอยู่", "a4": "Safari ไม่อนุญาตให้ส่วนขยายเปลี่ยนหน้าของตัวเอง เช่น หน้าเริ่มต้น การตั้งค่า และรายการอ่าน หน้าเหล่านี้จะเป็นไปตามลักษณะของระบบแทน ให้เปลี่ยนอุปกรณ์เป็นโหมดมืดเพื่อทำให้มืด", "q5": "เว็บไซต์แสดงผลผิดปกติ ควรทำอย่างไร", "a5": "เปิดเมนู Nocti บนเว็บไซต์นั้นแล้วเปิด <strong>ปิดใช้งานบนเว็บไซต์นี้</strong> หน้าเว็บจะกลับเป็นปกติทันทีและ Nocti จะจำไว้ เราออกการแก้ไขเว็บไซต์ทุกๆ สองสามสัปดาห์ ลองเปิดกลับมาใหม่หลังอัปเดต", "q6": "ถ้าเว็บไซต์มีดีไซน์โทนมืดอยู่แล้ว Nocti จะทำให้มืดซ้ำอีกรอบไหม", "a6": "ไม่ Nocti ตรวจจับเว็บไซต์ที่มีดีไซน์โทนมืดของตัวเองและข้ามไป ไอคอนในแถบเครื่องมือจะจางลงเพื่อแสดงสถานะนี้", "q7": "ฉันเปลี่ยนระบบเป็นโหมดสว่างแล้ว แต่ไม่มีอะไรเปลี่ยน", "a7": "ดูโหมดในเมนู Nocti ก่อน ในโหมด <strong>ตามระบบ</strong> แท็บที่เปิดอยู่จะกลับเป็นปกติภายในหนึ่งวินาที ในโหมด <strong>เปิดตลอด</strong> เว็บไซต์จะมืดเสมอไม่ว่าลักษณะของระบบจะเป็นแบบใด", "q8": "ทำไม PDF ไม่มืด", "a8": "PDF, ไฟล์ในเครื่อง และหน้าของ Safari เองจะคงไว้ตามเดิมโดยตั้งใจ การบังคับใช้โหมดมืดกับหน้าเหล่านี้มักทำให้กลายเป็นหน้าว่าง", "q9": "หน้าเว็บกลับเป็นสว่าง หรือภาพดูเหมือนถูกกลับสี", "a9": "ปิด <strong>กลับสีแบบอัจฉริยะ</strong> และ <strong>กลับสีแบบคลาสสิก</strong> เพราะจะขัดกับ Nocti บน iPhone และ iPad: <strong>การตั้งค่า → การช่วยการเข้าถึง → ขนาดการแสดงผลและข้อความ</strong> บน Mac: <strong>การตั้งค่าระบบ → การช่วยการเข้าถึง → จอภาพ</strong>", "q10": "อะไรฟรี และ Nocti Pro เพิ่มอะไรบ้าง", "a10": "ทุกสิ่งที่ทำให้หน้าเว็บอ่านง่ายนั้นฟรีตลอดไป ได้แก่ ไม่มีแสงขาววาบ ไม่มีขอบสว่าง โหมดตามระบบ การควบคุมรายเว็บไซต์ และการตรวจจับเว็บไซต์ที่มืดอยู่แล้ว พร้อมธีม Nocti Gray <strong>Nocti Pro</strong> เป็นการซื้อครั้งเดียวที่เพิ่มธีม OLED Black และธีมอื่นอีกสี่ธีม ธีมกำหนดเอง รวมถึงการปรับความสว่าง คอนทราสต์ และความอุ่น คุณทดลองใช้ Pro ทั้งหมดได้ฟรี 14 วัน", "q11": "ช่วงทดลองใช้ฟรีทำงานอย่างไร", "a11": "เปิด <strong>Nocti Pro</strong> แล้วแตะ <strong>เริ่มทดลองใช้ฟรี 14 วัน</strong> การทดลองใช้เป็นการซื้อภายในแอปที่ไม่มีค่าใช้จ่าย จึงผูกกับบัญชี Apple ของคุณ โดย Pro จะปลดล็อกเป็นเวลา 14 วันบนทุกอุปกรณ์ของคุณ และแต่ละบัญชี Apple ใช้ได้ครั้งเดียว ไม่มีการเรียกเก็บเงินและไม่มีการต่ออายุ", "q12": "จะเกิดอะไรขึ้นเมื่อช่วงทดลองใช้ฟรีสิ้นสุด", "a12": "Nocti ยังคงทำงานต่อและกลับไปใช้ Nocti Gray ไม่มีการเรียกเก็บเงิน และไม่ต้องยกเลิกอะไร ธีมกำหนดเองและการปรับแต่งของคุณจะถูกเก็บไว้ และจะกลับมาทันทีที่คุณปลดล็อก Pro", "q13": "ต้องซื้อ Nocti Pro อีกครั้งบน Mac หรือ iPad หรือไม่", "a13": "ไม่ต้อง การซื้อครั้งเดียวปลดล็อก Pro บน iPhone, iPad และ Mac ที่ใช้บัญชี Apple เดียวกัน ถ้าอุปกรณ์ใดยังแสดงเวอร์ชันฟรี ให้เปิด <strong>Nocti Pro</strong> ในแอปแล้วแตะ <strong>กู้คืนการซื้อ</strong>", "q14": "Nocti จะแสดงโฆษณาหรือขอให้ฉันให้คะแนนไหม", "a14": "ไม่มีเลย ทั้งในหน้าเว็บและในเมนู Nocti Nocti ไม่มีโฆษณา ส่วน Pro เป็นการซื้อครั้งเดียวภายในแอปนี้ซึ่งจะซื้อหรือไม่ก็ได้"}, "tr": {"title": "Nocti · Destek", "app": "Nocti", "tagline": "iPhone, iPad ve Mac’te Safari için Koyu Mod", "support_h": "Destek", "contact_h": "Bize ulaşın", "contact_p": "Bir sorunuz mu var, hata mı buldunuz ya da bir site yanlış mı görünüyor? Bize e-posta gönderin, genellikle iki gün içinde yanıtlıyoruz.", "contact_btn": "E-posta gönder", "faq_h": "SSS", "privacy_link": "Gizlilik Politikası", "q1": "Nocti tarama verilerimi topluyor mu?", "a1": "Hayır. Nocti sayfaları tamamen aygıtınızda yeniden biçimlendirir ve tarama geçmişinizi ya da sayfa içeriğini asla toplamaz. Hangi sitelerin düzeltilmesi gerektiğini bilmemiz için anonim kullanım verileri gönderir; bir siteyi bildirdiğinizde veya o sitede Nocti’yi kapattığınızda sitenin alan adı da buna dahildir. Bunu Ayarlar’dan kapatabilirsiniz.", "q2": "Nocti neden tüm web sitelerine erişim istiyor?", "a2": "Nocti’nin bir sayfayı koyulaştırmak için renklerini okuması gerekir. Tüm web sitelerine erişimi olduğunda her sayfayı ilk kareden itibaren koyulaştırabilir. Sitelere tek tek izin verirseniz izin vermediğiniz sayfalar açık renkte kalır.", "q3": "Nocti; WeChat’te, Mail’de veya diğer uygulamalarda çalışmıyor.", "a3": "Diğer uygulamaların içinde açılan sayfalar, Safari uzantılarını desteklemeyen yerleşik bir tarayıcı kullanır. <strong>Safari’de Aç</strong>’a dokunun (genellikle ••• veya paylaş menüsündedir), Nocti orada çalışır.", "q4": "Yeni sekme sayfası veya Başlangıç Sayfası neden hâlâ açık renkte?", "a4": "Safari, uzantıların Başlangıç Sayfası, Ayarlar ve Okuma Listesi gibi kendi sayfalarını değiştirmesine izin vermez. Bu sayfalar sistem görünümünüzü izler; koyu görünmeleri için aygıtınızı Koyu moda geçirin.", "q5": "Bir web sitesi düzgün görünmüyor. Ne yapabilirim?", "a5": "O sitede Nocti menüsünü açın ve <strong>Bu Sitede Devre Dışı Bırak</strong>’ı açın. Sayfa hemen normale döner ve Nocti bunu hatırlar. Birkaç haftada bir site düzeltmeleri yayımlıyoruz; bir güncellemeden sonra yeniden açmayı deneyin.", "q6": "Bir web sitesinin zaten koyu bir tasarımı var. Nocti onu iki kez mi koyulaştırır?", "a6": "Hayır. Nocti kendi koyu tasarımı olan siteleri algılar ve atlar. Bunu göstermek için araç çubuğu simgesi soluklaşır.", "q7": "Sistemimi Açık moda geçirdim ama hiçbir şey değişmedi.", "a7": "Nocti menüsündeki modu kontrol edin. <strong>Sistemi Takip Et</strong> modunda açık sekmeler bir saniye içinde açık renge döner. <strong>Her Zaman Açık</strong> modunda web siteleri sistem görünümü ne olursa olsun koyu kalır.", "q8": "PDF’ler neden koyu değil?", "a8": "PDF’ler, yerel dosyalar ve Safari’nin kendi sayfaları bilerek olduğu gibi bırakılır. Bunlarda koyu modu zorlamak çoğu zaman sayfayı boş gösterir.", "q9": "Sayfalar yeniden açık renge dönüyor veya görüntüler ters görünüyor.", "a9": "<strong>Akıllı Tersine Çevirme</strong> ve <strong>Klasik Tersine Çevirme</strong> özelliklerini kapatın; Nocti ile çakışırlar. iPhone ve iPad’de: <strong>Ayarlar → Erişilebilirlik → Ekran ve Metin Puntosu</strong>. Mac’te: <strong>Sistem Ayarları → Erişilebilirlik → Ekran</strong>.", "q10": "Neler ücretsiz, Nocti Pro neler ekliyor?", "a10": "Sayfaları okunur tutan her şey sonsuza dek ücretsiz: beyaz parlama yok, parlak kenar yok, Sistemi Takip Et, site bazında denetimler ve koyu site algılama; üstelik Nocti Gri temasıyla. <strong>Nocti Pro</strong>, OLED Siyah ve dört tema daha, özel temalar ve parlaklık, kontrast ve sıcaklık ayarları ekleyen tek seferlik bir satın almadır. Pro’nun tamamını 14 gün boyunca ücretsiz deneyebilirsiniz.", "q11": "Ücretsiz deneme nasıl çalışır?", "a11": "<strong>Nocti Pro</strong>’yu açın ve <strong>14 Günlük Ücretsiz Denemeyi Başlat</strong>’a dokunun. Deneme ücretsiz bir uygulama içi satın almadır, bu yüzden Apple Hesabınıza bağlıdır: Pro, tüm aygıtlarınızda 14 gün boyunca açık olur ve her Apple Hesabı denemeyi bir kez kullanabilir. Hiçbir ücret alınmaz ve hiçbir şey yenilenmez.", "q12": "Ücretsiz deneme süresi bitince ne olur?", "a12": "Nocti çalışmaya devam eder ve Nocti Gri’ye geri döner. Hiçbir ücret alınmaz ve iptal edilecek bir şey yoktur. Özel temalarınız ve ayarlarınız korunur; Pro’nun kilidini açtığınız anda geri gelir.", "q13": "Nocti Pro’yu Mac’imde veya iPad’imde yeniden satın almam gerekir mi?", "a13": "Hayır. Tek bir satın alma, aynı Apple Hesabı ile iPhone, iPad ve Mac’te Pro’nun kilidini açar. Bir aygıt hâlâ ücretsiz sürümü gösteriyorsa uygulamada <strong>Nocti Pro</strong>’yu açın ve <strong>Satın Alınanları Geri Yükle</strong>’ye dokunun.", "q14": "Nocti reklam gösterecek veya benden puan isteyecek mi?", "a14": "Web sayfalarında veya Nocti menüsünde asla. Nocti’de reklam yok; Pro, bu uygulamanın içinde tek seferlik ve isteğe bağlı bir satın almadır."}, "uk": {"title": "Nocti · Підтримка", "app": "Nocti", "tagline": "Темний режим для Safari на iPhone, iPad і Mac", "support_h": "Підтримка", "contact_h": "Зв’язатися з нами", "contact_p": "Маєте запитання, помітили помилку або сайт відображається неправильно? Напишіть нам — зазвичай ми відповідаємо протягом двох днів.", "contact_btn": "Написати листа", "faq_h": "Запитання й відповіді", "privacy_link": "Політика конфіденційності", "q1": "Чи збирає Nocti дані про те, що я переглядаю?", "a1": "Ні. Nocti перефарбовує сторінки лише на вашому пристрої й ніколи не збирає історію переглядів чи вміст сторінок. Надсилаються анонімні дані про використання — зокрема домен сайту, якщо ви повідомляєте про нього або вимикаєте для нього Nocti, — щоб ми знали, які сайти потрібно доопрацювати. Це можна вимкнути в налаштуваннях.", "q2": "Чому Nocti запитує доступ до всіх сайтів?", "a2": "Щоб зробити сторінку темною, Nocti має прочитати її кольори. З доступом до всіх сайтів він затемнює кожну сторінку з першого кадру. Якщо дозволяти сайти по одному, сторінки без дозволу залишаться світлими.", "q3": "Nocti не працює в Telegram, Пошті та інших програмах.", "a3": "Сторінки, відкриті в інших програмах, показуються у вбудованому браузері, який не підтримує розширення Safari. Торкніться <strong>Відкрити в Safari</strong> (зазвичай у меню ••• або «Поширити»), і Nocti запрацює.", "q4": "Чому нова вкладка або початкова сторінка залишаються світлими?", "a4": "Safari не дозволяє розширенням змінювати власні сторінки, як-от початкову сторінку, параметри та список читання. Вони відповідають оформленню системи — увімкніть на пристрої темний режим, щоб зробити їх темними.", "q5": "Сайт відображається неправильно. Що робити?", "a5": "Відкрийте меню Nocti на цьому сайті й увімкніть <strong>Вимкнути на цьому сайті</strong>. Сторінка одразу повернеться до звичайного вигляду, а Nocti це запам’ятає. Ми випускаємо виправлення для сайтів що кілька тижнів, тож після оновлення спробуйте ввімкнути Nocti знову.", "q6": "Сайт уже темний. Чи не затемнить його Nocti вдруге?", "a6": "Ні. Nocti розпізнає сайти з власним темним оформленням і пропускає їх. Значок на панелі інструментів при цьому стає напівпрозорим.", "q7": "Система у світлому режимі, але нічого не змінилося.", "a7": "Перевірте режим у меню Nocti. У режимі <strong>Як у системі</strong> відкриті вкладки повертаються до звичайного вигляду за секунду. У режимі <strong>Завжди ввімкнено</strong> сайти залишаються темними за будь-якого оформлення системи.", "q8": "Чому PDF не стають темними?", "a8": "PDF, локальні файли та власні сторінки Safari навмисно залишаються як є. Примусовий темний режим часто робить їх порожніми.", "q9": "Сторінки знову стають світлими або зображення виглядають інвертованими.", "a9": "Вимкніть <strong>Смарт-інверсію</strong> та <strong>Класичну інверсію</strong> — вони конфліктують із Nocti. На iPhone і iPad: <strong>Параметри → Доступність → Дисплей і розмір тексту</strong>. На Mac: <strong>Системні параметри → Доступність → Дисплей</strong>.", "q10": "Що безплатно і що додає Nocti Pro?", "a10": "Усе, що робить сторінки зручними для читання, безплатне назавжди: без білих спалахів і світлих країв, режим «Як у системі», налаштування для окремих сайтів і розпізнавання темних сайтів, а також тема «Сірий Nocti». <strong>Nocti Pro</strong> — разова покупка, що додає «Чорний OLED» і ще чотири теми, власні теми, а також налаштування яскравості, контрасту й теплоти. Усі можливості Pro можна безплатно спробувати протягом 14 днів.", "q11": "Як працює безплатний пробний період?", "a11": "Відкрийте <strong>Nocti Pro</strong> й торкніться <strong>Спробувати 14 днів безплатно</strong>. Пробний період — це безплатна вбудована покупка, тож він прив’язаний до вашого облікового запису Apple: Pro відкрито на 14 днів на всіх ваших пристроях, а кожен обліковий запис Apple може скористатися ним один раз. Нічого не списується й не поновлюється.", "q12": "Що станеться, коли безплатний пробний період завершиться?", "a12": "Nocti працюватиме й далі та повернеться до теми «Сірий Nocti». Жодних списань, і нічого не потрібно скасовувати. Ваші власні теми й налаштування збережуться та повернуться, щойно ви розблокуєте Pro.", "q13": "Чи потрібно знову купувати Nocti Pro на Mac або iPad?", "a13": "Ні. Одна покупка активує Pro на iPhone, iPad і Mac з тим самим обліковим записом Apple. Якщо на пристрої досі безплатна версія, відкрийте <strong>Nocti Pro</strong> у програмі й торкніться <strong>Відновити покупки</strong>.", "q14": "Чи показуватиме Nocti рекламу або проситиме оцінку?", "a14": "Ніколи — ні на вебсторінках, ні в меню Nocti. У Nocti немає реклами: Pro — єдина необов’язкова покупка в цій програмі."}, "ur": {"title": "Nocti · سپورٹ", "app": "Nocti", "tagline": "iPhone، iPad اور Mac پر Safari کے لیے ڈارک موڈ", "support_h": "سپورٹ", "contact_h": "ہم سے رابطہ کریں", "contact_p": "کوئی سوال، بگ رپورٹ، یا کوئی سائٹ غلط دکھائی دے رہی ہے؟ ہمیں ای میل کریں، ہم عموماً دو دن میں جواب دیتے ہیں۔", "contact_btn": "ای میل بھیجیں", "faq_h": "عام سوالات", "privacy_link": "رازداری کی پالیسی", "q1": "کیا Nocti میرا براؤزنگ ڈیٹا جمع کرتا ہے؟", "a1": "نہیں۔ Nocti صفحات کو مکمل طور پر آپ کے ڈیوائس پر نیا انداز دیتا ہے اور کبھی آپ کی براؤزنگ ہسٹری یا صفحے کا مواد جمع نہیں کرتا۔ یہ گمنام استعمال کا ڈیٹا بھیجتا ہے، جس میں کسی سائٹ کا ڈومین بھی شامل ہوتا ہے جب آپ اسے رپورٹ کریں یا اس کے لیے Nocti بند کریں، تاکہ ہمیں معلوم ہو کہ کن سائٹس کو درستگی کی ضرورت ہے۔ آپ اسے سیٹنگز میں بند کر سکتے ہیں۔", "q2": "Nocti تمام ویب سائٹس تک رسائی کیوں مانگتا ہے؟", "a2": "ڈارک بنانے کے لیے Nocti کو صفحے کے رنگ پڑھنے پڑتے ہیں۔ تمام ویب سائٹس تک رسائی کے ساتھ، یہ ہر صفحے کو بالکل پہلے فریم سے ڈارک کر سکتا ہے۔ اگر آپ سائٹس کو ایک ایک کر کے اجازت دیں، تو جن صفحات کی اجازت نہیں دی وہ ہلکے رہیں گے۔", "q3": "Nocti Instagram، میل یا دیگر ایپس میں کام نہیں کرتا۔", "a3": "دیگر ایپس کے اندر کھلنے والے صفحات ایک بلٹ ان براؤزر استعمال کرتے ہیں جو Safari ایکسٹینشنز کو سپورٹ نہیں کرتا۔ <strong>Safari میں کھولیں</strong> پر ٹیپ کریں (عموماً ••• یا شیئر مینو میں) اور Nocti وہاں کام کرے گا۔", "q4": "نیا ٹیب صفحہ یا اسٹارٹ پیج اب بھی ہلکا کیوں ہے؟", "a4": "Safari ایکسٹینشنز کو اپنے صفحات، جیسے اسٹارٹ پیج، سیٹنگز اور ریڈنگ لسٹ، بدلنے نہیں دیتا۔ یہ آپ کے سسٹم کی ظاہری شکل کی پیروی کرتے ہیں — انہیں ڈارک کرنے کے لیے اپنے ڈیوائس کو ڈارک موڈ پر کریں۔", "q5": "کوئی ویب سائٹ غلط نظر آ رہی ہے۔ میں کیا کروں؟", "a5": "اس سائٹ پر Nocti مینو کھولیں اور <strong>Disable on This Site</strong> آن کریں۔ صفحہ فوراً معمول پر آ جاتا ہے اور Nocti اسے یاد رکھتا ہے۔ ہم ہر چند ہفتوں میں سائٹ کی درستگیاں جاری کرتے ہیں، اس لیے اپ ڈیٹ کے بعد اسے دوبارہ آن کر کے دیکھیں۔", "q6": "ویب سائٹ کا اپنا ڈارک ڈیزائن پہلے سے ہے۔ کیا Nocti اسے دوبارہ ڈارک کرے گا؟", "a6": "نہیں۔ Nocti اپنے ڈارک ڈیزائن والی سائٹس کو پہچان کر چھوڑ دیتا ہے۔ یہ ظاہر کرنے کے لیے ٹول بار آئیکن مدھم ہو جاتا ہے۔", "q7": "میں نے اپنا سسٹم لائٹ موڈ پر کر دیا، لیکن کچھ نہیں بدلا۔", "a7": "Nocti مینو میں موڈ چیک کریں۔ <strong>Follow System</strong> میں کھلے ٹیبز ایک سیکنڈ میں واپس بدل جاتے ہیں۔ <strong>Always On</strong> میں ویب سائٹس سسٹم کی ظاہری شکل سے قطع نظر ڈارک رہتی ہیں۔", "q8": "PDF ڈارک کیوں نہیں ہوتیں؟", "a8": "PDF، مقامی فائلیں اور Safari کے اپنے صفحات جان بوجھ کر جیسے ہیں ویسے ہی چھوڑے جاتے ہیں۔ ان پر زبردستی ڈارک موڈ لگانے سے وہ اکثر خالی ہو جاتے ہیں۔", "q9": "صفحات واپس ہلکے ہو جاتے ہیں، یا تصاویر الٹی نظر آتی ہیں۔", "a9": "<strong>اسمارٹ انورٹ</strong> اور <strong>کلاسک انورٹ</strong> بند کریں — یہ Nocti سے ٹکراتے ہیں۔ iPhone اور iPad پر: <strong>سیٹنگز → رسائی پذیری → ڈسپلے اور ٹیکسٹ سائز</strong>۔ Mac پر: <strong>سسٹم سیٹنگز → رسائی پذیری → ڈسپلے</strong>۔", "q10": "کیا مفت ہے، اور Nocti Pro کیا شامل کرتا ہے؟", "a10": "صفحات کو پڑھنے کے قابل رکھنے والی ہر چیز ہمیشہ کے لیے مفت ہے: نہ سفید چمک، نہ روشن کنارے، Follow System، ہر سائٹ کا کنٹرول اور ڈارک ڈیزائن والی سائٹس کی شناخت، Nocti Gray تھیم کے ساتھ۔ <strong>Nocti Pro</strong> ایک بار کی خریداری ہے جو OLED Black اور چار مزید تھیمز، حسب ضرورت تھیمز، اور چمک، کنٹراسٹ اور گرماہٹ کی ایڈجسٹمنٹس شامل کرتی ہے۔ آپ پورا Pro 14 دن تک مفت آزما سکتے ہیں۔", "q11": "مفت ٹرائل کیسے کام کرتا ہے؟", "a11": "<strong>Nocti Pro</strong> کھولیں اور <strong>14 دن کا مفت ٹرائل شروع کریں</strong> پر ٹیپ کریں۔ ٹرائل ایک مفت اِن ایپ خریداری ہے، اس لیے یہ آپ کے Apple اکاؤنٹ سے منسلک ہوتا ہے: آپ کے تمام آلات پر Pro 14 دن کے لیے ان لاک رہتا ہے، اور ہر Apple اکاؤنٹ اسے ایک بار استعمال کر سکتا ہے۔ کوئی رقم نہیں لی جاتی اور کچھ بھی رینیو نہیں ہوتا۔", "q12": "مفت ٹرائل ختم ہونے پر کیا ہوتا ہے؟", "a12": "Nocti کام کرتا رہتا ہے اور واپس Nocti Gray پر آ جاتا ہے۔ کوئی رقم نہیں لی جاتی اور کچھ منسوخ کرنے کی ضرورت نہیں۔ آپ کی حسب ضرورت تھیمز اور ایڈجسٹمنٹس محفوظ رہتی ہیں، اور Pro ان لاک کرتے ہی واپس آ جاتی ہیں۔", "q13": "کیا مجھے Mac یا iPad پر Nocti Pro دوبارہ خریدنا ہوگا؟", "a13": "نہیں۔ ایک ہی Apple اکاؤنٹ کے ساتھ ایک خریداری iPhone، iPad اور Mac پر Pro کو ان لاک کر دیتی ہے۔ اگر کوئی ڈیوائس اب بھی مفت ورژن دکھائے، تو ایپ میں <strong>Nocti Pro</strong> کھولیں اور <strong>خریداریاں بحال کریں</strong> پر ٹیپ کریں۔", "q14": "کیا Nocti اشتہارات دکھائے گا یا مجھ سے ریٹنگ مانگے گا؟", "a14": "ویب صفحات کے اندر یا Nocti مینو میں کبھی نہیں۔ Nocti میں کوئی اشتہار نہیں — Pro اس ایپ کے اندر ایک ہی، اختیاری خریداری ہے۔"}, "vi": {"title": "Nocti · Hỗ trợ", "app": "Nocti", "tagline": "Chế độ tối cho Safari trên iPhone, iPad và Mac", "support_h": "Hỗ trợ", "contact_h": "Liên hệ chúng tôi", "contact_p": "Có câu hỏi, lỗi cần báo cáo hoặc một trang web hiển thị sai? Hãy gửi email cho chúng tôi, thường chúng tôi trả lời trong vòng hai ngày.", "contact_btn": "Gửi email", "faq_h": "Câu hỏi thường gặp", "privacy_link": "Chính sách quyền riêng tư", "q1": "Nocti có thu thập dữ liệu duyệt web của tôi không?", "a1": "Không. Nocti tạo kiểu lại trang hoàn toàn trên thiết bị của bạn và không bao giờ thu thập lịch sử duyệt web hay nội dung trang. Ứng dụng gửi dữ liệu sử dụng ẩn danh, bao gồm tên miền của trang web khi bạn báo cáo hoặc tắt Nocti cho trang đó, để chúng tôi biết trang nào cần sửa. Bạn có thể tắt tính năng này trong Cài đặt.", "q2": "Tại sao Nocti yêu cầu quyền truy cập tất cả trang web?", "a2": "Nocti cần đọc màu sắc của trang để làm tối trang. Khi có quyền truy cập tất cả trang web, Nocti có thể làm tối mọi trang ngay từ khung hình đầu tiên. Nếu bạn cho phép từng trang một, những trang chưa được cho phép sẽ vẫn sáng.", "q3": "Nocti không hoạt động trong Zalo, Mail hay các ứng dụng khác.", "a3": "Trang được mở bên trong ứng dụng khác dùng trình duyệt tích hợp, không hỗ trợ tiện ích mở rộng Safari. Hãy chạm vào <strong>Mở trong Safari</strong> (thường nằm trong menu ••• hoặc menu chia sẻ) và Nocti sẽ hoạt động ở đó.", "q4": "Tại sao trang tab mới hoặc Trang bắt đầu vẫn sáng?", "a4": "Safari không cho phép tiện ích mở rộng thay đổi các trang của chính nó, như Trang bắt đầu, Cài đặt và Danh sách đọc. Các trang này theo giao diện hệ thống — hãy chuyển thiết bị sang chế độ Tối để làm tối chúng.", "q5": "Trang web hiển thị sai. Tôi có thể làm gì?", "a5": "Mở menu Nocti trên trang web đó và bật <strong>Tắt trên trang này</strong>. Trang sẽ trở lại bình thường ngay lập tức và Nocti sẽ ghi nhớ lựa chọn. Chúng tôi phát hành bản sửa lỗi trang web vài tuần một lần, vì vậy hãy thử bật lại sau khi cập nhật.", "q6": "Trang web đã có thiết kế tối. Nocti có làm tối thêm lần nữa không?", "a6": "Không. Nocti nhận diện các trang web có thiết kế tối riêng và bỏ qua chúng. Biểu tượng trên thanh công cụ sẽ mờ đi để cho biết điều này.", "q7": "Tôi đã chuyển hệ thống sang chế độ Sáng nhưng không có gì thay đổi.", "a7": "Kiểm tra chế độ trong menu Nocti. Ở chế độ <strong>Theo hệ thống</strong>, các tab đang mở sẽ chuyển lại trong vòng một giây. Ở chế độ <strong>Luôn bật</strong>, trang web luôn tối bất kể giao diện hệ thống.", "q8": "Tại sao PDF không tối?", "a8": "PDF, tệp cục bộ và các trang của chính Safari được cố ý giữ nguyên. Ép chế độ tối lên chúng thường khiến trang bị trắng trơn.", "q9": "Trang bị sáng trở lại, hoặc hình ảnh trông như bị đảo màu.", "a9": "Hãy tắt <strong>Đảo ngược thông minh</strong> và <strong>Đảo ngược cổ điển</strong> — chúng xung đột với Nocti. Trên iPhone và iPad: <strong>Cài đặt → Trợ năng → Màn hình &amp; cỡ chữ</strong>. Trên Mac: <strong>Cài đặt hệ thống → Trợ năng → Màn hình</strong>.", "q10": "Những gì miễn phí và Nocti Pro bổ sung gì?", "a10": "Mọi thứ giúp trang dễ đọc đều miễn phí vĩnh viễn: không lóe trắng, không viền sáng, Theo hệ thống, điều khiển theo từng trang web và nhận diện trang tối sẵn, cùng chủ đề Xám Nocti. <strong>Nocti Pro</strong> là giao dịch mua một lần, bổ sung Đen OLED và bốn chủ đề khác, chủ đề tùy chỉnh, cùng khả năng điều chỉnh độ sáng, độ tương phản và độ ấm. Bạn có thể dùng thử toàn bộ Pro miễn phí trong 14 ngày.", "q11": "Dùng thử miễn phí hoạt động thế nào?", "a11": "Mở <strong>Nocti Pro</strong> và chạm vào <strong>Bắt đầu dùng thử miễn phí 14 ngày</strong>. Bản dùng thử là một giao dịch mua trong ứng dụng miễn phí, nên được gắn với Tài khoản Apple của bạn: Pro được mở khóa trong 14 ngày trên tất cả thiết bị của bạn và mỗi Tài khoản Apple chỉ dùng được một lần. Không tính phí và không tự động gia hạn.", "q12": "Điều gì xảy ra khi hết thời gian dùng thử miễn phí?", "a12": "Nocti vẫn tiếp tục hoạt động và chuyển về Xám Nocti. Không tính phí và không có gì cần hủy. Các chủ đề tùy chỉnh và điều chỉnh của bạn được giữ lại, và sẽ quay lại ngay khi bạn mở khóa Pro.", "q13": "Tôi có cần mua lại Nocti Pro trên Mac hoặc iPad không?", "a13": "Không. Một lần mua sẽ mở khóa Pro trên iPhone, iPad và Mac với cùng một Tài khoản Apple. Nếu một thiết bị vẫn hiển thị bản miễn phí, hãy mở <strong>Nocti Pro</strong> trong ứng dụng và chạm vào <strong>Khôi phục giao dịch mua</strong>.", "q14": "Nocti có hiển thị quảng cáo hay đòi tôi đánh giá không?", "a14": "Không bao giờ xuất hiện trong trang web hay menu Nocti. Nocti không có quảng cáo — Pro là giao dịch mua một lần, không bắt buộc, ngay trong ứng dụng này."}};
const SUP=["en", "zh-Hans", "zh-Hant", "ja", "ko", "de", "fr", "es", "it", "pt-BR", "ru", "ar", "bn", "ca", "cs", "da", "el", "es-419", "fi", "fr-CA", "gu", "he", "hi", "hr", "hu", "id", "kn", "ml", "mr", "ms", "nb", "nl", "or", "pa", "pl", "pt-PT", "ro", "sk", "sl", "sv", "ta", "te", "th", "tr", "uk", "ur", "vi"],RTL=["ar", "he", "ur"];
function norm(p){p=p.toLowerCase();
  const ex=SUP.find(c=>c.toLowerCase()===p);if(ex)return ex;
  if(p.startsWith('zh'))return(p.includes('hant')||p.includes('tw')||p.includes('hk')||p.includes('mo'))?'zh-Hant':'zh-Hans';
  if(p.startsWith('pt'))return p.includes('pt-pt')?'pt-PT':'pt-BR';
  if(p.startsWith('fr'))return p.includes('ca')?'fr-CA':'fr';
  if(p.startsWith('es'))return/^es-(419|mx|ar|co|cl|pe|ve|ec|uy|py|bo|cr|pa|do|gt|hn|ni|sv|pr|cu|us)/.test(p)?'es-419':'es';
  if(/^(nb|nn|no)/.test(p))return'nb';
  if(p.startsWith('iw'))return'he';
  if(p.startsWith('in'))return'id';
  const b=p.slice(0,2);return SUP.includes(b)?b:null;}
function detect(){
  const h=(location.hash.match(/lang=([\w-]+)/)||[])[1];
  if(h&&I18N[h])return h;
  for(const p of(navigator.languages||[navigator.language||'en'])){const n=norm(p);if(n&&I18N[n])return n;}
  return'en';}
function apply(lang){
  const d=I18N[lang]||I18N.en;
  document.documentElement.lang=lang;document.documentElement.dir=RTL.includes(lang)?'rtl':'ltr';
  document.title=d.title;
  document.querySelectorAll('[data-i]').forEach(el=>{el.innerHTML=d[el.dataset.i]||'';});
  document.querySelectorAll('a[data-page]').forEach(a=>{a.href=a.dataset.page+'#lang='+lang;});
  document.getElementById('lang').value=lang;
  try{history.replaceState(null,'','#lang='+lang);}catch(e){}}
