*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--label);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}

.card h3{font-size:17px;margin:0 0 6px}.card p{margin:0}
a{color:var(--tint);text-decoration:none}a:hover{text-decoration:underline}
.btn{display:inline-block;background:var(--tint);color:var(--on-tint);padding:11px 22px;border-radius:12px;font-weight:600;min-height:44px;margin-top:6px}
.btn:hover{text-decoration:none;opacity:.9}
.back{display:inline-block;margin:6px 0 18px;font-size:15px}

.eff{color:var(--label-2);font-size:14px;margin:0 0 20px}

<script>
const I18N={"en": {"title": "Nocti · Support", "app": "Nocti", "tagline": "Dark Mode for Safari on iPhone, iPad and Mac", "support_h": "Support", "contact_h": "Contact us", "contact_p": "Questions, bug reports or a site that looks wrong? Email us and we usually reply within two days.", "contact_btn": "Email us", "faq_h": "FAQ", "privacy_link": "Privacy Policy", "q1": "Does Nocti collect my browsing data?", "a1": "No. Nocti restyles pages entirely on your device and never collects your browsing history or page content. It sends anonymous usage data, including a site's domain when you report it or turn Nocti off for it, so we know which sites need fixing. You can turn this off in Settings.", "q2": "Why does Nocti ask for access to all websites?", "a2": "Nocti has to read a page's colors to make it dark. With access to all websites, it can darken every page from the very first frame. If you allow sites one at a time, pages you haven't allowed stay light.", "q3": "Nocti doesn't work in WeChat, Mail or other apps.", "a3": "Pages opened inside other apps use a built-in browser that doesn't support Safari extensions. Tap <strong>Open in Safari</strong> (usually in the ••• or share menu) and Nocti will work there.", "q4": "Why is the new tab page or Start Page still light?", "a4": "Safari doesn't let extensions change its own pages, such as the Start Page, Settings and Reading List. They follow your system appearance instead — switch your device to Dark mode to make them dark.", "q5": "A website looks wrong. What can I do?", "a5": "Open the Nocti menu on that site and turn on <strong>Disable on This Site</strong>. The page returns to normal right away and Nocti remembers it. We release site fixes every few weeks, so try turning it back on after an update.", "q6": "A website already has a dark design. Will Nocti darken it twice?", "a6": "No. Nocti detects sites with their own dark design and skips them. The toolbar icon fades to show this.", "q7": "I switched my system to Light mode, but nothing changed.", "a7": "Check the mode in the Nocti menu. In <strong>Follow System</strong>, open tabs switch back within a second. In <strong>Always On</strong>, websites stay dark whatever the system appearance.", "q8": "Why aren't PDFs dark?", "a8": "PDFs, local files and Safari's own pages are left as they are, on purpose. Forcing dark mode on them often turns them blank.", "q9": "Pages flip back to light, or images look inverted.", "a9": "Turn off <strong>Smart Invert</strong> and <strong>Classic Invert</strong> — they conflict with Nocti. On iPhone and iPad: <strong>Settings → Accessibility → Display &amp; Text Size</strong>. On Mac: <strong>System Settings → Accessibility → Display</strong>.", "q10": "What's free, and what does Nocti Pro add?", "a10": "Everything that keeps pages readable is free forever: no white flash, no bright edges, Follow System, per-site controls and dark-site detection, with the Nocti Gray theme. <strong>Nocti Pro</strong> is a one-time purchase that adds OLED Black and four more themes, custom themes, and brightness, contrast and warmth adjustments. You can try all of Pro free for 14 days.", "q11": "How does the free trial work?", "a11": "Open <strong>Nocti Pro</strong> and tap <strong>Start 14-Day Free Trial</strong>. The trial is a free in-app purchase, so it belongs to your Apple Account: Pro is unlocked for 14 days on all your devices, and each Apple Account can use it once. Nothing is charged and nothing renews.", "q12": "What happens when the free trial ends?", "a12": "Nocti keeps working and switches back to Nocti Gray. Nothing is charged and there's nothing to cancel. Your custom themes and adjustments are kept, and come back as soon as you unlock Pro.", "q13": "Do I need to buy Nocti Pro again on my Mac or iPad?", "a13": "No. One purchase unlocks Pro on iPhone, iPad and Mac with the same Apple Account. If a device still shows the free version, open <strong>Nocti Pro</strong> in the app and tap <strong>Restore Purchases</strong>.", "q14": "Will Nocti show ads or ask me for ratings?", "a14": "Never inside web pages or the Nocti menu. Nocti has no ads — Pro is a single, optional purchase inside this app."}, "zh-Hans": {"title": "夜猫 · 支持", "app": "夜猫", "tagline": "Safari 网页深色模式 · iPhone、iPad、Mac 通用", "support_h": "支持", "contact_h": "联系我们", "contact_p": "有问题、发现 bug，或者某个网站显示不对？给我们写信，通常两天内回复。", "contact_btn": "发送邮件", "faq_h": "常见问题", "privacy_link": "隐私政策", "q1": "夜猫会收集我的浏览数据吗？", "a1": "不会。夜猫完全在你的设备上处理网页，从不收集你的浏览记录和网页内容。它会发送匿名使用数据，你反馈某个网站或在某个网站关掉夜猫时会附带该网站的域名，让我们知道哪些网站需要适配。你可以在设置中关闭。", "q2": "为什么夜猫要访问所有网站？", "a2": "夜猫需要读取网页的颜色才能把它变暗。授权所有网站后，每个页面从第一帧起就是深色。如果逐个网站授权，没授权的网站会保持浅色。", "q3": "在微信、邮件等 App 里打开的网页不生效？", "a3": "在其他 App 里打开的网页使用的是内嵌浏览器，不支持 Safari 扩展。请点「<strong>在 Safari 中打开</strong>」（通常在 ••• 或分享菜单里），夜猫就能生效。", "q4": "为什么新标签页或起始页还是浅色？", "a4": "Safari 不允许扩展修改它自己的页面，比如起始页、设置和阅读列表。这些页面跟随系统外观，把设备切到深色模式即可。", "q5": "某个网站显示不正常，怎么办？", "a5": "在该网站打开夜猫菜单，打开「<strong>在此网站停用</strong>」。页面会立即恢复原样，夜猫会记住这个设置。我们每隔几周发布一次修站更新，更新后可以再打开试试。", "q6": "网站本身就是深色的，夜猫会再处理一遍吗？", "a6": "不会。夜猫会识别自带深色设计的网站并跳过，这时工具栏图标会变成半透明。", "q7": "系统切到了浅色模式，网页却没变？", "a7": "先在夜猫菜单里看一下当前模式。「<strong>跟随系统</strong>」下，已打开的标签页会在 1 秒内恢复；「<strong>始终开启</strong>」下，无论系统外观如何，网页都保持深色。", "q8": "为什么 PDF 没有变暗？", "a8": "PDF、本地文件和 Safari 自己的页面是特意保持原样的。强行给它们加深色，常常会变成一片空白。", "q9": "页面又变回浅色，或者图片像被反色了？", "a9": "请关闭「<strong>智能反转</strong>」和「<strong>经典反转</strong>」，它们会和夜猫冲突。iPhone 和 iPad：「<strong>设置 → 辅助功能 → 显示与文字大小</strong>」。Mac：「<strong>系统设置 → 辅助功能 → 显示</strong>」。", "q10": "哪些功能免费？夜猫 Pro 增加了什么？", "a10": "让网页好好显示的功能永久免费：加载不白闪、边缘不露白、跟随系统、按网站控制、识别自带深色的网站，以及夜猫灰主题。<strong>夜猫 Pro</strong> 是一次性买断，增加纯黑 OLED 等 5 套主题、自定义主题，以及亮度、对比度、暖色调节。所有 Pro 功能可免费试用 14 天。", "q11": "免费试用怎么用？", "a11": "打开「<strong>夜猫 Pro</strong>」，点「<strong>开始 14 天免费试用</strong>」。试用是一笔免费的 App 内购买，记在你的 Apple 账户上：14 天内你所有设备都能用 Pro，每个 Apple 账户只能试用一次。不会扣费，也不会自动续期。", "q12": "免费试用结束后会怎样？", "a12": "夜猫会继续正常工作，并换回夜猫灰。不会扣费，也没有什么需要取消。你的自定义主题和调节都会保留，解锁 Pro 后立即恢复。", "q13": "在 Mac 或 iPad 上需要再买一次 Pro 吗？", "a13": "不需要。使用同一个 Apple 账户，买一次 Pro 就能在 iPhone、iPad 和 Mac 上使用。如果某台设备仍显示免费版，请在 App 里打开「<strong>夜猫 Pro</strong>」，轻点「<strong>恢复购买</strong>」。", "q14": "夜猫会显示广告或请我评分吗？", "a14": "网页里和夜猫菜单里都绝对不会。夜猫没有广告，Pro 只是 App 里一次性、可选的购买。"}, "zh-Hant": {"title": "夜貓 · 支援", "app": "夜貓", "tagline": "Safari 網頁深色模式 · iPhone、iPad、Mac 通用", "support_h": "支援", "contact_h": "聯絡我們", "contact_p": "有問題、發現 bug，或是某個網站顯示不正常？寫信給我們，通常兩天內回覆。", "contact_btn": "寄送郵件", "faq_h": "常見問題", "privacy_link": "隱私權政策", "q1": "夜貓會收集我的瀏覽資料嗎？", "a1": "不會。夜貓完全在你的裝置上處理網頁，絕不收集你的瀏覽記錄和網頁內容。它會傳送匿名使用資料；當你回報某個網站或在某個網站關閉夜貓時，會附上該網站的網域，讓我們知道哪些網站需要調整。你可以在「設定」中關閉此功能。", "q2": "為什麼夜貓要存取所有網站？", "a2": "夜貓需要讀取網頁的顏色才能把它變暗。授權所有網站後，每個頁面從第一格畫面起就是深色。如果逐一授權網站，未授權的網站會維持淺色。", "q3": "在 LINE、郵件等 App 中打開的網頁沒有效果？", "a3": "在其他 App 中打開的網頁使用的是內建瀏覽器，不支援 Safari 延伸功能。請點一下「<strong>在 Safari 中打開</strong>」（通常在 ••• 或分享選單中），夜貓就能生效。", "q4": "為什麼新標籤頁或起始頁面還是淺色？", "a4": "Safari 不允許延伸功能修改它自己的頁面，例如起始頁面、設定和閱讀列表。這些頁面會跟隨系統外觀，將裝置切換為深色模式即可。", "q5": "某個網站顯示不正常，該怎麼辦？", "a5": "在該網站打開夜貓選單，開啟「<strong>在此網站停用</strong>」。頁面會立即恢復原樣，夜貓也會記住這個設定。我們每隔幾週就會發布網站修正更新，更新後可以再開啟試試看。", "q6": "網站本身就是深色的，夜貓會再處理一次嗎？", "a6": "不會。夜貓會辨識自帶深色設計的網站並略過，此時工具列圖像會變成半透明。", "q7": "系統切換到淺色模式，網頁卻沒有變化？", "a7": "先在夜貓選單中看看目前的模式。在「<strong>跟隨系統</strong>」下，已打開的標籤頁會在 1 秒內恢復；在「<strong>永遠開啟</strong>」下，無論系統外觀為何，網頁都會維持深色。", "q8": "為什麼 PDF 沒有變暗？", "a8": "PDF、本機檔案和 Safari 自己的頁面是刻意維持原樣的。強制套用深色模式，常常會讓它們變成一片空白。", "q9": "頁面又變回淺色，或圖片看起來像被反相了？", "a9": "請關閉「<strong>智慧型反相</strong>」和「<strong>經典型反相</strong>」，它們會與夜貓衝突。iPhone 和 iPad：「<strong>設定 → 輔助使用 → 顯示與文字大小</strong>」。Mac：「<strong>系統設定 → 輔助使用 → 顯示器</strong>」。", "q10": "哪些功能免費？夜貓 Pro 增加了什麼？", "a10": "讓網頁好好顯示的功能永久免費：載入不閃白、邊緣不露白、跟隨系統、依網站控制、辨識自帶深色的網站，以及夜貓灰主題。<strong>夜貓 Pro</strong> 為一次性購買，增加純黑 OLED 等 5 款主題、自訂主題，以及亮度、對比和暖色調整。所有 Pro 功能可免費試用 14 天。", "q11": "免費試用怎麼用？", "a11": "打開「<strong>夜貓 Pro</strong>」，點一下「<strong>開始 14 天免費試用</strong>」。試用是一筆免費的 App 內購買項目，記在你的 Apple 帳號上：14 天內你所有裝置都能使用 Pro，每個 Apple 帳號只能試用一次。不會收費，也不會自動續訂。", "q12": "免費試用結束後會怎樣？", "a12": "夜貓會繼續正常運作，並換回夜貓灰。不會收取任何費用，也沒有需要取消的項目。你的自訂主題和調整都會保留，解鎖 Pro 後立即恢復。", "q13": "在 Mac 或 iPad 上需要再購買一次 Pro 嗎？", "a13": "不需要。使用同一個 Apple 帳號，購買一次 Pro 就能在 iPhone、iPad 和 Mac 上使用。如果某部裝置仍顯示免費版，請在 App 中打開「<strong>夜貓 Pro</strong>」，點一下「<strong>回復購買項目</strong>」。", "q14": "夜貓會顯示廣告或要求我評分嗎？", "a14": "網頁裡和夜貓選單裡都絕對不會。夜貓沒有廣告，Pro 只是 App 內一次性、可自由選擇的購買項目。"}, "ja": {"title": "Nocti · サポート", "app": "Nocti", "tagline": "iPhone・iPad・Mac の Safari をダークモードに", "support_h": "サポート", "contact_h": "お問い合わせ", "contact_p": "ご質問、不具合のご報告、表示がおかしいサイトなど、お気軽にメールください。通常 2 日以内に返信します。", "contact_btn": "メールを送る", "faq_h": "よくある質問", "privacy_link": "プライバシーポリシー", "q1": "Noctiは閲覧データを収集しますか？", "a1": "いいえ。Noctiはすべてデバイス上でページの色を変えており、閲覧履歴やページの内容を収集することはありません。匿名の使用状況データは送信します。サイトを報告したときやNoctiをオフにしたときはそのサイトのドメインも含まれ、どのサイトの対応が必要かを把握するのに使います。この送信は設定でオフにできます。", "q2": "NoctiがすべてのWebサイトへのアクセスを求めるのはなぜですか？", "a2": "ページをダークにするには、Noctiがページの色を読み取る必要があります。すべてのWebサイトへのアクセスを許可すると、どのページも最初のフレームからダークにできます。サイトごとに許可した場合、許可していないページは明るいままです。", "q3": "LINEやメールなどのアプリ内ではNoctiが動作しません。", "a3": "ほかのアプリ内で開いたページは、Safari機能拡張に対応していない内蔵ブラウザを使っています。<strong>Safariで開く</strong>（通常は•••または共有メニューにあります）をタップすれば、Noctiが動作します。", "q4": "新規タブやスタートページが明るいままなのはなぜですか？", "a4": "Safariでは、スタートページ、設定、リーディングリストなどSafari自体のページを機能拡張が変更することはできません。これらはシステムの外観に従うので、デバイスをダークモードにすればダークになります。", "q5": "Webサイトの表示がおかしい場合は？", "a5": "そのサイトでNoctiメニューを開き、<strong>このサイトで無効にする</strong>をオンにします。ページはすぐに元に戻り、Noctiはこの設定を記憶します。サイト対応のアップデートは数週間ごとに配信しているので、アップデート後にもう一度オンにして試してみてください。", "q6": "もともとダークなWebサイトを、Noctiがさらに暗くしてしまいませんか？", "a6": "いいえ。Noctiは独自のダークデザインを持つサイトを検出してスキップします。そのときはツールバーのアイコンが半透明になります。", "q7": "システムをライトモードにしたのに、何も変わりません。", "a7": "まずNoctiメニューで現在のモードを確認してください。<strong>システムに合わせる</strong>では、開いているタブが1秒以内に元に戻ります。<strong>常にオン</strong>では、システムの外観に関係なくWebサイトはダークのままです。", "q8": "PDFがダークにならないのはなぜですか？", "a8": "PDF、ローカルファイル、Safari自体のページは、あえてそのままにしています。これらを無理にダークにすると、真っ白になってしまうことが多いからです。", "q9": "ページが明るく戻る、または画像が反転して見える。", "a9": "<strong>スマート反転</strong>と<strong>クラシック反転</strong>をオフにしてください。Noctiと競合します。iPhoneとiPad：<strong>設定 → アクセシビリティ → 画面表示とテキストサイズ</strong>。Mac：<strong>システム設定 → アクセシビリティ → ディスプレイ</strong>。", "q10": "何が無料で、Nocti Proでは何が増えますか？", "a10": "ページを読みやすく保つ機能はずっと無料です。白いチラつきなし、明るい縁が残らない、システムに合わせる、サイトごとの設定、ダークなサイトの検出、そしてNoctiグレイテーマ。<strong>Nocti Pro</strong>は買い切りで、OLEDブラックなど5つのテーマ、カスタムテーマ、明るさ・コントラスト・暖かみの調整が加わります。Proのすべての機能を14日間無料でお試しいただけます。", "q11": "無料体験の仕組みは？", "a11": "<strong>Nocti Pro</strong>を開いて、<strong>14日間の無料体験を開始</strong>をタップします。無料体験は無料のApp内課金なので、お使いのApple Accountに紐づきます。14日間すべてのデバイスでProが使え、無料体験は1つのApple Accountにつき1回までです。料金はかからず、自動更新もありません。", "q12": "無料体験が終わるとどうなりますか？", "a12": "Noctiはそのまま使え、Noctiグレイに戻ります。料金は一切かからず、解約の手続きも不要です。カスタムテーマや調整内容は保存され、Proを購入するとすぐに元に戻ります。", "q13": "MacやiPadでNocti Proをもう一度購入する必要はありますか？", "a13": "いいえ。同じApple Accountなら、1回の購入でiPhone、iPad、MacのすべてでProが使えます。無料版のまま表示されるデバイスがある場合は、Appで<strong>Nocti Pro</strong>を開き、<strong>購入を復元</strong>をタップしてください。", "q14": "Noctiは広告を表示したり、評価を求めたりしますか？", "a14": "Webページ内やNoctiメニューに表示されることは一切ありません。Noctiに広告はなく、ProはこのApp内での1回限りの任意の購入です。"}, "ko": {"title": "Nocti · 지원", "app": "Nocti", "tagline": "iPhone, iPad, Mac의 Safari를 다크 모드로", "support_h": "지원", "contact_h": "문의하기", "contact_p": "궁금한 점, 버그 제보, 화면이 이상한 웹사이트가 있나요? 메일을 보내 주세요. 보통 2일 이내에 답장드립니다.", "contact_btn": "이메일 보내기", "faq_h": "자주 묻는 질문", "privacy_link": "개인정보 처리방침", "q1": "Nocti가 내 브라우징 데이터를 수집하나요?", "a1": "아니요. Nocti는 전적으로 기기에서 페이지 스타일을 바꾸며 브라우징 기록이나 페이지 내용을 절대 수집하지 않습니다. 어떤 사이트를 수정해야 하는지 알 수 있도록 익명 사용 데이터를 보내며, 사이트를 신고하거나 그 사이트에서 Nocti를 끌 때는 해당 사이트의 도메인이 포함됩니다. 이 기능은 설정에서 끌 수 있습니다.", "q2": "Nocti는 왜 모든 웹 사이트에 대한 접근을 요청하나요?", "a2": "Nocti가 페이지를 어둡게 하려면 페이지의 색상을 읽어야 합니다. 모든 웹 사이트에 접근할 수 있으면 모든 페이지를 첫 프레임부터 어둡게 표시할 수 있습니다. 사이트를 하나씩 허용하면 허용하지 않은 페이지는 밝게 남습니다.", "q3": "카카오톡, 메일 등 다른 앱에서는 Nocti가 작동하지 않아요.", "a3": "다른 앱 안에서 연 페이지는 Safari 확장 프로그램을 지원하지 않는 내장 브라우저를 사용합니다. <strong>Safari에서 열기</strong>(보통 ••• 또는 공유 메뉴에 있음)를 탭하면 Nocti가 작동합니다.", "q4": "새로운 탭 페이지나 시작 페이지는 왜 여전히 밝나요?", "a4": "Safari는 시작 페이지, 설정, 읽기 목록 같은 자체 페이지를 확장 프로그램이 바꾸지 못하게 합니다. 이런 페이지는 시스템 화면 모드를 따르므로 기기를 다크 모드로 바꾸면 어두워집니다.", "q5": "웹 사이트가 이상하게 보여요. 어떻게 하나요?", "a5": "해당 사이트에서 Nocti 메뉴를 열고 <strong>이 사이트에서 끄기</strong>를 켜세요. 페이지가 바로 원래대로 돌아오고 Nocti가 이 설정을 기억합니다. 몇 주마다 사이트 수정 업데이트를 배포하니 업데이트 후 다시 켜 보세요.", "q6": "이미 다크 디자인인 웹 사이트도 Nocti가 한 번 더 어둡게 하나요?", "a6": "아니요. Nocti는 자체 다크 디자인이 있는 사이트를 감지해 건너뜁니다. 이때 도구 막대 아이콘이 반투명해집니다.", "q7": "시스템을 라이트 모드로 바꿨는데 아무것도 바뀌지 않아요.", "a7": "먼저 Nocti 메뉴에서 모드를 확인하세요. <strong>시스템 설정 따르기</strong>에서는 열려 있는 탭이 1초 안에 원래대로 돌아갑니다. <strong>항상 켬</strong>에서는 시스템 화면 모드와 관계없이 웹 사이트가 계속 어둡게 표시됩니다.", "q8": "PDF는 왜 어두워지지 않나요?", "a8": "PDF, 로컬 파일, Safari 자체 페이지는 의도적으로 그대로 둡니다. 다크 모드를 강제로 적용하면 빈 화면이 되는 경우가 많기 때문입니다.", "q9": "페이지가 다시 밝아지거나 이미지가 반전되어 보여요.", "a9": "<strong>스마트 반전</strong>과 <strong>클래식 반전</strong>을 끄세요. Nocti와 충돌합니다. iPhone 및 iPad: <strong>설정 → 손쉬운 사용 → 디스플레이 및 텍스트 크기</strong>. Mac: <strong>시스템 설정 → 손쉬운 사용 → 디스플레이</strong>.", "q10": "무료 기능은 무엇이고, Nocti Pro는 무엇을 더하나요?", "a10": "페이지를 편하게 읽는 데 필요한 기능은 평생 무료입니다. 하얀 깜빡임 없음, 밝은 가장자리 없음, 시스템 설정 따르기, 사이트별 제어, 다크 사이트 감지, 그리고 Nocti 그레이 테마까지. <strong>Nocti Pro</strong>는 한 번만 구입하면 OLED 블랙을 포함한 테마 5종, 사용자 설정 테마, 밝기·대비·따뜻함 조절이 추가됩니다. Pro의 모든 기능을 14일 동안 무료로 체험할 수 있습니다.", "q11": "무료 체험은 어떻게 이용하나요?", "a11": "<strong>Nocti Pro</strong>를 열고 <strong>14일 무료 체험 시작</strong>을 탭하세요. 무료 체험은 무료 앱 내 구입이므로 Apple 계정에 귀속됩니다. 14일 동안 모든 기기에서 Pro가 잠금 해제되며, Apple 계정당 한 번만 사용할 수 있습니다. 요금이 청구되지 않으며 자동으로 갱신되지도 않습니다.", "q12": "무료 체험이 끝나면 어떻게 되나요?", "a12": "Nocti는 계속 작동하며 Nocti 그레이로 돌아갑니다. 요금은 청구되지 않으며 따로 취소할 것도 없습니다. 사용자 설정 테마와 조절 값은 보관되며, Pro를 잠금 해제하면 바로 다시 사용할 수 있습니다.", "q13": "Mac이나 iPad에서 Nocti Pro를 다시 구입해야 하나요?", "a13": "아니요. 같은 Apple 계정이라면 한 번 구입으로 iPhone, iPad, Mac 모두에서 Pro가 잠금 해제됩니다. 기기에 아직 무료 버전이 표시되면 앱에서 <strong>Nocti Pro</strong>를 열고 <strong>구입 항목 복원</strong>을 탭하세요.", "q14": "Nocti가 광고를 보여 주거나 평가를 요청하나요?", "a14": "웹 페이지나 Nocti 메뉴 안에서는 절대 표시되지 않습니다. Nocti에는 광고가 없으며, Pro는 이 앱 안에서 한 번만 구입하는 선택 사항입니다."}, "de": {"title": "Nocti · Support", "app": "Nocti", "tagline": "Dunkelmodus für Safari auf iPhone, iPad und Mac", "support_h": "Support", "contact_h": "Kontakt", "contact_p": "Fragen, Fehlermeldungen oder eine Website, die falsch aussieht? Schreib uns – wir antworten in der Regel innerhalb von zwei Tagen.", "contact_btn": "E-Mail schreiben", "faq_h": "FAQ", "privacy_link": "Datenschutzrichtlinie", "q1": "Erfasst Nocti meine Browserdaten?", "a1": "Nein. Nocti gestaltet Seiten komplett auf deinem Gerät um und erfasst nie deinen Browserverlauf oder Seiteninhalte. Es sendet anonyme Nutzungsdaten – inklusive der Domain einer Website, wenn du sie meldest oder Nocti dort ausschaltest –, damit wir wissen, welche Websites angepasst werden müssen. Du kannst das in den Einstellungen ausschalten.", "q2": "Warum fragt Nocti nach Zugriff auf alle Websites?", "a2": "Nocti muss die Farben einer Seite lesen, um sie dunkel zu machen. Mit Zugriff auf alle Websites kann es jede Seite ab dem ersten Frame abdunkeln. Erlaubst du Websites einzeln, bleiben nicht erlaubte Seiten hell.", "q3": "Nocti funktioniert nicht in Instagram, Mail oder anderen Apps.", "a3": "Seiten, die in anderen Apps geöffnet werden, nutzen einen integrierten Browser, der keine Safari-Erweiterungen unterstützt. Tippe auf <strong>In Safari öffnen</strong> (meist im ••• oder Teilen-Menü), dann funktioniert Nocti.", "q4": "Warum sind neue Tabs oder die Startseite noch hell?", "a4": "Safari erlaubt Erweiterungen nicht, seine eigenen Seiten wie die Startseite, Einstellungen und die Leseliste zu verändern. Diese folgen stattdessen dem Erscheinungsbild deines Systems – stell dein Gerät auf den dunklen Modus, damit sie dunkel werden.", "q5": "Eine Website sieht falsch aus. Was kann ich tun?", "a5": "Öffne auf dieser Website das Nocti-Menü und aktiviere <strong>Auf dieser Website deaktivieren</strong>. Die Seite sieht sofort wieder normal aus und Nocti merkt sich das. Wir veröffentlichen alle paar Wochen Website-Korrekturen – probier es nach einem Update also gern wieder aus.", "q6": "Eine Website ist schon dunkel. Dunkelt Nocti sie doppelt ab?", "a6": "Nein. Nocti erkennt Websites mit eigenem dunklen Design und überspringt sie. Das Symbol in der Symbolleiste wird dann blass.", "q7": "Ich habe mein System auf hell umgestellt, aber nichts hat sich geändert.", "a7": "Prüfe den Modus im Nocti-Menü. Bei <strong>Wie System</strong> wechseln offene Tabs innerhalb einer Sekunde zurück. Bei <strong>Immer an</strong> bleiben Websites dunkel, egal welches Erscheinungsbild das System hat.", "q8": "Warum werden PDFs nicht dunkel?", "a8": "PDFs, lokale Dateien und Safaris eigene Seiten bleiben absichtlich, wie sie sind. Ein erzwungener Dunkelmodus macht sie oft leer.", "q9": "Seiten werden wieder hell oder Bilder sehen invertiert aus.", "a9": "Schalte <strong>Intelligent umkehren</strong> und <strong>Klassisch umkehren</strong> aus – sie stören Nocti. Auf iPhone und iPad: <strong>Einstellungen → Bedienungshilfen → Anzeige &amp; Textgröße</strong>. Auf dem Mac: <strong>Systemeinstellungen → Bedienungshilfen → Anzeige</strong>.", "q10": "Was ist gratis und was bringt Nocti Pro?", "a10": "Alles, was Seiten gut lesbar macht, ist für immer gratis: kein weißes Aufblitzen, keine hellen Ränder, „Wie System“, Steuerung pro Website und Erkennung dunkler Websites, dazu das Theme Nocti Grau. <strong>Nocti Pro</strong> ist ein Einmalkauf und bringt OLED-Schwarz plus vier weitere Themes, eigene Themes sowie Regler für Helligkeit, Kontrast und Wärme. Du kannst Pro 14 Tage lang kostenlos testen.", "q11": "Wie funktioniert die kostenlose Testphase?", "a11": "Öffne <strong>Nocti Pro</strong> und tippe auf <strong>14 Tage kostenlos testen</strong>. Die Testphase ist ein kostenloser In-App-Kauf und gehört deshalb zu deinem Apple Account: Pro ist 14 Tage lang auf all deinen Geräten freigeschaltet, und jeder Apple Account kann sie einmal nutzen. Es wird nichts berechnet und nichts verlängert sich.", "q12": "Was passiert, wenn die kostenlose Testphase endet?", "a12": "Nocti funktioniert weiter und wechselt zurück zu Nocti Grau. Es wird nichts berechnet und du musst nichts kündigen. Deine eigenen Themes und Anpassungen bleiben erhalten und sind wieder da, sobald du Pro freischaltest.", "q13": "Muss ich Nocti Pro auf meinem Mac oder iPad noch einmal kaufen?", "a13": "Nein. Ein Kauf schaltet Pro auf iPhone, iPad und Mac mit demselben Apple Account frei. Zeigt ein Gerät noch die Gratisversion, öffne in der App <strong>Nocti Pro</strong> und tippe auf <strong>Käufe wiederherstellen</strong>.", "q14": "Zeigt Nocti Werbung oder bittet mich um Bewertungen?", "a14": "Niemals auf Webseiten oder im Nocti-Menü. Nocti hat keine Werbung – Pro ist ein einziger, optionaler Kauf in dieser App."}, "fr": {"title": "Nocti · Assistance", "app": "Nocti", "tagline": "Le mode sombre de Safari sur iPhone, iPad et Mac", "support_h": "Assistance", "contact_h": "Nous contacter", "contact_p": "Une question, un bug, un site qui s’affiche mal ? Écrivez-nous, nous répondons généralement sous deux jours.", "contact_btn": "Nous écrire", "faq_h": "FAQ", "privacy_link": "Politique de confidentialité", "q1": "Nocti collecte-t-il mes données de navigation ?", "a1": "Non. Nocti assombrit les pages entièrement sur votre appareil et ne collecte jamais votre historique de navigation ni le contenu des pages. Il envoie des données d’utilisation anonymes, y compris le domaine d’un site lorsque vous le signalez ou y désactivez Nocti, afin que nous sachions quels sites corriger. Vous pouvez désactiver cette option dans Réglages.", "q2": "Pourquoi Nocti demande-t-il l’accès à tous les sites web ?", "a2": "Nocti doit lire les couleurs d’une page pour l’assombrir. Avec l’accès à tous les sites web, il assombrit chaque page dès la première image. Si vous autorisez les sites un par un, les pages non autorisées restent claires.", "q3": "Nocti ne fonctionne pas dans WeChat, Mail ou d’autres apps.", "a3": "Les pages ouvertes dans d’autres apps utilisent un navigateur intégré qui ne prend pas en charge les extensions Safari. Touchez <strong>Ouvrir dans Safari</strong> (en général dans le menu ••• ou de partage) et Nocti fonctionnera.", "q4": "Pourquoi la page Nouvel onglet ou la page de démarrage reste-t-elle claire ?", "a4": "Safari ne permet pas aux extensions de modifier ses propres pages, comme la page de démarrage, les réglages et la liste de lecture. Elles suivent plutôt l’apparence du système — passez votre appareil en mode sombre pour les assombrir.", "q5": "Un site s’affiche mal. Que faire ?", "a5": "Ouvrez le menu Nocti sur ce site et activez <strong>Désactiver sur ce site</strong>. La page redevient normale immédiatement et Nocti s’en souvient. Nous publions régulièrement des corrections de sites : réessayez de le réactiver après une mise à jour.", "q6": "Un site est déjà sombre. Nocti va-t-il l’assombrir une seconde fois ?", "a6": "Non. Nocti détecte les sites qui ont leur propre design sombre et les ignore. L’icône de la barre d’outils s’estompe pour l’indiquer.", "q7": "J’ai passé mon appareil en mode clair, mais rien n’a changé.", "a7": "Vérifiez le mode dans le menu Nocti. En mode <strong>Suivre le système</strong>, les onglets ouverts repassent en clair en moins d’une seconde. En mode <strong>Toujours activé</strong>, les sites restent sombres quelle que soit l’apparence du système.", "q8": "Pourquoi les PDF ne sont-ils pas sombres ?", "a8": "Les PDF, les fichiers locaux et les pages propres à Safari restent tels quels, volontairement. Leur imposer le mode sombre les rend souvent vides.", "q9": "Les pages repassent en clair, ou les images semblent inversées.", "a9": "Désactivez <strong>Inversion intelligente</strong> et <strong>Inversion classique</strong> — elles entrent en conflit avec Nocti. Sur iPhone et iPad : <strong>Réglages → Accessibilité → Affichage et taille du texte</strong>. Sur Mac : <strong>Réglages Système → Accessibilité → Affichage</strong>.", "q10": "Qu’est-ce qui est gratuit, et qu’apporte Nocti Pro ?", "a10": "Tout ce qui rend les pages lisibles est gratuit pour toujours : pas de flash blanc, pas de bords lumineux, Suivre le système, réglages par site et détection des sites sombres, avec le thème Gris Nocti. <strong>Nocti Pro</strong> est un achat unique qui ajoute Noir OLED et quatre autres thèmes, les thèmes personnalisés et le réglage de la luminosité, du contraste et de la chaleur. Vous pouvez essayer tout Pro gratuitement pendant 14 jours.", "q11": "Comment fonctionne l’essai gratuit ?", "a11": "Ouvrez <strong>Nocti Pro</strong> et touchez <strong>Commencer l’essai gratuit de 14 jours</strong>. L’essai est un achat intégré gratuit, il est donc lié à votre compte Apple : Pro est débloqué pendant 14 jours sur tous vos appareils, et chaque compte Apple ne peut l’utiliser qu’une fois. Rien n’est facturé et rien n’est renouvelé.", "q12": "Que se passe-t-il à la fin de l’essai gratuit ?", "a12": "Nocti continue de fonctionner et revient à Gris Nocti. Rien n’est facturé et il n’y a rien à résilier. Vos thèmes personnalisés et réglages sont conservés et reviennent dès que vous débloquez Pro.", "q13": "Dois-je racheter Nocti Pro sur mon Mac ou mon iPad ?", "a13": "Non. Un seul achat débloque Pro sur iPhone, iPad et Mac avec le même compte Apple. Si un appareil affiche encore la version gratuite, ouvrez <strong>Nocti Pro</strong> dans l’app et touchez <strong>Restaurer les achats</strong>.", "q14": "Nocti affichera-t-il des publicités ou me demandera-t-il de le noter ?", "a14": "Jamais dans les pages web ni dans le menu Nocti. Nocti n’a pas de publicité — Pro est un achat unique et facultatif dans cette app."}, "es": {"title": "Nocti · Soporte", "app": "Nocti", "tagline": "Modo oscuro para Safari en iPhone, iPad y Mac", "support_h": "Soporte", "contact_h": "Contacto", "contact_p": "¿Dudas, errores o un sitio que se ve mal? Escríbenos; solemos responder en un plazo de dos días.", "contact_btn": "Escríbenos", "faq_h": "Preguntas frecuentes", "privacy_link": "Política de privacidad", "q1": "¿Recopila Nocti mis datos de navegación?", "a1": "No. Nocti cambia el estilo de las páginas por completo en tu dispositivo y nunca recopila tu historial de navegación ni el contenido de las páginas. Envía datos de uso anónimos, incluido el dominio de un sitio cuando lo notificas o desactivas Nocti en él, para que sepamos qué sitios hay que corregir. Puedes desactivarlo en Ajustes.", "q2": "¿Por qué Nocti pide acceso a todos los sitios web?", "a2": "Nocti tiene que leer los colores de una página para oscurecerla. Con acceso a todos los sitios web, puede oscurecer cada página desde el primer instante. Si permites los sitios uno a uno, las páginas que no hayas permitido se quedarán claras.", "q3": "Nocti no funciona en WeChat, Mail ni otras apps.", "a3": "Las páginas que se abren dentro de otras apps usan un navegador integrado que no admite extensiones de Safari. Toca <strong>Abrir en Safari</strong> (normalmente en el menú ••• o en el de compartir) y Nocti funcionará.", "q4": "¿Por qué la página de nueva pestaña o la página de inicio siguen claras?", "a4": "Safari no permite que las extensiones cambien sus propias páginas, como la página de inicio, los ajustes y la lista de lectura. Estas siguen el aspecto del sistema: cambia el dispositivo al modo oscuro para que se vean oscuras.", "q5": "Un sitio web se ve mal. ¿Qué puedo hacer?", "a5": "Abre el menú de Nocti en ese sitio y activa <strong>Desactivar en este sitio</strong>. La página vuelve a la normalidad al instante y Nocti lo recuerda. Publicamos correcciones de sitios cada pocas semanas, así que prueba a reactivarlo después de una actualización.", "q6": "Un sitio web ya tiene un diseño oscuro. ¿Lo oscurecerá Nocti dos veces?", "a6": "No. Nocti detecta los sitios con su propio diseño oscuro y los omite. El icono de la barra de herramientas se atenúa para indicarlo.", "q7": "He cambiado el sistema a modo claro, pero no ha cambiado nada.", "a7": "Comprueba el modo en el menú de Nocti. Con <strong>Seguir al sistema</strong>, las pestañas abiertas vuelven a la normalidad en menos de un segundo. Con <strong>Siempre activado</strong>, los sitios web siguen oscuros sea cual sea el aspecto del sistema.", "q8": "¿Por qué los PDF no se oscurecen?", "a8": "Los PDF, los archivos locales y las páginas propias de Safari se dejan como están a propósito. Forzar el modo oscuro en ellos suele dejarlos en blanco.", "q9": "Las páginas vuelven a verse claras o las imágenes parecen invertidas.", "a9": "Desactiva <strong>Inversión inteligente</strong> e <strong>Inversión clásica</strong>: entran en conflicto con Nocti. En el iPhone y el iPad: <strong>Ajustes → Accesibilidad → Pantalla y tamaño del texto</strong>. En el Mac: <strong>Ajustes del Sistema → Accesibilidad → Pantalla</strong>.", "q10": "¿Qué es gratis y qué añade Nocti Pro?", "a10": "Todo lo que hace que las páginas se lean bien es gratis para siempre: sin destellos blancos, sin bordes claros, «Seguir al sistema», control por sitio y detección de sitios oscuros, con el tema Gris Nocti. <strong>Nocti Pro</strong> es una compra única que añade Negro OLED y cuatro temas más, temas personalizados y ajustes de brillo, contraste y calidez. Puedes probar todo Pro gratis durante 14 días.", "q11": "¿Cómo funciona la prueba gratuita?", "a11": "Abre <strong>Nocti Pro</strong> y toca <strong>Empezar prueba gratuita de 14 días</strong>. La prueba es una compra gratuita dentro de la app, así que queda asociada a tu cuenta de Apple: Pro se desbloquea durante 14 días en todos tus dispositivos y cada cuenta de Apple puede usarla una vez. No se cobra nada y no se renueva nada.", "q12": "¿Qué pasa cuando termina la prueba gratuita?", "a12": "Nocti sigue funcionando y vuelve a Gris Nocti. No se cobra nada y no hay nada que cancelar. Tus temas personalizados y ajustes se conservan y vuelven en cuanto desbloqueas Pro.", "q13": "¿Tengo que volver a comprar Nocti Pro en mi Mac o iPad?", "a13": "No. Una sola compra desbloquea Pro en iPhone, iPad y Mac con la misma cuenta de Apple. Si un dispositivo sigue mostrando la versión gratuita, abre <strong>Nocti Pro</strong> en la app y toca <strong>Restaurar compras</strong>.", "q14": "¿Mostrará Nocti anuncios o me pedirá valoraciones?", "a14": "Nunca dentro de las páginas web ni en el menú de Nocti. Nocti no tiene anuncios: Pro es una única compra opcional dentro de esta app."}, "it": {"title": "Nocti · Supporto", "app": "Nocti", "tagline": "La modalità scura per Safari su iPhone, iPad e Mac", "support_h": "Supporto", "contact_h": "Contattaci", "contact_p": "Domande, segnalazioni di bug o un sito che non si vede bene? Scrivici: di solito rispondiamo entro due giorni.", "contact_btn": "Scrivici", "faq_h": "Domande frequenti", "privacy_link": "Informativa sulla privacy", "q1": "Nocti raccoglie i miei dati di navigazione?", "a1": "No. Nocti cambia lo stile delle pagine interamente sul tuo dispositivo e non raccoglie mai la cronologia di navigazione né i contenuti delle pagine. Invia dati di utilizzo anonimi, incluso il dominio di un sito quando lo segnali o disattivi Nocti su di esso, così sappiamo quali siti sistemare. Puoi disattivare questa opzione in Impostazioni.", "q2": "Perché Nocti chiede l’accesso a tutti i siti web?", "a2": "Nocti deve leggere i colori di una pagina per scurirla. Con l’accesso a tutti i siti web, può scurire ogni pagina fin dal primo istante. Se consenti i siti uno alla volta, le pagine che non hai consentito restano chiare.", "q3": "Nocti non funziona in WeChat, Mail o altre app.", "a3": "Le pagine aperte dentro altre app usano un browser integrato che non supporta le estensioni di Safari. Tocca <strong>Apri in Safari</strong> (di solito nel menu ••• o di condivisione) e Nocti funzionerà.", "q4": "Perché la pagina del nuovo pannello o la pagina iniziale sono ancora chiare?", "a4": "Safari non permette alle estensioni di modificare le sue pagine, come la pagina iniziale, le impostazioni e l’Elenco lettura. Queste seguono l’aspetto del sistema: passa il dispositivo alla modalità scura per renderle scure.", "q5": "Un sito web si vede male. Cosa posso fare?", "a5": "Apri il menu di Nocti su quel sito e attiva <strong>Disattiva su questo sito</strong>. La pagina torna subito normale e Nocti se lo ricorda. Pubblichiamo regolarmente correzioni per i siti, quindi prova a riattivarla dopo un aggiornamento.", "q6": "Un sito web ha già un design scuro. Nocti lo scurirà due volte?", "a6": "No. Nocti rileva i siti con un proprio design scuro e li salta. L’icona nella barra strumenti diventa sbiadita per indicarlo.", "q7": "Ho passato il sistema alla modalità chiara, ma non è cambiato nulla.", "a7": "Controlla la modalità nel menu di Nocti. Con <strong>Segui il sistema</strong>, i pannelli aperti tornano normali entro un secondo. Con <strong>Sempre attivo</strong>, i siti web restano scuri qualunque sia l’aspetto del sistema.", "q8": "Perché i PDF non diventano scuri?", "a8": "I PDF, i file locali e le pagine di Safari restano come sono, di proposito. Forzare la modalità scura su di essi spesso li rende bianchi.", "q9": "Le pagine tornano chiare o le immagini sembrano invertite.", "a9": "Disattiva <strong>Inversione smart</strong> e <strong>Inversione classica</strong>: sono in conflitto con Nocti. Su iPhone e iPad: <strong>Impostazioni → Accessibilità → Schermo e dimensioni testo</strong>. Su Mac: <strong>Impostazioni di Sistema → Accessibilità → Schermo</strong>.", "q10": "Cosa è gratis e cosa aggiunge Nocti Pro?", "a10": "Tutto ciò che rende le pagine leggibili è gratis per sempre: niente lampi bianchi, niente bordi chiari, “Segui il sistema”, controllo per sito e rilevamento dei siti scuri, con il tema Grigio Nocti. <strong>Nocti Pro</strong> è un acquisto una tantum che aggiunge Nero OLED e altri quattro temi, i temi personalizzati e le regolazioni di luminosità, contrasto e calore. Puoi provare tutto Pro gratis per 14 giorni.", "q11": "Come funziona la prova gratuita?", "a11": "Apri <strong>Nocti Pro</strong> e tocca <strong>Inizia la prova gratuita di 14 giorni</strong>. La prova è un acquisto in-app gratuito, quindi è legata al tuo account Apple: Pro resta sbloccato per 14 giorni su tutti i tuoi dispositivi e ogni account Apple può usarla una sola volta. Nessun addebito e nessun rinnovo.", "q12": "Cosa succede quando finisce la prova gratuita?", "a12": "Nocti continua a funzionare e torna a Grigio Nocti. Non viene addebitato nulla e non c’è niente da disdire. I tuoi temi personalizzati e le regolazioni vengono conservati e tornano non appena sblocchi Pro.", "q13": "Devo acquistare di nuovo Nocti Pro sul Mac o sull’iPad?", "a13": "No. Un solo acquisto sblocca Pro su iPhone, iPad e Mac con lo stesso account Apple. Se un dispositivo mostra ancora la versione gratuita, apri <strong>Nocti Pro</strong> nell’app e tocca <strong>Ripristina acquisti</strong>.", "q14": "Nocti mostrerà pubblicità o mi chiederà valutazioni?", "a14": "Mai nelle pagine web né nel menu di Nocti. Nocti non ha pubblicità: Pro è un unico acquisto facoltativo all’interno di questa app."}, "pt-BR": {"title": "Nocti · Suporte", "app": "Nocti", "tagline": "Modo escuro para o Safari no iPhone, iPad e Mac", "support_h": "Suporte", "contact_h": "Fale conosco", "contact_p": "Dúvidas, bugs ou um site que não está certo? Escreva para nós; costumamos responder em até dois dias.", "contact_btn": "Enviar e-mail", "faq_h": "Perguntas Frequentes", "privacy_link": "Política de Privacidade", "q1": "O Nocti coleta meus dados de navegação?", "a1": "Não. O Nocti escurece as páginas inteiramente no seu dispositivo e nunca coleta seu histórico de navegação nem o conteúdo das páginas. Ele envia dados de uso anônimos, incluindo o domínio de um site quando você o relata ou desativa o Nocti nele, para sabermos quais sites precisam de correção. Você pode desativar isso nos Ajustes.", "q2": "Por que o Nocti pede acesso a todos os sites?", "a2": "O Nocti precisa ler as cores de uma página para escurecê-la. Com acesso a todos os sites, ele escurece todas as páginas desde o primeiro instante. Se você permitir site por site, as páginas não permitidas continuam claras.", "q3": "O Nocti não funciona no Instagram, no Mail ou em outros apps.", "a3": "Páginas abertas dentro de outros apps usam um navegador embutido que não aceita extensões do Safari. Toque em <strong>Abrir no Safari</strong> (geralmente no menu ••• ou de compartilhamento) e o Nocti funcionará.", "q4": "Por que a página de nova aba ou a Página Inicial continua clara?", "a4": "O Safari não permite que extensões alterem as páginas dele, como a Página Inicial, os Ajustes e a Lista de Leitura. Elas seguem a aparência do sistema — mude o dispositivo para o modo Escuro para deixá-las escuras.", "q5": "Um site está com aparência errada. O que posso fazer?", "a5": "Abra o menu do Nocti nesse site e ative <strong>Desativar Neste Site</strong>. A página volta ao normal na hora e o Nocti se lembra disso. Lançamos correções de sites a cada poucas semanas, então tente reativá-lo depois de uma atualização.", "q6": "O site já tem um visual escuro. O Nocti vai escurecê-lo duas vezes?", "a6": "Não. O Nocti detecta sites com visual escuro próprio e não mexe neles. O ícone da barra de ferramentas fica esmaecido para indicar isso.", "q7": "Mudei o sistema para o modo Claro, mas nada mudou.", "a7": "Veja o modo no menu do Nocti. Em <strong>Seguir o Sistema</strong>, as abas abertas voltam ao normal em até um segundo. Em <strong>Sempre Ativado</strong>, os sites ficam escuros independentemente da aparência do sistema.", "q8": "Por que os PDFs não ficam escuros?", "a8": "PDFs, arquivos locais e as páginas do próprio Safari ficam como estão, de propósito. Forçar o modo escuro neles muitas vezes os deixa em branco.", "q9": "As páginas voltam a ficar claras ou as imagens parecem invertidas.", "a9": "Desative a <strong>Inversão Inteligente</strong> e a <strong>Inversão Clássica</strong> — elas entram em conflito com o Nocti. No iPhone e no iPad: <strong>Ajustes → Acessibilidade → Tela e Tamanho do Texto</strong>. No Mac: <strong>Ajustes do Sistema → Acessibilidade → Tela</strong>.", "q10": "O que é grátis e o que o Nocti Pro adiciona?", "a10": "Tudo o que deixa as páginas legíveis é grátis para sempre: sem clarão branco, sem bordas claras, Seguir o Sistema, controle por site e detecção de sites escuros, com o tema Cinza Nocti. O <strong>Nocti Pro</strong> é uma compra única que adiciona o Preto OLED e mais quatro temas, temas personalizados e ajustes de brilho, contraste e calor. Você pode testar todo o Pro grátis por 14 dias.", "q11": "Como funciona o teste grátis?", "a11": "Abra <strong>Nocti Pro</strong> e toque em <strong>Iniciar Teste Grátis de 14 Dias</strong>. O teste é uma compra gratuita dentro do app, por isso fica vinculado à sua Conta Apple: o Pro fica desbloqueado por 14 dias em todos os seus dispositivos, e cada Conta Apple pode usá-lo uma vez. Nada é cobrado e nada é renovado.", "q12": "O que acontece quando o teste grátis termina?", "a12": "O Nocti continua funcionando e volta para o Cinza Nocti. Nada é cobrado e não há nada para cancelar. Seus temas personalizados e ajustes são mantidos e voltam assim que você desbloquear o Pro.", "q13": "Preciso comprar o Nocti Pro de novo no Mac ou no iPad?", "a13": "Não. Uma compra desbloqueia o Pro no iPhone, iPad e Mac com a mesma Conta Apple. Se algum dispositivo ainda mostrar a versão gratuita, abra <strong>Nocti Pro</strong> no app e toque em <strong>Restaurar Compras</strong>.", "q14": "O Nocti vai mostrar anúncios ou pedir avaliações?", "a14": "Nunca dentro das páginas nem no menu do Nocti. O Nocti não tem anúncios — o Pro é uma compra única e opcional dentro deste app."}, "ru": {"title": "Nocti · Поддержка", "app": "Nocti", "tagline": "Тёмный режим для Safari на iPhone, iPad и Mac", "support_h": "Поддержка", "contact_h": "Связаться с нами", "contact_p": "Вопросы, сообщения об ошибках или сайт, который выглядит неправильно? Напишите нам — обычно мы отвечаем в течение двух дней.", "contact_btn": "Написать письмо", "faq_h": "Вопросы и ответы", "privacy_link": "Политика конфиденциальности", "q1": "Собирает ли Nocti данные о том, что я просматриваю?", "a1": "Нет. Nocti перекрашивает страницы только на вашем устройстве и никогда не собирает историю просмотров или содержимое страниц. Отправляются анонимные данные об использовании — в том числе домен сайта, если вы сообщаете о нем или отключаете для него Nocti, — чтобы мы знали, какие сайты нужно доработать. Это можно отключить в настройках.", "q2": "Почему Nocti запрашивает доступ ко всем сайтам?", "a2": "Чтобы сделать страницу темной, Nocti нужно прочитать ее цвета. С доступом ко всем сайтам он затемняет каждую страницу с первого кадра. Если разрешать сайты по одному, страницы без разрешения останутся светлыми.", "q3": "Nocti не работает в Telegram, Почте и других приложениях.", "a3": "Страницы, открытые в других приложениях, показываются во встроенном браузере, который не поддерживает расширения Safari. Коснитесь <strong>Открыть в Safari</strong> (обычно в меню ••• или «Поделиться»), и Nocti заработает.", "q4": "Почему новая вкладка или начальная страница остаются светлыми?", "a4": "Safari не позволяет расширениям менять свои страницы, например начальную страницу, настройки и список для чтения. Они следуют оформлению системы — включите на устройстве темное оформление, чтобы сделать их темными.", "q5": "Сайт отображается неправильно. Что делать?", "a5": "Откройте меню Nocti на этом сайте и включите <strong>Отключить на этом сайте</strong>. Страница сразу вернется к обычному виду, а Nocti это запомнит. Мы выпускаем исправления для сайтов раз в несколько недель, поэтому после обновления попробуйте включить Nocti снова.", "q6": "Сайт уже темный. Не затемнит ли его Nocti повторно?", "a6": "Нет. Nocti распознает сайты с собственным темным оформлением и пропускает их. Значок на панели инструментов при этом становится полупрозрачным.", "q7": "В системе включено светлое оформление, но ничего не изменилось.", "a7": "Проверьте режим в меню Nocti. В режиме <strong>Как в системе</strong> открытые вкладки возвращаются к обычному виду за секунду. В режиме <strong>Всегда включено</strong> сайты остаются темными при любом оформлении системы.", "q8": "Почему PDF не становятся темными?", "a8": "PDF, локальные файлы и собственные страницы Safari намеренно остаются как есть. Принудительный темный режим часто делает их пустыми.", "q9": "Страницы снова становятся светлыми или изображения выглядят инвертированными.", "a9": "Выключите <strong>Смарт-инверсию</strong> и <strong>Классическую инверсию</strong> — они конфликтуют с Nocti. На iPhone и iPad: <strong>Настройки → Универсальный доступ → Дисплей и размер текста</strong>. На Mac: <strong>Системные настройки → Универсальный доступ → Дисплей</strong>.", "q10": "Что бесплатно и что добавляет Nocti Pro?", "a10": "Все, что делает страницы удобными для чтения, бесплатно навсегда: без белых вспышек и светлых краев, режим «Как в системе», настройки для отдельных сайтов и распознавание темных сайтов, а также тема «Серый Nocti». <strong>Nocti Pro</strong> — разовая покупка, которая добавляет «Черный OLED» и еще четыре темы, свои темы, а также настройку яркости, контраста и теплоты. Все возможности Pro можно бесплатно попробовать в течение 14 дней.", "q11": "Как работает бесплатный пробный период?", "a11": "Откройте <strong>Nocti Pro</strong> и коснитесь <strong>Попробовать 14 дней бесплатно</strong>. Пробный период — это бесплатная встроенная покупка, поэтому он привязан к вашему Аккаунту Apple: Pro открыт на 14 дней на всех ваших устройствах, а каждый Аккаунт Apple может воспользоваться им один раз. Ничего не списывается и не продлевается.", "q12": "Что будет, когда закончится бесплатный пробный период?", "a12": "Nocti продолжит работать и вернется к теме «Серый Nocti». Никаких списаний, и ничего не нужно отменять. Ваши темы и настройки сохранятся и вернутся, как только вы разблокируете Pro.", "q13": "Нужно ли снова покупать Nocti Pro на Mac или iPad?", "a13": "Нет. Одна покупка активирует Pro на iPhone, iPad и Mac с тем же Аккаунтом Apple. Если на устройстве все еще бесплатная версия, откройте <strong>Nocti Pro</strong> в приложении и коснитесь <strong>Восстановить покупки</strong>.", "q14": "Будет ли Nocti показывать рекламу или просить оценку?", "a14": "Никогда — ни на веб-страницах, ни в меню Nocti. В Nocti нет рекламы: Pro — единственная необязательная покупка внутри этого приложения."}, "ar": {"title": "Nocti · الدعم", "app": "Nocti", "tagline": "وضع داكن لـ Safari على iPhone وiPad وMac", "support_h": "الدعم", "contact_h": "تواصل معنا", "contact_p": "هل لديك سؤال أو بلاغ عن خطأ أو موقع يظهر بشكل غير صحيح؟ راسلنا، وعادةً نردّ خلال يومين.", "contact_btn": "أرسل رسالة", "faq_h": "الأسئلة الشائعة", "privacy_link": "سياسة الخصوصية", "q1": "هل يجمع Nocti بيانات التصفح الخاصة بي؟", "a1": "لا. يعيد Nocti تنسيق الصفحات بالكامل على جهازك ولا يجمع أبدًا سجل التصفح أو محتوى الصفحات. وهو يرسل بيانات استخدام مجهولة، تشمل نطاق الموقع عندما تبلّغ عنه أو توقف Nocti عليه، لنعرف المواقع التي تحتاج إلى إصلاح. يمكنك إيقاف ذلك من الإعدادات.", "q2": "لماذا يطلب Nocti الوصول إلى كل مواقع الويب؟", "a2": "يحتاج Nocti إلى قراءة ألوان الصفحة ليجعلها داكنة. عند السماح له بالوصول إلى كل مواقع الويب، يمكنه جعل كل صفحة داكنة من أول إطار. وإذا سمحت بالمواقع واحدًا تلو الآخر، فستبقى الصفحات التي لم تسمح بها فاتحة.", "q3": "لا يعمل Nocti في Instagram أو البريد أو التطبيقات الأخرى.", "a3": "تستخدم الصفحات المفتوحة داخل التطبيقات الأخرى متصفحًا مدمجًا لا يدعم امتدادات Safari. اضغط على <strong>فتح في Safari</strong> (عادةً في قائمة ••• أو قائمة المشاركة) وسيعمل Nocti هناك.", "q4": "لماذا لا تزال صفحة علامة التبويب الجديدة أو صفحة البداية فاتحة؟", "a4": "لا يسمح Safari للامتدادات بتغيير صفحاته الخاصة، مثل صفحة البداية والإعدادات وقائمة القراءة. فهي تتبع مظهر نظامك بدلًا من ذلك — حوّل جهازك إلى الوضع الداكن لتصبح داكنة.", "q5": "موقع يبدو غير صحيح. ماذا أفعل؟", "a5": "افتح قائمة Nocti على ذلك الموقع وشغّل <strong>تعطيل على هذا الموقع</strong>. تعود الصفحة إلى طبيعتها فورًا ويتذكر Nocti ذلك. نُصدر إصلاحات للمواقع كل بضعة أسابيع، فجرّب إعادة تشغيله بعد التحديث.", "q6": "لموقع ما تصميم داكن بالفعل. هل سيجعله Nocti داكنًا مرتين؟", "a6": "لا. يكتشف Nocti المواقع ذات التصميم الداكن الخاص ويتخطاها. وتبهت أيقونة شريط الأدوات للدلالة على ذلك.", "q7": "حوّلت نظامي إلى الوضع الفاتح، لكن لم يتغير شيء.", "a7": "تحقّق من الوضع في قائمة Nocti. في وضع <strong>اتباع النظام</strong> تعود علامات التبويب المفتوحة إلى الفاتح خلال ثانية. في وضع <strong>تشغيل دائمًا</strong> تبقى المواقع داكنة أيًّا كان مظهر النظام.", "q8": "لماذا لا تصبح ملفات PDF داكنة؟", "a8": "تُترك ملفات PDF والملفات المحلية وصفحات Safari الخاصة كما هي عن قصد. ففرض الوضع الداكن عليها يجعلها غالبًا فارغة.", "q9": "تعود الصفحات إلى الفاتح، أو تبدو الصور معكوسة.", "a9": "أوقف <strong>القلب الذكي</strong> و<strong>القلب الكلاسيكي</strong> — فهما يتعارضان مع Nocti. على iPhone وiPad: <strong>الإعدادات ← تسهيلات الاستخدام ← الشاشة وحجم النص</strong>. على Mac: <strong>إعدادات النظام ← تسهيلات الاستخدام ← شاشة العرض</strong>.", "q10": "ما المجاني، وماذا يضيف Nocti Pro؟", "a10": "كل ما يُبقي الصفحات مقروءة مجاني للأبد: بلا ومضة بيضاء، بلا حواف ساطعة، اتباع النظام، التحكم لكل موقع، واكتشاف المواقع الداكنة، مع سمة رمادي Nocti. <strong>Nocti Pro</strong> عملية شراء لمرة واحدة تضيف أسود OLED وأربع سمات أخرى، والسمات المخصصة، وضبط السطوع والتباين والدفء. يمكنك تجربة كل ميزات Pro مجانًا لمدة 14 يومًا.", "q11": "كيف تعمل الفترة التجريبية المجانية؟", "a11": "افتح <strong>Nocti Pro</strong> واضغط على <strong>بدء فترة تجريبية مجانية لمدة 14 يومًا</strong>. الفترة التجريبية عملية شراء مجانية داخل التطبيق، لذا فهي مرتبطة بحساب Apple الخاص بك: يُفتح Pro لمدة 14 يومًا على جميع أجهزتك، ويمكن لكل حساب Apple استخدامها مرة واحدة. لا تُفرض أي رسوم ولا يتجدد أي شيء.", "q12": "ماذا يحدث عند انتهاء الفترة التجريبية المجانية؟", "a12": "يواصل Nocti العمل ويعود إلى رمادي Nocti. لا تُفرض أي رسوم ولا يوجد ما يلزم إلغاؤه. تُحفظ سماتك المخصصة وتعديلاتك، وتعود فور فتح Pro.", "q13": "هل أحتاج إلى شراء Nocti Pro مرة أخرى على Mac أو iPad؟", "a13": "لا. عملية شراء واحدة تفتح Pro على iPhone وiPad وMac باستخدام حساب Apple نفسه. إذا كان جهاز ما لا يزال يعرض الإصدار المجاني، فافتح <strong>Nocti Pro</strong> في التطبيق واضغط على <strong>استعادة المشتريات</strong>.", "q14": "هل سيعرض Nocti إعلانات أو يطلب مني التقييم؟", "a14": "أبدًا، لا داخل صفحات الويب ولا في قائمة Nocti. لا توجد إعلانات في Nocti، وPro عملية شراء واحدة اختيارية داخل هذا التطبيق."}, "bn": {"title": "Nocti · সহায়তা", "app": "Nocti", "tagline": "iPhone, iPad ও Mac-এ Safari-র জন্য ডার্ক মোড", "support_h": "সহায়তা", "contact_h": "যোগাযোগ করুন", "contact_p": "কোনো প্রশ্ন, বাগ রিপোর্ট, বা কোনো সাইট ঠিকমতো দেখাচ্ছে না? আমাদের ইমেল করুন, সাধারণত দুই দিনের মধ্যে উত্তর দিই।", "contact_btn": "ইমেল পাঠান", "faq_h": "সাধারণ প্রশ্নাবলি", "privacy_link": "গোপনীয়তা নীতি", "q1": "Nocti কি আমার ব্রাউজিং ডেটা সংগ্রহ করে?", "a1": "না। Nocti পুরোপুরি আপনার ডিভাইসেই পৃষ্ঠা নতুন করে সাজায় এবং কখনো আপনার ব্রাউজিং ইতিহাস বা পৃষ্ঠার কনটেন্ট সংগ্রহ করে না। এটি বেনামি ব্যবহারের ডেটা পাঠায় — আপনি কোনো সাইট রিপোর্ট করলে বা সেখানে Nocti বন্ধ করলে সেই সাইটের ডোমেনও — যাতে আমরা জানতে পারি কোন সাইটগুলো ঠিক করা দরকার। আপনি সেটিংসে এটি বন্ধ করতে পারেন।", "q2": "Nocti কেন সকল ওয়েবসাইটে অ্যাক্সেস চায়?", "a2": "পৃষ্ঠা ডার্ক করতে Nocti-কে তার রংগুলো পড়তে হয়। সকল ওয়েবসাইটে অ্যাক্সেস থাকলে এটি প্রতিটি পৃষ্ঠা একেবারে প্রথম ফ্রেম থেকেই ডার্ক করতে পারে। একটি একটি করে সাইটে অনুমতি দিলে, যেসব পৃষ্ঠায় অনুমতি দেননি সেগুলো হালকাই থাকে।", "q3": "Facebook, মেল বা অন্য অ্যাপে Nocti কাজ করে না।", "a3": "অন্য অ্যাপের ভেতরে খোলা পৃষ্ঠাগুলো একটি বিল্ট-ইন ব্রাউজার ব্যবহার করে, যা Safari এক্সটেনশন সমর্থন করে না। <strong>Safari-তে খুলুন</strong>-এ ট্যাপ করুন (সাধারণত ••• বা শেয়ার মেনুতে থাকে), তাহলে সেখানে Nocti কাজ করবে।", "q4": "নতুন ট্যাব পৃষ্ঠা বা শুরুর পৃষ্ঠা কেন এখনো হালকা?", "a4": "Safari এক্সটেনশনগুলোকে তার নিজস্ব পৃষ্ঠা — যেমন শুরুর পৃষ্ঠা, সেটিংস ও পড়ার তালিকা — বদলাতে দেয় না। এগুলো বরং আপনার সিস্টেমের চেহারা অনুসরণ করে; এগুলো ডার্ক করতে ডিভাইসটি ডার্ক মোডে নিন।", "q5": "কোনো ওয়েবসাইট ঠিকমতো দেখাচ্ছে না। কী করব?", "a5": "সেই সাইটে Nocti মেনু খুলে <strong>এই সাইটে বন্ধ করুন</strong> চালু করুন। পৃষ্ঠাটি সঙ্গে সঙ্গে স্বাভাবিক হয়ে যাবে এবং Nocti তা মনে রাখবে। আমরা কয়েক সপ্তাহ পরপর সাইট ফিক্স প্রকাশ করি, তাই আপডেটের পর আবার চালু করে দেখুন।", "q6": "ওয়েবসাইটটি আগে থেকেই ডার্ক। Nocti কি সেটিকে আবার ডার্ক করবে?", "a6": "না। নিজস্ব ডার্ক ডিজাইনের সাইটগুলো Nocti শনাক্ত করে এড়িয়ে যায়। তখন টুলবারের আইকনটি ঝাপসা হয়ে যায়।", "q7": "সিস্টেম লাইট মোডে বদলেছি, কিন্তু কিছুই বদলায়নি।", "a7": "Nocti মেনুতে মোডটি দেখুন। <strong>সিস্টেম অনুসারে</strong> মোডে খোলা ট্যাবগুলো এক সেকেন্ডের মধ্যে আগের মতো হয়ে যায়। <strong>সর্বদা চালু</strong> মোডে সিস্টেমের চেহারা যা-ই হোক, ওয়েবসাইট ডার্ক থাকে।", "q8": "PDF কেন ডার্ক হয় না?", "a8": "PDF, লোকাল ফাইল এবং Safari-র নিজস্ব পৃষ্ঠা ইচ্ছে করেই যেমন আছে তেমন রাখা হয়। এগুলোতে জোর করে ডার্ক মোড চাপালে প্রায়ই পুরো ফাঁকা হয়ে যায়।", "q9": "পৃষ্ঠা আবার হালকা হয়ে যাচ্ছে, বা ছবির রং উল্টে যাচ্ছে।", "a9": "<strong>স্মার্ট ইনভার্ট</strong> ও <strong>ক্লাসিক ইনভার্ট</strong> বন্ধ করুন — এগুলো Nocti-র সঙ্গে সংঘাত করে। iPhone ও iPad-এ: <strong>সেটিংস → অ্যাক্সেসিবিলিটি → ডিসপ্লে ও টেক্সট সাইজ</strong>। Mac-এ: <strong>সিস্টেম সেটিংস → অ্যাক্সেসিবিলিটি → ডিসপ্লে</strong>।", "q10": "কী কী বিনামূল্যে, আর Nocti Pro কী যোগ করে?", "a10": "পৃষ্ঠা পড়ার উপযোগী রাখার সবকিছুই চিরকাল বিনামূল্যে: সাদা ঝলক নেই, উজ্জ্বল কিনারা নেই, সিস্টেম অনুসারে, সাইট অনুযায়ী নিয়ন্ত্রণ ও ডার্ক সাইট শনাক্তকরণ, সঙ্গে Nocti ধূসর থিম। <strong>Nocti Pro</strong> একবারের কেনাকাটা, যা যোগ করে OLED কালো ও আরও চারটি থিম, কাস্টম থিম, এবং উজ্জ্বলতা, কনট্রাস্ট ও উষ্ণতা সামঞ্জস্য। পুরো Pro 14 দিন বিনামূল্যে ব্যবহার করে দেখতে পারেন।", "q11": "ফ্রি ট্রায়াল কীভাবে কাজ করে?", "a11": "<strong>Nocti Pro</strong> খুলুন এবং <strong>14 দিনের ফ্রি ট্রায়াল শুরু করুন</strong>-এ ট্যাপ করুন। ট্রায়ালটি একটি বিনামূল্যের ইন-অ্যাপ কেনাকাটা, তাই এটি আপনার Apple অ্যাকাউন্টের সঙ্গে যুক্ত থাকে: আপনার সব ডিভাইসে 14 দিনের জন্য Pro আনলক থাকে, আর প্রতিটি Apple অ্যাকাউন্ট এটি একবারই ব্যবহার করতে পারে। কোনো টাকা কাটা হয় না, কিছুই রিনিউ হয় না।", "q12": "ফ্রি ট্রায়াল শেষ হলে কী হয়?", "a12": "Nocti কাজ করতেই থাকে এবং Nocti ধূসরে ফিরে যায়। কোনো টাকা কাটা হয় না, বাতিল করারও কিছু নেই। আপনার কাস্টম থিম ও সামঞ্জস্যগুলো রেখে দেওয়া হয়, এবং Pro আনলক করলেই সেগুলো ফিরে আসে।", "q13": "Mac বা iPad-এ কি আবার Nocti Pro কিনতে হবে?", "a13": "না। একই Apple অ্যাকাউন্ট দিয়ে একবার কিনলেই iPhone, iPad ও Mac-এ Pro আনলক হয়। কোনো ডিভাইসে এখনো ফ্রি সংস্করণ দেখালে অ্যাপে <strong>Nocti Pro</strong> খুলে <strong>ক্রয় পুনরুদ্ধার করুন</strong>-এ ট্যাপ করুন।", "q14": "Nocti কি বিজ্ঞাপন দেখাবে বা রেটিং চাইবে?", "a14": "ওয়েব পৃষ্ঠার ভেতরে বা Nocti মেনুতে কখনোই না। Nocti-তে কোনো বিজ্ঞাপন নেই — Pro এই অ্যাপের ভেতরে একটিমাত্র, ঐচ্ছিক কেনাকাটা।"}, "ca": {"title": "Nocti · Assistència", "app": "Nocti", "tagline": "Mode fosc per a Safari a l’iPhone, l’iPad i el Mac", "support_h": "Assistència", "contact_h": "Contacta amb nosaltres", "contact_p": "Tens un dubte, has trobat un error o un web es veu malament? Escriu-nos; normalment responem en dos dies.", "contact_btn": "Envia un correu", "faq_h": "Preguntes freqüents", "privacy_link": "Política de privacitat", "q1": "El Nocti recull les meves dades de navegació?", "a1": "No. El Nocti canvia l’estil de les pàgines completament al dispositiu i no recull mai l’historial de navegació ni el contingut de les pàgines. Envia dades d’ús anònimes, incloent-hi el domini d’un lloc quan el notifiques o hi desactives el Nocti, perquè sapiguem quins llocs cal arreglar. Pots desactivar-ho a Configuració.", "q2": "Per què el Nocti demana accés a tots els llocs web?", "a2": "El Nocti ha de llegir els colors d’una pàgina per enfosquir-la. Amb accés a tots els llocs web, pot enfosquir cada pàgina des del primer fotograma. Si autoritzes els llocs un per un, les pàgines que no hagis autoritzat es queden clares.", "q3": "El Nocti no funciona a WeChat, a Mail o en altres apps.", "a3": "Les pàgines obertes dins d’altres apps fan servir un navegador integrat que no admet extensions del Safari. Toca <strong>Obrir al Safari</strong> (normalment al menú ••• o al de compartir) i el Nocti hi funcionarà.", "q4": "Per què la pàgina de pestanya nova o la pàgina d’inici continua sent clara?", "a4": "El Safari no deixa que les extensions modifiquin les seves pròpies pàgines, com la pàgina d’inici, la configuració i la llista de lectura. Aquestes segueixen l’aspecte del sistema: posa el dispositiu en mode fosc perquè es vegin fosques.", "q5": "Un lloc web es veu malament. Què puc fer?", "a5": "Obre el menú del Nocti en aquest lloc i activa <strong>Desactivar en aquest lloc</strong>. La pàgina torna a la normalitat a l’instant i el Nocti ho recorda. Publiquem correccions de llocs periòdicament, així que prova de tornar-lo a activar després d’una actualització.", "q6": "Un lloc web ja té un disseny fosc. El Nocti l’enfosquirà dues vegades?", "a6": "No. El Nocti detecta els llocs amb un disseny fosc propi i se’ls salta. La icona de la barra d’eines es torna translúcida per indicar-ho.", "q7": "He canviat el sistema al mode clar, però no ha canviat res.", "a7": "Comprova el mode al menú del Nocti. Amb <strong>Seguir el sistema</strong>, les pestanyes obertes tornen al mode clar en menys d’un segon. Amb <strong>Sempre activat</strong>, els llocs web es mantenen foscos sigui quin sigui l’aspecte del sistema.", "q8": "Per què els PDF no es tornen foscos?", "a8": "Els PDF, els fitxers locals i les pàgines pròpies del Safari es deixen tal com són, expressament. Forçar-hi el mode fosc sovint fa que quedin en blanc.", "q9": "Les pàgines tornen a ser clares, o les imatges semblen invertides.", "a9": "Desactiva <strong>Inversió intel·ligent</strong> i <strong>Inversió clàssica</strong>, perquè entren en conflicte amb el Nocti. A l’iPhone i l’iPad: <strong>Configuració → Accessibilitat → Pantalla i mida del text</strong>. Al Mac: <strong>Configuració del Sistema → Accessibilitat → Pantalla</strong>.", "q10": "Què és gratuït i què hi afegeix el Nocti Pro?", "a10": "Tot el que fa que les pàgines es puguin llegir és gratuït per sempre: sense flaixos blancs ni vores brillants, “Seguir el sistema”, control per lloc i detecció de llocs foscos, amb el tema Gris Nocti. El <strong>Nocti Pro</strong> és una compra única que afegeix el Negre OLED i quatre temes més, temes personalitzats i ajustos de brillantor, contrast i calidesa. Pots provar tot el Pro gratis durant 14 dies.", "q11": "Com funciona la prova gratuïta?", "a11": "Obre el <strong>Nocti Pro</strong> i toca <strong>Començar la prova gratuïta de 14 dies</strong>. La prova és una compra integrada gratuïta, així que va lligada al teu compte d’Apple: el Pro queda desbloquejat durant 14 dies a tots els teus dispositius, i cada compte d’Apple la pot fer servir una vegada. No es cobra res i no es renova res.", "q12": "Què passa quan s’acaba la prova gratuïta?", "a12": "El Nocti continua funcionant i torna al Gris Nocti. No es cobra res i no cal cancel·lar res. Els teus temes personalitzats i ajustos es conserven i tornen tan bon punt desbloqueges el Pro.", "q13": "He de tornar a comprar el Nocti Pro al Mac o a l’iPad?", "a13": "No. Amb una sola compra desbloqueges el Pro a l’iPhone, l’iPad i el Mac amb el mateix compte d’Apple. Si un dispositiu encara mostra la versió gratuïta, obre <strong>Nocti Pro</strong> a l’app i toca <strong>Restaurar les compres</strong>.", "q14": "El Nocti mostrarà anuncis o em demanarà valoracions?", "a14": "Mai dins de les pàgines web ni al menú del Nocti. El Nocti no té anuncis: el Pro és una única compra opcional dins d’aquesta app."}, "cs": {"title": "Nocti · Podpora", "app": "Nocti", "tagline": "Tmavý režim pro Safari na iPhonu, iPadu a Macu", "support_h": "Podpora", "contact_h": "Kontaktujte nás", "contact_p": "Máte dotaz, chcete nahlásit chybu nebo se vám nějaký web zobrazuje špatně? Napište nám, obvykle odpovídáme do dvou dnů.", "contact_btn": "Napsat e-mail", "faq_h": "Časté dotazy", "privacy_link": "Zásady ochrany soukromí", "q1": "Shromažďuje Nocti údaje o mém prohlížení?", "a1": "Ne. Nocti upravuje stránky výhradně ve vašem zařízení a nikdy neshromažďuje historii prohlížení ani obsah stránek. Odesílá anonymní údaje o používání, včetně domény webu, když ho nahlásíte nebo na něm Nocti vypnete, abychom věděli, které weby je potřeba opravit. Můžete to vypnout v Nastavení.", "q2": "Proč Nocti žádá o přístup ke všem webům?", "a2": "Aby Nocti mohlo stránku ztmavit, musí číst její barvy. S přístupem ke všem webům ztmaví každou stránku od prvního snímku. Když weby povolujete jednotlivě, stránky, které jste nepovolili, zůstanou světlé.", "q3": "Nocti nefunguje ve WeChatu, Mailu ani jiných aplikacích.", "a3": "Stránky otevřené v jiných aplikacích používají vestavěný prohlížeč, který nepodporuje rozšíření Safari. Klepněte na <strong>Otevřít v Safari</strong> (obvykle v nabídce ••• nebo Sdílet) a Nocti tam bude fungovat.", "q4": "Proč je nový panel nebo Úvodní stránka stále světlá?", "a4": "Safari nedovoluje rozšířením měnit své vlastní stránky, například Úvodní stránku, Nastavení nebo Seznam četby. Ty se místo toho řídí vzhledem systému — přepněte zařízení do tmavého režimu a ztmavnou.", "q5": "Web vypadá špatně. Co s tím?", "a5": "Otevřete na tom webu nabídku Nocti a zapněte <strong>Vypnout na tomto webu</strong>. Stránka se okamžitě vrátí do původního stavu a Nocti si to zapamatuje. Opravy webů vydáváme každých pár týdnů, takže to po aktualizaci zkuste znovu zapnout.", "q6": "Web už má vlastní tmavý vzhled. Ztmaví ho Nocti podruhé?", "a6": "Ne. Nocti rozpozná weby s vlastním tmavým vzhledem a přeskočí je. Ikona na nástrojovém panelu pak zprůhlední.", "q7": "Systém je ve světlém režimu, ale nic se nezměnilo.", "a7": "Zkontrolujte režim v nabídce Nocti. V režimu <strong>Podle systému</strong> se otevřené panely do sekundy přepnou zpět. V režimu <strong>Vždy zapnuto</strong> zůstávají weby tmavé bez ohledu na vzhled systému.", "q8": "Proč nejsou PDF tmavá?", "a8": "PDF, místní soubory a vlastní stránky Safari záměrně zůstávají beze změny. Vynucený tmavý režim by je často zobrazil prázdné.", "q9": "Stránky se vracejí do světlé podoby nebo obrázky vypadají invertované.", "a9": "Vypněte volby <strong>Chytrá inverze</strong> a <strong>Klasická inverze</strong> — kolidují s Nocti. Na iPhonu a iPadu: <strong>Nastavení → Zpřístupnění → Displej a velikost textu</strong>. Na Macu: <strong>Nastavení systému → Zpřístupnění → Displej</strong>.", "q10": "Co je zdarma a co přidává Nocti Pro?", "a10": "Vše, co udržuje stránky čitelné, je navždy zdarma: žádný bílý záblesk, žádné světlé okraje, režim Podle systému, ovládání jednotlivých webů a rozpoznávání tmavých webů, k tomu motiv Nocti šedá. <strong>Nocti Pro</strong> je jednorázový nákup, který přidává OLED černou a čtyři další motivy, vlastní motivy a nastavení jasu, kontrastu a teploty. Celé Pro můžete 14 dní zkoušet zdarma.", "q11": "Jak funguje zkušební verze zdarma?", "a11": "Otevřete <strong>Nocti Pro</strong> a klepněte na <strong>Vyzkoušet 14 dní zdarma</strong>. Zkušební verze je bezplatný nákup v aplikaci, takže patří k vašemu Apple účtu: Pro je odemčené na 14 dní ve všech vašich zařízeních a každý Apple účet ji může využít jednou. Nic se neúčtuje a nic se neobnovuje.", "q12": "Co se stane, až zkušební verze skončí?", "a12": "Nocti dál funguje a vrátí se k motivu Nocti šedá. Nic se neúčtuje a není co rušit. Vaše vlastní motivy a nastavení zůstanou zachovány a vrátí se, jakmile Pro odemknete.", "q13": "Musím si Nocti Pro na Macu nebo iPadu koupit znovu?", "a13": "Ne. Jeden nákup odemkne Pro na iPhonu, iPadu i Macu se stejným Apple účtem. Pokud některé zařízení stále ukazuje bezplatnou verzi, otevřete v aplikaci <strong>Nocti Pro</strong> a klepněte na <strong>Obnovit nákupy</strong>.", "q14": "Bude Nocti zobrazovat reklamy nebo žádat o hodnocení?", "a14": "Nikdy na webových stránkách ani v nabídce Nocti. Nocti nemá reklamy — Pro je jediný volitelný nákup v této aplikaci."}, "da": {"title": "Nocti · Support", "app": "Nocti", "tagline": "Mørk tilstand til Safari på iPhone, iPad og Mac", "support_h": "Support", "contact_h": "Kontakt os", "contact_p": "Har du et spørgsmål, en fejlrapport eller et websted, der ser forkert ud? Skriv til os – vi svarer som regel inden for to dage.", "contact_btn": "Skriv til os", "faq_h": "Ofte stillede spørgsmål", "privacy_link": "Anonymitetspolitik", "q1": "Indsamler Nocti mine browserdata?", "a1": "Nej. Nocti giver siderne nye farver udelukkende på din enhed og indsamler aldrig din browserhistorik eller sideindhold. Den sender anonyme brugsdata, herunder et websteds domæne, når du rapporterer det eller slår Nocti fra for det, så vi ved, hvilke websteder der skal rettes. Du kan slå det fra i Indstillinger.", "q2": "Hvorfor beder Nocti om adgang til alle websteder?", "a2": "Nocti skal læse en sides farver for at gøre den mørk. Med adgang til alle websteder kan den gøre alle sider mørke fra allerførste frame. Hvis du tillader websteder et ad gangen, forbliver de sider, du ikke har tilladt, lyse.", "q3": "Nocti virker ikke i Instagram, Mail eller andre apps.", "a3": "Sider, der åbnes i andre apps, bruger en indbygget browser, som ikke understøtter Safari-udvidelser. Tryk på <strong>Åbn i Safari</strong> (normalt i •••- eller delemenuen), så virker Nocti.", "q4": "Hvorfor er siden for ny fane eller Startside stadig lys?", "a4": "Safari lader ikke udvidelser ændre Safaris egne sider, f.eks. Startside, Indstillinger og Læseliste. De følger i stedet dit systems udseende – skift din enhed til mørk tilstand for at gøre dem mørke.", "q5": "Et websted ser forkert ud. Hvad kan jeg gøre?", "a5": "Åbn Nocti-menuen på webstedet, og slå <strong>Deaktiver på dette websted</strong> til. Siden bliver normal igen med det samme, og Nocti husker det. Vi udgiver rettelser til websteder med få ugers mellemrum, så prøv at slå den til igen efter en opdatering.", "q6": "Et websted har allerede et mørkt design. Gør Nocti det mørkt to gange?", "a6": "Nej. Nocti genkender websteder med deres eget mørke design og springer dem over. Ikonet på værktøjslinjen bliver falmet for at vise det.", "q7": "Jeg har skiftet mit system til lys tilstand, men intet ændrede sig.", "a7": "Tjek tilstanden i Nocti-menuen. Med <strong>Følg system</strong> skifter åbne faner tilbage inden for et sekund. Med <strong>Altid til</strong> forbliver websteder mørke uanset systemets udseende.", "q8": "Hvorfor bliver PDF'er ikke mørke?", "a8": "PDF'er, lokale arkiver og Safaris egne sider får bevidst lov at være, som de er. Hvis man tvinger mørk tilstand på dem, bliver de ofte tomme.", "q9": "Siderne bliver lyse igen, eller billederne ser inverterede ud.", "a9": "Slå <strong>Smart invertering</strong> og <strong>Klassisk invertering</strong> fra – de er i konflikt med Nocti. På iPhone og iPad: <strong>Indstillinger → Tilgængelighed → Skærm og tekststørrelse</strong>. På Mac: <strong>Systemindstillinger → Tilgængelighed → Skærm</strong>.", "q10": "Hvad er gratis, og hvad tilføjer Nocti Pro?", "a10": "Alt, der holder siderne læsbare, er gratis for altid: intet hvidt blink, ingen lyse kanter, Følg system, styring pr. websted og genkendelse af mørke websteder, med temaet Nocti Grå. <strong>Nocti Pro</strong> er et engangskøb, der tilføjer OLED-sort og fire andre temaer, egne temaer samt justering af lysstyrke, kontrast og varme. Du kan prøve hele Pro gratis i 14 dage.", "q11": "Hvordan fungerer den gratis prøveperiode?", "a11": "Åbn <strong>Nocti Pro</strong>, og tryk på <strong>Prøv gratis i 14 dage</strong>. Prøveperioden er et gratis køb i appen og hører derfor til din Apple-konto: Pro er låst op i 14 dage på alle dine enheder, og hver Apple-konto kan bruge den én gang. Du bliver ikke opkrævet noget, og intet fornyes.", "q12": "Hvad sker der, når den gratis prøveperiode slutter?", "a12": "Nocti bliver ved med at virke og skifter tilbage til Nocti Grå. Du bliver ikke opkrævet noget, og der er intet at opsige. Dine egne temaer og justeringer bliver gemt og kommer tilbage, så snart du låser Pro op.", "q13": "Skal jeg købe Nocti Pro igen på min Mac eller iPad?", "a13": "Nej. Ét køb låser Pro op på iPhone, iPad og Mac med den samme Apple-konto. Hvis en enhed stadig viser gratisversionen, så åbn <strong>Nocti Pro</strong> i appen, og tryk på <strong>Gendan køb</strong>.", "q14": "Viser Nocti reklamer eller beder mig om bedømmelser?", "a14": "Aldrig på websider eller i Nocti-menuen. Nocti har ingen reklamer – Pro er ét valgfrit køb i denne app."}, "el": {"title": "Nocti · Υποστήριξη", "app": "Nocti", "tagline": "Σκούρα λειτουργία για το Safari σε iPhone, iPad και Mac", "support_h": "Υποστήριξη", "contact_h": "Επικοινωνία", "contact_p": "Έχετε ερώτηση, αναφορά σφάλματος ή μια ιστοσελίδα που φαίνεται λάθος; Στείλτε μας email· συνήθως απαντάμε μέσα σε δύο ημέρες.", "contact_btn": "Στείλτε email", "faq_h": "Συχνές ερωτήσεις", "privacy_link": "Πολιτική απορρήτου", "q1": "Συλλέγει το Nocti τα δεδομένα περιήγησής μου;", "a1": "Όχι. Το Nocti αναμορφώνει τις σελίδες εξ ολοκλήρου στη συσκευή σας και δεν συλλέγει ποτέ το ιστορικό περιήγησης ή το περιεχόμενο των σελίδων. Στέλνει ανώνυμα δεδομένα χρήσης, μαζί με τον τομέα ενός ιστοτόπου όταν τον αναφέρετε ή απενεργοποιείτε το Nocti σε αυτόν, ώστε να ξέρουμε ποιοι ιστότοποι χρειάζονται διόρθωση. Μπορείτε να το απενεργοποιήσετε στις Ρυθμίσεις.", "q2": "Γιατί το Nocti ζητά πρόσβαση σε όλους τους ιστότοπους;", "a2": "Το Nocti πρέπει να διαβάσει τα χρώματα μιας σελίδας για να τη σκουρύνει. Με πρόσβαση σε όλους τους ιστότοπους, σκουραίνει κάθε σελίδα από το πρώτο κιόλας καρέ. Αν επιτρέπετε τους ιστότοπους έναν έναν, οι σελίδες που δεν έχετε επιτρέψει μένουν ανοιχτόχρωμες.", "q3": "Το Nocti δεν λειτουργεί στο Mail ή σε άλλες εφαρμογές.", "a3": "Οι σελίδες που ανοίγουν μέσα σε άλλες εφαρμογές χρησιμοποιούν ενσωματωμένο πρόγραμμα περιήγησης που δεν υποστηρίζει επεκτάσεις Safari. Αγγίξτε <strong>Άνοιγμα στο Safari</strong> (συνήθως στο μενού ••• ή κοινής χρήσης) και το Nocti θα λειτουργήσει εκεί.", "q4": "Γιατί η σελίδα νέας καρτέλας ή η Σελίδα έναρξης είναι ακόμα ανοιχτόχρωμη;", "a4": "Το Safari δεν επιτρέπει στις επεκτάσεις να αλλάζουν τις δικές του σελίδες, όπως τη Σελίδα έναρξης, τις Ρυθμίσεις και τη Λίστα ανάγνωσης. Αυτές ακολουθούν την εμφάνιση του συστήματος — αλλάξτε τη συσκευή σε σκούρα λειτουργία για να γίνουν σκούρες.", "q5": "Ένας ιστότοπος δεν εμφανίζεται σωστά. Τι μπορώ να κάνω;", "a5": "Ανοίξτε το μενού Nocti σε αυτόν τον ιστότοπο και ενεργοποιήστε την επιλογή <strong>Απενεργοποίηση σε αυτόν τον ιστότοπο</strong>. Η σελίδα επανέρχεται αμέσως στο κανονικό και το Nocti το θυμάται. Κυκλοφορούμε διορθώσεις ιστοτόπων κάθε λίγες εβδομάδες, οπότε δοκιμάστε να ενεργοποιήσετε ξανά το Nocti μετά από μια ενημέρωση.", "q6": "Ένας ιστότοπος έχει ήδη σκούρα σχεδίαση. Θα τον σκουρύνει το Nocti δύο φορές;", "a6": "Όχι. Το Nocti εντοπίζει τους ιστότοπους με δική τους σκούρα σχεδίαση και τους παρακάμπτει. Το εικονίδιο της γραμμής εργαλείων γίνεται αχνό για να το δείξει.", "q7": "Άλλαξα το σύστημα σε ανοιχτόχρωμη λειτουργία, αλλά δεν άλλαξε τίποτα.", "a7": "Ελέγξτε τη λειτουργία στο μενού Nocti. Στην <strong>Ακολούθηση συστήματος</strong>, οι ανοιχτές καρτέλες επανέρχονται μέσα σε ένα δευτερόλεπτο. Στο <strong>Πάντα ενεργό</strong>, οι ιστότοποι μένουν σκούροι όποια κι αν είναι η εμφάνιση του συστήματος.", "q8": "Γιατί τα PDF δεν γίνονται σκούρα;", "a8": "Τα PDF, τα τοπικά αρχεία και οι σελίδες του ίδιου του Safari μένουν σκόπιμα ως έχουν. Αν τους επιβληθεί σκούρα λειτουργία, συχνά γίνονται κενά.", "q9": "Οι σελίδες γίνονται ξανά ανοιχτόχρωμες ή οι εικόνες φαίνονται αντεστραμμένες.", "a9": "Απενεργοποιήστε την <strong>Έξυπνη αντιστροφή</strong> και την <strong>Κλασική αντιστροφή</strong> — συγκρούονται με το Nocti. Σε iPhone και iPad: <strong>Ρυθμίσεις → Προσβασιμότητα → Οθόνη και μέγεθος κειμένου</strong>. Σε Mac: <strong>Ρυθμίσεις συστήματος → Προσβασιμότητα → Οθόνη</strong>.", "q10": "Τι είναι δωρεάν και τι προσθέτει το Nocti Pro;", "a10": "Ό,τι κρατά τις σελίδες ευανάγνωστες είναι δωρεάν για πάντα: χωρίς λευκή λάμψη, χωρίς φωτεινές άκρες, Ακολούθηση συστήματος, έλεγχος ανά ιστότοπο και εντοπισμός σκούρων ιστοτόπων, μαζί με το θέμα Γκρι Nocti. Το <strong>Nocti Pro</strong> είναι εφάπαξ αγορά που προσθέτει το Μαύρο OLED και τέσσερα ακόμα θέματα, προσαρμοσμένα θέματα και ρυθμίσεις φωτεινότητας, αντίθεσης και θερμότητας. Μπορείτε να δοκιμάσετε όλο το Pro δωρεάν για 14 ημέρες.", "q11": "Πώς λειτουργεί η δωρεάν δοκιμή;", "a11": "Ανοίξτε το <strong>Nocti Pro</strong> και αγγίξτε <strong>Έναρξη δωρεάν δοκιμής 14 ημερών</strong>. Η δοκιμή είναι μια δωρεάν αγορά εντός εφαρμογής, οπότε ανήκει στον Λογαριασμό Apple σας: το Pro ξεκλειδώνεται για 14 ημέρες σε όλες τις συσκευές σας και κάθε Λογαριασμός Apple μπορεί να τη χρησιμοποιήσει μία φορά. Δεν υπάρχει καμία χρέωση και τίποτα δεν ανανεώνεται.", "q12": "Τι γίνεται όταν λήξει η δωρεάν δοκιμή;", "a12": "Το Nocti συνεχίζει να λειτουργεί και επιστρέφει στο Γκρι Nocti. Δεν υπάρχει καμία χρέωση και τίποτα για ακύρωση. Τα προσαρμοσμένα θέματα και οι ρυθμίσεις σας διατηρούνται και επιστρέφουν μόλις ξεκλειδώσετε το Pro.", "q13": "Πρέπει να αγοράσω ξανά το Nocti Pro στο Mac ή στο iPad μου;", "a13": "Όχι. Μία αγορά ξεκλειδώνει το Pro σε iPhone, iPad και Mac με τον ίδιο Λογαριασμό Apple. Αν μια συσκευή εμφανίζει ακόμα τη δωρεάν έκδοση, ανοίξτε το <strong>Nocti Pro</strong> στην εφαρμογή και αγγίξτε <strong>Επαναφορά αγορών</strong>.", "q14": "Θα εμφανίσει το Nocti διαφημίσεις ή θα μου ζητήσει αξιολογήσεις;", "a14": "Ποτέ μέσα σε ιστοσελίδες ή στο μενού Nocti. Το Nocti δεν έχει διαφημίσεις — το Pro είναι μία, προαιρετική αγορά μέσα σε αυτή την εφαρμογή."}, "es-419": {"title": "Nocti · Soporte", "app": "Nocti", "tagline": "Modo oscuro para Safari en iPhone, iPad y Mac", "support_h": "Soporte", "contact_h": "Contáctanos", "contact_p": "¿Tienes dudas, errores o un sitio que se ve mal? Escríbenos; normalmente respondemos en un plazo de dos días.", "contact_btn": "Escríbenos", "faq_h": "Preguntas frecuentes", "privacy_link": "Política de privacidad", "q1": "¿Recopila Nocti mis datos de navegación?", "a1": "No. Nocti cambia el estilo de las páginas por completo en tu dispositivo y nunca recopila tu historial de navegación ni el contenido de las páginas. Envía datos de uso anónimos, incluido el dominio de un sitio cuando lo notificas o desactivas Nocti en él, para que sepamos qué sitios hay que corregir. Puedes desactivarlo en Configuración.", "q2": "¿Por qué Nocti pide acceso a todos los sitios web?", "a2": "Nocti tiene que leer los colores de una página para oscurecerla. Con acceso a todos los sitios web, puede oscurecer cada página desde el primer instante. Si permites los sitios uno a uno, las páginas que no hayas permitido se quedarán claras.", "q3": "Nocti no funciona en WeChat, Mail ni otras apps.", "a3": "Las páginas que se abren dentro de otras apps usan un navegador integrado que no admite extensiones de Safari. Toca <strong>Abrir en Safari</strong> (normalmente en el menú ••• o en el de compartir) y Nocti funcionará.", "q4": "¿Por qué la página de nueva pestaña o la página de inicio siguen claras?", "a4": "Safari no permite que las extensiones cambien sus propias páginas, como la página de inicio, la configuración y la lista de lectura. Estas siguen la apariencia del sistema: cambia el dispositivo al modo oscuro para que se vean oscuras.", "q5": "Un sitio web se ve mal. ¿Qué puedo hacer?", "a5": "Abre el menú de Nocti en ese sitio y activa <strong>Desactivar en este sitio</strong>. La página vuelve a la normalidad al instante y Nocti lo recuerda. Publicamos correcciones de sitios cada pocas semanas, así que prueba a reactivarlo después de una actualización.", "q6": "Un sitio web ya tiene un diseño oscuro. ¿Lo oscurecerá Nocti dos veces?", "a6": "No. Nocti detecta los sitios con su propio diseño oscuro y los omite. El ícono de la barra de herramientas se atenúa para indicarlo.", "q7": "Cambié el sistema a modo claro, pero no cambió nada.", "a7": "Revisa el modo en el menú de Nocti. Con <strong>Seguir al sistema</strong>, las pestañas abiertas vuelven a la normalidad en menos de un segundo. Con <strong>Siempre activado</strong>, los sitios web siguen oscuros sea cual sea la apariencia del sistema.", "q8": "¿Por qué los PDF no se oscurecen?", "a8": "Los PDF, los archivos locales y las páginas propias de Safari se dejan como están a propósito. Forzar el modo oscuro en ellos suele dejarlos en blanco.", "q9": "Las páginas vuelven a verse claras o las imágenes parecen invertidas.", "a9": "Desactiva <strong>Inversión inteligente</strong> e <strong>Inversión clásica</strong>: entran en conflicto con Nocti. En el iPhone y el iPad: <strong>Configuración → Accesibilidad → Pantalla y tamaño del texto</strong>. En el Mac: <strong>Configuración del Sistema → Accesibilidad → Pantalla</strong>.", "q10": "¿Qué es gratis y qué agrega Nocti Pro?", "a10": "Todo lo que hace que las páginas se lean bien es gratis para siempre: sin destellos blancos, sin bordes claros, “Seguir al sistema”, control por sitio y detección de sitios oscuros, con el tema Gris Nocti. <strong>Nocti Pro</strong> es una compra única que agrega Negro OLED y cuatro temas más, temas personalizados y ajustes de brillo, contraste y calidez. Puedes probar todo Pro gratis durante 14 días.", "q11": "¿Cómo funciona la prueba gratuita?", "a11": "Abre <strong>Nocti Pro</strong> y toca <strong>Comenzar prueba gratuita de 14 días</strong>. La prueba es una compra gratuita dentro de la app, así que queda asociada a tu cuenta de Apple: Pro se desbloquea durante 14 días en todos tus dispositivos y cada cuenta de Apple puede usarla una vez. No se cobra nada y no se renueva nada.", "q12": "¿Qué pasa cuando termina la prueba gratuita?", "a12": "Nocti sigue funcionando y vuelve a Gris Nocti. No se cobra nada y no hay nada que cancelar. Tus temas personalizados y ajustes se conservan y vuelven en cuanto desbloqueas Pro.", "q13": "¿Tengo que volver a comprar Nocti Pro en mi Mac o iPad?", "a13": "No. Una sola compra desbloquea Pro en iPhone, iPad y Mac con la misma cuenta de Apple. Si un dispositivo sigue mostrando la versión gratuita, abre <strong>Nocti Pro</strong> en la app y toca <strong>Restaurar compras</strong>.", "q14": "¿Mostrará Nocti anuncios o me pedirá calificaciones?", "a14": "Nunca dentro de las páginas web ni en el menú de Nocti. Nocti no tiene anuncios: Pro es una única compra opcional dentro de esta app."}, "fi": {"title": "Nocti · Tuki", "app": "Nocti", "tagline": "Tumma tila Safarille iPhonessa, iPadissa ja Macissa", "support_h": "Tuki", "contact_h": "Ota yhteyttä", "contact_p": "Kysyttävää, virheilmoitus tai sivusto, joka näyttää väärältä? Lähetä meille sähköpostia – vastaamme yleensä kahden päivän kuluessa.", "contact_btn": "Lähetä sähköpostia", "faq_h": "UKK", "privacy_link": "Tietosuojakäytäntö", "q1": "Kerääkö Nocti selaustietojani?", "a1": "Ei. Nocti muotoilee sivut kokonaan laitteellasi eikä koskaan kerää selaushistoriaasi tai sivujen sisältöä. Se lähettää anonyymejä käyttötietoja, kuten sivuston verkkotunnuksen, kun ilmoitat sivustosta tai laitat Noctin pois päältä sillä, jotta tiedämme, mitkä sivustot kaipaavat korjausta. Voit laittaa tämän pois päältä Asetuksista.", "q2": "Miksi Nocti pyytää pääsyä kaikille verkkosivustoille?", "a2": "Noctin täytyy lukea sivun värit tummentaakseen sen. Kun sillä on pääsy kaikille verkkosivustoille, se voi tummentaa jokaisen sivun heti ensimmäisestä ruudusta. Jos sallit sivustot yksi kerrallaan, sallimattomat sivut pysyvät vaaleina.", "q3": "Nocti ei toimi WeChatissa, Mailissa tai muissa apeissa.", "a3": "Muissa apeissa avatut sivut käyttävät sisäänrakennettua selainta, joka ei tue Safari-laajennuksia. Napauta <strong>Avaa Safarissa</strong> (yleensä •••- tai jakovalikossa), niin Nocti toimii siellä.", "q4": "Miksi uuden välilehden sivu tai Aloitussivu on yhä vaalea?", "a4": "Safari ei anna laajennusten muuttaa omia sivujaan, kuten Aloitussivua, Asetuksia ja Lukulistaa. Ne seuraavat järjestelmän ulkoasua – vaihda laite tummaan tilaan, niin nekin tummuvat.", "q5": "Verkkosivusto näyttää väärältä. Mitä voin tehdä?", "a5": "Avaa Nocti-valikko kyseisellä sivustolla ja laita päälle <strong>Poista käytöstä tällä sivustolla</strong>. Sivu palautuu heti normaaliksi, ja Nocti muistaa valinnan. Julkaisemme sivustokorjauksia muutaman viikon välein, joten kokeile laittaa se takaisin päälle päivityksen jälkeen.", "q6": "Verkkosivustolla on jo tumma ulkoasu. Tummentaako Nocti sen kahdesti?", "a6": "Ei. Nocti tunnistaa sivustot, joilla on oma tumma ulkoasu, ja ohittaa ne. Työkalupalkin kuvake haalistuu merkiksi tästä.", "q7": "Vaihdoin järjestelmän vaaleaan tilaan, mutta mikään ei muuttunut.", "a7": "Tarkista tila Nocti-valikosta. <strong>Seuraa järjestelmää</strong> ‑tilassa avoimet välilehdet vaihtuvat takaisin sekunnissa. <strong>Aina päällä</strong> ‑tilassa verkkosivustot pysyvät tummina järjestelmän ulkoasusta riippumatta.", "q8": "Miksi PDF:t eivät ole tummia?", "a8": "PDF:t, paikalliset tiedostot ja Safarin omat sivut jätetään tarkoituksella ennalleen. Tumman tilan pakottaminen niihin tekee ne usein tyhjiksi.", "q9": "Sivut vaihtuvat takaisin vaaleiksi, tai kuvat näyttävät käänteisiltä.", "a9": "Laita <strong>Älykäs käänteinen</strong> ja <strong>Perinteinen käänteinen</strong> pois päältä – ne ovat ristiriidassa Noctin kanssa. iPhonessa ja iPadissa: <strong>Asetukset → Käyttöapu → Näyttö ja tekstin koko</strong>. Macissa: <strong>Järjestelmäasetukset → Käyttöapu → Näyttö</strong>.", "q10": "Mikä on ilmaista, ja mitä Nocti Pro lisää?", "a10": "Kaikki, mikä pitää sivut luettavina, on ikuisesti ilmaista: ei valkoista välähdystä, ei vaaleita reunoja, Seuraa järjestelmää, sivustokohtaiset asetukset ja tummien sivustojen tunnistus sekä teema Nocti-harmaa. <strong>Nocti Pro</strong> on kertaosto, joka lisää OLED-mustan ja neljä muuta teemaa, omat teemat sekä kirkkauden, kontrastin ja lämmön säädöt. Voit kokeilla koko Prota ilmaiseksi 14 päivän ajan.", "q11": "Miten ilmaine
