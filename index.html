n kokeilu toimii?", "a11": "Avaa <strong>Nocti Pro</strong> ja napauta <strong>Kokeile ilmaiseksi 14 päivää</strong>. Kokeilu on ilmainen appin sisäinen osto, joten se kuuluu Apple-tilillesi: Pro on käytössä 14 päivää kaikilla laitteillasi, ja kukin Apple-tili voi käyttää kokeilun kerran. Mitään ei veloiteta eikä mitään uusita.", "q12": "Mitä tapahtuu, kun ilmainen kokeilu päättyy?", "a12": "Nocti toimii edelleen ja palaa Nocti-harmaaseen. Mitään ei veloiteta eikä mitään tarvitse perua. Omat teemasi ja säätösi säilyvät ja palaavat heti, kun avaat Pron.", "q13": "Pitääkö Nocti Pro ostaa uudelleen Macille tai iPadille?", "a13": "Ei. Yksi ostos avaa Pron iPhonessa, iPadissa ja Macissa samalla Apple-tilillä. Jos laite näyttää yhä ilmaisversiota, avaa apissa <strong>Nocti Pro</strong> ja napauta <strong>Palauta ostot</strong>.", "q14": "Näyttääkö Nocti mainoksia tai pyytääkö se arvostelemaan?", "a14": "Ei koskaan verkkosivuilla eikä Nocti-valikossa. Noctissa ei ole mainoksia – Pro on yksi valinnainen osto tässä appissa."}, "fr-CA": {"title": "Nocti · Assistance", "app": "Nocti", "tagline": "Le mode sombre de Safari sur iPhone, iPad et Mac", "support_h": "Assistance", "contact_h": "Nous joindre", "contact_p": "Une question, un bogue, un site qui s’affiche mal? Écrivez-nous, nous répondons habituellement en deux jours.", "contact_btn": "Nous écrire", "faq_h": "FAQ", "privacy_link": "Politique de confidentialité", "q1": "Nocti collecte-t-il mes données de navigation?", "a1": "Non. Nocti assombrit les pages entièrement sur votre appareil et ne collecte jamais votre historique de navigation ni le contenu des pages. Il envoie des données d’utilisation anonymes, y compris le domaine d’un site lorsque vous le signalez ou y désactivez Nocti, afin que nous sachions quels sites corriger. Vous pouvez désactiver cette option dans Réglages.", "q2": "Pourquoi Nocti demande-t-il l’accès à tous les sites Web?", "a2": "Nocti doit lire les couleurs d’une page pour l’assombrir. Avec l’accès à tous les sites Web, il assombrit chaque page dès la première image. Si vous autorisez les sites un par un, les pages non autorisées restent claires.", "q3": "Nocti ne fonctionne pas dans WeChat, Mail ou d’autres apps.", "a3": "Les pages ouvertes dans d’autres apps utilisent un navigateur intégré qui ne prend pas en charge les extensions Safari. Touchez <strong>Ouvrir dans Safari</strong> (en général dans le menu ••• ou de partage) et Nocti fonctionnera.", "q4": "Pourquoi la page Nouvel onglet ou la page de démarrage reste-t-elle claire?", "a4": "Safari ne permet pas aux extensions de modifier ses propres pages, comme la page de démarrage, les réglages et la liste de lecture. Elles suivent plutôt l’apparence du système — passez votre appareil en mode sombre pour les assombrir.", "q5": "Un site s’affiche mal. Que faire?", "a5": "Ouvrez le menu Nocti sur ce site et activez <strong>Désactiver sur ce site</strong>. La page redevient normale immédiatement et Nocti s’en souvient. Nous publions régulièrement des corrections de sites : réessayez de le réactiver après une mise à jour.", "q6": "Un site est déjà sombre. Nocti va-t-il l’assombrir une seconde fois?", "a6": "Non. Nocti détecte les sites qui ont leur propre design sombre et les ignore. L’icône de la barre d’outils s’estompe pour l’indiquer.", "q7": "J’ai passé mon appareil en mode clair, mais rien n’a changé.", "a7": "Vérifiez le mode dans le menu Nocti. En mode <strong>Suivre le système</strong>, les onglets ouverts repassent en clair en moins d’une seconde. En mode <strong>Toujours activé</strong>, les sites restent sombres quelle que soit l’apparence du système.", "q8": "Pourquoi les PDF ne sont-ils pas sombres?", "a8": "Les PDF, les fichiers locaux et les pages propres à Safari restent tels quels, volontairement. Leur imposer le mode sombre les rend souvent vides.", "q9": "Les pages repassent en clair, ou les images semblent inversées.", "a9": "Désactivez <strong>Inversion intelligente</strong> et <strong>Inversion classique</strong> — elles entrent en conflit avec Nocti. Sur iPhone et iPad : <strong>Réglages → Accessibilité → Affichage et taille du texte</strong>. Sur Mac : <strong>Réglages Système → Accessibilité → Affichage</strong>.", "q10": "Qu’est-ce qui est gratuit, et qu’apporte Nocti Pro?", "a10": "Tout ce qui rend les pages lisibles est gratuit pour toujours : pas de flash blanc, pas de bords lumineux, Suivre le système, réglages par site et détection des sites sombres, avec le thème Gris Nocti. <strong>Nocti Pro</strong> est un achat unique qui ajoute Noir OLED et quatre autres thèmes, les thèmes personnalisés et le réglage de la luminosité, du contraste et de la chaleur. Vous pouvez essayer tout Pro gratuitement pendant 14 jours.", "q11": "Comment fonctionne l’essai gratuit?", "a11": "Ouvrez <strong>Nocti Pro</strong> et touchez <strong>Commencer l’essai gratuit de 14 jours</strong>. L’essai est un achat intégré gratuit, il est donc lié à votre compte Apple : Pro est débloqué pendant 14 jours sur tous vos appareils, et chaque compte Apple ne peut l’utiliser qu’une fois. Rien n’est facturé et rien n’est renouvelé.", "q12": "Que se passe-t-il à la fin de l’essai gratuit?", "a12": "Nocti continue de fonctionner et revient à Gris Nocti. Rien n’est facturé et il n’y a rien à résilier. Vos thèmes personnalisés et réglages sont conservés et reviennent dès que vous débloquez Pro.", "q13": "Dois-je racheter Nocti Pro sur mon Mac ou mon iPad?", "a13": "Non. Un seul achat débloque Pro sur iPhone, iPad et Mac avec le même compte Apple. Si un appareil affiche encore la version gratuite, ouvrez <strong>Nocti Pro</strong> dans l’app et touchez <strong>Restaurer les achats</strong>.", "q14": "Nocti affichera-t-il des publicités ou me demandera-t-il de le noter?", "a14": "Jamais dans les pages Web ni dans le menu Nocti. Nocti n’a pas de publicité — Pro est un achat unique et facultatif dans cette app."}, "gu": {"title": "Nocti · સપોર્ટ", "app": "Nocti", "tagline": "iPhone, iPad અને Mac પર Safari માટે ડાર્ક મોડ", "support_h": "સપોર્ટ", "contact_h": "અમારો સંપર્ક કરો", "contact_p": "પ્રશ્ન, બગ રિપોર્ટ અથવા કોઈ સાઇટ ખોટી દેખાય છે? અમને ઇમેઇલ કરો, અમે સામાન્ય રીતે બે દિવસમાં જવાબ આપીએ છીએ.", "contact_btn": "ઇમેઇલ મોકલો", "faq_h": "વારંવાર પૂછાતા પ્રશ્નો", "privacy_link": "ગોપનીયતા નીતિ", "q1": "શું Nocti મારો બ્રાઉઝિંગ ડેટા એકત્ર કરે છે?", "a1": "ના. Nocti પેજને સંપૂર્ણપણે તમારા ડિવાઇસ પર જ નવી સ્ટાઇલ આપે છે અને ક્યારેય તમારો બ્રાઉઝિંગ ઇતિહાસ કે પેજનું કન્ટેન્ટ એકત્ર કરતું નથી. તે અનામી ઉપયોગ ડેટા મોકલે છે, જેમાં તમે કોઈ સાઇટની જાણ કરો કે તેના પર Nocti બંધ કરો ત્યારે તે સાઇટનું ડોમેન પણ હોય છે, જેથી અમને ખબર પડે કે કઈ સાઇટ્સ સુધારવાની છે. તમે સેટિંગ્સમાં આ બંધ કરી શકો છો.", "q2": "Nocti બધી વેબસાઇટ્સની ઍક્સેસ કેમ માગે છે?", "a2": "પેજને ડાર્ક કરવા Noctiએ તેના રંગો વાંચવા પડે છે. બધી વેબસાઇટ્સની ઍક્સેસ હોય તો તે દરેક પેજને બિલકુલ પહેલી ફ્રેમથી ડાર્ક કરી શકે છે. જો તમે એક પછી એક સાઇટને મંજૂરી આપો, તો જે પેજને મંજૂરી નથી આપી તે આછાં જ રહે છે.", "q3": "Instagram, મેઇલ કે અન્ય ઍપ્સમાં Nocti કામ કરતું નથી.", "a3": "અન્ય ઍપ્સની અંદર ખૂલતાં પેજ બિલ્ટ-ઇન બ્રાઉઝર વાપરે છે, જે Safari એક્સ્ટેન્શન્સને સપોર્ટ કરતું નથી. <strong>Safariમાં ખોલો</strong> પર ટૅપ કરો (સામાન્ય રીતે ••• કે શેર મેનૂમાં હોય છે), પછી ત્યાં Nocti કામ કરશે.", "q4": "નવી ટૅબનું પેજ કે સ્ટાર્ટ પેજ હજી આછું કેમ છે?", "a4": "Safari એક્સ્ટેન્શન્સને પોતાનાં પેજ — જેમ કે સ્ટાર્ટ પેજ, સેટિંગ્સ અને રીડિંગ લિસ્ટ — બદલવા દેતું નથી. તે તમારી સિસ્ટમના દેખાવને અનુસરે છે; તેમને ડાર્ક કરવા ડિવાઇસને ડાર્ક મોડમાં ફેરવો.", "q5": "કોઈ વેબસાઇટ ખોટી દેખાય છે. હું શું કરું?", "a5": "તે સાઇટ પર Nocti મેનૂ ખોલો અને <strong>આ સાઇટ પર બંધ કરો</strong> ચાલુ કરો. પેજ તરત સામાન્ય થઈ જશે અને Nocti તે યાદ રાખશે. અમે દર થોડાં અઠવાડિયે સાઇટ ફિક્સ રિલીઝ કરીએ છીએ, તેથી અપડેટ પછી તેને ફરી ચાલુ કરી જુઓ.", "q6": "વેબસાઇટની ડિઝાઇન પહેલેથી ડાર્ક છે. શું Nocti તેને ફરીથી ડાર્ક કરશે?", "a6": "ના. Nocti પોતાની ડાર્ક ડિઝાઇનવાળી સાઇટ્સ ઓળખીને તેને છોડી દે છે. ત્યારે ટૂલબારનો આઇકન ઝાંખો થઈને આ બતાવે છે.", "q7": "મેં સિસ્ટમને લાઇટ મોડમાં બદલી, પણ કંઈ બદલાયું નહીં.", "a7": "Nocti મેનૂમાં મોડ તપાસો. <strong>સિસ્ટમ મુજબ</strong> મોડમાં ખુલ્લી ટૅબ્સ એક સેકન્ડમાં પાછી બદલાઈ જાય છે. <strong>હંમેશાં ચાલુ</strong> મોડમાં સિસ્ટમનો દેખાવ ગમે તે હોય, વેબસાઇટ્સ ડાર્ક જ રહે છે.", "q8": "PDF ડાર્ક કેમ નથી થતી?", "a8": "PDF, લોકલ ફાઇલો અને Safariનાં પોતાનાં પેજ જાણીજોઈને જેમ છે તેમ રાખવામાં આવે છે. તેમના પર ડાર્ક મોડ ઠોકી બેસાડવાથી ઘણી વાર તે ખાલી થઈ જાય છે.", "q9": "પેજ પાછાં આછાં થઈ જાય છે, અથવા છબીઓ ઊલટા રંગની દેખાય છે.", "a9": "<strong>સ્માર્ટ ઇન્વર્ટ</strong> અને <strong>ક્લાસિક ઇન્વર્ટ</strong> બંધ કરો — તે Nocti સાથે ટકરાય છે. iPhone અને iPad પર: <strong>સેટિંગ્સ → ઍક્સેસિબિલિટી → ડિસ્પ્લે અને ટેક્સ્ટનું કદ</strong>. Mac પર: <strong>સિસ્ટમ સેટિંગ્સ → ઍક્સેસિબિલિટી → ડિસ્પ્લે</strong>.", "q10": "શું મફત છે, અને Nocti Pro શું ઉમેરે છે?", "a10": "પેજને વાંચવાલાયક રાખતું બધું હંમેશાં મફત છે: ન સફેદ ઝબકારો, ન ચમકતી કિનારીઓ, સિસ્ટમ મુજબ, સાઇટ મુજબ નિયંત્રણ અને ડાર્ક સાઇટની ઓળખ, સાથે Nocti રાખોડી થીમ. <strong>Nocti Pro</strong> એક વખતની ખરીદી છે, જે OLED કાળો અને બીજી ચાર થીમ, કસ્ટમ થીમ્સ, તેમજ બ્રાઇટનેસ, કોન્ટ્રાસ્ટ અને ઉષ્માની ગોઠવણ ઉમેરે છે. તમે આખું Pro 14 દિવસ મફતમાં અજમાવી શકો છો.", "q11": "ફ્રી ટ્રાયલ કેવી રીતે કામ કરે છે?", "a11": "<strong>Nocti Pro</strong> ખોલો અને <strong>14 દિવસની ફ્રી ટ્રાયલ શરૂ કરો</strong> પર ટૅપ કરો. ટ્રાયલ એક મફત ઇન-ઍપ ખરીદી છે, તેથી તે તમારા Apple એકાઉન્ટ સાથે જોડાયેલી રહે છે: તમારાં બધાં ડિવાઇસ પર Pro 14 દિવસ માટે અનલૉક રહે છે, અને દરેક Apple એકાઉન્ટ તેનો એક જ વાર ઉપયોગ કરી શકે છે. કોઈ ચાર્જ લેવાતો નથી અને કંઈ રિન્યૂ થતું નથી.", "q12": "ફ્રી ટ્રાયલ પૂરી થાય ત્યારે શું થાય છે?", "a12": "Nocti ચાલુ રહે છે અને Nocti રાખોડી પર પાછું આવી જાય છે. કોઈ ચાર્જ લાગતો નથી અને કંઈ રદ કરવાની જરૂર નથી. તમારી કસ્ટમ થીમ્સ અને ગોઠવણો સાચવી રખાય છે, અને Pro અનલૉક કરતાં જ પાછી આવી જાય છે.", "q13": "શું મારે Mac કે iPad પર Nocti Pro ફરીથી ખરીદવું પડશે?", "a13": "ના. એક જ Apple એકાઉન્ટ સાથે એક વાર ખરીદવાથી iPhone, iPad અને Mac પર Pro અનલૉક થાય છે. જો કોઈ ડિવાઇસ પર હજી મફત વર્ઝન દેખાય, તો ઍપમાં <strong>Nocti Pro</strong> ખોલો અને <strong>ખરીદીઓ રિસ્ટોર કરો</strong> પર ટૅપ કરો.", "q14": "શું Nocti જાહેરાતો બતાવશે કે રેટિંગ માગશે?", "a14": "વેબ પેજની અંદર કે Nocti મેનૂમાં ક્યારેય નહીં. Nocti માં કોઈ જાહેરાત નથી — Pro આ ઍપની અંદર એક જ, વૈકલ્પિક ખરીદી છે."}, "he": {"title": "Nocti · תמיכה", "app": "Nocti", "tagline": "מצב כהה ל-Safari ב-iPhone, ב-iPad וב-Mac", "support_h": "תמיכה", "contact_h": "יצירת קשר", "contact_p": "יש שאלה, דיווח על באג או אתר שנראה לא תקין? כתבו לנו, ובדרך כלל נענה תוך יומיים.", "contact_btn": "שליחת אימייל", "faq_h": "שאלות נפוצות", "privacy_link": "מדיניות פרטיות", "q1": "האם Nocti אוסף את נתוני הגלישה שלי?", "a1": "לא. Nocti מעצב מחדש את העמודים כולם במכשיר שלך ולעולם לא אוסף את היסטוריית הגלישה או את תוכן העמודים. הוא שולח נתוני שימוש אנונימיים, כולל הדומיין של אתר כשמדווחים עליו או מכבים בו את Nocti, כדי שנדע אילו אתרים צריך לתקן. אפשר לכבות זאת בהגדרות.", "q2": "למה Nocti מבקש גישה לכל האתרים?", "a2": "כדי לכהות עמוד, Nocti צריך לקרוא את הצבעים שלו. עם גישה לכל האתרים, הוא יכול לכהות כל עמוד כבר מהפריים הראשון. אם מאשרים אתרים אחד־אחד, עמודים שלא אושרו יישארו בהירים.", "q3": "Nocti לא עובד ב-Instagram, בדואר או באפליקציות אחרות.", "a3": "עמודים שנפתחים בתוך אפליקציות אחרות משתמשים בדפדפן מובנה שלא תומך בהרחבות Safari. יש להקיש על <strong>פתח ב-Safari</strong> (בדרך כלל בתפריט ••• או בתפריט השיתוף) ו-Nocti יעבוד שם.", "q4": "למה עמוד הכרטיסייה החדשה או עמוד הפתיחה עדיין בהירים?", "a4": "Safari לא מאפשר להרחבות לשנות את העמודים שלו עצמו, כמו עמוד הפתיחה, ההגדרות ורשימת הקריאה. הם פועלים לפי מראה המערכת — כדי שיהיו כהים, יש להעביר את המכשיר למצב כהה.", "q5": "אתר נראה לא תקין. מה אפשר לעשות?", "a5": "יש לפתוח את תפריט Nocti באתר ולהפעיל את <strong>השבתה באתר זה</strong>. העמוד חוזר מיד למצבו הרגיל ו-Nocti זוכר זאת. אנחנו משחררים תיקוני אתרים כל כמה שבועות, אז כדאי לנסות להפעיל מחדש אחרי עדכון.", "q6": "לאתר יש כבר עיצוב כהה. האם Nocti יכהה אותו פעמיים?", "a6": "לא. Nocti מזהה אתרים עם עיצוב כהה משלהם ומדלג עליהם. הסמל בסרגל הכלים נעשה דהוי כדי לציין זאת.", "q7": "העברתי את המערכת למצב בהיר, אבל שום דבר לא השתנה.", "a7": "יש לבדוק את המצב בתפריט Nocti. במצב <strong>בהתאם למערכת</strong>, כרטיסיות פתוחות חוזרות לבהיר תוך שנייה. במצב <strong>פועל תמיד</strong>, האתרים נשארים כהים בלי קשר למראה המערכת.", "q8": "למה קובצי PDF לא כהים?", "a8": "קובצי PDF, קבצים מקומיים והעמודים של Safari עצמו נשארים כמו שהם, בכוונה. כפיית מצב כהה עליהם הופכת אותם לעתים קרובות לריקים.", "q9": "עמודים חוזרים לבהיר, או שתמונות נראות הפוכות.", "a9": "יש לכבות את <strong>היפוך חכם</strong> ואת <strong>היפוך קלאסי</strong> — הם מתנגשים עם Nocti. ב-iPhone וב-iPad: <strong>הגדרות ← נגישות ← תצוגה וגודל טקסט</strong>. ב-Mac: <strong>הגדרות המערכת ← נגישות ← תצוגה</strong>.", "q10": "מה בחינם, ומה Nocti Pro מוסיף?", "a10": "כל מה ששומר על קריאוּת העמודים חינמי לתמיד: בלי הבזק לבן, בלי שוליים בוהקים, בהתאם למערכת, שליטה לכל אתר וזיהוי אתרים כהים, עם ערכת הנושא אפור Nocti. <strong>Nocti Pro</strong> הוא רכישה חד־פעמית שמוסיפה את שחור OLED ועוד ארבע ערכות נושא, ערכות נושא מותאמות וכוונון בהירות, ניגודיות וחמימות. אפשר לנסות את כל Pro בחינם למשך 14 יום.", "q11": "איך עובדת תקופת הניסיון בחינם?", "a11": "יש לפתוח את <strong>Nocti Pro</strong> ולהקיש על <strong>התחלת ניסיון חינם ל-14 יום</strong>. הניסיון הוא רכישה בחינם בתוך האפליקציה, ולכן הוא שייך לחשבון Apple שלך: Pro פתוח למשך 14 יום בכל המכשירים שלך, וכל חשבון Apple יכול להשתמש בו פעם אחת. אין שום חיוב ואין שום חידוש.", "q12": "מה קורה כשתקופת הניסיון בחינם מסתיימת?", "a12": "Nocti ממשיך לעבוד וחוזר לאפור Nocti. שום דבר לא מחויב ואין מה לבטל. ערכות הנושא המותאמות והכוונונים שלך נשמרים, וחוזרים ברגע שפותחים את Pro.", "q13": "האם צריך לקנות את Nocti Pro שוב ב-Mac או ב-iPad?", "a13": "לא. רכישה אחת פותחת את Pro ב-iPhone, ב-iPad וב-Mac עם אותו חשבון Apple. אם מכשיר עדיין מציג את הגרסה החינמית, יש לפתוח את <strong>Nocti Pro</strong> באפליקציה ולהקיש על <strong>שחזור רכישות</strong>.", "q14": "האם Nocti יציג פרסומות או יבקש ממני דירוג?", "a14": "אף פעם לא בתוך דפי אינטרנט או בתפריט Nocti. ב-Nocti אין פרסומות — Pro הוא רכישה אחת, אופציונלית, בתוך האפליקציה הזו."}, "hi": {"title": "Nocti · सहायता", "app": "Nocti", "tagline": "iPhone, iPad और Mac पर Safari के लिए डार्क मोड", "support_h": "सहायता", "contact_h": "हमसे संपर्क करें", "contact_p": "कोई सवाल, बग रिपोर्ट, या कोई साइट गड़बड़ दिख रही है? हमें ईमेल करें, हम आम तौर पर दो दिन के भीतर जवाब देते हैं।", "contact_btn": "ईमेल भेजें", "faq_h": "अक्सर पूछे जाने वाले सवाल", "privacy_link": "गोपनीयता नीति", "q1": "क्या Nocti मेरा ब्राउज़िंग डेटा इकट्ठा करता है?", "a1": "नहीं। Nocti पेजों को पूरी तरह आपके डिवाइस पर ही बदलता है और कभी आपका ब्राउज़िंग इतिहास या पेज की सामग्री इकट्ठा नहीं करता। यह गुमनाम उपयोग डेटा भेजता है, जिसमें किसी साइट का डोमेन भी शामिल होता है जब आप उसकी रिपोर्ट करते हैं या उस पर Nocti बंद करते हैं, ताकि हमें पता चले कि किन साइटों को ठीक करना है। आप इसे सेटिंग्ज़ में बंद कर सकते हैं।", "q2": "Nocti सभी वेबसाइटों की ऐक्सेस क्यों माँगता है?", "a2": "किसी पेज को डार्क करने के लिए Nocti को उसके रंग पढ़ने पड़ते हैं। सभी वेबसाइटों की ऐक्सेस मिलने पर यह हर पेज को पहले फ़्रेम से ही डार्क कर सकता है। अगर आप साइटों को एक-एक करके अनुमति देते हैं, तो जिन पेजों को अनुमति नहीं दी है वे लाइट ही रहते हैं।", "q3": "Nocti Instagram, Mail या दूसरे ऐप्स में काम नहीं करता।", "a3": "दूसरे ऐप्स के अंदर खुलने वाले पेज एक बिल्ट-इन ब्राउज़र इस्तेमाल करते हैं, जो Safari एक्सटेंशन को सपोर्ट नहीं करता। <strong>Safari में खोलें</strong> पर टैप करें (आमतौर पर ••• या शेयर मेनू में), फिर वहाँ Nocti काम करेगा।", "q4": "नया टैब पेज या स्टार्ट पेज अब भी लाइट क्यों है?", "a4": "Safari एक्सटेंशन को अपने पेज, जैसे स्टार्ट पेज, सेटिंग्ज़ और रीडिंग लिस्ट, बदलने नहीं देता। ये आपके सिस्टम के रूप के अनुसार चलते हैं — इन्हें डार्क करने के लिए अपने डिवाइस को डार्क मोड में करें।", "q5": "कोई वेबसाइट ठीक नहीं दिख रही। मैं क्या करूँ?", "a5": "उस साइट पर Nocti मेनू खोलें और <strong>इस साइट पर बंद करें</strong> चालू करें। पेज तुरंत सामान्य हो जाता है और Nocti इसे याद रखता है। हम हर कुछ हफ़्तों में साइट सुधार जारी करते हैं, इसलिए अपडेट के बाद इसे फिर से चालू करके देखें।", "q6": "किसी वेबसाइट का डिज़ाइन पहले से डार्क है। क्या Nocti उसे दोबारा डार्क करेगा?", "a6": "नहीं। Nocti उन साइटों को पहचानकर छोड़ देता है जिनका अपना डार्क डिज़ाइन है। यह दिखाने के लिए टूलबार आइकन धुंधला हो जाता है।", "q7": "मैंने सिस्टम को लाइट मोड में बदला, लेकिन कुछ नहीं बदला।", "a7": "Nocti मेनू में मोड देखें। <strong>सिस्टम के अनुसार</strong> मोड में खुले टैब एक सेकंड के अंदर वापस बदल जाते हैं। <strong>हमेशा चालू</strong> मोड में सिस्टम का रूप जो भी हो, वेबसाइटें डार्क ही रहती हैं।", "q8": "PDF डार्क क्यों नहीं होते?", "a8": "PDF, लोकल फ़ाइलें और Safari के अपने पेज जानबूझकर जैसे हैं वैसे ही छोड़े जाते हैं। उन पर ज़बरदस्ती डार्क मोड लगाने से वे अक्सर खाली हो जाते हैं।", "q9": "पेज फिर से लाइट हो जाते हैं, या इमेज उलटी दिखती हैं।", "a9": "<strong>स्मार्ट इन्वर्ट</strong> और <strong>क्लासिक इन्वर्ट</strong> बंद करें — ये Nocti से टकराते हैं। iPhone और iPad पर: <strong>सेटिंग्ज़ → ऐक्सेसिबिलिटी → डिस्प्ले और टेक्स्ट आकार</strong>। Mac पर: <strong>सिस्टम सेटिंग्ज़ → ऐक्सेसिबिलिटी → डिस्प्ले</strong>।", "q10": "क्या मुफ़्त है, और Nocti Pro क्या जोड़ता है?", "a10": "पेजों को पढ़ने लायक रखने वाली हर चीज़ हमेशा मुफ़्त है: कोई सफ़ेद चमक नहीं, कोई चमकीले किनारे नहीं, सिस्टम के अनुसार, हर साइट के लिए नियंत्रण और डार्क साइट की पहचान, साथ में Nocti ग्रे थीम। <strong>Nocti Pro</strong> एक बार की ख़रीदारी है, जो OLED ब्लैक और चार और थीम, कस्टम थीम, और ब्राइटनेस, कंट्रास्ट व गर्माहट के एडजस्टमेंट जोड़ता है। आप पूरा Pro 14 दिन तक मुफ़्त आज़मा सकते हैं।", "q11": "फ़्री ट्रायल कैसे काम करता है?", "a11": "<strong>Nocti Pro</strong> खोलें और <strong>14 दिन का फ़्री ट्रायल शुरू करें</strong> पर टैप करें। ट्रायल एक मुफ़्त इन-ऐप ख़रीदारी है, इसलिए यह आपके Apple खाते से जुड़ा होता है: आपके सभी डिवाइस पर Pro 14 दिन के लिए अनलॉक रहता है, और हर Apple खाता इसे एक बार इस्तेमाल कर सकता है। कोई शुल्क नहीं लगता और कुछ भी रिन्यू नहीं होता।", "q12": "फ़्री ट्रायल ख़त्म होने पर क्या होता है?", "a12": "Nocti काम करता रहता है और वापस Nocti ग्रे पर आ जाता है। कोई शुल्क नहीं लगता और कुछ भी रद्द नहीं करना पड़ता। आपकी कस्टम थीम और एडजस्टमेंट सहेजे रहते हैं, और Pro अनलॉक करते ही वापस आ जाते हैं।", "q13": "क्या मुझे Mac या iPad पर Nocti Pro दोबारा ख़रीदना होगा?", "a13": "नहीं। एक ही Apple खाते से की गई एक ख़रीदारी iPhone, iPad और Mac पर Pro अनलॉक कर देती है। अगर किसी डिवाइस पर अब भी मुफ़्त वर्शन दिखे, तो ऐप में <strong>Nocti Pro</strong> खोलें और <strong>ख़रीदारियाँ रीस्टोर करें</strong> पर टैप करें।", "q14": "क्या Nocti विज्ञापन दिखाएगा या मुझसे रेटिंग माँगेगा?", "a14": "वेब पेजों के अंदर या Nocti मेनू में कभी नहीं। Nocti में कोई विज्ञापन नहीं है — Pro इस ऐप के अंदर एक ही, वैकल्पिक ख़रीदारी है।"}, "hr": {"title": "Nocti · Podrška", "app": "Nocti", "tagline": "Tamni način rada za Safari na iPhoneu, iPadu i Macu", "support_h": "Podrška", "contact_h": "Kontaktirajte nas", "contact_p": "Imate pitanje, prijavu greške ili web-stranica ne izgleda dobro? Pišite nam, obično odgovaramo u roku od dva dana.", "contact_btn": "Pošalji e-poruku", "faq_h": "Česta pitanja", "privacy_link": "Pravila privatnosti", "q1": "Prikuplja li Nocti podatke o mojem pregledavanju?", "a1": "Ne. Nocti preoblikuje stranice isključivo na vašem uređaju i nikad ne prikuplja vašu povijest pregledavanja ni sadržaj stranica. Šalje anonimne podatke o korištenju, uključujući domenu stranice kad je prijavite ili za nju isključite Nocti, kako bismo znali koje stranice treba popraviti. To možete isključiti u Postavkama.", "q2": "Zašto Nocti traži pristup svim web-stranicama?", "a2": "Da bi zatamnio stranicu, Nocti mora pročitati njezine boje. S pristupom svim web-stranicama može zatamniti svaku stranicu od prvog kadra. Ako dopuštate stranice jednu po jednu, one koje niste dopustili ostaju svijetle.", "q3": "Nocti ne radi u WeChatu, Mailu ni drugim aplikacijama.", "a3": "Stranice otvorene unutar drugih aplikacija koriste ugrađeni preglednik koji ne podržava proširenja za Safari. Dodirnite <strong>Otvori u Safariju</strong> (obično u izborniku ••• ili Dijeli) i Nocti će ondje raditi.", "q4": "Zašto su nova kartica ili Početna stranica i dalje svijetle?", "a4": "Safari ne dopušta proširenjima da mijenjaju njegove vlastite stranice, poput Početne stranice, Postavki i Popisa za čitanje. One umjesto toga prate izgled sustava — prebacite uređaj u tamni način rada da bi postale tamne.", "q5": "Web-stranica ne izgleda dobro. Što mogu učiniti?", "a5": "Na toj stranici otvorite izbornik Nocti i uključite <strong>Isključi na ovoj stranici</strong>. Stranica se odmah vraća u normalu i Nocti to pamti. Popravke stranica objavljujemo svakih nekoliko tjedana, pa ga nakon ažuriranja pokušajte ponovno uključiti.", "q6": "Web-stranica već ima tamni dizajn. Hoće li je Nocti zatamniti dvaput?", "a6": "Ne. Nocti prepoznaje stranice s vlastitim tamnim dizajnom i preskače ih. Ikona na alatnoj traci tada postaje prozirna.", "q7": "Sustav je u svijetlom načinu rada, ali ništa se nije promijenilo.", "a7": "Provjerite način rada u izborniku Nocti. U načinu <strong>Prati sustav</strong> otvorene se kartice vraćaju u roku od sekunde. U načinu <strong>Uvijek uključeno</strong> web-stranice ostaju tamne bez obzira na izgled sustava.", "q8": "Zašto PDF-ovi nisu tamni?", "a8": "PDF-ovi, lokalne datoteke i Safarijeve vlastite stranice namjerno ostaju kakvi jesu. Nametanje tamnog načina rada često ih učini praznima.", "q9": "Stranice se vraćaju na svijetlo ili slike izgledaju invertirano.", "a9": "Isključite <strong>Pametno invertiranje</strong> i <strong>Klasično invertiranje</strong> — sukobljavaju se s Noctijem. Na iPhoneu i iPadu: <strong>Postavke → Pristupačnost → Zaslon i veličina teksta</strong>. Na Macu: <strong>Postavke sustava → Pristupačnost → Zaslon</strong>.", "q10": "Što je besplatno, a što dodaje Nocti Pro?", "a10": "Sve što stranice čini čitljivima zauvijek je besplatno: bez bijelog bljeska, bez svijetlih rubova, Prati sustav, upravljanje po stranici i prepoznavanje tamnih stranica, uz temu Nocti siva. <strong>Nocti Pro</strong> jednokratna je kupnja koja dodaje OLED crnu i još četiri teme, prilagođene teme te podešavanje svjetline, kontrasta i topline. Cijeli Pro možete besplatno isprobati 14 dana.", "q11": "Kako funkcionira besplatno probno razdoblje?", "a11": "Otvorite <strong>Nocti Pro</strong> i dodirnite <strong>Isprobaj besplatno 14 dana</strong>. Probno razdoblje besplatna je kupnja unutar aplikacije pa pripada vašem Apple računu: Pro je otključan 14 dana na svim vašim uređajima, a svaki ga Apple račun može iskoristiti jednom. Ništa se ne naplaćuje i ništa se ne obnavlja.", "q12": "Što se događa kad besplatno probno razdoblje završi?", "a12": "Nocti nastavlja raditi i vraća se na Nocti sivu. Ništa se ne naplaćuje i nema se što otkazivati. Vaše prilagođene teme i podešavanja se čuvaju i vraćaju se čim otključate Pro.", "q13": "Moram li Nocti Pro ponovno kupiti na Macu ili iPadu?", "a13": "Ne. Jedna kupnja otključava Pro na iPhoneu, iPadu i Macu s istim Apple računom. Ako neki uređaj i dalje prikazuje besplatnu verziju, u aplikaciji otvorite <strong>Nocti Pro</strong> i dodirnite <strong>Vrati kupnje</strong>.", "q14": "Hoće li Nocti prikazivati oglase ili tražiti ocjenu?", "a14": "Nikad unutar web-stranica ni u izborniku Nocti. Nocti nema oglasa — Pro je jedna, neobavezna kupnja unutar ove aplikacije."}, "hu": {"title": "Nocti · Támogatás", "app": "Nocti", "tagline": "Sötét mód a Safarihoz iPhone-on, iPaden és Macen", "support_h": "Támogatás", "contact_h": "Kapcsolat", "contact_p": "Kérdésed van, hibát találtál, vagy egy weboldal rosszul jelenik meg? Írj nekünk, általában két napon belül válaszolunk.", "contact_btn": "E-mail küldése", "faq_h": "GYIK", "privacy_link": "Adatvédelmi szabályzat", "q1": "Gyűjti a Nocti a böngészési adataimat?", "a1": "Nem. A Nocti teljes egészében az eszközödön alakítja át az oldalakat, és sosem gyűjti a böngészési előzményeidet vagy az oldalak tartalmát. Névtelen használati adatokat küld, köztük egy webhely domainjét, ha jelented, vagy kikapcsolod rajta a Noctit, hogy tudjuk, mely webhelyeket kell javítani. Ezt a Beállításokban kikapcsolhatod.", "q2": "Miért kér a Nocti hozzáférést minden webhelyhez?", "a2": "A Noctinak be kell olvasnia az oldal színeit, hogy elsötétíthesse. Ha minden webhelyhez hozzáfér, minden oldalt már az első képkockától elsötétíthet. Ha egyenként engedélyezed a webhelyeket, a nem engedélyezett oldalak világosak maradnak.", "q3": "A Nocti nem működik a WeChatben, a Mailben vagy más appokban.", "a3": "A más appokban megnyitott oldalak beépített böngészőt használnak, amely nem támogatja a Safari-bővítményeket. Koppints a <strong>Megnyitás a Safariban</strong> lehetőségre (általában a ••• vagy a megosztás menüben), és ott már működik a Nocti.", "q4": "Miért világos még mindig az új lap oldala vagy a Kezdőlap?", "a4": "A Safari nem engedi, hogy a bővítmények módosítsák a saját oldalait, például a Kezdőlapot, a Beállításokat és az Olvasási listát. Ezek a rendszer megjelenését követik – kapcsold az eszközt sötét módba, hogy ezek is sötétek legyenek.", "q5": "Egy webhely rosszul néz ki. Mit tehetek?", "a5": "Nyisd meg a Nocti menüt az adott webhelyen, és kapcsold be a <strong>Kikapcsolás ezen a webhelyen</strong> beállítást. Az oldal azonnal visszaáll, és a Nocti megjegyzi ezt. Néhány hetente webhelyjavításokat adunk ki, ezért egy frissítés után próbáld meg újra bekapcsolni.", "q6": "Egy webhelynek már sötét dizájnja van. A Nocti kétszer sötétíti el?", "a6": "Nem. A Nocti felismeri a saját sötét dizájnnal rendelkező webhelyeket, és kihagyja őket. Ilyenkor az eszközsor ikonja elhalványul.", "q7": "Világos módra váltottam a rendszert, de semmi sem változott.", "a7": "Nézd meg az üzemmódot a Nocti menüben. <strong>Rendszer követése</strong> módban a megnyitott lapok egy másodpercen belül visszaváltanak. <strong>Mindig be</strong> módban a webhelyek a rendszer megjelenésétől függetlenül sötétek maradnak.", "q8": "Miért nem sötétek a PDF-ek?", "a8": "A PDF-ek, a helyi fájlok és a Safari saját oldalai szándékosan változatlanok maradnak. Ha rájuk erőltetnénk a sötét módot, gyakran üresek lennének.", "q9": "Az oldalak visszaváltanak világosra, vagy a képek invertáltnak tűnnek.", "a9": "Kapcsold ki az <strong>Intelligens invertálás</strong> és a <strong>Klasszikus invertálás</strong> funkciót – ütköznek a Noctival. iPhone-on és iPaden: <strong>Beállítások → Kisegítő lehetőségek → Kijelző és szövegméret</strong>. Macen: <strong>Rendszerbeállítások → Kisegítő lehetőségek → Kijelző</strong>.", "q10": "Mi ingyenes, és mit ad hozzá a Nocti Pro?", "a10": "Minden, ami az oldalakat olvashatóvá teszi, örökre ingyenes: nincs fehér villanás, nincsenek világos szélek, Rendszer követése, webhelyenkénti vezérlés és a sötét webhelyek felismerése, a Nocti szürke témával. A <strong>Nocti Pro</strong> egyszeri vásárlás, amely hozzáadja az OLED fekete és további négy témát, az egyéni témákat, valamint a fényerő, a kontraszt és a melegség beállítását. A teljes Prót 14 napig ingyen kipróbálhatod.", "q11": "Hogyan működik az ingyenes próbaidő?", "a11": "Nyisd meg a <strong>Nocti Pro</strong> részt, és koppints a <strong>14 napos ingyenes próba indítása</strong> gombra. A próbaidő egy ingyenes, appon belüli vásárlás, ezért az Apple-fiókodhoz tartozik: a Pro 14 napig minden eszközödön fel van oldva, és minden Apple-fiók egyszer veheti igénybe. Semmit sem számlázunk, és semmi sem újul meg automatikusan.", "q12": "Mi történik, ha lejár az ingyenes próbaidő?", "a12": "A Nocti tovább működik, és visszavált a Nocti szürke témára. Semmit sem számlázunk, és nincs mit lemondani. Az egyéni témáid és beállításaid megmaradnak, és visszatérnek, amint feloldod a Prót.", "q13": "Újra meg kell vennem a Nocti Prót a Macen vagy az iPaden?", "a13": "Nem. Egyetlen vásárlással a Pro feloldódik iPhone-on, iPaden és Macen ugyanazzal az Apple-fiókkal. Ha egy eszköz még mindig az ingyenes verziót mutatja, nyisd meg a <strong>Nocti Pro</strong> részt az appban, és koppints a <strong>Vásárlások visszaállítása</strong> elemre.", "q14": "Jelenít meg a Nocti reklámokat, vagy kér értékelést?", "a14": "Soha, sem a weboldalakon, sem a Nocti menüben. A Noctiban nincs reklám – a Pro egyetlen, opcionális vásárlás ebben az appban."}, "id": {"title": "Nocti · Dukungan", "app": "Nocti", "tagline": "Mode Gelap untuk Safari di iPhone, iPad, dan Mac", "support_h": "Dukungan", "contact_h": "Hubungi kami", "contact_p": "Punya pertanyaan, laporan bug, atau situs yang tampilannya aneh? Kirim email kepada kami, biasanya kami membalas dalam dua hari.", "contact_btn": "Kirim email", "faq_h": "Tanya Jawab", "privacy_link": "Kebijakan Privasi", "q1": "Apakah Nocti mengumpulkan data penelusuran saya?", "a1": "Tidak. Nocti mengubah gaya halaman sepenuhnya di perangkat Anda dan tidak pernah mengumpulkan riwayat penelusuran atau konten halaman Anda. Nocti mengirim data penggunaan anonim, termasuk domain situs saat Anda melaporkannya atau mematikan Nocti untuknya, agar kami tahu situs mana yang perlu diperbaiki. Anda bisa mematikannya di Pengaturan.", "q2": "Mengapa Nocti meminta akses ke semua situs web?", "a2": "Nocti harus membaca warna halaman untuk menggelapkannya. Dengan akses ke semua situs web, Nocti dapat menggelapkan setiap halaman sejak bingkai pertama. Jika Anda mengizinkan situs satu per satu, halaman yang belum diizinkan tetap terang.", "q3": "Nocti tidak berfungsi di Instagram, Mail, atau app lain.", "a3": "Halaman yang dibuka di dalam app lain menggunakan browser bawaan yang tidak mendukung ekstensi Safari. Ketuk <strong>Buka di Safari</strong> (biasanya di menu ••• atau menu bagikan) dan Nocti akan berfungsi di sana.", "q4": "Mengapa halaman tab baru atau Halaman Mulai masih terang?", "a4": "Safari tidak mengizinkan ekstensi mengubah halaman miliknya sendiri, seperti Halaman Mulai, Pengaturan, dan Daftar Bacaan. Halaman tersebut mengikuti tampilan sistem — ubah perangkat ke mode Gelap untuk membuatnya gelap.", "q5": "Situs web tampil salah. Apa yang bisa saya lakukan?", "a5": "Buka menu Nocti di situs tersebut dan nyalakan <strong>Nonaktifkan di Situs Ini</strong>. Halaman langsung kembali normal dan Nocti akan mengingatnya. Kami merilis perbaikan situs setiap beberapa minggu, jadi coba nyalakan lagi setelah pembaruan.", "q6": "Situs web sudah punya desain gelap. Apakah Nocti akan menggelapkannya dua kali?", "a6": "Tidak. Nocti mendeteksi situs yang punya desain gelapnya sendiri dan melewatinya. Ikon bar alat akan memudar untuk menunjukkan hal ini.", "q7": "Saya mengubah sistem ke mode Terang, tetapi tidak ada yang berubah.", "a7": "Periksa mode di menu Nocti. Dalam mode <strong>Ikuti Sistem</strong>, tab yang terbuka akan kembali dalam satu detik. Dalam mode <strong>Selalu Aktif</strong>, situs web tetap gelap apa pun tampilan sistemnya.", "q8": "Mengapa PDF tidak gelap?", "a8": "PDF, file lokal, dan halaman milik Safari sendiri sengaja dibiarkan apa adanya. Memaksakan mode gelap pada halaman tersebut sering membuatnya kosong.", "q9": "Halaman kembali terang, atau gambar tampak terbalik warnanya.", "a9": "Matikan <strong>Inversi Cerdas</strong> dan <strong>Inversi Klasik</strong> — keduanya berbenturan dengan Nocti. Di iPhone dan iPad: <strong>Pengaturan → Aksesibilitas → Tampilan &amp; Ukuran Teks</strong>. Di Mac: <strong>Pengaturan Sistem → Aksesibilitas → Tampilan</strong>.", "q10": "Apa yang gratis, dan apa yang ditambahkan Nocti Pro?", "a10": "Semua yang membuat halaman tetap mudah dibaca gratis selamanya: tanpa kedipan putih, tanpa tepi terang, Ikuti Sistem, kontrol per situs, dan deteksi situs gelap, beserta tema Abu-abu Nocti. <strong>Nocti Pro</strong> adalah pembelian satu kali yang menambahkan Hitam OLED dan empat tema lainnya, tema khusus, serta penyesuaian kecerahan, kontras, dan kehangatan. Anda bisa mencoba seluruh fitur Pro gratis selama 14 hari.", "q11": "Bagaimana cara kerja uji coba gratis?", "a11": "Buka <strong>Nocti Pro</strong> lalu ketuk <strong>Mulai Uji Coba Gratis 14 Hari</strong>. Uji coba ini adalah pembelian dalam app yang gratis, jadi terikat pada Akun Apple Anda: Pro terbuka selama 14 hari di semua perangkat Anda, dan setiap Akun Apple hanya bisa menggunakannya sekali. Tidak ada biaya dan tidak ada perpanjangan.", "q12": "Apa yang terjadi saat uji coba gratis berakhir?", "a12": "Nocti tetap berfungsi dan kembali ke Abu-abu Nocti. Tidak ada biaya dan tidak ada yang perlu dibatalkan. Tema khusus dan penyesuaian Anda tetap tersimpan, dan kembali begitu Anda membuka Pro.", "q13": "Apakah saya perlu membeli Nocti Pro lagi di Mac atau iPad?", "a13": "Tidak. Satu kali pembelian membuka Pro di iPhone, iPad, dan Mac dengan Akun Apple yang sama. Jika perangkat masih menampilkan versi gratis, buka <strong>Nocti Pro</strong> di app lalu ketuk <strong>Pulihkan Pembelian</strong>.", "q14": "Apakah Nocti akan menampilkan iklan atau meminta rating?", "a14": "Tidak pernah di dalam halaman web atau menu Nocti. Nocti tidak memiliki iklan — Pro adalah satu pembelian opsional di dalam app ini."}, "kn": {"title": "Nocti · ಬೆಂಬಲ", "app": "Nocti", "tagline": "iPhone, iPad ಮತ್ತು Mac ನಲ್ಲಿ Safari ಗಾಗಿ ಡಾರ್ಕ್ ಮೋಡ್", "support_h": "ಬೆಂಬಲ", "contact_h": "ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ", "contact_p": "ಪ್ರಶ್ನೆ, ಬಗ್ ವರದಿ ಅಥವಾ ತಪ್ಪಾಗಿ ಕಾಣುವ ಸೈಟ್ ಇದೆಯೇ? ನಮಗೆ ಇಮೇಲ್ ಮಾಡಿ, ನಾವು ಸಾಮಾನ್ಯವಾಗಿ ಎರಡು ದಿನಗಳಲ್ಲಿ ಉತ್ತರಿಸುತ್ತೇವೆ.", "contact_btn": "ಇಮೇಲ್ ಕಳುಹಿಸಿ", "faq_h": "ಪದೇ ಪದೇ ಕೇಳುವ ಪ್ರಶ್ನೆಗಳು", "privacy_link": "ಗೌಪ್ಯತಾ ನೀತಿ", "q1": "Nocti ನನ್ನ ಬ್ರೌಸಿಂಗ್ ಡೇಟಾವನ್ನು ಸಂಗ್ರಹಿಸುತ್ತದೆಯೇ?", "a1": "ಇಲ್ಲ. Nocti ಪುಟಗಳ ಶೈಲಿಯನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ನಿಮ್ಮ ಸಾಧನದಲ್ಲೇ ಬದಲಾಯಿಸುತ್ತದೆ ಮತ್ತು ನಿಮ್ಮ ಬ್ರೌಸಿಂಗ್ ಇತಿಹಾಸ ಅಥವಾ ಪುಟದ ವಿಷಯವನ್ನು ಎಂದಿಗೂ ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ. ಯಾವ ಸೈಟ್‌ಗಳನ್ನು ಸರಿಪಡಿಸಬೇಕು ಎಂದು ತಿಳಿಯಲು ಅನಾಮಧೇಯ ಬಳಕೆಯ ಡೇಟಾವನ್ನು ಕಳುಹಿಸುತ್ತದೆ — ನೀವು ಸೈಟ್ ಅನ್ನು ವರದಿ ಮಾಡಿದಾಗ ಅಥವಾ ಅದಕ್ಕೆ Nocti ಆಫ್ ಮಾಡಿದಾಗ ಆ ಸೈಟ್‌ನ ಡೊಮೇನ್ ಸೇರಿದಂತೆ. ಇದನ್ನು ಸೆಟ್ಟಿಂಗ್‌ಗಳಲ್ಲಿ ಆಫ್ ಮಾಡಬಹುದು.", "q2": "Nocti ಎಲ್ಲಾ ವೆಬ್‌ಸೈಟ್‌ಗಳಿಗೆ ಪ್ರವೇಶ ಏಕೆ ಕೇಳುತ್ತದೆ?", "a2": "ಪುಟವನ್ನು ಡಾರ್ಕ್ ಮಾಡಲು Nocti ಅದರ ಬಣ್ಣಗಳನ್ನು ಓದಬೇಕು. ಎಲ್ಲಾ ವೆಬ್‌ಸೈಟ್‌ಗಳಿಗೆ ಪ್ರವೇಶವಿದ್ದರೆ, ಪ್ರತಿ ಪುಟವನ್ನು ಮೊದಲ ಫ್ರೇಮ್‌ನಿಂದಲೇ ಡಾರ್ಕ್ ಮಾಡಬಹುದು. ಸೈಟ್‌ಗಳನ್ನು ಒಂದೊಂದಾಗಿ ಅನುಮತಿಸಿದರೆ, ನೀವು ಅನುಮತಿಸದ ಪುಟಗಳು ಲೈಟ್ ಆಗಿಯೇ ಉಳಿಯುತ್ತವೆ.", "q3": "WeChat, ಮೇಲ್ ಅಥವಾ ಇತರ ಆ್ಯಪ್‌ಗಳಲ್ಲಿ Nocti ಕೆಲಸ ಮಾಡುವುದಿಲ್ಲ.", "a3": "ಇತರ ಆ್ಯಪ್‌ಗಳೊಳಗೆ ತೆರೆಯುವ ಪುಟಗಳು Safari ಎಕ್ಸ್‌ಟೆನ್ಶನ್‌ಗಳನ್ನು ಬೆಂಬಲಿಸದ ಅಂತರ್ನಿರ್ಮಿತ ಬ್ರೌಸರ್ ಬಳಸುತ್ತವೆ. <strong>Safari ಯಲ್ಲಿ ತೆರೆಯಿರಿ</strong> ಟ್ಯಾಪ್ ಮಾಡಿ (ಸಾಮಾನ್ಯವಾಗಿ ••• ಅಥವಾ ಹಂಚಿಕೊಳ್ಳಿ ಮೆನುವಿನಲ್ಲಿ), ಅಲ್ಲಿ Nocti ಕೆಲಸ ಮಾಡುತ್ತದೆ.", "q4": "ಹೊಸ ಟ್ಯಾಬ್ ಪುಟ ಅಥವಾ ಪ್ರಾರಂಭ ಪುಟ ಇನ್ನೂ ಏಕೆ ಲೈಟ್ ಆಗಿದೆ?", "a4": "ಪ್ರಾರಂಭ ಪುಟ, ಸೆಟ್ಟಿಂಗ್‌ಗಳು ಮತ್ತು ರೀಡಿಂಗ್ ಲಿಸ್ಟ್‌ನಂತಹ Safari ಯ ಸ್ವಂತ ಪುಟಗಳನ್ನು ಬದಲಾಯಿಸಲು Safari ಎಕ್ಸ್‌ಟೆನ್ಶನ್‌ಗಳಿಗೆ ಅನುಮತಿಸುವುದಿಲ್ಲ. ಅವು ನಿಮ್ಮ ಸಿಸ್ಟಮ್ ನೋಟವನ್ನು ಅನುಸರಿಸುತ್ತವೆ — ಅವುಗಳನ್ನು ಡಾರ್ಕ್ ಮಾಡಲು ನಿಮ್ಮ ಸಾಧನವನ್ನು ಡಾರ್ಕ್ ಮೋಡ್‌ಗೆ ಬದಲಾಯಿಸಿ.", "q5": "ಒಂದು ವೆಬ್‌ಸೈಟ್ ಸರಿಯಾಗಿ ಕಾಣುತ್ತಿಲ್ಲ. ನಾನೇನು ಮಾಡಬಹುದು?", "a5": "ಆ ಸೈಟ್‌ನಲ್ಲಿ Nocti ಮೆನು ತೆರೆದು <strong>ಈ ಸೈಟ್‌ನಲ್ಲಿ ನಿಷ್ಕ್ರಿಯಗೊಳಿಸಿ</strong> ಆನ್ ಮಾಡಿ. ಪುಟ ತಕ್ಷಣ ಸಾಮಾನ್ಯ ಸ್ಥಿತಿಗೆ ಮರಳುತ್ತದೆ ಮತ್ತು Nocti ಅದನ್ನು ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತದೆ. ನಾವು ಕೆಲವು ವಾರಗಳಿಗೊಮ್ಮೆ ಸೈಟ್ ತಿದ್ದುಪಡಿಗಳನ್ನು ಬಿಡುಗಡೆ ಮಾಡುತ್ತೇವೆ, ಹಾಗಾಗಿ ಅಪ್‌ಡೇಟ್ ನಂತರ ಮತ್ತೆ ಆನ್ ಮಾಡಿ ನೋಡಿ.", "q6": "ವೆಬ್‌ಸೈಟ್‌ಗೆ ಈಗಾಗಲೇ ಡಾರ್ಕ್ ವಿನ್ಯಾಸವಿದೆ. Nocti ಅದನ್ನು ಎರಡು ಬಾರಿ ಡಾರ್ಕ್ ಮಾಡುತ್ತದೆಯೇ?", "a6": "ಇಲ್ಲ. ತಮ್ಮದೇ ಡಾರ್ಕ್ ವಿನ್ಯಾಸವಿರುವ ಸೈಟ್‌ಗಳನ್ನು Nocti ಪತ್ತೆಹಚ್ಚಿ ಬಿಟ್ಟುಬಿಡುತ್ತದೆ. ಇದನ್ನು ತೋರಿಸಲು ಟೂಲ್‌ಬಾರ್ ಐಕಾನ್ ಮಸುಕಾಗುತ್ತದೆ.", "q7": "ನನ್ನ ಸಿಸ್ಟಮ್ ಅನ್ನು ಲೈಟ್ ಮೋಡ್‌ಗೆ ಬದಲಾಯಿಸಿದೆ, ಆದರೆ ಏನೂ ಬದಲಾಗಲಿಲ್ಲ.", "a7": "Nocti ಮೆನುವಿನಲ್ಲಿ ಮೋಡ್ ಪರಿಶೀಲಿಸಿ. <strong>ಸಿಸ್ಟಮ್ ಅನುಸರಿಸಿ</strong> ಮೋಡ್‌ನಲ್ಲಿ, ತೆರೆದಿರುವ ಟ್ಯಾಬ್‌ಗಳು ಒಂದು ಸೆಕೆಂಡಿನೊಳಗೆ ಮರಳಿ ಬದಲಾಗುತ್ತವೆ. <strong>ಯಾವಾಗಲೂ ಆನ್</strong> ಮೋಡ್‌ನಲ್ಲಿ, ಸಿಸ್ಟಮ್ ನೋಟ ಏನೇ ಇರಲಿ ವೆಬ್‌ಸೈಟ್‌ಗಳು ಡಾರ್ಕ್ ಆಗಿಯೇ ಇರುತ್ತವೆ.", "q8": "PDF ಗಳು ಏಕೆ ಡಾರ್ಕ್ ಆಗುವುದಿಲ್ಲ?", "a8": "PDF ಗಳು, ಸ್ಥಳೀಯ ಫೈಲ್‌ಗಳು ಮತ್ತು Safari ಯ ಸ್ವಂತ ಪುಟಗಳನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಹಾಗೆಯೇ ಬಿಡಲಾಗುತ್ತದೆ. ಅವುಗಳ ಮೇಲೆ ಡಾರ್ಕ್ ಮೋಡ್ ಬಲವಂತವಾಗಿ ಹೇರಿದರೆ ಅವು ಆಗಾಗ ಖಾಲಿಯಾಗುತ್ತವೆ.", "q9": "ಪುಟಗಳು ಮತ್ತೆ ಲೈಟ್ ಆಗುತ್ತವೆ, ಅಥವಾ ಚಿತ್ರಗಳು ತಲೆಕೆಳಗಾದ ಬಣ್ಣಗಳಲ್ಲಿ ಕಾಣುತ್ತವೆ.", "a9": "<strong>ಸ್ಮಾರ್ಟ್ ಇನ್‌ವರ್ಟ್</strong> ಮತ್ತು <strong>ಕ್ಲಾಸಿಕ್ ಇನ್‌ವರ್ಟ್</strong> ಆಫ್ ಮಾಡಿ — ಅವು Nocti ಯೊಂದಿಗೆ ಸಂಘರ್ಷಿಸುತ್ತವೆ. iPhone ಮತ್ತು iPad ನಲ್ಲಿ: <strong>ಸೆಟ್ಟಿಂಗ್‌ಗಳು → ಆ್ಯಕ್ಸೆಸಿಬಿಲಿಟಿ → ಡಿಸ್‌ಪ್ಲೇ &amp; ಪಠ್ಯದ ಗಾತ್ರ</strong>. Mac ನಲ್ಲಿ: <strong>ಸಿಸ್ಟಮ್ ಸೆಟ್ಟಿಂಗ್‌ಗಳು → ಆ್ಯಕ್ಸೆಸಿಬಿಲಿಟಿ → ಡಿಸ್‌ಪ್ಲೇ</strong>.", "q10": "ಯಾವುದು ಉಚಿತ, Nocti Pro ಏನನ್ನು ಸೇರಿಸುತ್ತದೆ?", "a10": "ಪುಟಗಳನ್ನು ಓದಲು ಸುಲಭವಾಗಿಸುವ ಎಲ್ಲವೂ ಎಂದೆಂದಿಗೂ ಉಚಿತ: ಬಿಳಿ ಫ್ಲ್ಯಾಶ್ ಇಲ್ಲ, ಪ್ರಖರ ಅಂಚುಗಳಿಲ್ಲ, ಸಿಸ್ಟಮ್ ಅನುಸರಿಸಿ, ಸೈಟ್‌ವಾರು ನಿಯಂತ್ರಣಗಳು, ಡಾರ್ಕ್ ಸೈಟ್ ಪತ್ತೆ, ಜೊತೆಗೆ Nocti ಬೂದು ಥೀಮ್. <strong>Nocti Pro</strong> ಒಂದು ಬಾರಿಯ ಖರೀದಿ; ಇದು OLED ಕಪ್ಪು ಮತ್ತು ಇನ್ನೂ ನಾಲ್ಕು ಥೀಮ್‌ಗಳು, ಕಸ್ಟಮ್ ಥೀಮ್‌ಗಳು ಹಾಗೂ ಪ್ರಕಾಶಮಾನ, ಕಾಂಟ್ರಾಸ್ಟ್, ಬೆಚ್ಚನೆ ಹೊಂದಾಣಿಕೆಗಳನ್ನು ಸೇರಿಸುತ್ತದೆ. ಸಂಪೂರ್ಣ Pro ಅನ್ನು 14 ದಿನಗಳ ಕಾಲ ಉಚಿತವಾಗಿ ಪ್ರಯತ್ನಿಸಬಹುದು.", "q11": "ಉಚಿತ ಟ್ರಯಲ್ ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ?", "a11": "<strong>Nocti Pro</strong> ತೆರೆದು <strong>14 ದಿನಗಳ ಉಚಿತ ಟ್ರಯಲ್ ಆರಂಭಿಸಿ</strong> ಟ್ಯಾಪ್ ಮಾಡಿ. ಟ್ರಯಲ್ ಒಂದು ಉಚಿತ ಇನ್-ಆ್ಯಪ್ ಖರೀದಿ, ಹಾಗಾಗಿ ಅದು ನಿಮ್ಮ Apple ಖಾತೆಗೆ ಸೇರಿರುತ್ತದೆ: ನಿಮ್ಮ ಎಲ್ಲ ಸಾಧನಗಳಲ್ಲಿ 14 ದಿನ Pro ಅನ್‌ಲಾಕ್ ಆಗಿರುತ್ತದೆ, ಮತ್ತು ಪ್ರತಿ Apple ಖಾತೆ ಇದನ್ನು ಒಮ್ಮೆ ಮಾತ್ರ ಬಳಸಬಹುದು. ಯಾವುದೇ ಶುಲ್ಕವಿಲ್ಲ, ಯಾವುದೂ ನವೀಕರಣಗೊಳ್ಳುವುದಿಲ್ಲ.", "q12": "ಉಚಿತ ಟ್ರಯಲ್ ಮುಗಿದಾಗ ಏನಾಗುತ್ತದೆ?", "a12": "Nocti ಕೆಲಸ ಮುಂದುವರಿಸುತ್ತದೆ ಮತ್ತು Nocti ಬೂದುಗೆ ಮರಳುತ್ತದೆ. ಯಾವುದೇ ಶುಲ್ಕವಿಲ್ಲ, ರದ್ದುಗೊಳಿಸಬೇಕಾದದ್ದೂ ಏನೂ ಇಲ್ಲ. ನಿಮ್ಮ ಕಸ್ಟಮ್ ಥೀಮ್‌ಗಳು ಮತ್ತು ಹೊಂದಾಣಿಕೆಗಳು ಉಳಿಯುತ್ತವೆ, ಮತ್ತು Pro ಅನ್‌ಲಾಕ್ ಮಾಡಿದ ತಕ್ಷಣ ಮರಳಿ ಬರುತ್ತವೆ.", "q13": "ನನ್ನ Mac ಅಥವಾ iPad ನಲ್ಲಿ Nocti Pro ಅನ್ನು ಮತ್ತೆ ಖರೀದಿಸಬೇಕೆ?", "a13": "ಇಲ್ಲ. ಒಂದೇ Apple ಖಾತೆಯೊಂದಿಗೆ ಒಮ್ಮೆ ಖರೀದಿಸಿದರೆ iPhone, iPad ಮತ್ತು Mac ನಲ್ಲಿ Pro ಅನ್‌ಲಾಕ್ ಆಗುತ್ತದೆ. ಯಾವುದಾದರೂ ಸಾಧನ ಇನ್ನೂ ಉಚಿತ ಆವೃತ್ತಿ ತೋರಿಸಿದರೆ, ಆ್ಯಪ್‌ನಲ್ಲಿ <strong>Nocti Pro</strong> ತೆರೆದು <strong>ಖರೀದಿಗಳನ್ನು ಮರುಸ್ಥಾಪಿಸಿ</strong> ಟ್ಯಾಪ್ ಮಾಡಿ.", "q14": "Nocti ಜಾಹೀರಾತು ತೋರಿಸುತ್ತದೆಯೇ ಅಥವಾ ರೇಟಿಂಗ್ ಕೇಳುತ್ತದೆಯೇ?", "a14": "ವೆಬ್ ಪುಟಗಳ ಒಳಗೆ ಅಥವಾ Nocti ಮೆನುವಿನಲ್ಲಿ ಎಂದಿಗೂ ಇಲ್ಲ. Nocti ಯಲ್ಲಿ ಜಾಹೀರಾತುಗಳಿಲ್ಲ — Pro ಈ ಆ್ಯಪ್‌ನೊಳಗಿನ ಒಂದೇ, ಐಚ್ಛಿಕ ಖರೀದಿ."}, "ml": {"title": "Nocti · പിന്തുണ", "app": "Nocti", "tagline": "iPhone, iPad, Mac എന്നിവയിലെ Safari-ക്കുള്ള ഡാർക്ക് മോഡ്", "support_h": "പിന്തുണ", "contact_h": "ഞങ്ങളെ ബന്ധപ്പെടുക", "contact_p": "ചോദ്യമോ ബഗ് റിപ്പോർട്ടോ ശരിയായി കാണാത്ത സൈറ്റോ ഉണ്ടോ? ഞങ്ങൾക്ക് ഇമെയിൽ അയയ്ക്കൂ, സാധാരണ രണ്ട് ദിവസത്തിനുള്ളിൽ മറുപടി നൽകും.", "contact_btn": "ഇമെയിൽ അയയ്ക്കുക", "faq_h": "പതിവ് ചോദ്യങ്ങൾ", "privacy_link": "സ്വകാര്യതാ നയം", "q1": "Nocti എന്റെ ബ്രൗസിംഗ് ഡാറ്റ ശേഖരിക്കുന്നുണ്ടോ?", "a1": "ഇല്ല. Nocti പേജുകളുടെ നിറം പൂർണ്ണമായും നിങ്ങളുടെ ഉപകരണത്തിൽ മാറ്റുന്നു, നിങ്ങളുടെ ബ്രൗസിംഗ് ചരിത്രമോ പേജ് ഉള്ളടക്കമോ ഒരിക്കലും ശേഖരിക്കുന്നില്ല. ഇത് അജ്ഞാത ഉപയോഗ ഡാറ്റ അയയ്ക്കുന്നു, നിങ്ങൾ ഒരു സൈറ്റ് റിപ്പോർട്ട് ചെയ്യുമ്പോഴോ അതിൽ Nocti ഓഫാക്കുമ്പോഴോ ആ സൈറ്റിന്റെ ഡൊമെയ്‌ൻ ഉൾപ്പെടെ, ഏതൊക്കെ സൈറ്റുകൾ ശരിയാക്കണമെന്ന് ഞങ്ങൾ അറിയാൻ. ഇത് ക്രമീകരണത്തിൽ ഓഫാക്കാം.", "q2": "Nocti എന്തിനാണ് എല്ലാ വെബ്സൈറ്റുകളിലേക്കും ആക്‌സസ് ചോദിക്കുന്നത്?", "a2": "ഒരു പേജ് ഡാർക്ക് ആക്കാൻ Nocti അതിന്റെ നിറങ്ങൾ വായിക്കണം. എല്ലാ വെബ്സൈറ്റുകളിലേക്കും ആക്‌സസ് ഉണ്ടെങ്കിൽ, എല്ലാ പേജും ആദ്യ ഫ്രെയിം മുതൽ ഇരുണ്ടതാക്കാം. സൈറ്റുകൾ ഓരോന്നായി അനുവദിച്ചാൽ, നിങ്ങൾ അനുവദിക്കാത്ത പേജുകൾ ലൈറ്റ് ആയി തുടരും.", "q3": "WeChat, മെയിൽ, മറ്റ് ആപ്പുകൾ എന്നിവയിൽ Nocti പ്രവർത്തിക്കുന്നില്ല.", "a3": "മറ്റ് ആപ്പുകൾക്കുള്ളിൽ തുറക്കുന്ന പേജുകൾ Safari എക്സ്റ്റൻഷനുകൾ പിന്തുണയ്ക്കാത്ത ബിൽറ്റ്-ഇൻ ബ്രൗസർ ഉപയോഗിക്കുന്നു. <strong>Safari-യിൽ തുറക്കുക</strong> ടാപ്പ് ചെയ്യുക (സാധാരണയായി ••• അല്ലെങ്കിൽ ഷെയർ മെനുവിൽ), അവിടെ Nocti പ്രവർത്തിക്കും.", "q4": "പുതിയ ടാബ് പേജ് അല്ലെങ്കിൽ ആരംഭ പേജ് ഇപ്പോഴും ലൈറ്റ് ആയിരിക്കുന്നത് എന്തുകൊണ്ട്?", "a4": "ആരംഭ പേജ്, ക്രമീകരണം, വായനാ ലിസ്റ്റ് പോലുള്ള Safari-യുടെ സ്വന്തം പേജുകൾ മാറ്റാൻ Safari എക്സ്റ്റൻഷനുകളെ അനുവദിക്കുന്നില്ല. അവ നിങ്ങളുടെ സിസ്റ്റം രൂപഭാവം പിന്തുടരുന്നു — അവ ഡാർക്ക് ആക്കാൻ ഉപകരണം ഡാർക്ക് മോഡിലേക്ക് മാറ്റുക.", "q5": "ഒരു വെബ്സൈറ്റ് ശരിയായി കാണുന്നില്ല. എന്ത് ചെയ്യാം?", "a5": "ആ സൈറ്റിൽ Nocti മെനു തുറന്ന് <strong>ഈ സൈറ്റിൽ പ്രവർത്തനരഹിതമാക്കുക</strong> ഓണാക്കുക. പേജ് ഉടൻ സാധാരണ നിലയിലാകും, Nocti അത് ഓർത്തുവയ്ക്കും. ഏതാനും ആഴ്ചകൾ കൂടുമ്പോൾ ഞങ്ങൾ സൈറ്റ് പരിഹാരങ്ങൾ പുറത്തിറക്കുന്നു, അതിനാൽ ഒരു അപ്‌ഡേറ്റിന് ശേഷം വീണ്ടും ഓണാക്കി നോക്കൂ.", "q6": "ഒരു വെബ്സൈറ്റിന് ഇതിനകം ഡാർക്ക് ഡിസൈൻ ഉണ്ട്. Nocti അതിനെ വീണ്ടും ഇരുണ്ടതാക്കുമോ?", "a6": "ഇല്ല. സ്വന്തമായി ഡാർക്ക് ഡിസൈനുള്ള സൈറ്റുകൾ Nocti കണ്ടെത്തി ഒഴിവാക്കുന്നു. ഇത് സൂചിപ്പിക്കാൻ ടൂൾബാർ ഐക്കൺ മങ്ങുന്നു.", "q7": "ഞാൻ സിസ്റ്റം ലൈറ്റ് മോഡിലേക്ക് മാറ്റി, പക്ഷേ ഒന്നും മാറിയില്ല.", "a7": "Nocti മെനുവിൽ മോഡ് പരിശോധിക്കുക. <strong>സിസ്റ്റം പിന്തുടരുക</strong>-യിൽ, തുറന്ന ടാബുകൾ ഒരു സെക്കൻഡിനുള്ളിൽ പഴയപടിയാകും. <strong>എപ്പോഴും ഓൺ</strong>-ൽ, സിസ്റ്റം രൂപഭാവം എന്തായാലും വെബ്സൈറ്റുകൾ ഡാർക്ക് ആയിരിക്കും.", "q8": "PDF-കൾ എന്തുകൊണ്ട് ഡാർക്ക് ആകുന്നില്ല?", "a8": "PDF-കൾ, ലോക്കൽ ഫയലുകൾ, Safari-യുടെ സ്വന്തം പേജുകൾ എന്നിവ മനഃപൂർവം അതേപടി വിടുന്നു. അവയിൽ നിർബന്ധമായി ഡാർക്ക് മോഡ് പ്രയോഗിച്ചാൽ പലപ്പോഴും അവ ശൂന്യമാകും.", "q9": "പേജുകൾ വീണ്ടും ലൈറ്റ് ആകുന്നു, അല്ലെങ്കിൽ ചിത്രങ്ങൾ തലകീഴായ നിറത്തിൽ കാണുന്നു.", "a9": "<strong>സ്മാർട്ട് ഇൻവേർട്ട്</strong>, <strong>ക്ലാസിക് ഇൻവേർട്ട്</strong> എന്നിവ ഓഫാക്കുക — അവ Nocti-യുമായി കൂട്ടിമുട്ടും. iPhone-ലും iPad-ലും: <strong>ക്രമീകരണം → പ്രവേശനക്ഷമത → ഡിസ്‌പ്ലേയും ടെക്സ്റ്റ് വലുപ്പവും</strong>. Mac-ൽ: <strong>സിസ്റ്റം ക്രമീകരണം → പ്രവേശനക്ഷമത → ഡിസ്‌പ്ലേ</strong>.", "q10": "എന്താണ് സൗജന്യം, Nocti Pro എന്ത് ചേർക്കുന്നു?", "a10": "പേജുകൾ വായിക്കാവുന്നതാക്കുന്ന എല്ലാം എന്നും സൗജന്യമാണ്: വെള്ള മിന്നലില്ല, തിളങ്ങുന്ന അരികുകളില്ല, സിസ്റ്റം പിന്തുടരുക, ഓരോ സൈറ്റിനുമുള്ള നിയന്ത്രണം, ഡാർക്ക് സൈറ്റ് കണ്ടെത്തൽ, ഒപ്പം Nocti ഗ്രേ തീമും. <strong>Nocti Pro</strong> ഒറ്റത്തവണ വാങ്ങലാണ്; അത് OLED ബ്ലാക്കും നാല് തീമുകളും കൂടി, ഇഷ്ടാനുസൃത തീമുകൾ, തെളിച്ചം, കോൺട്രാസ്റ്റ്, ഊഷ്മളത ക്രമീകരണങ്ങൾ എന്നിവ ചേർക്കുന്നു. Pro മുഴുവനും 14 ദിവസം സൗജന്യമായി പരീക്ഷിക്കാം.", "q11": "സൗജന്യ ട്രയൽ എങ്ങനെ പ്രവർത്തിക്കുന്നു?", "a11": "<strong>Nocti Pro</strong> തുറന്ന് <strong>14 ദിവസത്തെ സൗജന്യ ട്രയൽ ആരംഭിക്കുക</strong> ടാപ്പ് ചെയ്യുക. ട്രയൽ ഒരു സൗജന്യ ഇൻ-ആപ്പ് വാങ്ങലാണ്, അതിനാൽ അത് നിങ്ങളുടെ Apple അക്കൗണ്ടിന്റേതാണ്: നിങ്ങളുടെ എല്ലാ ഉപകരണങ്ങളിലും 14 ദിവസത്തേക്ക് Pro അൺലോക്ക് ആകും, ഓരോ Apple അക്കൗണ്ടിനും ഇത് ഒരിക്കൽ മാത്രം ഉപയോഗിക്കാം. ഒരു തുകയും ഈടാക്കില്ല, ഒന്നും പുതുക്കപ്പെടുകയുമില്ല.", "q12": "സൗജന്യ ട്രയൽ കഴിയുമ്പോൾ എന്ത് സംഭവിക്കും?", "a12": "Nocti പ്രവർത്തനം തുടരുകയും Nocti ഗ്രേയിലേക്ക് മടങ്ങുകയും ചെയ്യും. ഒന്നിനും പണം ഈടാക്കില്ല, റദ്ദാക്കാനും ഒന്നുമില്ല. നിങ്ങളുടെ ഇഷ്ടാനുസൃത തീമുകളും ക്രമീകരണങ്ങളും സൂക്ഷിക്കപ്പെടും, Pro അൺലോക്ക് ചെയ്യുമ്പോൾ തന്നെ അവ തിരിച്ചെത്തും.", "q13": "എന്റെ Mac-ലോ iPad-ലോ Nocti Pro വീണ്ടും വാങ്ങണോ?", "a13": "ഇല്ല. ഒരേ Apple അക്കൗണ്ട് ഉപയോഗിച്ച് ഒരൊറ്റ വാങ്ങൽ iPhone, iPad, Mac എന്നിവയിൽ Pro അൺലോക്ക് ചെയ്യുന്നു. ഒരു ഉപകരണം ഇപ്പോഴും സൗജന്യ പതിപ്പ് കാണിക്കുന്നുവെങ്കിൽ, ആപ്പിൽ <strong>Nocti Pro</strong> തുറന്ന് <strong>വാങ്ങലുകൾ പുനഃസ്ഥാപിക്കുക</strong> ടാപ്പ് ചെയ്യുക.", "q14": "Nocti പരസ്യങ്ങൾ കാണിക്കുമോ റേറ്റിംഗ് ചോദിക്കുമോ?", "a14": "വെബ് പേജുകൾക്കുള്ളിലോ Nocti മെനുവിലോ ഒരിക്കലുമില്ല. Nocti-യിൽ പരസ്യങ്ങളില്ല — Pro ഈ ആപ്പിനുള്ളിലെ ഒരൊറ്റ, ഐച്ഛിക വാങ്ങലാണ്."}, "mr": {"title": "Nocti · सहाय्य", "app": "Nocti", "tagline": "iPhone, iPad आणि Mac वरील Safari साठी डार्क मोड", "support_h": "सहाय्य", "contact_h": "आमच्याशी संपर्क साधा", "contact_p": "प्रश्न, बग रिपोर्ट किंवा एखादी साइट चुकीची दिसत आहे? आम्हाला ईमेल करा, आम्ही साधारणपणे दोन दिवसांत उत्तर देतो.", "contact_btn": "ईमेल पाठवा", "faq_h": "सामान्य प्रश्न", "privacy_link": "गोपनीयता धोरण", "q1": "Nocti माझा ब्राउझिंग डेटा गोळा करते का?", "a1": "नाही. Nocti पेजेसना पूर्णपणे तुमच्या डिव्हाइसवर नवी शैली देते आणि तुमचा ब्राउझिंग इतिहास किंवा पेजचा मजकूर कधीही गोळा करत नाही. ते निनावी वापर डेटा पाठवते, ज्यात तुम्ही एखादी साइट रिपोर्ट करता किंवा तिच्यासाठी Nocti बंद करता तेव्हा त्या साइटचे डोमेन असते, जेणेकरून कोणत्या साइट्सना दुरुस्तीची गरज आहे हे आम्हाला कळते. तुम्ही हे सेटिंग्जमध्ये बंद करू शकता.", "q2": "Nocti सर्व वेबसाइट्सचा ॲक्सेस का मागते?", "a2": "पेज गडद करण्यासाठी Nocti ला त्याचे रंग वाचावे लागतात. सर्व वेबसाइट्सचा ॲक्सेस असल्यास, ते प्रत्येक पेज अगदी पहिल्या फ्रेमपासून गडद करू शकते. तुम्ही साइट्सना एकेक करून अनुमती दिल्यास, अनुमती न दिलेली पेजेस उजळच राहतात.", "q3": "Nocti Instagram, मेल किंवा इतर ॲप्समध्ये काम करत नाही.", "a3": "इतर ॲप्समध्ये उघडलेली पेजेस अंगभूत ब्राउझर वापरतात, जो Safari एक्सटेन्शन्सना सपोर्ट करत नाही. <strong>Safari मध्ये उघडा</strong> वर टॅप करा (सहसा ••• किंवा शेअर मेनूमध्ये) आणि तिथे Nocti काम करेल.", "q4": "नवीन टॅब पेज किंवा स्टार्ट पेज अजूनही उजळ का आहे?", "a4": "Safari एक्सटेन्शन्सना स्टार्ट पेज, सेटिंग्ज आणि वाचन सूची यांसारखी स्वतःची पेजेस बदलू देत नाही. ती त्याऐवजी तुमच्या सिस्टमच्या स्वरूपानुसार चालतात — ती गडद करण्यासाठी तुमचे डिव्हाइस डार्क मोडवर स्विच करा.", "q5": "वेबसाइट चुकीची दिसते. मी काय करू?", "a5": "त्या साइटवर Nocti मेनू उघडा आणि <strong>या साइटवर बंद करा</strong> सुरू करा. पेज लगेच पूर्ववत होते आणि Nocti ते लक्षात ठेवते. आम्ही दर काही आठवड्यांनी साइट दुरुस्त्या प्रकाशित करतो, त्यामुळे अपडेटनंतर ते पुन्हा सुरू करून पाहा.", "q6": "वेबसाइटचे डिझाइन आधीच गडद आहे. Nocti ती पुन्हा गडद करेल का?", "a6": "नाही. Nocti स्वतःचे डार्क डिझाइन असलेल्या साइट्स ओळखते आणि त्या वगळते. हे दाखवण्यासाठी टूलबार आयकॉन फिकट होतो.", "q7": "मी सिस्टम लाइट मोडवर बदलली, पण काहीच बदलले नाही.", "a7": "Nocti मेनूमध्ये मोड तपासा. <strong>सिस्टमनुसार</strong> मध्ये उघडे टॅब्स एका सेकंदात परत बदलतात. <strong>नेहमी सुरू</strong> मध्ये सिस्टमचे स्वरूप काहीही असले तरी वेबसाइट्स गडदच राहतात.", "q8": "PDF गडद का होत नाहीत?", "a8": "PDF, स्थानिक फाइल्स आणि Safari ची स्वतःची पेजेस मुद्दाम जशी आहेत तशी ठेवली जातात. त्यांच्यावर जबरदस्तीने डार्क मोड लावल्यास ती अनेकदा रिकामी होतात.", "q9": "पेजेस पुन्हा उजळ होतात, किंवा इमेजेस उलट्या रंगांच्या दिसतात.", "a9": "<strong>स्मार्ट इन्व्हर्ट</strong> आणि <strong>क्लासिक इन्व्हर्ट</strong> बंद करा — ते Nocti शी विसंगत आहेत. iPhone आणि iPad वर: <strong>सेटिंग्ज → ॲक्सेसिबिलिटी → डिस्प्ले आणि मजकूर आकार</strong>. Mac वर: <strong>सिस्टम सेटिंग्ज → ॲक्सेसिबिलिटी → डिस्प्ले</strong>.", "q10": "काय मोफत आहे, आणि Nocti Pro काय जोडते?", "a10": "पेजेस वाचनीय ठेवणारे सर्व काही कायमचे मोफत आहे: पांढरी चमक नाही, उजळ कडा नाहीत, सिस्टमनुसार, प्रत्येक साइटसाठी नियंत्रण आणि गडद साइट ओळख, तसेच Nocti ग्रे थीम. <strong>Nocti Pro</strong> ही एकदाच करायची खरेदी आहे, जी OLED ब्लॅक आणि आणखी चार थीम्स, कस्टम थीम्स, तसेच ब्राइटनेस, कॉन्ट्रास्ट आणि उबदारपणा ॲडजस्टमेंट्स जोडते. तुम्ही संपूर्ण Pro 14 दिवस मोफत वापरून पाहू शकता.", "q11": "मोफत ट्रायल कशी चालते?", "a11": "<strong>Nocti Pro</strong> उघडा आणि <strong>14 दिवसांची मोफत ट्रायल सुरू करा</strong> वर टॅप करा. ट्रायल ही मोफत ॲप-मधील खरेदी आहे, त्यामुळे ती तुमच्या Apple खात्याशी जोडलेली असते: तुमच्या सर्व डिव्हाइसेसवर Pro 14 दिवसांसाठी अनलॉक होते, आणि प्रत्येक Apple खाते ती एकदाच वापरू शकते. कोणतेही शुल्क नाही आणि काहीही रिन्यू होत नाही.", "q12": "मोफत ट्रायल संपल्यावर काय होते?", "a12": "Nocti काम करत राहते आणि पुन्हा Nocti ग्रे वर येते. कोणतेही शुल्क आकारले जात नाही आणि काहीही रद्द करावे लागत नाही. तुमच्या कस्टम थीम्स आणि ॲडजस्टमेंट्स जपून ठेवल्या जातात आणि Pro अनलॉक करताच परत येतात.", "q13": "Mac किंवा iPad वर मला Nocti Pro पुन्हा खरेदी करावे लागेल का?", "a13": "नाही. एकाच Apple खात्याने एकदा खरेदी केल्यावर iPhone, iPad आणि Mac वर Pro अनलॉक होते. एखाद्या डिव्हाइसवर अजूनही मोफत व्हर्जन दिसत असल्यास, ॲपमध्ये <strong>Nocti Pro</strong> उघडा आणि <strong>खरेदी पुनर्संचयित करा</strong> वर टॅप करा.", "q14": "Nocti जाहिराती दाखवेल किंवा रेटिंग मागेल का?", "a14": "वेब पेजेसमध्ये किंवा Nocti मेनूमध्ये कधीच नाही. Nocti मध्ये जाहिराती नाहीत — Pro ही या ॲपमधील एकच, ऐच्छिक खरेदी आहे."}, "ms": {"title": "Nocti · Sokongan", "app": "Nocti", "tagline": "Mod Gelap untuk Safari pada iPhone, iPad dan Mac", "support_h": "Sokongan", "contact_h": "Hubungi kami", "contact_p": "Ada soalan, laporan pepijat atau tapak web yang kelihatan tidak betul? E-mel kami, kami biasanya membalas dalam masa dua hari.", "contact_btn": "Hantar e-mel", "faq_h": "Soalan Lazim", "privacy_link": "Dasar Privasi", "q1": "Adakah Nocti mengumpul data pelayaran saya?", "a1": "Tidak. Nocti menggayakan semula halaman sepenuhnya pada peranti anda dan tidak sekali-kali mengumpul sejarah pelayaran atau kandungan halaman anda. Ia menghantar data penggunaan tanpa nama, termasuk domain laman apabila anda melaporkannya atau mematikan Nocti untuknya, supaya kami tahu laman mana yang perlu dibaiki. Anda boleh mematikannya dalam Seting.", "q2": "Mengapakah Nocti meminta akses kepada semua laman web?", "a2": "Nocti perlu membaca warna halaman untuk menggelapkannya. Dengan akses kepada semua laman web, ia boleh menggelapkan setiap halaman dari bingkai pertama lagi. Jika anda membenarkan laman satu demi satu, halaman yang belum dibenarkan kekal cerah.", "q3": "Nocti tidak berfungsi dalam Instagram, Mail atau app lain.", "a3": "Halaman yang dibuka di dalam app lain menggunakan pelayar terbina dalam yang tidak menyokong sambungan Safari. Ketik <strong>Buka dalam Safari</strong> (biasanya dalam menu ••• atau menu kongsi) dan Nocti akan berfungsi di sana.", "q4": "Mengapakah halaman tab baharu atau Halaman Mula masih cerah?", "a4": "Safari tidak membenarkan sambungan mengubah halamannya sendiri, seperti Halaman Mula, Seting dan Senarai Bacaan. Halaman ini mengikut penampilan sistem anda — tukar peranti kepada mod Gelap untuk menjadikannya gelap.", "q5": "Laman web kelihatan salah. Apakah yang boleh saya lakukan?", "a5": "Buka menu Nocti pada laman itu dan hidupkan <strong>Nyahdayakan pada Laman Ini</strong>. Halaman kembali normal serta-merta dan Nocti mengingatinya. Kami mengeluarkan pembaikan laman setiap beberapa minggu, jadi cuba hidupkannya semula selepas kemas kini.", "q6": "Laman web sudah mempunyai reka bentuk gelap. Adakah Nocti akan menggelapkannya dua kali?", "a6": "Tidak. Nocti mengesan laman yang mempunyai reka bentuk gelapnya sendiri dan melangkauinya. Ikon bar alat menjadi pudar untuk menunjukkan perkara ini.", "q7": "Saya menukar sistem kepada mod Cerah, tetapi tiada apa-apa yang berubah.", "a7": "Semak mod dalam menu Nocti. Dalam <strong>Ikut Sistem</strong>, tab yang terbuka bertukar semula dalam masa sesaat. Dalam <strong>Sentiasa Hidup</strong>, laman web kekal gelap walau apa pun penampilan sistem.", "q8": "Mengapakah PDF tidak gelap?", "a8": "PDF, fail setempat dan halaman Safari sendiri sengaja dibiarkan seperti asal. Memaksa mod gelap padanya selalunya menjadikannya kosong.", "q9": "Halaman bertukar kembali menjadi cerah, atau imej kelihatan tersongsang.", "a9": "Matikan <strong>Songsang Pintar</strong> dan <strong>Songsang Klasik</strong> — kedua-duanya bercanggah dengan Nocti. Pada iPhone dan iPad: <strong>Seting → Kebolehcapaian → Paparan &amp; Saiz Teks</strong>. Pada Mac: <strong>Seting Sistem → Kebolehcapaian → Paparan</strong>.", "q10": "Apakah yang percuma, dan apakah yang ditambah oleh Nocti Pro?", "a10": "Semua yang memastikan halaman mudah dibaca adalah percuma selama-lamanya: tiada kelipan putih, tiada tepi terang, Ikut Sistem, kawalan setiap laman dan pengesanan laman gelap, bersama tema Kelabu Nocti. <strong>Nocti Pro</strong> ialah pembelian sekali sahaja yang menambah Hitam OLED dan empat tema lagi, tema tersuai, serta pelarasan kecerahan, kontras dan kehangatan. Anda boleh mencuba semua ciri Pro secara percuma selama 14 hari.", "q11": "Bagaimanakah percubaan percuma berfungsi?", "a11": "Buka <strong>Nocti Pro</strong> dan ketik <strong>Mulakan Percubaan Percuma 14 Hari</strong>. Percubaan ini ialah pembelian dalam app yang percuma, jadi ia terikat pada Akaun Apple anda: Pro dibuka kunci selama 14 hari pada semua peranti anda, dan setiap Akaun Apple boleh menggunakannya sekali. Tiada caj dan tiada pembaharuan.", "q12": "Apakah yang berlaku apabila percubaan percuma tamat?", "a12": "Nocti terus berfungsi dan kembali kepada Kelabu Nocti. Tiada sebarang caj dan tiada apa-apa yang perlu dibatalkan. Tema tersuai dan pelarasan anda disimpan, dan akan kembali sebaik sahaja anda membuka kunci Pro.", "q13": "Adakah saya perlu membeli Nocti Pro sekali lagi pada Mac atau iPad?", "a13": "Tidak. Satu pembelian membuka kunci Pro pada iPhone, iPad dan Mac dengan Akaun Apple yang sama. Jika peranti masih menunjukkan versi percuma, buka <strong>Nocti Pro</strong> dalam app dan ketik <strong>Pulihkan Pembelian</strong>.", "q14": "Adakah Nocti akan menunjukkan iklan atau meminta saya memberi penilaian?", "a14": "Tidak sekali-kali di dalam halaman web atau menu Nocti. Nocti tiada iklan — Pro ialah satu pembelian pilihan di dalam app ini."}, "nb": {"title": "Nocti · Brukerstøtte", "app": "Nocti", "tagline": "Mørk modus for Safari på iPhone, iPad og Mac", "support_h": "Brukerstøtte", "contact_h": "Kontakt oss", "contact_p": "Har du et spørsmål, en feilrapport eller et nettsted som ser feil ut? Send oss en e-post – vi svarer vanligvis innen to dager.", "contact_btn": "Send e-post", "faq_h": "Vanlige spørsmål", "privacy_link": "Personvernerklæring", "q1": "Samler Nocti inn nettleserdataene mine?", "a1": "Nei. Nocti gir sider ny stil helt og holdent på enheten din og samler aldri inn nettleserloggen eller sideinnholdet ditt. Appen sender anonyme bruksdata, inkludert domenet til et nettsted når du rapporterer det eller slår av Nocti for det, slik at vi vet hvilke nettsteder som må fikses. Du kan slå dette av i Innstillinger.", "q2": "Hvorfor ber Nocti om tilgang til alle nettsteder?", "a2": "Nocti må lese fargene på en side for å gjøre den mørk. Med tilgang til alle nettsteder kan Nocti gjøre hver side mørk fra aller første bilde. Hvis du tillater nettsteder ett om gangen, forblir sider du ikke har tillatt, lyse.", "q3": "Nocti virker ikke i Mail eller andre apper.", "a3": "Sider som åpnes i andre apper, bruker en innebygd nettleser som ikke støtter Safari-utvidelser. Trykk på <strong>Åpne i Safari</strong> (vanligvis i •••- eller delingsmenyen), så virker Nocti der.", "q4": "Hvorfor er siden for ny fane eller Startside fortsatt lys?", "a4": "Safari lar ikke utvidelser endre Safaris egne sider, som Startside, Innstillinger og Leseliste. De følger i stedet systemets utseende – bytt enheten til mørk modus for å gjøre dem mørke.", "q5": "Et nettsted ser feil ut. Hva kan jeg gjøre?", "a5": "Åpne Nocti-menyen på nettstedet, og slå på <strong>Deaktiver på dette nettstedet</strong>. Siden går tilbake til normalt med en gang, og Nocti husker det. Vi slipper nettstedjusteringer med noen ukers mellomrom, så prøv å aktivere Nocti igjen etter en oppdatering.", "q6": "Et nettsted har allerede et mørkt design. Gjør Nocti det mørkt to ganger?", "a6": "Nei. Nocti gjenkjenner nettsteder med eget mørkt design og hopper over dem. Symbolet i verktøylinjen blir blekt for å vise dette.", "q7": "Jeg byttet systemet til lys modus, men ingenting endret seg.", "a7": "Sjekk modusen i Nocti-menyen. I <strong>Følg systemet</strong> blir åpne faner lyse igjen i løpet av et sekund. I <strong>Alltid på</strong> forblir nettsteder mørke uansett systemets utseende.", "q8": "Hvorfor blir ikke PDF-er mørke?", "a8": "PDF-er, lokale filer og Safaris egne sider blir med vilje latt være som de er. Å tvinge mørk modus på dem gjør dem ofte blanke.", "q9": "Sider blir lyse igjen, eller bilder ser inverterte ut.", "a9": "Slå av <strong>Smart invertering</strong> og <strong>Klassisk invertering</strong> – de kommer i konflikt med Nocti. På iPhone og iPad: <strong>Innstillinger → Tilgjengelighet → Skjerm og tekststørrelse</strong>. På Mac: <strong>Systeminnstillinger → Tilgjengelighet → Skjerm</strong>.", "q10": "Hva er gratis, og hva får jeg med Nocti Pro?", "a10": "Alt som holder sidene lesbare, er gratis for alltid: ingen hvite glimt, ingen lyse kanter, Følg systemet, kontroll per nettsted og gjenkjenning av mørke nettsteder, pluss temaet Nocti-grå. <strong>Nocti Pro</strong> er et engangskjøp som gir deg OLED-svart og fire andre temaer, egendefinerte temaer og justering av lysstyrke, kontrast og varme. Du kan prøve hele Pro gratis i 14 dager.", "q11": "Hvordan fungerer den gratis prøveperioden?", "a11": "Åpne <strong>Nocti Pro</strong> og trykk på <strong>Prøv gratis i 14 dager</strong>. Prøveperioden er et gratis kjøp i appen og hører derfor til Apple-kontoen din: Pro er låst opp i 14 dager på alle enhetene dine, og hver Apple-konto kan bruke den én gang. Du blir ikke belastet, og ingenting fornyes.", "q12": "Hva skjer når den gratis prøveperioden er over?", "a12": "Nocti fortsetter å virke og bytter tilbake til Nocti-grå. Du blir ikke belastet, og det er ingenting å si opp. De egendefinerte temaene og justeringene dine beholdes, og kommer tilbake så snart du låser opp Pro.", "q13": "Må jeg kjøpe Nocti Pro på nytt på Mac eller iPad?", "a13": "Nei. Ett kjøp låser opp Pro på iPhone, iPad og Mac med samme Apple-konto. Hvis en enhet fortsatt viser gratisversjonen, åpner du <strong>Nocti Pro</strong> i appen og trykker på <strong>Gjenopprett kjøp</strong>.", "q14": "Viser Nocti reklame eller ber meg om vurderinger?", "a14": "Aldri på nettsider eller i Nocti-menyen. Nocti har ingen reklame – Pro er ett enkelt, valgfritt kjøp i denne appen."}, "nl": {"title": "Nocti · Support", "app": "Nocti", "tagline": "Donkere modus voor Safari op iPhone, iPad en Mac", "support_h": "Support", "contact_h": "Neem contact op", "contact_p": "Een vraag, een bugmelding of een website die er raar uitziet? Mail ons, we antwoorden meestal binnen twee dagen.", "contact_btn": "Mail ons", "faq_h": "Veelgestelde vragen", "privacy_link": "Privacybeleid", "q1": "Verzamelt Nocti mijn browsegegevens?", "a1": "Nee. Nocti past pagina's volledig op je apparaat aan en verzamelt nooit je browsegeschiedenis of pagina-inhoud. Het verstuurt anonieme gebruiksgegevens, inclusief het domein van een site als je die meldt of Nocti erop uitzet, zodat we weten welke sites aangepast moeten worden. Je kunt dit uitzetten in Instellingen.", "q2": "Waarom vraagt Nocti om toegang tot alle websites?", "a2": "Nocti moet de kleuren van een pagina lezen om hem donker te maken. Met toegang tot alle websites kan het elke pagina vanaf het allereerste frame donker maken. Sta je sites een voor een toe, dan blijven pagina's die je niet hebt toegestaan licht.", "q3": "Nocti werkt niet in Instagram, Mail of andere apps.", "a3": "Pagina's die je in andere apps opent, gebruiken een ingebouwde browser die geen Safari-extensies ondersteunt. Tik op <strong>Open in Safari</strong> (meestal in het •••- of deelmenu) en Nocti werkt daar wel.", "q4": "Waarom is de nieuwe-tabbladpagina of startpagina nog licht?", "a4": "Safari laat extensies zijn eigen pagina's, zoals de startpagina, Instellingen en de leeslijst, niet aanpassen. Die volgen in plaats daarvan de weergave van je systeem – zet je apparaat in de donkere modus om ze donker te maken.", "q5": "Een website ziet er verkeerd uit. Wat kan ik doen?", "a5": "Open op die site het Nocti-menu en zet <strong>Schakel uit op deze site</strong> aan. De pagina wordt meteen weer normaal en Nocti onthoudt het. We brengen om de paar weken siteverbeteringen uit, dus probeer het na een update gerust opnieuw.", "q6": "Een website is al donker. Maakt Nocti hem dan dubbel donker?", "a6": "Nee. Nocti herkent sites met een eigen donker ontwerp en slaat ze over. Het pictogram in de knoppenbalk vervaagt dan.", "q7": "Ik heb mijn systeem op licht gezet, maar er veranderde niets.", "a7": "Controleer de modus in het Nocti-menu. Bij <strong>Volg systeem</strong> schakelen open tabbladen binnen een seconde terug. Bij <strong>Altijd aan</strong> blijven websites donker, ongeacht de weergave van je systeem.", "q8": "Waarom worden pdf's niet donker?", "a8": "Pdf's, lokale bestanden en de eigen pagina's van Safari blijven bewust zoals ze zijn. Ze geforceerd donker maken levert vaak een lege pagina op.", "q9": "Pagina's worden weer licht, of afbeeldingen zien er omgekeerd uit.", "a9": "Zet <strong>Slim omkeren</strong> en <strong>Klassiek omkeren</strong> uit – die botsen met Nocti. Op iPhone en iPad: <strong>Instellingen → Toegankelijkheid → Weergave en tekstgrootte</strong>. Op de Mac: <strong>Systeeminstellingen → Toegankelijkheid → Weergave</strong>.", "q10": "Wat is gratis en wat voegt Nocti Pro toe?", "a10": "Alles wat pagina's leesbaar houdt, is voor altijd gratis: geen witte flits, geen lichte randen, ‘Volg systeem’, bediening per site en herkenning van donkere sites, met het thema Nocti Grijs. <strong>Nocti Pro</strong> is een eenmalige aankoop met OLED-zwart en nog vier thema's, eigen thema's en regelaars voor helderheid, contrast en warmte. Je kunt heel Pro 14 dagen gratis proberen.", "q11": "Hoe werkt de gratis proefperiode?", "a11": "Open <strong>Nocti Pro</strong> en tik op <strong>Probeer 14 dagen gratis</strong>. De proefperiode is een gratis in-app-aankoop en hoort dus bij je Apple Account: Pro is 14 dagen ontgrendeld op al je apparaten, en elk Apple Account kan hem één keer gebruiken. Er wordt niets in rekening gebracht en niets wordt verlengd.", "q12": "Wat gebeurt er als de gratis proefperiode afloopt?", "a12": "Nocti blijft werken en schakelt terug naar Nocti Grijs. Er wordt niets in rekening gebracht en je hoeft niets op te zeggen. Je eigen thema's en aanpassingen blijven bewaard en komen terug zodra je Pro ontgrendelt.", "q13": "Moet ik Nocti Pro opnieuw kopen op mijn Mac of iPad?", "a13": "Nee. Met één aankoop ontgrendel je Pro op iPhone, iPad en Mac met hetzelfde Apple Account. Toont een apparaat nog de gratis versie, open dan <strong>Nocti Pro</strong> in de app en tik op <strong>Herstel aankopen</strong>.", "q14": "Toont Nocti advertenties of vraagt het om beoordelingen?", "a14": "Nooit in webpagina's of in het Nocti-menu. Nocti heeft geen advertenties – Pro is één optionele aankoop in deze app."}, "or": {"title": "Nocti · ସହାୟତା", "app": "Nocti", "tagline": "iPhone, iPad ଓ Mac ରେ Safari ପାଇଁ ଡାର୍କ ମୋଡ୍", "support_h": "ସହାୟତା", "contact_h": "ଆମକୁ ଯୋଗାଯୋଗ କରନ୍ତୁ", "contact_p": "କୌଣସି ପ୍ରଶ୍ନ, ବଗ୍ ରିପୋର୍ଟ ବା ଭୁଲ ଦେଖାଯାଉଥିବା ସାଇଟ୍ ଅଛି କି? ଆମକୁ ଇମେଲ୍ କରନ୍ତୁ, ଆମେ ସାଧାରଣତଃ ଦୁଇ ଦିନ ମଧ୍ୟରେ ଉତ୍ତର ଦେଉ।", "contact_btn": "ଇମେଲ୍ ପଠାନ୍ତୁ", "faq_h": "ବାରମ୍ବାର ପଚରାଯାଉଥିବା ପ୍ରଶ୍ନ", "privacy_link": "ଗୋପନୀୟତା ନୀତି", "q1": "Nocti କ’ଣ ମୋର ବ୍ରାଉଜିଂ ଡାଟା ସଂଗ୍ରହ କରେ?", "a1": "ନା। Nocti ସମ୍ପୂର୍ଣ୍ଣ ଭାବେ ଆପଣଙ୍କ ଡିଭାଇସରେ ପେଜକୁ ନୂଆ ରୂପ ଦିଏ ଏବଂ କେବେ ବି ଆପଣଙ୍କ ବ୍ରାଉଜିଂ ଇତିହାସ କିମ୍ବା ପେଜ୍ ବିଷୟବସ୍ତୁ ସଂଗ୍ରହ କରେ ନାହିଁ। ଏହା ଅଜ୍ଞାତ ବ୍ୟବହାର ଡାଟା ପଠାଏ, ଯେଉଁଥିରେ ଆପଣ କୌଣସି ସାଇଟ୍ ରିପୋର୍ଟ କଲେ କିମ୍ବା ତା’ ପାଇଁ Nocti ବନ୍ଦ କଲେ ସେହି ସାଇଟର ଡୋମେନ୍ ଥାଏ, ଯାହାଦ୍ୱାରା ଆମେ ଜାଣିପାରିବୁ କେଉଁ ସାଇଟ୍ ଠିକ୍ କରିବା ଦରକାର। ଆପଣ ଏହାକୁ ସେଟିଂସରେ ବନ୍ଦ କରିପାରିବେ।", "q2": "Nocti କାହିଁକି ସମସ୍ତ ୱେବସାଇଟର ଆକ୍ସେସ୍ ମାଗେ?", "a2": "ପେଜକୁ ଡାର୍କ କରିବା ପାଇଁ Noctiକୁ ତା’ର ରଙ୍ଗ ପଢ଼ିବାକୁ ପଡ଼େ। ସମସ୍ତ ୱେବସାଇଟର ଆକ୍ସେସ୍ ସହ, ଏହା ପ୍ରତ୍ୟେକ ପେଜକୁ ଏକଦମ୍ ପ୍ରଥମ ଫ୍ରେମରୁ ଡାର୍କ କରିପାରେ। ଯଦି ଆପଣ ଗୋଟିଏ ଗୋଟିଏ କରି ସାଇଟକୁ ଅନୁମତି ଦିଅନ୍ତି, ଅନୁମତି ନଥିବା ପେଜ୍ ହାଲୁକା ରହେ।", "q3": "Nocti WeChat, ମେଲ୍ କିମ୍ବା ଅନ୍ୟ ଆପରେ କାମ କରେ ନାହିଁ।", "a3": "ଅନ୍ୟ ଆପ୍ ଭିତରେ ଖୋଲା ପେଜ୍ ଏକ ବିଲ୍ଟ-ଇନ୍ ବ୍ରାଉଜର୍ ବ୍ୟବହାର କରେ ଯାହା Safari ଏକ୍ସଟେନସନ୍ ସମର୍ଥନ କରେ ନାହିଁ। <strong>Safariରେ ଖୋଲନ୍ତୁ</strong> ଟାପ୍ କରନ୍ତୁ (ସାଧାରଣତଃ ••• କିମ୍ବା ସେୟାର୍ ମେନୁରେ) ଏବଂ ସେଠାରେ Nocti କାମ କରିବ।", "q4": "ନୂଆ ଟାବ୍ ପେଜ୍ କିମ୍ବା ଷ୍ଟାର୍ଟ ପେଜ୍ କାହିଁକି ଏବେ ବି ହାଲୁକା?", "a4": "Safari ଏକ୍ସଟେନସନକୁ ନିଜ ପେଜ୍ ବଦଳାଇବାକୁ ଦିଏ ନାହିଁ, ଯେପରିକି ଷ୍ଟାର୍ଟ ପେଜ୍, ସେଟିଂସ ଏବଂ ରିଡିଂ ଲିଷ୍ଟ। ସେଗୁଡ଼ିକ ବଦଳରେ ଆପଣଙ୍କ ସିଷ୍ଟମ୍ ଆପିୟରାନ୍ସ ଅନୁସରଣ କରେ — ସେଗୁଡ଼ିକୁ ଡାର୍କ କରିବାକୁ ଆପଣଙ୍କ ଡିଭାଇସକୁ ଡାର୍କ ମୋଡକୁ ବଦଳାନ୍ତୁ।", "q5": "ଗୋଟିଏ ୱେବସାଇଟ୍ ଭୁଲ ଦେଖାଯାଉଛି। ମୁଁ କ’ଣ କରିପାରିବି?", "a5": "ସେହି ସାଇଟରେ Nocti ମେନୁ ଖୋଲନ୍ତୁ ଏବଂ <strong>Disable on This Site</strong> ଚାଲୁ କରନ୍ତୁ। ପେଜ୍ ତୁରନ୍ତ ସାଧାରଣ ଅବସ୍ଥାକୁ ଫେରେ ଏବଂ Nocti ଏହାକୁ ମନେ ରଖେ। ଆମେ କିଛି ସପ୍ତାହ ବ୍ୟବଧାନରେ ସାଇଟ୍ ସମାଧାନ ରିଲିଜ୍ କରୁ, ତେଣୁ ଅପଡେଟ୍ ପରେ ଏହାକୁ ପୁଣି ଚାଲୁ କରି ଦେଖନ୍ତୁ।", "q6": "ୱେବସାଇଟର ପୂର୍ବରୁ ଡାର୍କ ଡିଜାଇନ୍ ଅଛି। Nocti କ’ଣ ଏହାକୁ ଦୁଇଥର ଡାର୍କ କରିବ?", "a6": "ନା। Nocti ନିଜସ୍ୱ ଡାର୍କ ଡିଜାଇନ୍ ଥିବା ସାଇଟଗୁଡ଼ିକୁ ଚିହ୍ନଟ କରି ଛାଡ଼ିଦିଏ। ଏହା ଦେଖାଇବା ପାଇଁ ଟୁଲବାର୍ ଆଇକନ୍ ଫିକା ହୋଇଯାଏ।", "q7": "ମୁଁ ମୋ ସିଷ୍ଟମକୁ ଲାଇଟ୍ ମୋଡକୁ ବଦଳାଇଲି, କିନ୍ତୁ କିଛି ବଦଳିଲା ନାହିଁ।", "a7": "Nocti ମେନୁରେ ମୋଡ୍ ଯାଞ୍ଚ କରନ୍ତୁ। <strong>Follow System</strong>ରେ, ଖୋଲା ଟାବ୍‌ଗୁଡ଼ିକ ଏକ ସେକେଣ୍ଡ ମଧ୍ୟରେ ପୂର୍ବ ଅବସ୍ଥାକୁ ଫେରିଯାଏ। <strong>Always On</strong>ରେ, ସିଷ୍ଟମର ଆପିୟରାନ୍ସ ଯାହା ବି ହେଉ, ୱେବସାଇଟ୍ ଡାର୍କ ରହେ।", "q8": "PDF କାହିଁକି ଡାର୍କ ହୁଏ ନାହିଁ?", "a8": "PDF, ସ୍ଥାନୀୟ ଫାଇଲ୍ ଏବଂ Safariର ନିଜ ପେଜକୁ ଜାଣିଶୁଣି ଯେମିତି ଅଛି ସେମିତି ରଖାଯାଏ। ସେଗୁଡ଼ିକ ଉପରେ ଜବରଦସ୍ତି ଡାର୍କ ମୋଡ୍ ଲଗାଇଲେ ପ୍ରାୟତଃ ସେଗୁଡ଼ିକ ଖାଲି ହୋଇଯାଏ।", "q9": "ପେଜ୍ ପୁଣି ହାଲୁକା ହୋଇଯାଉଛି, କିମ୍ବା ଛବି ଓଲଟା ଦେଖାଯାଉଛି।", "a9": "<strong>ସ୍ମାର୍ଟ ଇନଭର୍ଟ</strong> ଏବଂ <strong>କ୍ଲା
